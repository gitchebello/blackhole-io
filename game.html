  // enjoado, o anel de acreção fica verde e o personagem solta glows radiais
  if (p.enjoo > 0) {
    paleta = COR.discoV;
    const q = Math.min(1, p.enjoo / 40);
    /* Três ondas escalonadas: uma sai, a seguinte já está no meio do caminho.
       Elas NÃO são círculos — o raio varia com o ângulo por duas senoides, e
       o desenho inteiro vai girando conforme se afasta. Círculo perfeito lê
       como sinal de rádio; torto e torcido lê como mal-estar, que é o que o
       cometa causa. */
    for (let i = 0; i < 3; i++) {
      const t = ((quadro * 0.017 + i / 3) % 1);
      const base = r + 2 + t * (r * 0.6 + 9);   // mais contido que antes
      const torce = t * 2.2 + quadro * 0.02;     // gira enquanto abre
      const esp = 2 + t * 2;
      ctx.globalAlpha = 0.32 * (1 - t) * q;
      // 6,5 por unidade de raio dá ~1 px de espaço entre pontos; com menos
      // a onda sai pontilhada em vez de traçada
      const passos = Math.max(40, Math.ceil(base * 6.5));
      for (let k = 0; k < passos; k++) {
        const a = (k / passos) * Math.PI * 2;
        const ondula = 1 + 0.2 * Math.sin(a * 3 + torce * 2.4)
                         + 0.12 * Math.sin(a * 5 - torce * 1.7)
                         + 0.07 * Math.sin(a * 8 + torce * 3.1);
        const rr = base * ondula;
        for (let e = 0; e < esp; e++)
          px(bx + Math.cos(a + torce) * (rr + e), by + Math.sin(a + torce) * (rr + e),
             COR.enjoo);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* Anel de acreção: o mesmo desenho de sempre — duas voltas, fortes de um
     lado e apagadas do outro — com três coisas somadas por cima conforme o
     personagem está COMENDO (`fervor`, que sobe a cada estrela e esfria
     sozinho): gira mais rápido, ganha um halo, e as voltas anteriores ficam
     na tela com alfa baixo, o que dá o rastro circular. Parado e sem comer,
     tudo isso vai a zero e sobra o anel limpo de antes. */
  // no escudo o disco liga no talo: é o momento mais forte do jogo e ele
  // precisa gritar isso sozinho
  const fervor = p.imune > 0 ? 1 : Math.min(1, p.fervor || 0);
  const acel = (comTurbo ? 1 + espiral * 2.6 : 1) * (1 + fervor * 0.9) *
               (p.imune > 0 ? 1.8 : 1);         // invencível, o disco dispara
  const giro = quadro * (comTurbo && turbo > 0 ? 0.09 : 0.04) * acel;
  const N = paleta.length;
  const iris = p.imune > 0 || (p === buraco && CORES_SKIN[salvo.cor] && CORES_SKIN[salvo.cor].iris);

  /* Brilho de base do disco: um halo leve e por igual, 360 graus em volta,
     aceso mesmo parado. Sem ponto quente nem lado mais forte — testei e
     ficou ruim; é um glow geral. No fundo preto a luz é SOMADA (`lighter`),
     que é o que faz parecer luz e não tinta; no branco fica por cima normal. */
  const glow = CFG.DISCO_GLOW;
  if (glow > 0) {
    const escuro = CFG.FUNDO_PB;
    if (escuro) ctx.globalCompositeOperation = "lighter";
    const corBase = iris
      ? COR.arcoiris[Math.floor(quadro * 0.06) % COR.arcoiris.length] : paleta[5];
    brilho(bx, by, r, r + 6 + r * 0.4, corBase, 0.3 * glow * (escuro ? 1 : 0.6), 2);
    ctx.globalCompositeOperation = "source-over";
  }

  if (fervor > 0.04) {                     // halo que acende junto
    // cor saturada do próprio disco, e não o halo pálido: por cima de uma
    // nebulosa da mesma família, o pálido sumia e só lavava a região
    if (iris) {
      // no arco-íris o halo é feito de várias cores empilhadas, cada uma um
      // pouco mais larga: sai um brilho iridescente em vez de um tom só
      // quatro camadas e não sete: o olho não conta, e cada uma custava caro
      for (let k = 0; k < 4; k++)
        brilho(bx, by, r + k * 1.2, r + 5 + k * 2.4,
               COR.arcoiris[(k * 2 + Math.floor(quadro * 0.12)) % COR.arcoiris.length],
               0.12, 2.2);
    } else {
      brilho(bx, by, r, r + 3 + fervor * 5, paleta[5], 0.09 + fervor * 0.26, 2.4);
    }
  }

  // rastro: as posições por onde o anel passou, cada vez mais apagadas
  // no escudo o rastro é mais longo: é o borrão que dá a leitura de giro
  // o rastro completo é só seu; nos bots uma volta basta para ler o giro
  const rastros = Math.min(p === buraco ? 6 : 1, iris ? 6 : (fervor > 0.06 ? 3 : 0));
  for (let g = rastros; g >= 0; g--) {
    const atraso = g * (iris ? 0.16 : 0.12 + fervor * 0.16);
    const alfa = g === 0 ? 1 : (iris ? 0.4 - g * 0.05 : (0.34 - g * 0.08) * fervor);
    if (alfa <= 0.02) continue;
    ctx.globalAlpha = alfa;
    // os pixels saem agrupados por cor e pintados de balde em balde: trocar
    // a cor a cada pixel era o que custava, não o pixel em si
    baldesAnel.clear();
    for (let k = 0; k < 2; k++) {
      const rr = r + 1 + k + (g ? g * (iris ? 0.42 : 0.5 * fervor) : 0);
      const passos = Math.max(20, Math.ceil(rr * 7));
      for (let i = 0; i < passos; i++) {
        const a = (i / passos) * Math.PI * 2;
        const lado = 0.5 + 0.5 * Math.sin(a - giro + atraso);
        const inten = (0.34 + 0.66 * lado) * (1 - k * 0.3);
        if (inten < 0.3) continue;
        // no arco-íris a cor vem do ÂNGULO, não da intensidade: é o que faz as
        // faixas girarem junto com o anel em vez de ficarem paradas
        /* A escada é lida do mesmo jeito nos dois fundos. Tentei invertê-la no
         escuro "para a frente do disco brilhar" e o resultado foi um aro
         claro e chapado, com cara de blur, que tapava o preto. O anel do jeito
         original deixa o fundo aparecer através dele, e é isso que faz o
         personagem parecer um buraco e não uma bola com aura. */
      const cor = iris
          ? COR.arcoiris[Math.floor(((a - giro * 1.6) / (Math.PI * 2) * COR.arcoiris.length
                                     % COR.arcoiris.length + COR.arcoiris.length))
                         % COR.arcoiris.length]
          : paleta[Math.min(N - 1, Math.floor(inten * N))];
        // o anel acompanha o corpo: se ele achata, o anel achata junto,
        // senão o disco descola e o personagem parece dentro de um aro rígido
        let b = baldesAnel.get(cor);
        if (!b) baldesAnel.set(cor, b = []);
        b.push(Math.round(bx + Math.cos(a) * rr * (rx / r)), Math.round(by + Math.sin(a) * rr * (ry / r)));
      }
    }
    for (const [cor, b] of baldesAnel) {
      ctx.fillStyle = cor;
      for (let i = 0; i < b.length; i += 2) ctx.fillRect(b[i], b[i + 1], 1, 1);
    }
  }
  ctx.globalAlpha = 1;

  desenharEnfeite(p, bx, by, r, ry, contorno, blush, true);
  // o corpo é claro: precisa de um fio de contorno para ter silhueta
  const gord = gordura(p);
  if (gord > 0.02) {
    /* Bochechas de hamster: dois calombos que saem da silhueta na altura da
       boca. Primeiro todos os contornos, depois todos os recheios — assim o
       fio só aparece por FORA e as três ovais viram um corpo só. */
    const rc = r * 0.36 * gord, rcy = rc * 0.82;
    const dx = rx * 0.78, cyc = by + ry * 0.3;
    oval(bx - dx, cyc, rc + 1, rcy + 1, contorno);
    oval(bx + dx, cyc, rc + 1, rcy + 1, contorno);
    oval(bx, by, rx, ry, contorno);
    oval(bx - dx, cyc, rc, rcy, COR.corpo);
    oval(bx + dx, cyc, rc, rcy, COR.corpo);
    oval(bx, by, rx - 1, ry - 1, COR.corpo);
  } else {
    oval(bx, by, rx, ry, contorno);
    oval(bx, by, rx - 1, ry - 1, COR.corpo);
  }

  // enjoado: o corpo continua branco — quem fica verde é o anel, lá em cima —
  // e sobem bolhinhas de mal-estar
  if (p.enjoo > 0) {
    const q = Math.min(1, p.enjoo / 40);         // passa aos poucos no fim
    ctx.globalAlpha = 0.85 * q;
    for (let i = 0; i < 5; i++) {
      const t = ((quadro * 0.028 + i * 0.2) % 1);
      const bxx = bx + Math.sin(quadro * 0.09 + i * 2.1) * r * 0.55;
      const byy = by - r * 0.5 - t * (r * 0.9 + 6);
      ctx.globalAlpha = 0.85 * q * (1 - t);
      px(bxx, byy, COR.cometa[i % 2 ? 3 : 4]);
      if (t < 0.5) { px(bxx + 1, byy, COR.cometa[4]); px(bxx, byy + 1, COR.cometa[4]); }
    }
    ctx.globalAlpha = 1;
  }
  if (CFG.ROSTO) desenharRosto(p, bx, by, r, blush, rx / r, ry / r);
  desenharEnfeite(p, bx, by, r, ry, contorno, blush, false);
  if (p === primeiro && cena !== "menu") desenharCoroa(p, bx, by, r);

  if (p === buraco && flash > 0 && flash % 6 < 3) {
    ctx.globalAlpha = 0.3; disco(bx, by, r + 4, paleta[6]); ctx.globalAlpha = 1;
  }

  // Barrinhas de duração, empilhadas sob o personagem. Cada uma tem um miolo
  // escuro, o preenchimento e um fio claro em cima: sem o fio elas somem no
  // fundo branco, e sem o miolo não dá para ver quanto já passou.
  if (comTurbo) {
    const l = Math.max(16, Math.round(r * 2.1));
    const x0 = Math.round(bx - l / 2);
    let y0 = Math.round(by + r + 5);
    const fila = [
      [turbo, CFG.TERRA_TURBO, COR.turbo, COR.turboClarao],
      [ima, CFG.MARTE_IMA, COR.ima, COR.imaPart[0]],
      [buraco.tiro, CFG.SATURNO_TIRO, COR.saturno[4], COR.saturno[2]],
      [buraco.inchado, CFG.JUPITER_INCHA, COR.jupiter[4], COR.jupiter[2]],
      [buraco.dreno, CFG.URANO_DRENO, COR.ciano, COR.urano[2]],
      [buraco.imune, CFG.NETUNO_IMUNE, COR.netuno[2], COR.netuno[0]],
      [buraco.enjoo, CFG.COMETA_ENJOO, COR.enjoo, COR.cometa[1]]
    ];
    for (const [v, tot, cor, claro] of fila) {
      if (v <= 0) continue;
      const cheio = Math.max(1, Math.round((l - 2) * v / tot));
      ctx.fillStyle = COR.borda;                       // trilho
      ctx.fillRect(x0, y0, l, 4);
      ctx.fillStyle = COR.vazio;                       // vão interno
      ctx.fillRect(x0 + 1, y0 + 1, l - 2, 2);
      ctx.fillStyle = cor;
      ctx.fillRect(x0 + 1, y0 + 1, cheio, 2);
      ctx.fillStyle = claro;                           // fio de luz em cima
      ctx.fillRect(x0 + 1, y0 + 1, cheio, 1);
      ctx.globalAlpha = 0.5;                           // pontinha acesa
      ctx.fillStyle = claro;
      ctx.fillRect(x0 + cheio, y0 + 1, 1, 2);
      ctx.globalAlpha = 1;
      y0 += 6;
    }
  }

}

function desenharCadente() {
  if (!cadente) return;
  // rastro dourado que vai apagando
  for (let i = cadente.rastro.length - 1; i >= 0; i--) {
    const r = cadente.rastro[i];
    const p = 1 - i / cadente.rastro.length;
    const cor = COR.cadente[p > 0.66 ? 1 : p > 0.33 ? 2 : 2];
    ctx.globalAlpha = 0.25 + p * 0.75;
    px(paraTelaX(r.x), paraTelaY(r.y), cor);
    if (p > 0.5) {
      px(paraTelaX(r.x) + 1, paraTelaY(r.y), cor);
      px(paraTelaX(r.x), paraTelaY(r.y) + 1, cor);
    }
    ctx.globalAlpha = 1;
  }
  const x = paraTelaX(cadente.x), y = paraTelaY(cadente.y);
  ctx.globalAlpha = 0.45;                       // brilho dourado em volta
  disco(x, y, CFG.CADENTE_RAIO + 2, COR.cadente[0]);
  ctx.globalAlpha = 1;
  carimbo(ESTRELAS_SPR[4], x, y, COR.cadente[2]);
  carimbo(ESTRELAS_SPR[2], x, y, COR.estrela);  // miolo preto, como as outras
}

/* O rabo é o que dá o aviso: longo, azul, e engrossando perto da cabeça. */
/* a cor arco-íris que anda: o mesmo índice para todo mundo, então a moldura,
   a borda do mundo e o rabo do cometa piscam no mesmo compasso */
function corIris(passo, i) {
  const n = COR.arcoiris.length;
  return COR.arcoiris[(((Math.floor(quadro * passo) + i) % n) + n) % n];
}

/* O cometa arco-íris. O rabo não é um degradê de uma cor só como o do cometa
   azul: cada anel do rastro pega uma cor da faixa, e a faixa inteira ANDA a
   cada quadro. É o que faz o bicho parecer um arco-íris em movimento em vez
   de uma fita colorida parada. */
function desenharArcoirisCometa() {
  if (!arcoiris) return;
  const R = CFG.ARCOIRIS_RAIO, cores = COR.arcoiris, nc = cores.length;
  const rs = arcoiris.rastro, n = rs.length;
  const hx = paraTelaX(arcoiris.x), hy = paraTelaY(arcoiris.y);
  if (hx < -R * 3 || hy < -R * 3 || hx > VL + R * 3 || hy > VA + R * 3) {
    if (!rs.length || !naTela(rs[rs.length - 1].x, rs[rs.length - 1].y, 10)) {
      avisoArcoiris(hx, hy);
      return;
    }
  }
  /* A FITA: as sete cores em faixas paralelas que seguem o caminho — um
     arco-íris de verdade, não discos empilhados. Uma onda corre da cabeça
     para a ponta e cresce para trás (follow-through: a ponta é a parte mais
     solta e chega atrasada), e a largura afina até sumir. */
  for (let i = n - 1; i >= 1; i--) {
    const a = rs[i], b = rs[i - 1];
    const x = paraTelaX(a.x), y = paraTelaY(a.y);
    if (x < -24 || y < -24 || x > VL + 24 || y > VA + 24) continue;
    const tx = paraTelaX(b.x) - x, ty = paraTelaY(b.y) - y, tl = Math.hypot(tx, ty) || 1;
    const nx = -ty / tl, ny = tx / tl;
    const p = 1 - i / n;                          // 1 na cabeça, 0 na ponta
    const larg = R * 0.9 * Math.pow(p, 0.6);
    if (larg < 0.6) continue;
    const onda = Math.sin(i * 0.2 - quadro * 0.22) * R * 0.6 * Math.pow(1 - p, 1.3);
    const cx = x + nx * onda, cy = y + ny * onda;
    const bw = (larg * 2) / nc, q = Math.ceil(bw) + 1;
    ctx.globalAlpha = 0.2 + 0.8 * Math.pow(p, 0.8);
    for (let k = 0; k < nc; k++) {
      const off = -larg + bw * (k + 0.5);
      ctx.fillStyle = cores[k];
      ctx.fillRect(Math.round(cx + nx * off - q / 2), Math.round(cy + ny * off - q / 2), q, q);
    }
    // um brilho que escorre pela fita, de tempos em tempos
    if ((i + Math.floor(quadro * 0.7)) % 14 === 0) {
      ctx.globalAlpha = 0.9 * p;
      px(cx, cy, "#ffffff"); px(cx + nx, cy + ny, "#ffffff"); px(cx - nx, cy - ny, "#ffffff");
    }
  }
  ctx.globalAlpha = 1;

  /* A CABEÇA: squash & stretch na direção do voo, num pulso de coração
     (estica, volta, estica de novo, pausa) — é o que a faz parecer viva. O
     volume se conserva: o que estica de comprido sai da largura. */
  const vv = Math.hypot(arcoiris.vx, arcoiris.vy) || 1;
  const ux = arcoiris.vx / vv, uy = arcoiris.vy / vv;
  const bat = quadro % 70, pulso = bat < 8 ? Math.sin(bat / 8 * Math.PI)
                             : bat > 14 && bat < 22 ? 0.6 * Math.sin((bat - 14) / 8 * Math.PI) : 0;
  const est = 1.16 + 0.14 * pulso, larga = 1 / Math.sqrt(est);
  const R2 = R * (1 + 0.1 * pulso);
  brilho(hx, hy, R2 * 0.9, R2 * 0.9 + 12 + pulso * 6, corIris(0.22, 0), 0.32 + pulso * 0.2, 2);
  for (let k = nc - 1; k >= 0; k--) {
    const rr = R2 * (0.3 + 0.7 * (k + 1) / nc);
    // as cores de dentro vão um pouco à frente: a cabeça "puxa" o resto
    const fr = (nc - 1 - k) * 0.35;
    elipseGirada(hx + ux * fr, hy + uy * fr, rr * est, rr * larga, ux, uy, corIris(0.18, -k));
  }
  elipseGirada(hx + ux * 2 - uy * 2, hy + uy * 2 + ux * 2, R2 * 0.22, R2 * 0.16, ux, uy, "#ffffff");
  // a carinha olhando para onde vai: feliz, de quem está passeando
  const fx = hx + ux * R2 * 0.25, fy = hy + uy * R2 * 0.25;
  carimbo(OLHOS_GORDO[1], fx - 3.5, fy - 1.5, ROSTO_CORPO);
  carimbo(OLHOS_GORDO[1], fx + 3.5, fy - 1.5, ROSTO_CORPO);
  carimbo(BOCAS_SORRISO[0], fx, fy + 2.5, ROSTO_CORPO);
  ctx.globalAlpha = 0.8;
  px(fx - 6, fy + 1, BLUSH_CORPO); px(fx + 6, fy + 1, BLUSH_CORPO);
  ctx.globalAlpha = 1;
  // a cintilação em cruz girando devagar por cima: o brilho de estrela
  const cl = R2 * (1.25 + 0.5 * pulso), cg = quadro * 0.02;
  for (let k = 0; k < 4; k++) {
    const an = cg + k * Math.PI / 2, co = Math.cos(an), si = Math.sin(an);
    for (let d = R2 * 0.95; d < cl; d += 1) {
      ctx.globalAlpha = 0.9 * (1 - (d - R2 * 0.95) / (cl - R2 * 0.95));
      px(hx + co * d, hy + si * d, "#ffffff");
    }
  }
  ctx.globalAlpha = 1;
  for (let k = 0; k < 7; k++) {
    const a = (k / 7) * Math.PI * 2 - quadro * 0.06;
    const rr = R2 * (1.3 + 0.25 * Math.sin(quadro * 0.11 + k));
    px(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr, corIris(0.3, k));
  }
}
/* elipse cheia girada (eixo maior na direção ux,uy), pixel a pixel */
function elipseGirada(cx, cy, a, b, ux, uy, cor) {
  const R = Math.ceil(Math.max(a, b));
  const x0 = Math.round(cx), y0 = Math.round(cy);
  ctx.fillStyle = cor;
  for (let dy = -R; dy <= R; dy++) {
    let ini = null;
    for (let dx = -R; dx <= R + 1; dx++) {
      const u = (dx * ux + dy * uy) / a, w = (-dx * uy + dy * ux) / b;
      const dentro = dx <= R && u * u + w * w <= 1;
      if (dentro && ini === null) ini = dx;
      else if (!dentro && ini !== null) { ctx.fillRect(x0 + ini, y0 + dy, dx - ini, 1); ini = null; }
    }
  }
}
/* fora da tela mas chegando perto: uma estrelinha arco-íris pulsando na
   borda, do lado por onde ele vem (staging: o olho já está lá quando entrar) */
function avisoArcoiris(hx, hy) {
  const m = 10, cx = VL / 2, cy = VA / 2;
  const dx = hx - cx, dy = hy - cy;
  if (Math.hypot(dx, dy) > Math.max(VL, VA) * 1.4) return;
  const k = Math.min((cx - m) / Math.abs(dx || 1e-6), (cy - m) / Math.abs(dy || 1e-6));
  const x = cx + dx * k, y = cy + dy * k;
  const pul = 0.5 + 0.5 * Math.sin(quadro * 0.2);
  brilho(x, y, 3, 14 + pul * 6, corIris(0.2, 0), 0.4 + pul * 0.2, 2);
  carimbo(ESTRELAS_SPR[pul > 0.5 ? 2 : 1], x, y, corIris(0.2, 0));
  px(x, y, "#ffffff");
}

/* A moldura do brawl: as quatro beiradas da TELA piscando arco-íris. É de
   propósito na tela e não na borda do mapa — a borda do mapa costuma estar
   fora de vista, e o aviso precisa estar sempre à volta de quem joga. */
/* A CASCATA DO BRAWL. As duas laterais viram um arco-íris despencando do
   topo até embaixo, sem parar, os quinze segundos inteiros.

   Ela é desenhada uma vez só num canvas à parte — uma tira com um ciclo
   inteiro de cores a mais de altura, e o esmaecimento para dentro da tela já
   pintado pixel a pixel. Depois cada quadro é UM drawImage por lado, com a
   tira deslizando para baixo. Pintar as faixas na mão a cada quadro seriam
   uns quinze mil fillRect por segundo, e o jogo é de 60 quadros. */
let cascata = null, cascataChave = "";
function fazerCascata() {
  const chave = VL + "x" + VA + "|" + COR.arcoiris.join("");
  if (cascata && cascataChave === chave) return cascata;
  const larg = Math.max(5, Math.round(Math.min(VL, VA) * 0.1));
  const n = COR.arcoiris.length, faixa = CFG.BRAWL_FAIXA;
  const ciclo = n * faixa, alt = VA + ciclo;
  const c = document.createElement("canvas");
  c.width = larg; c.height = alt;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  for (let y = 0; y < alt; y++) {
    g.fillStyle = COR.arcoiris[Math.floor(y / faixa) % n];
    for (let i = 0; i < larg; i++) {
      // a coluna 0 é a beirada da tela e é onde a cor está inteira; para
      // dentro ela se apaga depressa, senão a cascata tapa o campo de jogo
      g.globalAlpha = Math.pow(1 - i / larg, 1.3);
      g.fillRect(i, y, 1, 1);
    }
  }
  cascata = { canvas: c, larg: larg, ciclo: ciclo };
  cascataChave = chave;
  return cascata;
}

function desenharMolduraBrawl() {
  if (brawl <= 0) return;
  // some suave nos últimos dois segundos, para o fim do modo ser visto vindo
  const fim = brawl < 120 ? brawl / 120 : 1;
  const pulso = 0.74 + 0.26 * Math.sin(quadro * 0.18);
  const forca = pulso * fim;

  const c = fazerCascata();
  const desce = -(Math.floor(quadro * CFG.BRAWL_CASCATA) % c.ciclo);
  ctx.globalAlpha = forca;
  ctx.drawImage(c.canvas, 0, desce);
  // o outro lado é a mesma tira espelhada: o esmaecimento tem de apontar
  // para dentro da tela nos dois lados
  ctx.save();
  ctx.translate(VL, 0); ctx.scale(-1, 1);
  ctx.drawImage(c.canvas, 0, desce);
  ctx.restore();

  /* fio fino em cima e embaixo, correndo no mesmo compasso: sem ele a
     moldura fica aberta e as duas cascatas parecem duas coisas soltas */
  ctx.globalAlpha = forca * 0.8;
  for (let x = 0; x < VL; x += 3) {
    ctx.fillStyle = corIris(CFG.BRAWL_CASCATA, x / 3);
    ctx.fillRect(x, 0, 3, 2);
    ctx.fillRect(x, VA - 2, 3, 2);
  }
  ctx.globalAlpha = 1;
}

function desenharCometa() {
  if (!cometa) return;
  const R = CFG.COMETA_RAIO;
  const n = cometa.rastro.length;
  // o rabo engrossa perto da cabeça e afina até sumir, na medida do raio
  for (let i = n - 1; i >= 0; i--) {
    const r = cometa.rastro[i];
    const p = 1 - i / n;                        // 1 na cabeça, 0 na ponta do rabo
    const x = paraTelaX(r.x), y = paraTelaY(r.y);
    ctx.globalAlpha = 0.14 + p * 0.7;
    const cor = COR.cometa[p > 0.72 ? 1 : p > 0.4 ? 2 : 3];
    const w = R * 0.62 * Math.pow(p, 0.8);
    if (w < 0.8) px(x, y, cor);
    else disco(x, y, w, cor);
  }
  ctx.globalAlpha = 1;

  const x = paraTelaX(cometa.x), y = paraTelaY(cometa.y);
  // a coma pulsa: cresce e encolhe, e o brilho vai junto
  const pc = 0.5 + 0.5 * Math.sin(quadro * 0.19);
  brilho(x, y, R * 0.75, R * 0.75 + 9 + pc * 3, COR.cometa[3], 0.26 + pc * 0.16, 2);
  ctx.globalAlpha = 0.5 + pc * 0.2;
  disco(x, y, R * (0.92 + pc * 0.12), COR.cometa[1]);
  ctx.globalAlpha = 1;
  disco(x, y, R * (0.6 + pc * 0.06), COR.cometa[0]);
  disco(x, y, R * 0.4, COR.cometa[2]);
  // núcleo em cruz: um disco de raio 2 sai quadrado e estraga a cabeça
  px(x, y, COR.cometa[4]);
  px(x - 1, y, COR.cometa[4]); px(x + 1, y, COR.cometa[4]);
  px(x, y - 1, COR.cometa[4]); px(x, y + 1, COR.cometa[4]);
  // lascas orbitando o núcleo: dá a sensação de bola de gases, não de bolinha
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2 + quadro * 0.05;
    const rr = R * (0.72 + 0.16 * Math.sin(quadro * 0.13 + k));
    px(x + Math.cos(a) * rr, y + Math.sin(a) * rr, COR.cometa[k % 2 ? 0 : 3]);
  }
}

function desenharBuraco() {
  // os que estão atrás primeiro, para o mais próximo do jogador ficar por cima.
  // Quem está SENDO ENGOLIDO vai por último, por cima de quem come: por baixo
  // ele sumia no corpo do outro e a engolida não aparecia
  const um = (p, eu) => {
    const pal = eu ? paletaSkin() : paletaDe(p);
    desenharPersonagem(p, eu ? raioTela : raioDe(p) * zoom,
                       pal.disco, pal.halo, pal.contorno, pal.blush, eu);
  };
  for (const r of rivais) if (!(r.engolido > 0)) um(r, false);
  if (!(buraco.engolido > 0)) um(buraco, true);
  for (const r of rivais) if (r.engolido > 0) um(r, false);
  if (buraco.engolido > 0) um(buraco, true);
}

/* A mesma coroa, miúda, para marcar a linha do primeiro no placar. Repetir
   o símbolo que já está na cabeça dele liga as duas leituras sem legenda. */
const COROA_HUD = ["#.#.#", "#####", ".###."];
function desenharCoroaHUD(x, y, cor) {
  // parada de propósito: quem flutua é a coroa do boneco em campo. No placar
  // ela é um rótulo, e rótulo que mexe compete com o jogo pela atenção
  carimbo(COROA_HUD, x + 2, y, COR.coroa[2]);
  carimbo(COROA_HUD, x + 2, y - 1, COR.coroa[1]);
}

/* A coroa do líder. Ela flutua (não encosta na cabeça), balança devagar e,
   quando troca de dono, CAI de cima com um repique — é o movimento que
   anuncia a virada, mais do que a coroa em si. */
function desenharCoroa(p, bx, by, r) {
  const t = COROAS[r < 14 ? 0 : r < 24 ? 1 : 2];
  // balanço mais largo e mais alto: ela precisa parecer solta no ar, não
  // apoiada na cabeça
  const bal = Math.sin(quadro * 0.062) * 2.2;
  const a = coroaAnim;
  const queda = a > 0 ? -Math.pow(a, 1.6) * (r + 30) + Math.sin(a * Math.PI) * 5 : 0;
  const cy = by - r - 10 - t.length + bal + queda;
  const giro = a > 0 ? Math.sin(a * Math.PI * 3) * 2 * a : 0;

  ctx.globalAlpha = 0.45;                         // brilhinho por baixo
  disco(bx + giro, cy + 1, t.length * 0.85, COR.coroa[0]);
  // um risco de sombra na cabeça, logo abaixo: é o que diz que ela flutua
  ctx.globalAlpha = 0.22 - Math.sin(quadro * 0.062) * 0.06;
  oval(bx, by - r + 1, t[0].length * 0.34, 1, COR.coroa[2]);
  ctx.globalAlpha = 1;
  carimbo(t, bx + giro, cy + 1, COR.coroa[2]);    // sombra, meio pixel abaixo
  carimbo(t, bx + giro, cy, COR.coroa[1]);

  // faíscas ocasionais em volta, para a coroa não ficar estática
  if (quadro % 9 === 0) {
    const ang = Math.random() * Math.PI * 2;
    const d = t[0].length * 0.6;
    px(bx + giro + Math.cos(ang) * d, cy + Math.sin(ang) * d * 0.7, COR.coroa[0]);
  }
}

/* A gota de suor do enjoo: escorre da têmpora, some e recomeça. É o sinal
   mais direto de "não estou bem" que cabe num rosto deste tamanho. */
function gotaDeSuor(bx, by, r, t) {
  const ciclo = (quadro % 96) / 96;
  if (ciclo > 0.62) return;                      // fica um tempo sem gota
  const q = ciclo / 0.62;
  const x = bx + r * 0.52;
  const y = by - r * 0.42 + q * r * 0.5;
  const c = COR.cometa[3];
  ctx.globalAlpha = q < 0.85 ? 1 : (1 - q) / 0.15;
  if (t >= 2) {                                  // gota maior nos bonecos grandes
    px(x, y - 1, c);
    px(x - 1, y, c); px(x, y, COR.cometa[1]); px(x + 1, y, c);
    px(x, y + 1, c);
  } else {
    px(x, y, c); px(x, y + 1, c);
  }
  ctx.globalAlpha = 1;
}

/* O fôlego de quem foi cuspido: cada ciclo de CFG.ARFA quadros é puxar o ar
   (estica para cima — antecipação), segurar, e soltar num "fuuu" com o corpo
   murchando (squash) e uma nuvenzinha saindo da boca. 0 = boca fechada,
   1 = soprando. */
function arfada(p) {
  const c = (CFG.ARFA - (p.tonto % CFG.ARFA)) / CFG.ARFA;   // 0 → 1 no ciclo
  return c < 0.45 ? 0 : c < 0.55 ? (c - 0.45) / 0.1 : Math.max(0, 1 - (c - 0.55) / 0.4);
}
function arfar(p) {
  const fase = CFG.ARFA - (p.tonto % CFG.ARFA);
  if (fase === 4) bater(p, -0.1);                          // puxa o ar: estica
  if (fase === Math.round(CFG.ARFA * 0.5)) bater(p, 0.16); // solta: achata
  const c = fase / CFG.ARFA;
  if (c > 0.5 && c < 0.8 && fase % 3 === 0 && (p === buraco || naTela(p.x, p.y, 20))) {
    const r = raioDe(p);
    // sai da boca, pro lado e um pouco para cima, cada bufada para um lado
    const lado = Math.floor(p.tonto / CFG.ARFA) % 2 ? 1 : -1;
    const vida = 22 + Math.floor(Math.random() * 10);
    faiscas.push({ curva: lado * 0.03, x: p.x + lado * r * 0.15, y: p.y + r * 0.38,
                   vx: lado * (0.35 + Math.random() * 0.3) / zoom, vy: (0.15 - Math.random() * 0.3) / zoom,
                   vida: vida, total: vida, arrasto: 0.95, tipo: "gas", cor: "#eef4ff",
                   tam: Math.max(1, r * zoom / 14) });
  }
}

/* a carinha: olhos que espiam para onde ele está indo, bochechas e um sorriso */
function desenharRosto(p, bx, by, r, blush, ex, ey) {
  ex = ex || 1; ey = ey || 1;
  /* Os olhos ARRASTAM atrás da mudança de direção em vez de saltar junto.
     É "overlapping action": partes leves chegam depois do corpo, e são elas
     que dão vida — olho que gruda na direção nova no mesmo quadro parece
     desenho técnico. */
  const v = Math.hypot(p.vx, p.vy);
  const alvoX = v > 0.01 ? (p.vx / v) * r * 0.11 : 0;
  const alvoY = v > 0.01 ? (p.vy / v) * r * 0.11 : 0;
  p.olhoX = (p.olhoX || 0) + (alvoX - (p.olhoX || 0)) * 0.16;
  p.olhoY = (p.olhoY || 0) + (alvoY - (p.olhoY || 0)) * 0.16;
  const ox = p.olhoX, oy = p.olhoY;
  const t = r < 11 ? 0 : r < 15 ? 1 : r < 20 ? 2 : r < 25 ? 3 : 4;
  const sep = Math.max(3, r * 0.4);

  const doente = p.enjoo > 0;
  const pasmo = p.surpresa > 0;
  const gord = gordura(p);
  const gordo = gord > 0.5;
  const estrelado = p.imune > 0 && !pasmo;   // estrela vence até o inchado
  const comTurbo = p === buraco ? turbo > 0 : p.turbo > 0;
  const comIma = p === buraco ? ima > 0 : p.ima > 0;
  const chorando = (p.lanterna || 0) > CFG.CARA_LANTERNA;
  const sono = (p.parado || 0) > CFG.CARA_SONO ? p.parado - CFG.CARA_SONO : -1;

  /* A ordem é a do que mais importa SENTIR naquele instante: a surpresa
     passa na frente, depois o poder que você pegou, e por último os humores
     lentos — enjoo, choro, sono. */
  let olho, olhoD = null, boca, lagrima = false, zzz = -1, coracao = false;
  // quem pode ser engolido fica com medo; quem pode te engolir, com fome.
  // É a única pista de tamanho que não precisa de número nenhum
  const comivel = cena === "jogo" && !(p.engolido > 0) &&
    (p === buraco ? !!ameaca(buraco) : podeEngolir(buraco, p));
  const faminto = cena === "jogo" && p !== buraco && podeEngolir(p, buraco) &&
    Math.hypot(p.x - buraco.x, p.y - buraco.y) < visaoL() * 0.7;
  if (pasmo) {
    olho = OLHOS[Math.min(OLHOS.length - 1, t + 1)];   // olhos de um tamanho acima
    boca = BOCAS_O[t];
  } else if (p.tonto > 0) {
    /* Acabou de ser cuspido: CANSADO, não zonzo — o "@_@" lia como derrota
       feia (pedido do usuário). Pálpebra pesada e a boca arfando no compasso
       do fôlego (ver `arfar`): fecha para puxar o ar, abre no "fuuu". */
    const f = arfada(p);
    olho = f > 0.5 ? OLHOS_FECHADO[t] : OLHOS_ENJOO[t];
    boca = f > 0.66 ? BOCAS_O[t] : f > 0.25 ? BOCAS_O[Math.max(0, t - 1)] : BOCAS_RETA[Math.max(0, t - 1)];
  } else if (gordo) {
    // inchado manda no rosto inteiro, até no enjoo: é o poder que você pegou
    // (só os olhos cedem para as estrelas do invencível, lá embaixo)
    olho = OLHOS_GORDO[t];
    boca = p.boca > 0 ? BOCAS_O[Math.max(0, t - 1)] : BOCAS_GORDO[t];
  } else if (estrelado) {
    olho = OLHOS[t];                             // só para medir as bochechas
    boca = p.boca > 0 ? BOCAS_O[t] : BOCAS_SORRISO[t];
  } else if (comivel) {
    olho = OLHOS[t];
    boca = BOCAS_ONDA[t];
    gotaDeSuor(bx, by, r, t);
  } else if (faminto) {
    // pálpebra baixa e sorrisão aberto: está de olho em você
    olho = OLHOS_ENJOO[t];
    boca = BOCAS_SORRISO[t];
  } else if (comIma) {
    // ímã: apaixonado — olhos de coração batendo e sorrisão. Ele está
    // atraindo tudo, e tem que parecer que adora isso
    olho = OLHOS[t]; coracao = true;
    boca = p.boca > 0 ? BOCAS_O[t] : BOCAS_SORRISO[t];
  } else if (comTurbo) {
    // turbo: "> ▽ <" — o aperto de olho de quem está na montanha-russa, com
    // o sorrisão aberto de quem está adorando a velocidade
    olho = OLHOS_ESFORCO[t]; olhoD = espelhar(olho);
    boca = BOCAS_SORRISO[t];
  } else if (doente) {
    olho = OLHOS[t];
    boca = BOCAS_TRISTE[t];
    gotaDeSuor(bx, by, r, t);
  } else if (chorando) {
    olho = OLHOS[t];
    boca = BOCAS_TRISTE[t];
    lagrima = true;
  } else if (sono >= 0) {
    /* Pescando: pálpebra pesada o tempo todo, uma piscada lenta no começo de
       cada ciclo e um bocejo enorme no meio, com o "z" subindo depois. */
    const c = sono % 300;
    olho = OLHOS_ENJOO[t];
    boca = BOCAS[Math.max(0, t - 1)];
    if (c < 36) {
      if (c >= 12 && c < 24) olho = OLHOS_FECHADO[t];
    } else if (c >= 80 && c < 170) {
      olho = OLHOS_FECHADO[t];
      const k = c < 96 ? (c - 80) / 16 : c > 154 ? (170 - c) / 16 : 1;
      boca = k > 0.66 ? BOCAS_O[Math.min(4, t + 1)] : k > 0.33 ? BOCAS_O[t] : BOCAS_O[Math.max(0, t - 1)];
    }
    if (c >= 120) zzz = (c - 120) / 180;
  } else {
    olho = OLHOS[t];
    boca = p.boca > 0 ? BOCAS_O[t] : BOCAS[t];
  }
  olhoD = olhoD || olho;
  // enquanto passa mal a bochecha sai de cena: é o que faz o rostinho perder
  // o viço, mais do que a boca virada
  if ((t >= 1 && !doente) || gord > 0.02) {
    // sobre corpo preto a bochecha em 62% some; ela é o único rosado do rosto
    // inchado, a bochecha cresce um tamanho, desce para os calombos e acende
    const tb = gord > 0.35 ? Math.min(BOCHECHAS.length - 1, t + 1) : t;
    ctx.globalAlpha = Math.min(1, (CFG.FUNDO_PB ? 0.9 : 0.62) + gord * 0.3);
    const dist = sep + olho[0].length / 2 + 1.5 + gord * r * 0.14;
    const yb = by + r * (0.26 + gord * 0.06) * ey + oy;
    carimbo(BOCHECHAS[tb], bx - dist * ex + ox, yb, blush);
    carimbo(BOCHECHAS[tb], bx + dist * ex + ox, yb, blush);
    ctx.globalAlpha = 1;
  }
  // com as bochechas cheias os olhos sobem um pouco: estão sendo empurrados
  const yo = by - r * (0.13 + gord * 0.05) * ey + oy;
  const xe = bx - sep * ex + ox, xd = bx + sep * ex + ox;
  if (estrelado) {
    olhosDeEstrela(xe, yo, t);
    olhosDeEstrela(xd, yo, t);
  } else if (coracao) {
    olhosDeCoracao(xe, yo, t);
    olhosDeCoracao(xd, yo, t);
  } else {
    carimbo(olho, xe, yo, COR.rosto);
    carimbo(olhoD, xd, yo, COR.rosto);
  }
  carimbo(boca, bx + ox, by + r * (0.34 + gord * 0.04) * ey + oy, COR.rosto);
  if (lagrima) gotaDeLagrima(xe - olho[0].length / 2, yo + olho.length / 2, r, t);
  if (zzz >= 0) {
    // o "z" nasce do lado da cabeça, sobe bambeando e apaga
    ctx.globalAlpha = zzz < 0.8 ? 1 : (1 - zzz) / 0.2;
    texto("z", bx + r * 0.7 + zzz * 6, by - r * 0.6 - zzz * (r * 0.6 + 8) +
          Math.sin(zzz * 9) * 1.5, COR.rosto, 1);
    ctx.globalAlpha = 1;
  }
}

/* A lágrima de quem está em último faz tempo: escorre do canto de fora do
   olho pela bochecha, some e volta — devagar, sem drama. */
function gotaDeLagrima(x, y, r, t) {
  const ciclo = (quadro % 110) / 110;
  if (ciclo > 0.7) return;
  const q = ciclo / 0.7;
  const yy = y + q * r * 0.55;
  const c = COR.turbo;
  ctx.globalAlpha = q < 0.8 ? 1 : (1 - q) / 0.2;
  px(x, yy, c); px(x, yy + 1, c);
  if (t >= 2) { px(x - 1, yy + 1, c); px(x + 1, yy + 1, c); px(x, yy + 2, c); }
  ctx.globalAlpha = 1;
}

/* Olho de coração para o ímã: rosa com sombra embaixo e brilho branco, no
   compasso de um coração de verdade — duas batidas curtas e uma pausa. */
const OLHOS_CORACAO = [
  [".#.#.", "#####", ".###.", "..#.."],
  [".#.#.", "#####", "#####", ".###.", "..#.."],
  [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."],
  [".##...##.", "####.####", "#########", "#########", ".#######.", "..#####..", "...###...", "....#...."],
  ["..##...##..", ".####.####.", "###########", "###########", "###########", ".#########.",
   "..#######..", "...#####...", "....###....", ".....#....."]
];
function olhosDeCoracao(x, y, t) {
  const fase = quadro % 48;
  const bate = fase < 6 || (fase >= 10 && fase < 16);
  const spr = OLHOS_CORACAO[bate ? Math.min(4, t + 1) : t];
  carimbo(spr, x, y + 1, "#b8255f");
  carimbo(spr, x, y, "#ff5c95");
  if (spr.length >= 5) px(x - Math.floor(spr[0].length / 4), y - Math.floor(spr.length / 4), "#ffffff");
}

/* Um olho de estrela: dourado com sombra embaixo (igual à coroa), pulsando
   de tamanho no ritmo do disco arco-íris, e um brilhinho branco no alto. */
function olhosDeEstrela(x, y, t) {
  const base = [1, 2, 2, 3, 4][t];
  const pul = Math.sin(quadro * 0.3);
  const spr = OLHOS_ESTRELA[pul < -0.25 ? base - 1 : base];
  carimbo(spr, x, y + 1, COR.coroa[2]);
  carimbo(spr, x, y, COR.coroa[1]);
  if (pul > 0.6 && spr.length >= 5) px(x - 1, y - 1, "#ffffff");
}

/* Estouro arco-íris: sete faixas concêntricas abrindo a partir do
   personagem. O "borrão" sai de desenhar cada faixa três vezes, grossa e
   apagada por baixo, fina e viva por cima — canvas com filtro de blur é
   caro no celular, e isso dá o mesmo brilho macio de graça. */
function desenharArcoIris() {
  if (arco <= 0) return;
  const p = arco / CFG.ARCO;                 // 1 -> 0
  const t = 1 - p;                           // 0 -> 1
  const bx = paraTelaX(buraco.x), by = paraTelaY(buraco.y);
  const raio = raioTela + Math.pow(t, 0.6) * VL * 0.62;
  const CORES = COR.arcoiris;
  const esp = Math.max(2, raio * 0.055);

  for (let i = 0; i < CORES.length; i++) {
    const rr = raio - i * esp;
    if (rr <= raioTela * 0.7) continue;
    const desbota = p * p * (1 - i / (CORES.length + 2));
    ctx.globalAlpha = desbota * 0.22;        // camada larga: o brilho
    anel(bx, by, rr + esp, esp * 3, CORES[i]);
    ctx.globalAlpha = desbota * 0.5;         // camada viva
    anel(bx, by, rr, esp, CORES[i]);
  }
  ctx.globalAlpha = 1;
}

function desenharClaraoTerra() {
  if (flashTerra <= 0) return;
  const p = flashTerra / CFG.TERRA_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.85 * forcaFlash();
  ctx.fillStyle = COR.turboClarao;
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}



function desenharClaraoIma() {
  if (flashIma <= 0) return;
  const p = flashIma / CFG.MARTE_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.7 * forcaFlash();
  ctx.fillStyle = COR.imaClarao;
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

/* Enquanto Júpiter dura: clarão roxo nas laterais (mais forte a cada estrela
   roubada) e um tremor de fundo baixinho, para a tela nunca ficar parada. */
/* Pisca vermelho na borda: você está perdendo estrela, seja lá de quem for.
   Fica DEPOIS dos outros brilhos na ordem de desenho, para não ser abafado
   pelo roxo ou pelo dourado de um poder que esteja rolando ao mesmo tempo. */
function desenharBrilhoDano() {
  if (flashDano <= 0) return;
  const p = flashDano / CFG.DANO_FLASH;
  const larg = Math.max(6, Math.round(VL * 0.24));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.6) * p * 0.95 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.dano;
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function desenharBrilhoUrano() {
  // Só quando O JOGADOR está drenando. Antes acendia com o poder de qualquer
   // um, e a tela ficava roxa por causa de uma briga do outro lado do mapa —
   // parecia que o efeito era seu quando não era. Quem está APANHANDO tem o
   // aviso vermelho, que é a informação certa para ele.
  const ativo = buraco.dreno > 0;
  if (!ativo && flashUrano <= 0) return;
  const base = ativo ? 0.26 + 0.1 * Math.sin(quadro * 0.12) : 0;
  const p = Math.max(base, flashUrano > 0 ? flashUrano / CFG.URANO_CLARAO : 0);
  const larg = Math.max(6, Math.round(VL * 0.2));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.8) * p * 0.85 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.urano[3];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

/* Golpe de Saturno: as laterais piscam alternando amarelo e azul. Duas cores
   trocando dão a sensação de impacto que uma cor só não dá — o olho lê a
   troca, não o brilho. */
/* Júpiter: um clarão lilás de tela cheia, curto, que respira uma vez */
function desenharClaraoJupiter() {
  if (flashJupiter <= 0) return;
  const p = flashJupiter / CFG.JUPITER_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.5) * 0.5 * forcaFlash();
  ctx.fillStyle = COR.jupiter[1];
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

function desenharClaraoAzul() {
  if (flashAzul <= 0) return;
  const p = flashAzul / CFG.NETUNO_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.55 * forcaFlash();
  ctx.fillStyle = COR.netuno[0];
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

function desenharBrilhoSaturno() {
  if (flashTiro <= 0) return;
  const p = flashTiro / CFG.SATURNO_CLARAO;
  const larg = Math.max(6, Math.round(VL * 0.22));
  const troca = quadro % 8 < 4;
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.7) * p * 0.9 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = troca ? COR.saturno[3] : COR.bloco[3];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillStyle = troca ? COR.bloco[3] : COR.saturno[3];
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function desenharClaraoTiro() {
  if (flashTiro <= 0) return;
  const p = flashTiro / CFG.SATURNO_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.7 * forcaFlash();
  ctx.fillStyle = COR.bloco[0];
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

function desenharClaraoEnjoo() {
  if (flashEnjoo > 0) {
    const p = flashEnjoo / 26;
    ctx.globalAlpha = Math.pow(p, 1.4) * 0.8 * forcaFlash();
    ctx.fillStyle = COR.enjooClarao;
    ctx.fillRect(0, 0, VL, VA);
    ctx.globalAlpha = 1;
  }
  if (buraco.enjoo <= 0) return;
  // friagem: uma moldura azul fina lembrando que o freio está ligado
  const q = Math.min(1, buraco.enjoo / 40);
  const larg = Math.max(4, Math.round(VL * 0.13));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 2.2) * 0.5 * q * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.cometa[1];
    ctx.fillRect(i, 0, 1, VA); ctx.fillRect(VL - 1 - i, 0, 1, VA);
    ctx.fillRect(0, i, VL, 1); ctx.fillRect(0, VA - 1 - i, VL, 1);
  }
  ctx.globalAlpha = 1;
}

/* No fundo preto qualquer chapada clara na borda vira um estouro: o olho
   está adaptado ao escuro e o mesmo alfa que era um brilho no branco vira
   uma parede de luz. Todos os flashes de lateral passam por aqui. */
function forcaFlash() { return CFG.FUNDO_PB ? 0.42 : 1; }

function desenharBrilhoLateral() {
  if (flashLado <= 0) return;
  const p = flashLado / 34;
  const larg = Math.max(6, Math.round(VL * 0.19));
  for (let i = 0; i < larg; i++) {
    const q = 1 - i / larg;
    const a = Math.pow(q, 1.9) * p * 0.85 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.coracao[1];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function barra(x, y, l, p, cor) {
  ctx.fillStyle = COR.borda; ctx.fillRect(x, y, l, 3);
  ctx.fillStyle = cor; ctx.fillRect(x, y, Math.round(limitar(p, 0, 1) * l), 3);
}

/* Triângulo cheio apontando para `ang`: começa em (x,y) e afina até a ponta.
   Rasterizado a mão porque em pixel art um path com antialias vira borrão. */
/* Triângulo cheio, rasterizado pela CAIXA: percorre o quadrado que envolve a
   seta e, para cada pixel, desgira e testa se cai dentro. A versão anterior
   andava 1 px por vez ao longo do eixo e pintava uma faixa perpendicular a
   cada passo — nos ângulos diagonais os passos não se encostavam e a seta
   saía esfarelada, um punhado de pontinhos soltos. Era isso que sujava a
   marca: no eixo ela era limpa, na diagonal virava chuvisco. */
function seta(x, y, ang, tam, larg, cor) {
  ctx.fillStyle = cor;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const r = Math.ceil(Math.max(tam, larg)) + 1;
  const x0 = Math.round(x), y0 = Math.round(y);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const u = dx * ca + dy * sa;                // ao longo da seta
      if (u < -0.5 || u > tam) continue;
      const v = dy * ca - dx * sa;                // perpendicular
      if (Math.abs(v) > larg * (1 - u / tam) + 0.5) continue;
      ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
    }
  }
}

/* Marca de borda: aponta para um jogador que está fora da tela. Ela respira
   na direção dele (avança e recua) e leva um halo, senão some no fundo claro.
   As silhuetas alternativas (seta dupla, miolo aceso) foram embora junto com
   as marcas de cometa e cadente — só jogador tem seta agora, e a cor de cada
   um já basta para saber quem é. */
function marcaNaBorda(mx0, my0, cores) {
  const cx = VL / 2, cy = VA / 2;
  const dx = mx0 - cx, dy = my0 - cy;
  const ang = Math.atan2(dy, dx);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const pulso = 0.5 + 0.5 * Math.sin(quadro * 0.11);

  // a margem encolhe com o pulso: é isso que faz a seta cutucar para fora
  const marg = 15 - pulso * 4;
  // o placar da direita cresce com o número de rivais; a seta desvia dele
  const tetoHUD = dx > 0 ? alturaPlacar() + 8 : 22;
  const m = Math.max(Math.abs(dx) / (VL / 2 - marg),
                     Math.abs(dy) / (VA / 2 - marg), 0.001);
  const bx = cx + dx / m, by = Math.max(cy + dy / m, dy < 0 ? tetoHUD : -1e9);

  const tam = 8 + pulso * 2.2;
  const larg = 4;

  /* Sem halo e sem rastro: só o triângulo e o contorno. Eram três discos
     empilhados chegando a 8 px além da ponta — de longe a marca virava uma
     bolota escura com um caco claro no meio, e o que se lia era a bolota, não
     a direção. O contorno de 1 px já resolve o que o halo resolvia (destacar
     a seta de uma nebulosa por baixo) sem sujar nada em volta. Um rastro
     atrás da ponta também foi testado: em ângulo diagonal ele lia como
     sujeira solta, não como rumo. */
  const rx = bx - ca * tam * 0.55, ry = by - sa * tam * 0.55;
  seta(rx - ca, ry - sa, ang, tam + 2, larg + 1, COR.vazio);       // contorno
  seta(rx, ry, ang, tam, larg, cores[1]);
}

/* cada rival fora de vista ganha sua marca na borda, na cor dele */
/* Com a arena cheia, uma seta por bot virava festival de novo. Ganham seta
   só o líder (se não for você) e os dois mais perto entre os que estão fora
   de vista — quem importa agora e quem está chegando. */
function desenharMarcaRival() {
  const fora = rivais.filter(r => {
    const rx = paraTelaX(r.x), ry = paraTelaY(r.y), rr = raioDe(r) * zoom;
    return !(rx > -rr && rx < VL + rr && ry > -rr && ry < VA + rr);
  }).sort((a, b) => Math.hypot(a.x - buraco.x, a.y - buraco.y) -
                    Math.hypot(b.x - buraco.x, b.y - buraco.y));
  const mostrar = fora.slice(0, 2);
  if (primeiro && primeiro !== buraco && fora.indexOf(primeiro) >= 0 &&
      mostrar.indexOf(primeiro) < 0) mostrar.push(primeiro);
  for (const r of mostrar) {
    const p = paletaDe(r);
    marcaNaBorda(paraTelaX(r.x), paraTelaY(r.y), [p.disco[4], p.disco[6]]);
  }
}


/* Aviso do efeito no meio da tela. Entra estufando, sobe devagar e some.
   O brilho é o próprio texto repetido em volta com alfa baixo — o contorno
   branco do texto() sozinho não separa a letra de um fundo colorido. */
function anunciar(txt, cor, iris, sub) {
  anuncio = { txt: txt, cor: cor, vida: CFG.ANUNCIO, total: CFG.ANUNCIO,
              iris: !!iris };
}

/* Um aviso agendado para daqui a tantos quadros. É como o cometa mostra
   primeiro o rótulo do efeito e só depois o custo: os dois ao mesmo tempo
   competiam, e um em cima do outro fazia o primeiro sumir sem ser lido. */
function anunciarDepois(txt, cor, atraso) {
  anuncioAdiado = { txt: txt, cor: cor, espera: atraso };
}
function passoAnuncioAdiado() {
  if (!anuncioAdiado) return;
  if (--anuncioAdiado.espera > 0) return;
  anunciar(anuncioAdiado.txt, anuncioAdiado.cor);
  anuncioAdiado = null;
}

/* Escreve letra a letra em arco-íris, as cores correndo pela palavra. Só o
   aviso do escudo usa isso — é o mesmo arco-íris que toma o disco de acreção,
   e ver a mesma cor nos dois lugares liga o texto ao efeito sem explicar. */
function glifosIris(str, x, y, tam, desloc) {
  let cx = Math.round(x);
  let i = 0;
  for (const ch of str) {
    const g = glifo(ch);
    const cor = COR.arcoiris[(i + desloc) % COR.arcoiris.length];
    ctx.fillStyle = cor;
    for (let ly = 0; ly < FONTE_H; ly++) {
      const linha = g.linhas[ly];
      for (let lx = 0; lx < g.larg; lx++)
        if (linha[g.c0 + lx] === "#")
          ctx.fillRect(cx + lx * tam, Math.round(y) + ly * tam, tam, tam);
    }
    cx += (g.larg + VAO) * tam;
    if (ch !== " ") i++;
  }
}

function desenharAnuncio() {
  if (!anuncio) return;
  if (--anuncio.vida <= 0) { anuncio = null; return; }
  const p = 1 - anuncio.vida / anuncio.total;        // 0 no começo, 1 no fim
  const tam = p < 0.1 ? 1 : 2;                       // estufa e assenta
  const l = larguraTexto(anuncio.txt, tam);
  const x = Math.round((VL - l) / 2);
  /* Sobe DEVAGAR e vai ACELERANDO (slow in): com subida linear o texto parece
     puxado por um fio. E logo na entrada ele passa um pouco do lugar e volta,
     que é o repique que o olho espera de algo que aparece de repente. */
  const subida = Math.pow(p, 1.9) * 16;
  const repique = p < 0.3 ? Math.sin(p / 0.3 * Math.PI) * 3.5 : 0;
  const y = Math.round(VA * 0.33 - subida + repique);
  const a = p > 0.7 ? (1 - p) / 0.3 : 1;             // só apaga no fim

  const desloc = Math.floor(quadro * 0.22);
  ctx.globalAlpha = a * (0.16 + 0.12 * Math.sin(quadro * 0.3));
  for (let d = 2; d <= 4; d++) {                     // halo em volta da palavra
    if (anuncio.iris) {
      glifosIris(anuncio.txt, x - d, y, tam, desloc);
      glifosIris(anuncio.txt, x + d, y, tam, desloc);
      glifosIris(anuncio.txt, x, y - d, tam, desloc);
      glifosIris(anuncio.txt, x, y + d, tam, desloc);
    } else {
      desenhaGlifos(anuncio.txt, x - d, y, anuncio.cor, tam);
      desenhaGlifos(anuncio.txt, x + d, y, anuncio.cor, tam);
      desenhaGlifos(anuncio.txt, x, y - d, anuncio.cor, tam);
      desenhaGlifos(anuncio.txt, x, y + d, anuncio.cor, tam);
    }
  }
  ctx.globalAlpha = a;
  if (anuncio.iris) {
    // contorno primeiro, depois as letras coloridas por cima
    for (let dx = -1; dx <= 1; dx++)
      for (let dy = -1; dy <= 1; dy++)
        if (dx || dy) desenhaGlifos(anuncio.txt, x + dx * tam, y + dy * tam, COR.vazio, tam);
    glifosIris(anuncio.txt, x, y, tam, desloc);
  } else {
    texto(anuncio.txt, x, y, anuncio.cor, tam);
  }
  ctx.globalAlpha = 1;
}

function desenharHUD() {
  // Seta é só para jogador. Com quatro em campo, mais cometa e cadente, a
  // borda virava um festival de setas e ninguém achava o que importava.
  desenharMarcaRival();
  /* Placar enxuto: só o número de estrelas de cada um e, embaixo, um fio
     fino com o que falta para o próximo nível. O painel em faixa larga que
     havia aqui roubava o topo da tela inteiro e atrapalhava justamente na
     hora de manobrar. A coroa fica ao lado de quem lidera.
     Você à esquerda, os rivais empilhados à direita, o X no meio. */
  const LARG = 26;
  // 13, não 11: com 11 a barra de um rival encostava no número do de baixo
  const ALT = 13;

  /* No brawl, a conta regressiva logo abaixo do X. Ela é a única informação
     nova da tela e é a que decide a jogada: com três segundos no relógio,
     partir para cima de alguém do outro lado da arena não é mais plano. */
  if (brawl > 0) {
    const seg = Math.ceil(brawl / 60);
    const r = "BRAWL " + seg;
    let bx = Math.round((VL - larguraTexto(r, 1)) / 2);
    // letra por letra, cada uma numa cor da faixa: o rótulo pisca junto com
    // a moldura, e as duas coisas se leem como a mesma coisa
    for (let k = 0; k < r.length; k++) {
      texto(r[k], bx, 19, corIris(0.3, k), 1);
      bx += larguraTexto(r[k], 1) + VAO;
    }
  }

  if (dicaTeclado > 0) {
    const d = "setas movem   -   espaco suga";
    ctx.globalAlpha = Math.min(1, dicaTeclado / 70) * 0.85;
    textoCentro(d, VA - FONTE_H - 6, COR.hud, 1);
    ctx.globalAlpha = 1;
  }

  const meu = "" + buraco.comidas;
  texto(meu, 5, 4, COR.hud, 1);
  if (primeiro === buraco)
    desenharCoroaHUD(5 + larguraTexto(meu, 1) + 2, 6, COR.hud);
  barra(5, 13, LARG, buraco.nivel < CFG.NIVEL_MAX
        ? buraco.progresso / custoDoNivel(buraco.nivel) : 1, COR.disco[4]);

  desenharPlacarVivo();
  desenharContagem(brawl > 0 ? 30 : 20);
  desenharCombo();

  // sobe um pouco: pegar a cadente dá 10 estrelas e quase sempre sobe de
  // nível junto, então os dois avisos apareciam um por cima do outro
  if (flash > 0) textoCentro("CRESCEU!", Math.round(VA * 0.21), COR.coracao[1], 2);
  desenharAnuncio();

  desenharBotaoSair();
}

/* Placar ao vivo, no canto direito: os cinco primeiros e, se você não estiver
   entre eles, a sua linha embaixo com a sua posição. É o "leaderboard" de
   todo .io — é ele que transforma uma multidão em uma corrida. */
const PLACAR_N = 5, PLACAR_ALT = 9, PLACAR_L = 78;
function linhasPlacar() {
  const ordem = todos().slice().sort((a, b) => b.comidas - a.comidas);
  const linhas = ordem.slice(0, PLACAR_N).map((p, i) => ({ p: p, pos: i + 1 }));
  const eu = ordem.indexOf(buraco);
  if (eu >= PLACAR_N) linhas.push({ p: buraco, pos: eu + 1 });
  return linhas;
}
function alturaPlacar() { return 4 + linhasPlacar().length * PLACAR_ALT + 2; }
function cortarTexto(t, larg) {
  if (larguraTexto(t, 1) <= larg) return t;
  while (t.length > 1 && larguraTexto(t + ".", 1) > larg) t = t.slice(0, -1);
  return t + ".";
}
function desenharPlacarVivo() {
  const x1 = VL - 4, x0 = x1 - PLACAR_L;
  const linhas = linhasPlacar();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = COR.painel;
  ctx.fillRect(x0 - 3, 2, PLACAR_L + 5, linhas.length * PLACAR_ALT + 4);
  ctx.globalAlpha = 1;
  linhas.forEach((l, k) => {
    const p = l.p, eu = p === buraco;
    const y = 4 + k * PLACAR_ALT;
    const cor = eu ? COR.hud : paletaDe(p).disco[6];
    // o líder leva a coroa no lugar do número: fora do placar ela encostava no X
    if (p === primeiro) desenharCoroaHUD(x0 - 1, y + 2, cor);
    else texto("" + l.pos, x0, y, eu ? COR.hud : COR.hudFraco, 1);
    const xn = x0 + 11;
    disco(xn + 1, y + 3, 1.6, eu ? COR.disco[4] : paletaDe(p).disco[4]);
    const num = "" + p.comidas;
    const xNum = x1 - larguraTexto(num, 1);
    const nome = cortarTexto(nomeDe(p), xNum - (xn + 5) - 3);
    texto(nome, xn + 5, y, cor, 1);
    texto(num, xNum, y, cor, 1);
  });
}

/* tela de fim: quem chegou ao nível 12 e quantas estrelas cada um juntou */
/* Gráfico de estrelas por tempo, uma linha por jogador na cor dele.
   O eixo Y vai fixo até a meta: assim a altura de cada traço já diz o quanto
   faltava, e a linha de quem venceu encosta no topo. Escala automática faria
   uma partida apertada parecer igual a uma goleada. */
function desenharGrafico(x0, y0, l, a) {
  if (historico.length < 2) return;
  const tmax = Math.max(1, historico[historico.length - 1].t);
  const emX = t => x0 + (t / tmax) * l;
  const emY = v => y0 + a - (Math.min(v, CFG.META) / CFG.META) * a;

  // um cartão claro atrás: a tela de fim deixa o jogo aparecer por baixo, e
  // corações subindo no meio do gráfico atrapalhavam a leitura das linhas
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = COR.painel;
  ctx.fillRect(x0 - 4, y0 - 8, l + 10, a + 22);
  ctx.globalAlpha = 1;

  // moldura: só as duas réguas, sem caixa fechada
  ctx.fillStyle = COR.borda;
  ctx.fillRect(x0, y0, 1, a + 1);
  ctx.fillRect(x0, y0 + a, l + 1, 1);

  // a meta, pontilhada no alto
  ctx.fillStyle = COR.hudFraco;
  for (let x = x0; x <= x0 + l; x += 3) ctx.fillRect(x, y0, 1, 1);

  // do último para o primeiro, para a sua linha ficar por cima. Com a arena
  // cheia, só os três primeiros e você: oito linhas viravam um novelo
  const quantos = historico[0].v.length;
  const fim = historico[historico.length - 1].v;
  const top = fim.map((v, i) => i).sort((a, b) => fim[b] - fim[a]).slice(0, 3);
  for (let i = quantos - 1; i >= 0; i--) {
    const eu = i === 0;
    if (!eu && top.indexOf(i) < 0) continue;
    const cor = eu ? COR.hud : paletaDe(rivais[i - 1]).disco[6];
    let ax = emX(historico[0].t), ay = emY(historico[0].v[i]);
    for (let k = 1; k < historico.length; k++) {
      const bx = emX(historico[k].t), by = emY(historico[k].v[i]);
      linha(ax, ay, bx, by, cor);
      if (eu) linha(ax, ay + 1, bx, by + 1, cor);   // a sua sai mais grossa
      ax = bx; ay = by;
    }
    // um ponto na ponta, para achar o fim de cada traço
    disco(ax, ay, 1.4, cor);
  }

  // legendas: a meta em cima da régua e a duração no fim do eixo do tempo
  texto("" + CFG.META, x0 + 3, y0 - 1, COR.hudFraco, 1);
  const dur = Math.floor(tmax / 60) + ":" + ("0" + Math.round(tmax % 60)).slice(-2);
  texto(dur, x0 + l - larguraTexto(dur, 1), y0 + a + 3, COR.hudFraco, 1);
}

function desenharFim() {
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = COR.vazio; ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;

  const ganhou = vencedor === buraco;
  // sobe o bloco todo: com o gráfico embaixo, o layout antigo estourava a tela
  const topo = Math.round(VA * 0.10);
  const palV = ganhou ? null : paletaDe(vencedor);
  const titulo = ganhou ? "voce venceu!" : nomeDe(vencedor) + " venceu!";
  const tamT = larguraTexto(titulo, 2) <= VL - 10 ? 2 : 1;
  textoCentro(cortarTexto(titulo, VL - 10), topo + (tamT === 1 ? 4 : 0),
              ganhou ? COR.hud : palV.disco[6], tamT);
  // a linha de baixo conta o que você levou da partida, o mais importante primeiro
  const mm = s => Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  const info = partida.recorde ? "novo recorde! " + mm(salvo.recorde)
             : partida.liberou ? "visual novo liberado!"
             : "+" + buraco.comidas + " estrelas  -  total " + salvo.total;
  textoCentro(cortarTexto(info, VL - 8), topo + 20,
              partida.recorde || partida.liberou ? COR.coroa[2] : COR.hudFraco, 1);

  /* Em tela DEITADA o placar e o gráfico ficam lado a lado. Empilhados eles
     não cabiam na altura (o gráfico simplesmente sumia) e, pior, o nome ia
     para a beira esquerda e o número para a beira direita, com um vão de tela
     inteira no meio — dois dados que se leem juntos não podem ficar a meio
     metro um do outro no monitor. */
  const larguraCol = Math.min(VL - 24, COLUNA);
  const colX = Math.round((VL - larguraCol) / 2);
  const emColunas = VL >= 300 && VA < 300;
  const placarL = emColunas ? Math.round(larguraCol * 0.42) : larguraCol;

  // os cinco primeiros e, se você ficou de fora, a sua linha com a posição.
  // Em tela baixa só cabe o que fica acima do botão — e a sua linha nunca sai
  let y0 = topo + 38;
  let linhas = linhasPlacar();
  const cabem = Math.max(2, Math.floor((botaoJogar().y - 6 - y0) / 11));
  if (linhas.length > cabem) {
    const minha = linhas.find(l => l.p === buraco);
    linhas = linhas.filter(l => l.p !== buraco).slice(0, cabem - 1);
    linhas.push(minha);
    linhas.sort((a, b) => a.pos - b.pos);
  }
  for (const l of linhas) {
    const p = l.p, eu = p === buraco;
    const cor = eu ? COR.hud : paletaDe(p).disco[6];
    const e1 = "" + p.comidas;
    const xNum = colX + placarL - larguraTexto(e1, 1);
    texto(l.pos + " " + cortarTexto(nomeDe(p), xNum - colX - 16), colX, y0, cor, 1);
    texto(e1, xNum, y0, cor, 1);
    y0 += 11;
  }

  /* desempenho ao longo da partida */
  const gx = emColunas ? colX + placarL + 14 : colX;
  const gl = emColunas ? larguraCol - placarL - 14 : larguraCol;
  const gy = emColunas ? topo + 38 : y0 + 12;
  const ga = botaoJogar().y - gy - 14;
  // se nem assim couber, melhor não desenhar do que desenhar por cima do botão
  if (ga >= 26) desenharGrafico(gx, gy, gl, ga);

  /* Numa sala online quem recomeça é o anfitrião — os outros esperam. O
     botão vira aviso em vez de sumir: espaço vazio no lugar dele daria a
     impressão de que a partida travou. */
  if (REDE.ativa && !REDE.anfitriao) {
    const pontos = ".".repeat(1 + Math.floor(quadro / 30) % 3);
    textoCentro("esperando o anfitriao" + pontos,
                botaoJogar().y + 7, COR.hudFraco, 1);
  } else {
    const b = comprimir(botaoJogar(), "jogar");
    const pulso = (Math.sin(quadro * 0.06) + 1) / 2;
    caixa(b, COR.painel, pulso > 0.5 ? COR.disco[4] : COR.disco[3], 2);
    texto("de novo", b.x + Math.round((b.l - larguraTexto("de novo", 2)) / 2),
          b.y + Math.round((b.a - FONTE_H * 2) / 2) + 1, COR.hud, 2);
  }

  desenharBotaoSair();
}

/* ── tela de visuais ─────────────────────────────────────────
   O boneco posa em cima (é a prévia ao vivo: o que você escolhe aparece
   nele na hora) e embaixo vêm duas grades de 4x2: cores e enfeites. Em tela
   deitada as duas grades ficam lado a lado. */
let visualMsg = "";
const VIS_C = 22, VIS_E = 6;
function layoutVisual() {
  const gl = 4 * VIS_C + 3 * VIS_E, ga = 2 * VIS_C + VIS_E;
  const deitado = VA < 300;
  const yG = deitado ? Math.round(VA * 0.5) : Math.round(VA * 0.42);
  const cor = deitado ? { x: Math.round(VL / 2 - gl - 10), y: yG } : { x: Math.round((VL - gl) / 2), y: yG };
  const enf = deitado ? { x: Math.round(VL / 2 + 10), y: yG } : { x: cor.x, y: yG + ga + 22 };
  return { cor: cor, enf: enf, gl: gl, ga: ga,
           bonecoY: deitado ? Math.round(VA * 0.3) : Math.round(VA * 0.24),
           msgY: (deitado ? yG + ga : enf.y + ga) + 10 };
}
function celulaVisual(g, i) {
  return { x: g.x + (i % 4) * (VIS_C + VIS_E), y: g.y + Math.floor(i / 4) * (VIS_C + VIS_E), l: VIS_C, a: VIS_C };
}
const CADEADO = [".###.", "#...#", "#...#", "#####", "##.##", "#####"];
function desenharVisual() {
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = COR.vazio; ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
  const lv = layoutVisual();
  textoCentro("visual", Math.round(VA * 0.06) + 6, COR.hud, 2);
  textoCentro("estrelas juntadas: " + salvo.total, Math.round(VA * 0.06) + 26, COR.hudFraco, 1);
  const grade = (g, itens, escolhido, rot, desenho) => {
    texto(rot, g.x, g.y - 10, COR.hudFraco, 1);
    itens.forEach((it, i) => {
      const c = comprimir(celulaVisual(g, i), rot + i);
      const ok = liberado(it), sel = i === escolhido;
      caixa(c, sel ? COR.painel : COR.vazio, sel ? COR.disco[5] : ok ? COR.hudFraco : COR.borda, sel ? 2 : 1);
      ctx.globalAlpha = ok ? 1 : 0.3;
      desenho(it, c.x + c.l / 2, c.y + c.a / 2);
      ctx.globalAlpha = 1;
      if (!ok) carimbo(CADEADO, c.x + c.l - 5, c.y + c.a - 5, COR.hudFraco);
    });
  };
  grade(lv.cor, CORES_SKIN, salvo.cor, "cor", (it, x, y) => {
    if (it.iris) for (let k = 0; k < 7; k++) anel(x, y, 7 - k * 0.5, 1, COR.arcoiris[(k + Math.floor(quadro / 6)) % 7]);
    else { const p = it.h ? paletaRival(it.h, it.s) : COR; anel(x, y, 7, 2, p.disco[5]); disco(x, y, 5, COR.corpo); anel(x, y, 5, 1, p.contorno); }
  });
  grade(lv.enf, ENFEITES, salvo.enfeite, "enfeite", (it, x, y) => {
    const n = it.nome;
    if (n === "nada") { texto("-", x - 2, y - 4, COR.hudFraco, 1); return; }
    if (n === "laco") carimboCores(SPR_LACO, x, y, { a: "#ff6fa8", b: "#c2306e", c: "#ffc4dc" }, 1);
    else if (n === "festa") carimboCores(SPR_FESTA, x, y, { a: "#5ec8e8", b: "#ff7cc4", c: "#ffd85c" }, 1);
    else if (n === "flor") carimboCores(SPR_FLOR, x, y, { a: "#fff0f7", b: "#ffd85c" }, 1);
    else if (n === "bruxa") carimboCores(SPR_BRUXA, x, y, { a: "#3d2a5c", b: "#ffd85c" }, 1);
    else if (n === "cogumelo") carimboCores(SPR_COGUMELO, x, y, COR_COGUMELO, 1);
    else if (n === "fones") { arcoFones(x, y + 2, 5, 5, 3, "#8a3d6e"); arcoFones(x, y + 2, 5, 5, 1, "#c9b6e8"); conchaFone(x - 5, y + 2, 1.5, 2.5); conchaFone(x + 5, y + 2, 1.5, 2.5); }
    else if (n === "estrelas") { carimboCores(SPR_BRILHO, x - 4, y + 2, COR_BRILHO, 1); carimboCores(SPR_BRILHO_P, x + 4, y - 3, COR_BRILHO, 1); carimboCores(SPR_BRILHO_P, x + 3, y + 4, COR_BRILHO, 1); }
  });
  if (visualMsg) textoCentro(cortarTexto(visualMsg, VL - 8), lv.msgY, COR.hud, 1);
  desenharBotaoSair();
}
function toqueVisual(gx, gy) {
  if (dentro(gx, gy, botaoSair(), 8)) { SFX.clique(); apertar("sair", () => { cena = "menu"; }); return; }
  const lv = layoutVisual();
  const tenta = (g, itens, campo, rot) => {
    for (let i = 0; i < itens.length; i++) {
      if (!dentro(gx, gy, celulaVisual(g, i), 2)) continue;
      const it = itens[i];
      if (liberado(it)) {
        SFX.clique();
        apertar(rot + i, () => { salvo[campo] = i; gravar(); bater(buraco, 0.25); buraco.pulso = 1; });
        visualMsg = it.nome;
      } else {
        SFX.perda();
        visualMsg = "faltam " + (it.custo - salvo.total) + " estrelas";
      }
      return true;
    }
    return false;
  };
  if (!tenta(lv.cor, CORES_SKIN, "cor", "cor")) tenta(lv.enf, ENFEITES, "enfeite", "enfeite");
}

/* Um quadradinho por opção de número de oponentes, logo acima do JOGAR. */
function botaoOponente(i) {
  // sete opções cabem até no celular pequeno (180 px de campo)
  const l = 18, esp = 4;
  const n = CFG.OPCOES_RIVAIS.length;
  const total = n * l + (n - 1) * esp;
  const x0 = Math.round((VL - total) / 2);
  const b = botaoOnline();          // logo abaixo do par JOGAR / ONLINE
  // acima deles a linha batia bem em cima do personagem que fica esperando
  // no meio da tela
  return { x: x0 + i * (l + esp), y: b.y + b.a + 12, l: l, a: 18 };
}

/* Som e fundo: dois botões de verdade, com caixa e contorno próprios. Antes
   eram só os iconezinhos soltos sobre uma placa, e não se lia que dava para
   apertar — nem qual dos dois estava ligado. */
const ICO_L = 30, ICO_A = 24, ICO_ESP = 10;
function botaoSom() {
  const b0 = botaoOponente(0);
  return { x: Math.round((VL - ICO_L * 3 - ICO_ESP * 2) / 2),
           y: b0.y + b0.a + 13, l: ICO_L, a: ICO_A };
}
function botaoFundo() {
  const b = botaoSom();
  return { x: b.x + ICO_L + ICO_ESP, y: b.y, l: ICO_L, a: ICO_A };
}
/* o terceiro botão leva à tela de visuais; o ícone é o próprio laço */
function botaoVisual() {
  const b = botaoSom();
  return { x: b.x + (ICO_L + ICO_ESP) * 2, y: b.y, l: ICO_L, a: ICO_A };
}

/* Os dois ícones são o dobro do tamanho dos antigos e desenhados em massa
   cheia, sem traço de 1 px: em 24 px de botão o que se lê de longe é a
   silhueta, não o detalhe. A lua saiu de um círculo menos outro deslocado
   para a direita — a mordida fica limpa, sem o bico torto do desenho à mão. */
const ICONE_LUA = [
  "....####.....",
  "..####.......",
  ".####........",
  ".####........",
  "####.........",
  "####.........",
  "####.........",
  "####.........",
  "####.........",
  ".####........",
  ".####........",
  "..####.......",
  "....####....."
];
/* Sol: miolo maciço, quatro raios retos e quatro tocos nas diagonais. Os
   raios saíram na mão em vez de por fórmula — em 13 px a diagonal calculada
   sempre sai quebrada, com pixel solto no meio do vão. */
const ICONE_SOL = [
  "......###......",
  "......###......",
  "..#.........#..",
  "...#..###..#...",
  ".....#####.....",
  "....#######....",
  "##.#########.##",
  "##.#########.##",
  "##.#########.##",
  "....#######....",
  ".....#####.....",
  "...#..###..#...",
  "..#.........#..",
  "......###......",
  "......###......"
];

const ESTRELINHA = [".#.", "###", ".#."];
/* O botão mostra PARA ONDE ele leva, não onde você está: no escuro aparece o
   sol, que é o que acontece se apertar. Com a lua fixa nos dois estados era
   preciso saber de cor qual dos dois acesos significava o quê. */
function desenharIconeFundo(cx, cy, pb) {
  const c = COR.disco[5];
  if (pb) { carimbo(ICONE_SOL, cx, cy, c); return; }
  // +2: carimbo centraliza pela caixa, mas a massa da lua fica toda na
  // metade esquerda dela, e sem o empurrão o ícone nasce torto no botão
  carimbo(ICONE_LUA, cx + 2, cy, c);
  // duas estrelinhas no vão da lua, do lado em que ela está aberta
  carimbo(ESTRELINHA, cx + 7, cy - 4, c);
  px(cx + 5, cy + 4, c);
}

/* Caixa de som: corpo maciço, cone reto e duas ondas em arco. */
const ICONE_SOM = [

/* No mudo o corpo fica INTEIRO e só as ondas viram um X. A barra cortando o

const ICONE_SOM_MUDO = [

function desenharIconeSom(cx, cy, ligado) {
