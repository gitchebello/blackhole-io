                   tipo: "enjoo", cor: COR.cometa[1 + Math.floor(Math.random() * 3)] });
  }
}

/* Uma amostra a cada meio segundo. Meio segundo é o suficiente para o
   traçado ficar liso na largura que ele tem na tela, e uma partida de três
   minutos guarda só 360 amostras. */
const PASSO_HISTORICO = 30;
/* A coroa muda de cabeça quando alguém passa o líder. Empate NÃO troca: no
   0 a 0 do começo, e a cada vez que dois se igualam, a coroa ficaria pulando
   de um para o outro sem ninguém ter feito nada. */
function verLideranca() {
  let melhor = null;
  for (const p of todos())
    if (p.comidas > 0 && (!melhor || p.comidas > melhor.comidas)) melhor = p;
  if (melhor === primeiro) return;
  if (primeiro && melhor && melhor.comidas === primeiro.comidas) return;
  primeiro = melhor;
  if (!primeiro || cena !== "jogo") return;
  coroaAnim = 1;
  if (primeiro === buraco) SFX.coroa();
  explodirEstrelas(primeiro.x, primeiro.y, 38);
  if (primeiro === buraco) { tremor = Math.max(tremor, 8); flashLado = 24; }
}

/* estouro de estrelinhas douradas: o sinal de que a coroa mudou de dono */
function explodirEstrelas(x, y, quantas) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.7 + Math.random() * 2.1) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 22 + Math.floor(Math.random() * 16), arrasto: 0.945,
                   tipo: "estrela",
                   cor: COR.coroa[Math.floor(Math.random() * COR.coroa.length)] });
  }
}

function anotarDesempenho() {
  if (historico.length && quadro - historico[historico.length - 1].q < PASSO_HISTORICO)
    return;
  historico.push({ q: quadro, t: (quadro - quadroInicio) / 60,
                   v: todos().map(p => p.comidas) });
}

function terminar(quem) {
  SFX.fim(quem === buraco);
  historico.push({ q: quadro, t: (quadro - quadroInicio) / 60,
                   v: todos().map(p => p.comidas) });
  vencedor = quem;
  cena = "fim";
  tremor = 14;
  soltarCoracoes(buraco.x, buraco.y, 40, 2.4, 1);
}

function passo() {
  quadro++;
  if (cena === "fim") {           // congela a partida, deixa a festa correr
    passoParticulas();
    return;
  }

  /* — direção — */
  let acelerando = false, freando = false;
  if (cena === "menu") {
    // no menu ele fica parado, esperando: só o disco de acreção gira
    buraco.vx = buraco.vy = 0;
    /* e espera ACIMA do botão. O centro da tela é onde ele nasce, mas em tela
       deitada esse centro cai bem em cima do JOGAR e o rosto ficava atrás da
       caixa. Em tela em pé a conta não muda nada: o botão está bem abaixo. */
    const alvoY = Math.min(VA / 2, botaoJogar().y - raioTela - 10);
    cam.x = buraco.x - VL / 2;
    cam.y = buraco.y - Math.max(raioTela + 4, alvoY);
  } else {
    if (toque.ativo) {
      const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
      if (Math.hypot(dx, dy) > CFG.ZONA_MORTA) buraco.ang = Math.atan2(dy, dx);
      acelerando = true;
    }
    /* No teclado não há como rodar o dedo: segurar shift ou espaço faz as
       vezes do gesto de espiral. Tem de ser um DESVIO de lerEspiral(), e não
       um acréscimo depois dela: sem dedo na tela ela zera `espiral` todo
       quadro, então somar por cima só rendia o valor de um quadro só. */
    let sugando;
    if (teclas.Shift || teclas[" "]) {
      sugando = true;
      espiral = Math.min(1, espiral + 0.14);
    } else {
      lerEspiral();
      // rodando o dedo, ele não sai andando: o gesto vira rotação, não
      // empurrão. Sem isso o buraco descreveria círculos junto com o dedo
      sugando = espiral > 0.15;
    }

    let tx = 0, ty = 0;
    if (teclas.ArrowLeft  || teclas.a || teclas.A) tx -= 1;
    if (teclas.ArrowRight || teclas.d || teclas.D) tx += 1;
    if (teclas.ArrowUp    || teclas.w || teclas.W) ty -= 1;
    if (teclas.ArrowDown  || teclas.s || teclas.S) ty += 1;
    if (tx || ty) { buraco.ang = Math.atan2(ty, tx); acelerando = true; }

    /* SUCÇÃO SÓ DE PÉ FIRME. Sugar andando virava "segura o espaço e passeia":
       no teclado não custa nada manter a tecla apertada, e o modo perdia o
       preço que ele tem no toque, onde é preciso rodar o dedo o tempo todo.
       Agora acionar já FREIA, e o poço só abre depois que ele de fato parou.
       A conta da velocidade é em pixels de TELA (por isso o × zoom): em mundo
       o mesmo movimento vale números diferentes a cada nível de câmera. */
    if (sugando) {
      acelerando = false;
      freando = true;
      if (Math.hypot(buraco.vx, buraco.vy) * zoom > CFG.SUCCAO_PARADO) espiral = 0;
    }
    // ^ DEPOIS das setas de propósito: elas ligam `acelerando` de volta, e com
    //   o freio antes delas dava para sair andando a 40% da velocidade com a
    //   tecla de sucção apertada — exatamente o passeio que era para acabar
  }

  /* — movimento: tudo é pensado em pixels de tela e convertido pelo zoom,
       para a sensação de velocidade não mudar quando a câmera se afasta — */
  // depois da pancada ele fica um tempo sem comando e sem teto de velocidade:
  // é o que faz os dois realmente se afastarem, em vez de grudarem de novo
  const zonzo = buraco.atordoado > 0;
  if (zonzo) { buraco.atordoado--; acelerando = false; }
  const fator = (turbo > 0 ? CFG.TERRA_FATOR : 1) *
                (buraco.enjoo > 0 ? CFG.COMETA_FREIO : 1);
  const acel = (acelerando ? CFG.ACEL * fator : 0) / zoom;
  const atrito = zonzo ? CFG.COLISAO_ARRASTO
               : freando ? CFG.SUCCAO_FREIO : CFG.ATRITO;
  buraco.vx = (buraco.vx + Math.cos(buraco.ang) * acel) * atrito;
  buraco.vy = (buraco.vy + Math.sin(buraco.ang) * acel) * atrito;
  const v = Math.hypot(buraco.vx, buraco.vy), vm = velMaxTela() / zoom;
  if (!zonzo && v > vm) { buraco.vx = buraco.vx / v * vm; buraco.vy = buraco.vy / v * vm; }
  buraco.x += buraco.vx; buraco.y += buraco.vy;
  if (turbo > 0) turbo--;

  /* — beirada do universo — */
  const L = limites(), m = raioMundo() + 1;
  if (buraco.x < L.x0 + m) { buraco.x = L.x0 + m; buraco.vx *= -0.35; }
  if (buraco.y < L.y0 + m) { buraco.y = L.y0 + m; buraco.vy *= -0.35; }
  if (buraco.x > L.x1 - m) { buraco.x = L.x1 - m; buraco.vx *= -0.35; }
  if (buraco.y > L.y1 - m) { buraco.y = L.y1 - m; buraco.vy *= -0.35; }

  for (const r of rivais) passoRival(r, L);
  passoTrombadas();
  passoCadente(L);
  passoCometa(L);

  /* — crescimento suave do raio e do afastamento da câmera — */
  const raioAlvo = CFG.RAIO_BASE + buraco.nivel * CFG.RAIO_TELA_PASSO;
  zoomAlvo = zoomDoNivel(buraco.nivel);
  raioTela += (raioAlvo - raioTela) * 0.08;
  /* Ao subir de nível a câmera não vai direto ao novo zoom: ela passa do
     ponto e volta. É o mesmo truque de uma câmera de cinema puxando para
     trás — o exagero de meio segundo é o que faz o ganho de campo ser
     SENTIDO, em vez de escorregar despercebido em algumas dezenas de
     quadros. Fora da animação, a aproximação lenta de sempre. */
  if (expansao > 0.004) {
    expansao *= CFG.ZOOM_FREIO;
    const alvo = zoomAlvo * (1 - expansao * CFG.ZOOM_ESTOURO);
    zoom += (alvo - zoom) * 0.16;
  } else {
    expansao = 0;
    zoom += (zoomAlvo - zoom) * 0.05;
  }

  /* — o campo repõe estrelas conforme o universo abre — */
  const alvo = alvoEstrelas();
  if (estrelas.length < alvo) estrelas.push(novaEstrela(buraco));

  /* — estrelas: os dois disputam; ganha quem estiver proporcionalmente
       mais perto, medindo pelo próprio alcance de cada um — */
  const sugadores = todos().map(p => ({ quem: p, x: p.x, y: p.y, rm: raioDe(p) }));
  // o ímã de Marte estica só o alcance do jogador, e por pouco tempo:
  // esticar demais faria as estrelas virem sozinhas e tirava a graça de mirar.
  // O gesto de espiral soma por cima, enquanto o dedo estiver rodando
  sugadores[0].alc = sugadores[0].rm * CFG.ALCANCE_SUCCAO *
                     (ima > 0 ? CFG.MARTE_ALCANCE : 1) *
                     (1 + espiral * CFG.ESPIRAL_ALCANCE);
  for (let k = 1; k < sugadores.length; k++)
    sugadores[k].alc = sugadores[k].rm * CFG.ALCANCE_SUCCAO;

  for (let i = estrelas.length - 1; i >= 0; i--) {
    const e = estrelas[i];
    e.fase += e.ritmo;

    let dono = null, melhor = Infinity, dDono = 0;
    for (const g of sugadores) {
      const d = Math.hypot(g.x - e.x, g.y - e.y) || 0.001;
      const rel = d / g.alc;
      if (rel < melhor) { melhor = rel; dono = g; dDono = d; }
    }

    if (melhor < 1) {
      e.presa = true;
      e.sx = dono.x; e.sy = dono.y; e.salc = dono.alc;
      const dx = dono.x - e.x, dy = dono.y - e.y, d = dDono;
      let puxao = dono.quem === buraco && ima > 0 ? CFG.MARTE_FORCA : 1;
      if (dono.quem === buraco) puxao *= 1 + espiral * CFG.ESPIRAL_FORCA;
      const forca = (CFG.FORCA_SUCCAO * puxao * (1 - melhor) + 0.02) / zoom;
      e.vx += (dx / d) * forca; e.vy += (dy / d) * forca;
      // gira a estrela em torno do sugador: o mergulho vira espiral.
      // É um giro do POSICIONAMENTO, não uma força lateral — força lateral
      // alimenta a órbita e a estrela nunca cai (foi o que aconteceu antes).
      const ang = 0.055 * CFG.GIRO_SUCCAO * (1 - melhor) * e.giro;
      const co = Math.cos(ang), si = Math.sin(ang);
      const rx = e.x - dono.x, ry = e.y - dono.y;
      e.x = dono.x + rx * co - ry * si;
      e.y = dono.y + rx * si + ry * co;
      const wx = e.vx, wy = e.vy;
      e.vx = wx * co - wy * si; e.vy = wx * si + wy * co;
    } else if (e.presa) { e.presa = false; e.vx *= 0.9; e.vy *= 0.9; }

    e.x += e.vx; e.y += e.vy; e.vx *= 0.985; e.vy *= 0.985;
    if (e.x < L.x0 + 2 || e.x > L.x1 - 2) { e.vx *= -0.6; e.x = limitar(e.x, L.x0 + 2, L.x1 - 2); }
    if (e.y < L.y0 + 2 || e.y > L.y1 - 2) { e.vy *= -0.6; e.y = limitar(e.y, L.y0 + 2, L.y1 - 2); }
    if (dono && dDono < dono.rm * 0.85) engolirEstrela(i, dono.quem);
  }

  /* — a Terra — */
  if (terra) {
    terra.quadro++;
    terra.x += terra.vx / zoom; terra.y += terra.vy / zoom;
    const rt = CFG.TERRA_RAIO / zoom;
    if (terra.x < L.x0 + rt || terra.x > L.x1 - rt) terra.vx *= -1;
    if (terra.y < L.y0 + rt || terra.y > L.y1 - rt) terra.vy *= -1;
    terra.x = limitar(terra.x, L.x0 + rt, L.x1 - rt);
    terra.y = limitar(terra.y, L.y0 + rt, L.y1 - rt);
    if (Math.hypot(terra.x - buraco.x, terra.y - buraco.y) < raioMundo() + rt * 0.4)
      engolirTerra(buraco);
    else for (const r of rivais) {
      if (Math.hypot(terra.x - r.x, terra.y - r.y) < raioMundoNivel(r.nivel) + rt * 0.4) {
        engolirTerra(r); break;
      }
    }
  } else if (--esperaTerra <= 0) {
    terra = novaTerra();
  }

  /* — Marte — */
  if (marte) {
    marte.quadro++;
    marte.x += marte.vx / zoom; marte.y += marte.vy / zoom;
    const rm2 = CFG.MARTE_RAIO / zoom;
    if (marte.x < L.x0 + rm2 || marte.x > L.x1 - rm2) marte.vx *= -1;
    if (marte.y < L.y0 + rm2 || marte.y > L.y1 - rm2) marte.vy *= -1;
    marte.x = limitar(marte.x, L.x0 + rm2, L.x1 - rm2);
    marte.y = limitar(marte.y, L.y0 + rm2, L.y1 - rm2);
    if (Math.hypot(marte.x - buraco.x, marte.y - buraco.y) < raioMundo() + rm2 * 0.4)
      engolirMarte(buraco);
    else for (const r of rivais) {
      if (Math.hypot(marte.x - r.x, marte.y - r.y) < raioMundoNivel(r.nivel) + rm2 * 0.4) {
        engolirMarte(r); break;
      }
    }
  } else if (--esperaMarte <= 0) {
    marte = novoMarte();
  }

  /* — Saturno — */
  if (saturno) {
    saturno.quadro++;
    saturno.x += saturno.vx / zoom; saturno.y += saturno.vy / zoom;
    const rs = CFG.SATURNO_RAIO / zoom;
    if (saturno.x < L.x0 + rs || saturno.x > L.x1 - rs) saturno.vx *= -1;
    if (saturno.y < L.y0 + rs || saturno.y > L.y1 - rs) saturno.vy *= -1;
    saturno.x = limitar(saturno.x, L.x0 + rs, L.x1 - rs);
    saturno.y = limitar(saturno.y, L.y0 + rs, L.y1 - rs);
    if (Math.hypot(saturno.x - buraco.x, saturno.y - buraco.y) < raioMundo() + rs * 0.4)
      engolirSaturno(buraco);
    else for (const r of rivais) {
      if (Math.hypot(saturno.x - r.x, saturno.y - r.y) < raioMundoNivel(r.nivel) + rs * 0.4) {
        engolirSaturno(r); break;
      }
    }
  } else if (--esperaSaturno <= 0) {
    saturno = novoSaturno();
  }

  /* — Júpiter — */
  if (jupiter) {
    jupiter.quadro++;
    jupiter.x += jupiter.vx / zoom; jupiter.y += jupiter.vy / zoom;
    const rj = CFG.JUPITER_RAIO / zoom;
    if (jupiter.x < L.x0 + rj || jupiter.x > L.x1 - rj) jupiter.vx *= -1;
    if (jupiter.y < L.y0 + rj || jupiter.y > L.y1 - rj) jupiter.vy *= -1;
    jupiter.x = limitar(jupiter.x, L.x0 + rj, L.x1 - rj);
    jupiter.y = limitar(jupiter.y, L.y0 + rj, L.y1 - rj);
    if (Math.hypot(jupiter.x - buraco.x, jupiter.y - buraco.y) < raioMundo() + rj * 0.4)
      engolirJupiter(buraco);
    else for (const r of rivais) {
      if (Math.hypot(jupiter.x - r.x, jupiter.y - r.y) < raioMundoNivel(r.nivel) + rj * 0.4) {
        engolirJupiter(r); break;
      }
    }
  } else if (--esperaJupiter <= 0) {
    jupiter = novoJupiter();
  }

  /* — Netuno — */
  if (netuno) {
    netuno.quadro++;
    netuno.x += netuno.vx / zoom; netuno.y += netuno.vy / zoom;
    const rn = CFG.NETUNO_RAIO / zoom;
    if (netuno.x < L.x0 + rn || netuno.x > L.x1 - rn) netuno.vx *= -1;
    if (netuno.y < L.y0 + rn || netuno.y > L.y1 - rn) netuno.vy *= -1;
    netuno.x = limitar(netuno.x, L.x0 + rn, L.x1 - rn);
    netuno.y = limitar(netuno.y, L.y0 + rn, L.y1 - rn);
    if (Math.hypot(netuno.x - buraco.x, netuno.y - buraco.y) < raioMundo() + rn * 0.4)
      engolirNetuno(buraco);
    else for (const r of rivais) {
      if (Math.hypot(netuno.x - r.x, netuno.y - r.y) < raioMundoNivel(r.nivel) + rn * 0.4) {
        engolirNetuno(r); break;
      }
    }
  } else if (--esperaNetuno <= 0) {
    netuno = novoNetuno();
  }

  /* — o roubo de estrelas, enquanto o poder dura, dos dois lados — */
  drenando = false;
  for (const p of todos()) {
    if (p.dreno <= 0) continue;
    p.dreno--;
    const outro = p === buraco ? maisPerto(p) : lider(p);
    if (!outro) { p.ritmoDreno = Math.min(p.ritmoDreno, 20); continue; }
    // basta estar na mesma tela: com raio fixo, no zoom afastado o alvo
    // aparecia na tela e mesmo assim ficava fora do alcance, o que confunde
    if (naTela(p.x, p.y, -CFG.JUPITER_FOLGA) &&
        naTela(outro.x, outro.y, -CFG.JUPITER_FOLGA)) {
      drenando = true;
      if (--p.ritmoDreno <= 0) {
        p.ritmoDreno = CFG.JUPITER_RITMO;
        if (outro.imune > 0) escudou(outro, outro.x, outro.y);
        else if (outro.comidas > 0) arrancarEstrela(p, outro);
      }
      if (quadro % 2 === 0) fioRoxo(p, outro);
    } else {
      p.ritmoDreno = Math.min(p.ritmoDreno, 20);   // saiu de vista, quase reinicia
    }
  }

  /* — a torre de gelo atira enquanto o poder dura, dos dois lados — */
  for (const p of todos()) {
    if (p.tiro <= 0) continue;
    p.tiro--;
    if (p.recargaTiro > 0) p.recargaTiro--;
    // Só atira quem está visível, e só em quem está visível: a câmera segue o
    // jogador, então isso vale para todos — ninguém leva tiro de fora da tela
    const outro = p === buraco ? maisPerto(p) : lider(p);
    if (!outro) continue;
    if (p.recargaTiro <= 0 &&
        naTela(p.x, p.y, -CFG.SATURNO_FOLGA) &&
        naTela(outro.x, outro.y, -CFG.SATURNO_FOLGA)) atirarBloco(p, outro);
  }
  passoBlocos(L);

  passoRoubadas();
  if (espiral > 0.02) puxarPlanetas();
  passoParticulas();
  verLideranca();
  anotarDesempenho();

  /* — câmera — */
  const alvoX = limitar(buraco.x - visaoL() / 2, L.x0, L.x1 - visaoL());
  const alvoY = limitar(buraco.y - visaoA() / 2, L.y0, L.y1 - visaoA());
  cam.x += (alvoX - cam.x) * 0.12;
  cam.y += (alvoY - cam.y) * 0.12;
  cam.x = limitar(cam.x, 0, MUNDO.L - visaoL());
  cam.y = limitar(cam.y, 0, MUNDO.A - visaoA());
}

function passoParticulas() {
  for (let i = faiscas.length - 1; i >= 0; i--) {
    const f = faiscas[i];
    const ar = f.arrasto || 0.9;
    /* ARCOS: cada faísca gira o próprio vetor de velocidade um pouquinho por
       quadro, então o caminho sai curvo em vez de reto. Reta com atrito é o
       que um cálculo faz; o olho espera arco, porque é assim que qualquer
       coisa lançada anda no mundo. O sentido é sorteado no nascimento, então
       um estouro abre em leque para os dois lados. */
    if (f.curva) {
      const co = Math.cos(f.curva), si = Math.sin(f.curva);
      const vx = f.vx;
      f.vx = vx * co - f.vy * si;
      f.vy = vx * si + f.vy * co;
    }
    f.x += f.vx; f.y += f.vy; f.vx *= ar; f.vy *= ar; f.vida--;
    if (f.vida <= 0) faiscas.splice(i, 1);
  }

  for (let i = coracoes.length - 1; i >= 0; i--) {
    const c = coracoes[i];
    c.x += c.vx + Math.sin(c.fase + quadro * 0.09) * 0.14 / zoom;   // bambeia
    c.y += c.vy;
    c.vy -= 0.005 / zoom;                                           // sobem
    c.vx *= 0.985;
    if (--c.vida <= 0) coracoes.splice(i, 1);
  }

  for (let i = aneis.length - 1; i >= 0; i--) {
    const a = aneis[i];
    a.r += 1.1 / zoom;
    if (--a.vida <= 0) aneis.splice(i, 1);
  }
  for (const p of todos()) {
    molaElastica(p);
    p.pulso *= 0.85;
    // esfria devagar: engolir em sequência mantém o disco aceso, parar apaga
    p.fervor = (p.fervor || 0) * 0.978;
  }
  if (buraco.boca > 0) buraco.boca--;
  for (const r of rivais) if (r.boca > 0) r.boca--;
  if (flashTerra > 0) flashTerra--;
  if (flashIma > 0) flashIma--;
  if (flashTiro > 0) flashTiro--;
  if (flashRoxo > 0) flashRoxo--;
  if (flashAzul > 0) flashAzul--;
  if (flashDano > 0) flashDano--;
  if (coroaAnim > 0) coroaAnim = Math.max(0, coroaAnim - 0.022);
  if (buraco.imune > 0) buraco.imune--;
  for (const r of rivais) if (r.imune > 0) r.imune--;
  // a tela nunca fica parada durante o efeito: um tremor de fundo baixinho
  // tremor de fundo do dreno: baixo o bastante para dar inquietação sem
  // atrapalhar a mira. Antes era 3,5 e a tela não parava quieta
  if (buraco.dreno > 0) tremor = Math.max(tremor, drenando ? 1.2 : 0.7);
  if (ima > 0) { ima--; faiscarIma(); if (quadro % 2 === 0) faiscarIma(); }
  if (flashEnjoo > 0) flashEnjoo--;
  if (buraco.surpresa > 0) buraco.surpresa--;
  for (const r of rivais) if (r.surpresa > 0) r.surpresa--;
  if (buraco.enjoo > 0) {
    buraco.enjoo--;
    if (quadro % 4 === 0) bafo(buraco.x, buraco.y, 1, 0.5);   // lascas caindo
  }
  for (const r of rivais) if (r.enjoo > 0) {
    r.enjoo--;
    if (quadro % 6 === 0) bafo(r.x, r.y, 1, 0.5);
  }
  if (turbo > 0) { raiarTurbo(); if (quadro % 2 === 0) raiarTurbo(); }

  if (tremor > 0) tremor *= 0.9;
  if (flash > 0) flash--;
  if (flashLado > 0) flashLado--;
  if (aberr > 0) aberr--;
  if (arco > 0) arco--;
  if (esperaColisao > 0) esperaColisao--;
  passoAnuncioAdiado();
  passoPerdas();
}



/* raios azuis e dourados saindo de dentro do personagem enquanto o turbo dura */
function raiarTurbo() {
  const a = Math.random() * Math.PI * 2;
  const v = (0.8 + Math.random() * 1.1) / zoom;
  faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: buraco.x, y: buraco.y,
                 vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                 vida: 16 + Math.floor(Math.random() * 14), arrasto: 0.975, tipo: "raio",
                 cor: COR.turboPart[Math.floor(Math.random() * COR.turboPart.length)] });
}

function faiscar(x, y, quantas, dei, dfi) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 1.1) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                   vida: 10 + Math.floor(Math.random() * 12),
                   cor: COR.disco[dei + Math.floor(Math.random() * (dfi - dei))] });
  }
}

function soltarCoracoes(x, y, quantos, forca, tamMin) {
  for (let k = 0; k < quantos; k++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.7;
    const vel = (0.35 + Math.random() * 0.85) * (forca || 1) / zoom;
    const vida = 42 + Math.floor(Math.random() * 34);
    coracoes.push({ x: x, y: y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel,
                    vida: vida, total: vida,
                    tam: Math.min(CORACOES.length - 1,
                                  (tamMin || 0) + (Math.random() < 0.55 ? 0 : 1)),
                    fase: Math.random() * Math.PI * 2 });
  }
}

/* Um caminho só para ganhar estrelas: a estrela engolida, o prêmio da
   cadente. Sobe quantos níveis for preciso. */
function ganharEstrelas(dono, n) {
  dono.comidas += n;
  // o nível só governa o tamanho; quem termina a partida é o contador
  if (dono.nivel < CFG.NIVEL_MAX) {
    dono.progresso += n;
    while (dono.nivel < CFG.NIVEL_MAX && dono.progresso >= custoDoNivel(dono.nivel)) {
      dono.progresso -= custoDoNivel(dono.nivel);
      dono.nivel++;
      subiuDeNivel(dono);
    }
    if (dono.nivel >= CFG.NIVEL_MAX) dono.progresso = 0;
  }
  if (dono.comidas >= CFG.META && cena === "jogo") terminar(dono);
}

function subiuDeNivel(dono) {
  if (dono === buraco) {
    tremor = 22; flash = CFG.ARCO; flashLado = 36;
    aberr = CFG.ABERRACAO; arco = CFG.ARCO;
    expansao = 1;                                     // a câmera abre e assenta
    // ANTECIPAÇÃO: estica para cima antes de crescer. A mola devolve o
    // movimento para baixo sozinha, e é essa ida-e-volta que faz o
    // crescimento parecer um impulso e não uma troca de número
    bater(buraco, -0.3);
    SFX.nivel();
    soltarCoracoes(buraco.x, buraco.y, 34, 2.1, 1);   // chuva de corações
  } else {
    soltarCoracoes(dono.x, dono.y, 8, 1.2, 0);
  }
}

/* Perder massa: sai do contador e volta do progresso, devolvendo nível se
   preciso — senão a trombada seria só um número piscando. */
/* Junta as estrelas que saem de você e fecha a conta quando o FLUXO PARA —
   não quando o poder do rival acaba. Fugir do alcance é a jogada certa, e
   quem fugiu tem de saber logo quanto custou; esperar os 8 ou 10 segundos do
   poder inteiro para ser avisado deixava a informação chegar quando ela já
   não servia para decidir nada.

   O que evita o troco-miúdo (um aviso por bloco) não é esperar o poder: é a
   carência abaixo. Ela tem de ser MAIOR que o intervalo entre dois golpes da
   mesma fonte, senão a conta fecha no vão entre um e outro. */
const PERDA_CARENCIA = { dreno: 34, gelo: 58 };   // ritmo 20 e cadência 40
function anotarPerda(origem, n) {
  perdaAcum[origem] += n;
  perdaParada[origem] = 0;
}

/* ainda tem coisa a caminho de mim? enquanto houver, a conta não fecha */
const drenoVindo = () => roubadas.some(e => e.para !== buraco);
const geloVindo  = () => blocos.some(g => g.alvo === buraco);

function fecharPerda(origem, vindo, cor) {
  if (perdaAcum[origem] <= 0) return;
  if (vindo()) { perdaParada[origem] = 0; return; }
  if (++perdaParada[origem] < PERDA_CARENCIA[origem]) return;
  anunciar("-" + perdaAcum[origem], cor);
  SFX.perda();
  perdaAcum[origem] = 0;
}

function passoPerdas() {
  // o que VOCÊ absorveu fecha pela mesma regra: parou de entrar, anuncia
  if (ganhoDreno > 0) {
    if (roubadas.some(e => e.para === buraco)) ganhoParado = 0;
    else if (++ganhoParado >= PERDA_CARENCIA.dreno) {
      anunciar("+" + ganhoDreno + "!", COR.roxo);
      ganhoDreno = 0;
    }
  }
  fecharPerda("dreno", drenoVindo, COR.roxo);
  fecharPerda("gelo", geloVindo, COR.bloco[3]);
}

function perderEstrelas(dono, n, origem) {
  // O escudo de Netuno é o único ponto que precisa saber de imunidade: tudo
  // que tira estrela passa por aqui — bloco de gelo, dreno e trombada
  if (dono.imune > 0) {
    dono.pulso = Math.max(dono.pulso, 0.6);
    if (dono === buraco) flashAzul = Math.max(flashAzul, 12);
    return;
  }
  const antes = dono.comidas;
  dono.comidas = Math.max(0, dono.comidas - n);
  /* Um aviso só para TODO tipo de dano: trombada, gelo, dreno ou cometa. O
     jogador não precisa decorar uma cor por arma — vermelho na borda quer
     dizer "está saindo estrela de você", e o texto no meio diz quanto. */
  if (dono === buraco && antes > dono.comidas) flashDano = CFG.DANO_FLASH;
  // só o que sai de VOCÊ vira aviso; o resto o placar já conta
  if (dono === buraco && origem && antes > dono.comidas) {
    const tirou = antes - dono.comidas;
    if (origem === "trombada") anunciar("-" + tirou, COR.disco[6]);
    else anotarPerda(origem, tirou);
  }
  if (!CFG.COLISAO_CUSTA_NIVEL) return;
  let resta = n;
  while (resta > 0) {
    if (dono.progresso > 0) {
      const tira = Math.min(dono.progresso, resta);
      dono.progresso -= tira; resta -= tira;
    } else if (dono.nivel > 0) {
      dono.nivel--;
      dono.progresso = custoDoNivel(dono.nivel);
    } else break;
  }
}

function engolirEstrela(indice, dono) {
  const e = estrelas[indice];
  faiscar(e.x, e.y, 11, 3, 8);
  estrelas.splice(indice, 1);
  if (cena !== "jogo") return;          // no menu ele come só de enfeite
  dono.pulso = 1; dono.boca = 18;
  // marca o quanto ele está comendo agora: o disco de acreção lê disso
  dono.fervor = Math.min(1.6, (dono.fervor || 0) + 0.45);
  bater(dono, 0.09);                      // engoliu: achata e repica
  if (dono === buraco) SFX.comer(dono.fervor / 1.6);
  aneis.push({ x: e.x, y: e.y, r: 2, vida: 15, total: 15, rival: dono !== buraco,
               pal: dono !== buraco ? paletaDe(dono).disco : null });
  if (dono === buraco && Math.random() < 0.28) soltarCoracoes(e.x, e.y, 1, 0.7, 0);
  ganharEstrelas(dono, 1);
}

function engolirTerra(dono) {
  if (dono === buraco) SFX.planeta(523);
  faiscar(terra.x, terra.y, 18, 2, 8);
  terra = null;
  esperaTerra = CFG.TERRA_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  if (dono !== buraco) return;                  // o rival só engole, não turbina
  turbo = CFG.TERRA_TURBO;
  anunciar("SPEED UP", COR.turbo);
  tremor = 10;
  flashTerra = CFG.TERRA_CLARAO;
  for (let k = 0; k < 30; k++) raiarTurbo();
  soltarCoracoes(buraco.x, buraco.y, 8, 1.1, 0);
}



function engolirMarte(dono) {
  if (dono === buraco) SFX.planeta(392);
  faiscar(marte.x, marte.y, 18, 2, 8);
  marte = null;
  esperaMarte = CFG.MARTE_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  if (dono !== buraco) return;                  // o rival só engole, como na Terra
  ima = CFG.MARTE_IMA;
  anunciar("MAGNETIC!", COR.ima);
  tremor = 10;
  flashIma = CFG.MARTE_CLARAO;
  aneis.push({ x: buraco.x, y: buraco.y, r: 3, vida: 24, total: 24, rival: false });
  for (let k = 0; k < 24; k++) faiscarIma();
}

function engolirSaturno(dono) {
  if (dono === buraco) SFX.planeta(659);
  faiscar(saturno.x, saturno.y, 18, 2, 8);
  saturno = null;
  esperaSaturno = CFG.SATURNO_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20; bater(dono, -0.2);
  dono.tiro = CFG.SATURNO_TIRO;
  dono.recargaTiro = 0;
  if (dono !== buraco) { tremor = 6; return; }  // no rival, sem aviso nem clarão
  // dourado, e não o azul do gelo: o azul brigaria com o "SPEED UP" da Terra,
  // e dourado liga o aviso a Saturno na hora
  anunciar("ICE SHOT!", COR.saturno[4]);
  tremor = 10;
  flashTiro = CFG.SATURNO_CLARAO;
  for (let k = 0; k < 20; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "enjoo",
                   cor: COR.bloco[Math.floor(Math.random() * COR.bloco.length)] });
  }
}

/* Um bloco sai da borda do buraco na direção do rival. Ele corrige o rumo de
   leve a cada quadro: sem correção nenhuma erra quase sempre, e com correção
   forte vira teleguiado e não dá para o rival escapar. */
function atirarBloco(de, alvo) {
  de.recargaTiro = CFG.SATURNO_CADENCIA;
  const a = Math.atan2(alvo.y - de.y, alvo.x - de.x) +
            (Math.random() - 0.5) * 0.3;
  const v = CFG.SATURNO_VEL / zoom;
  const r = de === buraco ? raioMundo() : raioMundoNivel(de.nivel);
  blocos.push({ x: de.x + Math.cos(a) * r, y: de.y + Math.sin(a) * r,
                vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                giro: Math.random() * Math.PI, vida: 200, alvo: alvo, rastro: [] });
  de.pulso = Math.max(de.pulso, 0.5);
  // fumacinha na boca do cano, para o disparo ter origem visível
  for (let k = 0; k < 8; k++) {
    const b = a + (Math.random() - 0.5) * 1.1, w = (0.5 + Math.random()) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.06,
                   x: de.x + Math.cos(a) * r, y: de.y + Math.sin(a) * r,
                   vx: Math.cos(b) * w, vy: Math.sin(b) * w,
                   vida: 10 + Math.floor(Math.random() * 8), arrasto: 0.92,
                   tipo: "enjoo", cor: COR.bloco[Math.floor(Math.random() * 3)] });
  }
}

function passoBlocos(L) {
  const rr = CFG.SATURNO_RAIO_BLOCO / zoom;
  for (let i = blocos.length - 1; i >= 0; i--) {
    const g = blocos[i];
    const vitima = g.alvo;
    // persegue de leve: gira o vetor na direção do alvo
    const alvo = Math.atan2(vitima.y - g.y, vitima.x - g.x);
    const atual = Math.atan2(g.vy, g.vx);
    let dif = alvo - atual;
    while (dif > Math.PI) dif -= Math.PI * 2;
    while (dif < -Math.PI) dif += Math.PI * 2;
    const ang = atual + limitar(dif, -CFG.SATURNO_MIRA, CFG.SATURNO_MIRA);
    const v = Math.hypot(g.vx, g.vy);
    g.vx = Math.cos(ang) * v; g.vy = Math.sin(ang) * v;
    if (g.rastro) {
      g.rastro.unshift({ x: g.x, y: g.y });
      if (g.rastro.length > 6) g.rastro.pop();
    }
    g.x += g.vx; g.y += g.vy;
    g.giro += 0.14;
    g.vida--;

    const rv = vitima === buraco ? raioMundo() : raioMundoNivel(vitima.nivel);
    if (Math.hypot(g.x - vitima.x, g.y - vitima.y) < rv + rr) {
      if (vitima === buraco) SFX.gelo();
      if (escudou(vitima, g.x, g.y)) { blocos.splice(i, 1); continue; }
      const quantas = Math.min(CFG.SATURNO_DANO, vitima.comidas);
      if (quantas > 0) perderEstrelas(vitima, quantas, "gelo");
      vitima.pulso = 1; vitima.boca = 14;
      bater(vitima, 0.2);
      vitima.surpresa = Math.max(vitima.surpresa, 18);
      // levar tiro sacode mais do que acertar: o baque é de quem apanha
      tremor = Math.max(tremor, vitima === buraco ? 14 : 6);
      if (vitima === buraco) aberr = Math.max(aberr, Math.round(CFG.ABERRACAO * 0.5));
      faiscar(g.x, g.y, 14, 2, 6);
      aneis.push({ x: g.x, y: g.y, r: 3, vida: 12, total: 12, rival: false });
      for (let k = 0; k < 22; k++) {
        const a = Math.random() * Math.PI * 2, s2 = (0.5 + Math.random()) / zoom;
        faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: g.x, y: g.y, vx: Math.cos(a) * s2, vy: Math.sin(a) * s2,
                       vida: 12 + Math.floor(Math.random() * 10), arrasto: 0.94,
                       tipo: "enjoo", cor: COR.bloco[Math.floor(Math.random() * 3)] });
      }
      aneis.push({ x: g.x, y: g.y, r: 2, vida: 14, total: 14, rival: vitima !== buraco, pal: vitima !== buraco ? paletaDe(vitima).disco : null });
      blocos.splice(i, 1);
      continue;
    }
    // e some ao sair de vista: bloco perseguindo fora da tela é dano invisível
    if (g.vida <= 0 || !naTela(g.x, g.y, 10)) blocos.splice(i, 1);
  }
}

/* No modo sucção os planetas também são puxados — devagar, porque eles têm
   massa. É o que faz o gesto valer a pena quando não há estrela por perto. */
function puxarPlanetas() {
  const alc = raioMundo() * CFG.ALCANCE_SUCCAO * (1 + espiral * CFG.ESPIRAL_ALCANCE) * 1.4;
  for (const o of [terra, marte, saturno, jupiter]) {
    if (!o) continue;
    const dx = buraco.x - o.x, dy = buraco.y - o.y;
    const d = Math.hypot(dx, dy) || 0.001;
    if (d > alc) continue;
    const f = CFG.ESPIRAL_PLANETA * espiral * (1 - d / alc) * 0.06;
    o.vx += (dx / d) * f * zoom;                 // vx dos planetas é em tela
    o.vy += (dy / d) * f * zoom;
    o.vx *= 0.99; o.vy *= 0.99;
  }
}

/* A estrela sai do rival NA HORA (o contador dele cai no mesmo quadro, para
   ele ver que está perdendo) e viaja até o jogador, que só marca o ponto
   quando ela chega. É o trajeto que conta a história. */
function arrancarEstrela(de, vitima) {
  perderEstrelas(vitima, 1, "dreno");
  vitima.pulso = 1;
  vitima.boca = 14;
  bater(vitima, 0.08);
  vitima.surpresa = Math.max(vitima.surpresa, 20);
  // 3 estrelas por segundo: um safanão a cada uma viraria trepidação contínua
  tremor = Math.max(tremor, vitima === buraco ? 3 : 1.5);
  if (de === buraco) flashRoxo = Math.max(flashRoxo, 14);
  aneis.push({ x: vitima.x, y: vitima.y, r: 2, vida: 14, total: 14, rival: vitima !== buraco, pal: vitima !== buraco ? paletaDe(vitima).disco : null });
  const rr = vitima === buraco ? raioMundo() : raioMundoNivel(vitima.nivel);
  const a = Math.random() * Math.PI * 2;
  roubadas.push({
    x0: vitima.x + Math.cos(a) * rr * 0.8, y0: vitima.y + Math.sin(a) * rr * 0.8,
    para: de,
    x: 0, y: 0, t: 0, giro: Math.random() * Math.PI, rastro: [],
    // a curva sai por um lado: em linha reta as três por segundo viram um fio só
    curva: (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.3),
    passo: 1 / (22 + Math.floor(Math.random() * 10))
  });
  // espiral saindo da vítima: as partículas nascem na borda e giram para
  // fora, o oposto do ímã. É a leitura de "está sendo arrancado daqui"
  for (let k = 0; k < 18; k++) {
    const b = (k / 18) * Math.PI * 2 + Math.random() * 0.3;
    const v = (0.7 + Math.random() * 0.9) / zoom;
    faiscas.push({ curva: 0.07,
                   x: vitima.x + Math.cos(b) * rr * 0.7,
                   y: vitima.y + Math.sin(b) * rr * 0.7,
                   vx: Math.cos(b) * v, vy: Math.sin(b) * v,
                   vida: 14 + Math.floor(Math.random() * 10), arrasto: 0.95, tipo: "raio",
                   cor: COR.jupiter[1 + Math.floor(Math.random() * 4)] });
  }
}

function passoRoubadas() {
  for (let i = roubadas.length - 1; i >= 0; i--) {
    const e = roubadas[i];
    e.t += e.passo;
    e.giro += 0.2;
    if (e.t > 0) {
      e.rastro.unshift({ x: e.x, y: e.y });
      if (e.rastro.length > 7) e.rastro.pop();
    }
    const p = e.para;
    if (e.t >= 1) {
      // chegou: agora sim o ponto entra, com o mesmo estalo de engolir estrela
      ganharEstrelas(p, 1);
      // o total é contado na CHEGADA, não no arranque: as últimas estrelas
      // ainda estão voando quando o poder acaba, e elas contam
      if (p === buraco) { ganhoDreno++; ganhoParado = 0; SFX.dreno(); }
      p.pulso = 1; p.boca = 16;
      aneis.push({ x: p.x, y: p.y, r: 2, vida: 14, total: 14, rival: p !== buraco, pal: p !== buraco ? paletaDe(p).disco : null });
      faiscar(p.x, p.y, 8, 3, 8);
      roubadas.splice(i, 1);
      continue;
    }
    // sempre mira onde o ladrão está AGORA: se ele foge, a estrela persegue
    const t = e.t;
    const mx = e.x0 + (p.x - e.x0) * t;
    const my = e.y0 + (p.y - e.y0) * t;
    const dx = p.x - e.x0, dy = p.y - e.y0;
    const arco = Math.sin(t * Math.PI) * e.curva;
    e.x = mx - dy * arco;
    e.y = my + dx * arco;
  }
}

function engolirNetuno(dono) {
  if (dono === buraco) SFX.planeta(440);
  faiscar(netuno.x, netuno.y, 18, 2, 8);
  netuno = null;
  esperaNetuno = CFG.NETUNO_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20; bater(dono, -0.24);
  dono.imune = CFG.NETUNO_IMUNE;
  if (dono !== buraco) { tremor = 6; return; }
  anunciar("INVINCIBLE!", COR.netunoTexto, true);
  SFX.escudo();
  tremor = 12;
  flashAzul = CFG.NETUNO_CLARAO;
  arco = Math.max(arco, 30);
  for (let k = 0; k < 26; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "raio",
                   cor: COR.arcoiris[Math.floor(Math.random() * COR.arcoiris.length)] });
  }
}

function engolirJupiter(dono) {
  if (dono === buraco) SFX.planeta(330);
  faiscar(jupiter.x, jupiter.y, 18, 2, 8);
  jupiter = null;
  esperaJupiter = CFG.JUPITER_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20; bater(dono, -0.2);
  dono.dreno = CFG.JUPITER_DRENO;
  dono.ritmoDreno = CFG.JUPITER_RITMO;
  if (dono !== buraco) { tremor = 6; return; }  // no rival, sem aviso nem clarão
  anunciar("STAR DRAIN!", COR.roxo);
  tremor = 12;
  flashRoxo = CFG.JUPITER_CLARAO;
  for (let k = 0; k < 26; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "raio",
                   cor: COR.jupiter[2 + Math.floor(Math.random() * 3)] });
  }
}

/* fio de partículas correndo do rival para o buraco: é o que mostra de onde
   a estrela está saindo, sem precisar de texto */
/* O cordão do dreno. Antes era uma partícula solta por vez seguindo a reta
   entre os dois, e sumia no meio do resto. Agora saem várias por chamada e
   elas nascem AFASTADAS DA RETA, num deslocamento que gira com o tempo — o
   conjunto vira um cordão trançado em vez de um risco, e é o trançado que faz
   enxergar de longe que existe uma ligação entre os dois personagens. */
function fioRoxo(de, vitima) {
  const dx = de.x - vitima.x, dy = de.y - vitima.y;
  const m = Math.hypot(dx, dy) || 1;
  const nx = -dy / m, ny = dx / m;               // perpendicular à ligação
  for (let k = 0; k < 3; k++) {
    const t = Math.random();
    const fase = t * 9 + quadro * 0.25 + k * 2.1;
    const lado = Math.sin(fase) * (5 + 5 * Math.sin(t * Math.PI)) / zoom;
    const x = vitima.x + dx * t + nx * lado;
    const y = vitima.y + dy * t + ny * lado;
    const v = (1.3 + Math.random() * 1.2) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.04,
                   x: x, y: y,
                   vx: dx / m * v, vy: dy / m * v,
                   vida: 9 + Math.floor(Math.random() * 8), arrasto: 0.98, tipo: "raio",
                   cor: COR.jupiter[1 + Math.floor(Math.random() * 4)] });
  }
}

/* poeira vermelha correndo PARA DENTRO do buraco: o ímã puxa, então as
   partículas dele vêm de fora para o centro, ao contrário das do turbo */
function faiscarIma() {
  const alc = raioMundo() * CFG.ALCANCE_SUCCAO * CFG.MARTE_ALCANCE;
  const a = Math.random() * Math.PI * 2;
  const d = raioMundo() + Math.random() * (alc - raioMundo());
  const v = (0.5 + Math.random() * 0.9) / zoom;
  // a poeira do ímã tem alvo: curva demais e ela erra o buraco
  faiscas.push({ curva: (Math.random() - 0.5) * 0.02,
                 x: buraco.x + Math.cos(a) * d, y: buraco.y + Math.sin(a) * d,
                 vx: -Math.cos(a) * v, vy: -Math.sin(a) * v,
                 vida: 14 + Math.floor(Math.random() * 10), arrasto: 0.99, tipo: "raio",
                 cor: COR.imaPart[Math.floor(Math.random() * COR.imaPart.length)] });
}

/* O anel de Saturno, em duas metades: a de trás sai antes do corpo, a da
   frente depois. Sem isso o anel some atrás do planeta ou passa por cima dele
   inteiro, e nos dois casos a leitura de "planeta com anel" se perde.

   Desenhado por LINHA, com a inclinação feita por cisalhamento (cada linha
   desliza um tanto para o lado) em vez de rotação: rotacionar quebra as
   linhas horizontais e o anel sai pontilhado.

   Três coisas fazem ele parecer o anel de Saturno e não um aro:
   1. a DIVISÃO DE CASSINI — o vão escuro entre as duas faixas principais;
   2. a faixa externa mais apagada que a interna, que é como ele se vê;
   3. a SOMBRA DO PLANETA projetada sobre a metade de trás, do lado oposto à
      luz. É ela que diz que o anel passa por trás de uma bola, e não em volta
      de um disco chapado. */
function anelSaturno(cx, cy, R, frente) {
  /* Anel mais justo e menos torto. Em 2,15 x 0,66 com cisalhamento 0,9 ele
     descia tanto de um lado que virava um chapéu derretido: a metade da
     frente ficava toda ABAIXO do planeta, como um borrão à parte. Achatando e
     endireitando, a faixa da frente cruza perto do equador e o conjunto lê
     como anel visto quase de lado, que é a silhueta que todo mundo reconhece. */
  const rx = R * 1.95, ry = R * 0.5;
  const incl = 0.34;                             // cisalhamento por linha
  const S = COR.saturno;
  // o anel tem que destoar do corpo: com tons vizinhos ele derrete no planeta
  /* O anel tinha a cor do corpo e os dois viravam uma mancha só. Agora ele
     abre com um FIO ESCURO por fora — é esse fio que recorta o anel contra o
     céu e contra o planeta — e a faixa A vai para o quase branco, o tom mais
     claro de toda a paleta. A divisão de Cassini (o vão entre A e B) é o que
     faz o anel parecer anel e não um disco borrado. */
  const faixas = [[1, 0.93, COR.contSaturno],    // fio escuro da borda externa
                  [0.92, 0.66, S[0]],            // faixa A: a mais clara de todas
                  [0.58, 0.3, S[4]]];            // faixa B, depois do vão
  const topo = Math.ceil(ry);
  for (let dy = -topo; dy <= topo; dy++) {
    if ((dy >= 0) !== frente) continue;
    const desliza = dy * incl;
    for (const [ko, ki, cor] of faixas) {
      const fo = 1 - (dy / (ry * ko)) * (dy / (ry * ko));
      if (fo <= 0) continue;
      const xo = rx * ko * Math.sqrt(fo);
      const fi = 1 - (dy / (ry * ki)) * (dy / (ry * ki));
      const xi = fi > 0 ? rx * ki * Math.sqrt(fi) : 0;
      const y = Math.round(cy + dy);
      const e0 = Math.round(cx + desliza - xo), e1 = Math.round(cx + desliza - xi);
      const d0 = Math.round(cx + desliza + xi), d1 = Math.round(cx + desliza + xo);
      // a luz vem do alto-esquerda, então a sombra cai à direita e atrás
      const naSombra = !frente;
      ctx.fillStyle = cor;
      if (e1 > e0) ctx.fillRect(e0, y, e1 - e0, 1);
      if (d1 > d0) {
        if (naSombra) {
          const corte = Math.round(cx + desliza + R * 0.35);
          if (corte > d0) ctx.fillRect(d0, y, Math.min(d1, corte) - d0, 1);
          if (d1 > corte) {                      // trecho na sombra do planeta
            ctx.fillStyle = S[6];
            ctx.globalAlpha = 0.75;
            ctx.fillRect(Math.max(d0, corte), y, d1 - Math.max(d0, corte), 1);
            ctx.globalAlpha = 1;
          }
        } else {
          ctx.fillRect(d0, y, d1 - d0, 1);
        }
      }
      // Na metade da FRENTE, o trecho que passa por cima do planeta sai mais
      // escuro. Sem isso ele vira só mais uma faixa do corpo, e a leitura de
      // "o anel está na minha frente" se perde justamente no ponto que mais
      // conta para entender a forma.
      if (frente && Math.abs(dy) < R) {
        const dentro0 = Math.max(e0, Math.round(cx - R));
        const dentro1 = Math.min(d1, Math.round(cx + R));
        if (dentro1 > dentro0) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = COR.saturno[6];
          const a0 = Math.max(dentro0, e0), a1 = Math.min(dentro1, e1);
          if (a1 > a0) ctx.fillRect(a0, y, a1 - a0, 1);
          const b0 = Math.max(dentro0, d0), b1 = Math.min(dentro1, d1);
          if (b1 > b0) ctx.fillRect(b0, y, b1 - b0, 1);
          ctx.globalAlpha = 1;
        }
      }
    }
  }
}

/* ── desenho ─────────────────────────────────────────────────── */
const paraTelaX = wx => (wx - cam.x) * zoom;
const paraTelaY = wy => (wy - cam.y) * zoom;
/* está dentro do que a câmera mostra? folga negativa exige folga sobrando */
function naTela(x, y, folga) {
  const sx = paraTelaX(x), sy = paraTelaY(y);
  return sx > -folga && sx < VL + folga && sy > -folga && sy < VA + folga;
}

function desenharMundo() {
  const sx0 = tremor > 0.3 ? (Math.random() - 0.5) * tremor / zoom : 0;
  const sy0 = tremor > 0.3 ? (Math.random() - 0.5) * tremor / zoom : 0;
  const cx = limitar(cam.x + sx0, 0, MUNDO.L - visaoL());
  const cy = limitar(cam.y + sy0, 0, MUNDO.A - visaoA());

  ctx.fillStyle = COR.vazio;
  ctx.fillRect(0, 0, VL, VA);
  const cam0 = camadaAtual();
  const e = cam0.escala;
  const sx = cx * e, sy = cy * e;
  const sl = Math.min(cam0.canvas.width - sx, visaoL() * e);
  const sa = Math.min(cam0.canvas.height - sy, visaoA() * e);
  ctx.drawImage(cam0.canvas, sx, sy, sl, sa, 0, 0, VL, VA);

  const guardaX = cam.x, guardaY = cam.y;
  cam.x = cx; cam.y = cy;

  /* beirada da área jogável: a fronteira do universo conhecido */
  const L = limites();
  ctx.fillStyle = COR.borda;
  const bx0 = paraTelaX(L.x0), bx1 = paraTelaX(L.x1);
  const by0 = paraTelaY(L.y0), by1 = paraTelaY(L.y1);
  for (let y = 0; y < VA; y += 3) {
    if (bx0 > -1 && bx0 < VL) ctx.fillRect(Math.round(bx0), y, 1, 2);
    if (bx1 > -1 && bx1 < VL) ctx.fillRect(Math.round(bx1), y, 1, 2);
  }
  for (let x = 0; x < VL; x += 3) {
    if (by0 > -1 && by0 < VA) ctx.fillRect(x, Math.round(by0), 2, 1);
    if (by1 > -1 && by1 < VA) ctx.fillRect(x, Math.round(by1), 2, 1);
  }

  /* estrelas */
  for (const e of estrelas) {
    const x = paraTelaX(e.x), y = paraTelaY(e.y);
    if (x < -8 || y < -8 || x > VL + 8 || y > VA + 8) continue;
    const osc = (Math.sin(e.fase) + 1) / 2;
    let spr;
    if (e.presa) {
      // sendo engolida: encolhe conforme chega perto, como se fosse espremida
      const d = Math.hypot(buraco.x - e.x, buraco.y - e.y);
      const perto = limitar(d / (raioMundo() * CFG.ALCANCE_SUCCAO), 0, 1);
      spr = ESTRELAS_SPR[perto > 0.62 ? 2 : perto > 0.3 ? 1 : 0];
    } else {
      spr = ESTRELAS_SPR[osc > 0.72 ? 3 : osc > 0.3 ? 2 : 1];
    }
    carimbo(spr, x, y, COR.estrela);
    if (e.presa) {                               // rastrinho atrás da estrela
      const dx = buraco.x - e.x, dy = buraco.y - e.y;
      const d2 = Math.hypot(dx, dy) || 1;
      px(x - dx / d2 * 4, y - dy / d2 * 4, COR.estrelaSuave);
      px(x - dx / d2 * 6, y - dy / d2 * 6, COR.poeira[2]);
    }
  }

  /* a Terra */
  if (terra) {
    const x = Math.round(paraTelaX(terra.x)) - CFG.TERRA_RAIO;
    const y = Math.round(paraTelaY(terra.y)) - CFG.TERRA_RAIO;
    if (x > -TERRA_D && y > -TERRA_D && x < VL && y < VA) {
      // camada fina de brilho, apagando para fora, respirando devagar
      const cxT2 = x + CFG.TERRA_RAIO, cyT2 = y + CFG.TERRA_RAIO;
      const pT = 0.5 + 0.5 * Math.sin(quadro * 0.055);
      brilho(cxT2, cyT2, CFG.TERRA_RAIO - 1, CFG.TERRA_RAIO + 7 + pT * 2,
             COR.glowTerra, 0.3 + pT * 0.12, 2.4);
      anel(x + CFG.TERRA_RAIO, y + CFG.TERRA_RAIO, CFG.TERRA_RAIO + 1, 1.6, COR.contTerra);
      ctx.drawImage(terraSprite, x, y);
    }
  }

  /* Marte */
  if (marte) {
    const x = Math.round(paraTelaX(marte.x)) - CFG.MARTE_RAIO;
    const y = Math.round(paraTelaY(marte.y)) - CFG.MARTE_RAIO;
    if (x > -MARTE_D && y > -MARTE_D && x < VL && y < VA) {
      // vermelho, um pouco mais forte que o da Terra: Marte é o planeta quente
      const cxM2 = x + CFG.MARTE_RAIO, cyM2 = y + CFG.MARTE_RAIO;
      const pM = 0.5 + 0.5 * Math.sin(quadro * 0.075 + 1.3);
      brilho(cxM2, cyM2, CFG.MARTE_RAIO - 1, CFG.MARTE_RAIO + 8 + pM * 2,
             COR.glowMarte, 0.34 + pM * 0.14, 2.2);
      anel(x + CFG.MARTE_RAIO, y + CFG.MARTE_RAIO, CFG.MARTE_RAIO + 1, 1.6, COR.contMarte);
      ctx.drawImage(marteSprite, x, y);
    }
  }

  /* Saturno */
  if (saturno) {
    const cxS = Math.round(paraTelaX(saturno.x));
    const cyS = Math.round(paraTelaY(saturno.y));
    const R = CFG.SATURNO_RAIO;
    if (cxS > -R * 3 && cyS > -R * 3 && cxS < VL + R * 3 && cyS < VA + R * 3) {
      const pS = 0.5 + 0.5 * Math.sin(quadro * 0.062 + 2.4);
      brilho(cxS, cyS, R - 1, R + 7 + pS * 2, COR.glowSaturno, 0.3 + pS * 0.12, 2.4);
      anelSaturno(cxS, cyS, R, false);          // metade de trás
      anel(cxS, cyS, R + 1, 1.6, COR.contSaturno);
      ctx.drawImage(saturnoSprite, cxS - R, cyS - R);
      anelSaturno(cxS, cyS, R, true);           // metade da frente
    }
  }

  /* Júpiter */
  if (jupiter) {
    const cxJ = Math.round(paraTelaX(jupiter.x));
    const cyJ = Math.round(paraTelaY(jupiter.y));
    const R = CFG.JUPITER_RAIO;
    if (cxJ > -R * 4 && cyJ > -R * 4 && cxJ < VL + R * 4 && cyJ < VA + R * 4) {
      // nuvem de fumaça: bolhas roxo-claro girando devagar em volta, mais
      // largas que o glow e irregulares — é o que dá o ar de gigante gasoso
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + jupiter.quadro * 0.006;
        const rr = R * (1.5 + 0.5 * Math.sin(jupiter.quadro * 0.02 + i * 1.7));
        ctx.globalAlpha = 0.1 + 0.05 * Math.sin(jupiter.quadro * 0.03 + i);
        disco(cxJ + Math.cos(a) * rr * 0.7, cyJ + Math.sin(a) * rr * 0.45,
              R * (0.7 + 0.25 * Math.sin(i * 2.3)), COR.fumaca);
      }
      const pJ = 0.5 + 0.5 * Math.sin(quadro * 0.058 + 3.7);
      brilho(cxJ, cyJ, R - 1, R + 7 + pJ * 2, COR.glowJupiter, 0.28 + pJ * 0.1, 2.4);
      anel(cxJ, cyJ, R + 1, 1.6, COR.contJupiter);
      ctx.drawImage(jupiterSprite, cxJ - R, cyJ - R);
    }
  }

  /* Netuno */
  if (netuno) {
    const cxN = Math.round(paraTelaX(netuno.x));
    const cyN = Math.round(paraTelaY(netuno.y));
    const R = CFG.NETUNO_RAIO;
    if (cxN > -R * 4 && cyN > -R * 4 && cxN < VL + R * 4 && cyN < VA + R * 4) {
      const pN = 0.5 + 0.5 * Math.sin(quadro * 0.05 + 1.9);
      brilho(cxN, cyN, R - 1, R + 7 + pN * 2, COR.glowNetuno, 0.3 + pN * 0.12, 2.4);
      anel(cxN, cyN, R + 1, 1.6, COR.contNetuno);
      ctx.drawImage(netunoSprite, cxN - R, cyN - R);
    }
  }

  /* o alcance no modo sucção: riscos girando em volta do corpo. O anel no raio real de
     sucção chega a passar da largura da tela e não se vê — o que lê como
     "está girando" são traços perto do personagem, rápidos */
  if (espiral > 0.05) {
    const bx0 = paraTelaX(buraco.x), by0 = paraTelaY(buraco.y);
    const r0 = raioTela;
    const sent = toque.sentido >= 0 ? 1 : -1;
    for (let k = 0; k < 3; k++) {
      const rr = r0 * (1.5 + k * 0.55);
      const base = quadro * (0.05 + espiral * 0.11) * sent + k * 2.1;
      for (let j2 = 0; j2 < 3; j2++) {
        const arco = 0.5 + espiral * 0.7;
        for (let t = 0; t < arco; t += 0.09) {
          const a = base + j2 * (Math.PI * 2 / 3) + t;
          ctx.globalAlpha = (0.2 + espiral * 0.55) * (1 - t / arco);
          px(bx0 + Math.cos(a) * rr, by0 + Math.sin(a) * rr, COR.disco[4 + (k % 3)]);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  /* as estrelas roubadas, a caminho: giram e deixam rastro roxo */
  for (const e of roubadas) {
    const ex = paraTelaX(e.x), ey = paraTelaY(e.y);
    if (e.rastro) {                              // deixa risco por onde passou
      for (let k = e.rastro.length - 1; k >= 0; k--) {
        const t = 1 - k / e.rastro.length;
        ctx.globalAlpha = t * 0.5;
        px(paraTelaX(e.rastro[k].x), paraTelaY(e.rastro[k].y), COR.jupiter[3]);
        if (t > 0.5) px(paraTelaX(e.rastro[k].x) + 1, paraTelaY(e.rastro[k].y), COR.jupiter[2]);
      }
      ctx.globalAlpha = 1;
    }
    brilho(ex, ey, 1, 6, COR.roxo, 0.4, 2);
    const spr = ESTRELAS_SPR[e.giro % 1.6 < 0.8 ? 1 : 2];
    carimbo(spr, ex, ey, COR.estrela);
    px(ex, ey, COR.jupiter[1]);
  }

  /* os blocos de gelo a caminho do alvo */
  for (const g of blocos) {
    const gx = paraTelaX(g.x), gy = paraTelaY(g.y);
    // rastro: as posições por onde passou, apagando. Sem ele o bloco some no
    // meio das estrelas e ninguém vê que tem coisa vindo
    if (g.rastro) {
      for (let k = g.rastro.length - 1; k >= 0; k--) {
        const t = 1 - k / g.rastro.length;
        ctx.globalAlpha = t * 0.5;
        disco(paraTelaX(g.rastro[k].x), paraTelaY(g.rastro[k].y),
              CFG.SATURNO_RAIO_BLOCO * t * 0.8, COR.bloco[1]);
      }
      ctx.globalAlpha = 1;
    }
    const pul = 0.5 + 0.5 * Math.sin(quadro * 0.3 + g.giro);
    brilho(gx, gy, CFG.SATURNO_RAIO_BLOCO,
           CFG.SATURNO_RAIO_BLOCO + 5 + pul * 2, COR.bloco[2], 0.3 + pul * 0.2, 2);
    /* CRISTAL maciço: um losango cheio, com aresta escura e um lasco de luz
       em cima. O desenho antigo era um disco com quatro pixels soltos nas
       quinas — de longe lia como bolinha, e bolinha é estrela neste jogo.
       O que precisa ser lido em 7 px é a SILHUETA angulosa. */
    cristal(gx, gy, CFG.SATURNO_RAIO_BLOCO + 1, g.giro);
  }

  /* o alcance do ímã, desenhado como um anel pontilhado que respira */
  if (ima > 0) {
    const q = Math.min(1, ima / 40);
    const rr = raioMundo() * CFG.ALCANCE_SUCCAO * CFG.MARTE_ALCANCE * zoom;
    const passos = Math.max(24, Math.ceil(rr * 2.2));
    ctx.globalAlpha = (0.3 + 0.2 * Math.sin(quadro * 0.16)) * q;
    for (let i = 0; i < passos; i++) {
      if (i % 2) continue;
      const a = (i / passos) * Math.PI * 2 + quadro * 0.02;
      px(paraTelaX(buraco.x) + Math.cos(a) * rr,
         paraTelaY(buraco.y) + Math.sin(a) * rr, COR.ima);
    }
    ctx.globalAlpha = 1;
  }

  /* faíscas */
  for (const f of faiscas) {
    const fx = paraTelaX(f.x), fy = paraTelaY(f.y);
    if (f.tipo === "raio") {                     // os raios do turbo são maiores
      px(fx, fy, f.cor);
      px(fx - 1, fy, f.cor); px(fx + 1, fy, f.cor);
      px(fx, fy - 1, f.cor); px(fx, fy + 1, f.cor);
    } else if (f.tipo === "estrela") {           // estrelinha do primeiro lugar
      carimbo(ESTRELAS_SPR[f.vida > 22 ? 1 : 0], fx, fy, f.cor);
    } else if (f.tipo === "enjoo") {              // lasca: um X pequenininho
      px(fx, fy, f.cor);
      px(fx - 1, fy - 1, f.cor); px(fx + 1, fy + 1, f.cor);
      px(fx + 1, fy - 1, f.cor); px(fx - 1, fy + 1, f.cor);
    } else px(fx, fy, f.cor);
  }

  /* o estalo de cada estrela engolida */
  for (const a of aneis) {
    const rr = a.r * zoom;
    const p = a.vida / a.total;
    const paleta = a.rival ? (a.pal || COR.discoR) : COR.disco;
    const cor = paleta[p > 0.55 ? 5 : 3];
    const passos = Math.max(10, Math.ceil(rr * 6));
    for (let i = 0; i < passos; i++) {
      if (i % 2) continue;                       // anel pontilhado, mais leve
      const ang = (i / passos) * Math.PI * 2;
      px(paraTelaX(a.x) + Math.cos(ang) * rr, paraTelaY(a.y) + Math.sin(ang) * rr, cor);
    }
  }

  /* corações: sobem e vão desbotando */
  for (const c of coracoes) {
    const p = c.vida / c.total;
    carimbo(CORACOES[c.tam], paraTelaX(c.x), paraTelaY(c.y),
            COR.coracao[p > 0.6 ? 0 : p > 0.3 ? 1 : 2]);
  }

  desenharCadente();
  desenharCometa();
  desenharBuraco();
  cam.x = guardaX; cam.y = guardaY;
}

/* Um só desenhador para os dois personagens: muda a paleta e o dono. */
function desenharPersonagem(p, raio, paleta, halo, contorno, blush, comTurbo) {
  const bx = paraTelaX(p.x), by = paraTelaY(p.y);
  const r = raio * (1 + p.pulso * 0.14);        // dá uma inchadinha ao engolir
  // squash & stretch: o que ganha de largura perde de altura
  const e = p.elast || 0;
  const rx = r * (1 + e), ry = r * (1 - e * 0.82);

  /* No branco o halo é uma oval chapada a 40% e funciona: ela clareia um
     pouco o que já é claro. No preto a mesma oval vira um aro marrom de borda
     dura em volta do personagem — chapada de cor sobre preto não lê como
     brilho, lê como sujeira. Ali ele vira uma queda radial, que apaga de
     verdade e deixa o preto voltar. */
  if (CFG.FUNDO_PB) {
    brilho(bx, by, Math.max(rx, ry), Math.max(rx, ry) + 7, halo, 0.22, 2.6);
  } else {
    ctx.globalAlpha = 0.4;                      // halo macio
    oval(bx, by, rx + 5, ry + 5, halo);
    ctx.globalAlpha = 1;
  }

  /* Quem está com um poder de ataque ganha um anel pulsando fora do disco.
     Com quatro personagens, cinco planetas, cometa e cadente na tela, não dava
     para saber quem estava perigoso — a barrinha só existe para você, e os
     rivais não tinham marca nenhuma. */
  if (p.tiro > 0 || p.dreno > 0) {
    const pul = 0.5 + 0.5 * Math.sin(quadro * 0.22);
    const cor = p.tiro > 0 ? COR.saturno[3] : COR.roxo;
    ctx.globalAlpha = 0.35 + pul * 0.4;
    anel(bx, by, r + 5 + pul * 2, 1.4, cor);
    ctx.globalAlpha = 0.2 + pul * 0.2;
    anel(bx, by, r + 8 + pul * 3, 1.2, cor);
    ctx.globalAlpha = 1;
  }

  // invencível: o anel roda em arco-íris, com um halo largo e macio por baixo.
  // O "blur" aqui são anéis concêntricos de alfa baixo — desenhar borrado de
  // verdade custaria uma cópia da tela inteira por quadro
  if (p.imune > 0) {
    const q = Math.min(1, p.imune / 45);
    for (let k = 0; k < COR.arcoiris.length; k++) {
      ctx.globalAlpha = 0.1 * q;
      anel(bx, by, r + 2 + k * 1.15, 2.2, COR.arcoiris[k]);
    }
    ctx.globalAlpha = 1;
  }

  // enjoado, o anel de acreção fica verde e o personagem solta glows radiais
  if (p.enjoo > 0) {
    paleta = COR.discoV;
    const q = Math.min(1, p.enjoo / 40);
    /* Três ondas escalonadas: uma sai, a seguinte já está no meio do caminho.
       Elas NÃO são círculos — o raio varia com o ângulo por duas senoides, e
       o desenho inteiro vai girando conforme se afasta. Círculo perfeito lê
       como sinal de rádio; torto e torcido lê como mal-estar, que é o que o
       cometa causa. */
    for (let i = 0; i < 3; i++) {
      const t = ((quadro * 0.017 + i / 3) % 1);
      const base = r + 2 + t * (r * 0.6 + 9);   // mais contido que antes
      const torce = t * 2.2 + quadro * 0.02;     // gira enquanto abre
      const esp = 2 + t * 2;
      ctx.globalAlpha = 0.32 * (1 - t) * q;
      // 6,5 por unidade de raio dá ~1 px de espaço entre pontos; com menos
      // a onda sai pontilhada em vez de traçada
      const passos = Math.max(40, Math.ceil(base * 6.5));
      for (let k = 0; k < passos; k++) {
        const a = (k / passos) * Math.PI * 2;
        const ondula = 1 + 0.2 * Math.sin(a * 3 + torce * 2.4)
                         + 0.12 * Math.sin(a * 5 - torce * 1.7)
                         + 0.07 * Math.sin(a * 8 + torce * 3.1);
        const rr = base * ondula;
        for (let e = 0; e < esp; e++)
          px(bx + Math.cos(a + torce) * (rr + e), by + Math.sin(a + torce) * (rr + e),
             COR.enjoo);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* Anel de acreção: o mesmo desenho de sempre — duas voltas, fortes de um
     lado e apagadas do outro — com três coisas somadas por cima conforme o
     personagem está COMENDO (`fervor`, que sobe a cada estrela e esfria
     sozinho): gira mais rápido, ganha um halo, e as voltas anteriores ficam
     na tela com alfa baixo, o que dá o rastro circular. Parado e sem comer,
     tudo isso vai a zero e sobra o anel limpo de antes. */
  // no escudo o disco liga no talo: é o momento mais forte do jogo e ele
  // precisa gritar isso sozinho
  const fervor = p.imune > 0 ? 1 : Math.min(1, p.fervor || 0);
  const acel = (comTurbo ? 1 + espiral * 2.6 : 1) * (1 + fervor * 0.9) *
               (p.imune > 0 ? 1.8 : 1);         // invencível, o disco dispara
  const giro = quadro * (comTurbo && turbo > 0 ? 0.09 : 0.04) * acel;
  const N = paleta.length;
  const iris = p.imune > 0;

  if (fervor > 0.04) {                     // halo que acende junto
    // cor saturada do próprio disco, e não o halo pálido: por cima de uma
    // nebulosa da mesma família, o pálido sumia e só lavava a região
    if (iris) {
      // no arco-íris o halo é feito de várias cores empilhadas, cada uma um
      // pouco mais larga: sai um brilho iridescente em vez de um tom só
      for (let k = 0; k < COR.arcoiris.length; k++)
        brilho(bx, by, r + k * 0.7, r + 5 + k * 1.5,
               COR.arcoiris[(k + Math.floor(quadro * 0.12)) % COR.arcoiris.length],
               0.09, 2.2);
    } else {
      brilho(bx, by, r, r + 3 + fervor * 5, paleta[5], 0.09 + fervor * 0.26, 2.4);
    }
  }

  // rastro: as posições por onde o anel passou, cada vez mais apagadas
  // no escudo o rastro é mais longo: é o borrão que dá a leitura de giro
  const rastros = iris ? 6 : (fervor > 0.06 ? 3 : 0);
  for (let g = rastros; g >= 0; g--) {
    const atraso = g * (iris ? 0.16 : 0.12 + fervor * 0.16);
    const alfa = g === 0 ? 1 : (iris ? 0.4 - g * 0.05 : (0.34 - g * 0.08) * fervor);
    if (alfa <= 0.02) continue;
    ctx.globalAlpha = alfa;
    for (let k = 0; k < 2; k++) {
      const rr = r + 1 + k + (g ? g * (iris ? 0.42 : 0.5 * fervor) : 0);
      const passos = Math.max(20, Math.ceil(rr * 7));
      for (let i = 0; i < passos; i++) {
        const a = (i / passos) * Math.PI * 2;
        const lado = 0.5 + 0.5 * Math.sin(a - giro + atraso);
        const inten = (0.34 + 0.66 * lado) * (1 - k * 0.3);
        if (inten < 0.3) continue;
        // no arco-íris a cor vem do ÂNGULO, não da intensidade: é o que faz as
        // faixas girarem junto com o anel em vez de ficarem paradas
        /* A escada é lida do mesmo jeito nos dois fundos. Tentei invertê-la no
         escuro "para a frente do disco brilhar" e o resultado foi um aro
         claro e chapado, com cara de blur, que tapava o preto. O anel do jeito
         original deixa o fundo aparecer através dele, e é isso que faz o
         personagem parecer um buraco e não uma bola com aura. */
      const cor = iris
          ? COR.arcoiris[Math.floor(((a - giro * 1.6) / (Math.PI * 2) * COR.arcoiris.length
                                     % COR.arcoiris.length + COR.arcoiris.length))
                         % COR.arcoiris.length]
          : paleta[Math.min(N - 1, Math.floor(inten * N))];
        // o anel acompanha o corpo: se ele achata, o anel achata junto,
        // senão o disco descola e o personagem parece dentro de um aro rígido
        px(bx + Math.cos(a) * rr * (rx / r), by + Math.sin(a) * rr * (ry / r), cor);
      }
    }
  }
  ctx.globalAlpha = 1;

  // o corpo é claro: precisa de um fio de contorno para ter silhueta
  oval(bx, by, rx, ry, contorno);
  oval(bx, by, rx - 1, ry - 1, COR.corpo);

  // enjoado: o corpo continua branco — quem fica verde é o anel, lá em cima —
  // e sobem bolhinhas de mal-estar
  if (p.enjoo > 0) {
    const q = Math.min(1, p.enjoo / 40);         // passa aos poucos no fim
    ctx.globalAlpha = 0.85 * q;
    for (let i = 0; i < 5; i++) {
      const t = ((quadro * 0.028 + i * 0.2) % 1);
      const bxx = bx + Math.sin(quadro * 0.09 + i * 2.1) * r * 0.55;
      const byy = by - r * 0.5 - t * (r * 0.9 + 6);
      ctx.globalAlpha = 0.85 * q * (1 - t);
      px(bxx, byy, COR.cometa[i % 2 ? 3 : 4]);
      if (t < 0.5) { px(bxx + 1, byy, COR.cometa[4]); px(bxx, byy + 1, COR.cometa[4]); }
    }
    ctx.globalAlpha = 1;
  }
  if (CFG.ROSTO) desenharRosto(p, bx, by, r, blush, rx / r, ry / r);
  if (p === primeiro && cena !== "menu") desenharCoroa(p, bx, by, r);

  if (p === buraco && flash > 0 && flash % 6 < 3) {
    ctx.globalAlpha = 0.3; disco(bx, by, r + 4, paleta[6]); ctx.globalAlpha = 1;
  }

  // Barrinhas de duração, empilhadas sob o personagem. Cada uma tem um miolo
  // escuro, o preenchimento e um fio claro em cima: sem o fio elas somem no
  // fundo branco, e sem o miolo não dá para ver quanto já passou.
  if (comTurbo) {
    const l = Math.max(16, Math.round(r * 2.1));
    const x0 = Math.round(bx - l / 2);
    let y0 = Math.round(by + r + 5);
    const fila = [
      [turbo, CFG.TERRA_TURBO, COR.turbo, COR.turboClarao],
      [ima, CFG.MARTE_IMA, COR.ima, COR.imaPart[0]],
      [buraco.tiro, CFG.SATURNO_TIRO, COR.saturno[4], COR.saturno[2]],
      [buraco.dreno, CFG.JUPITER_DRENO, COR.roxo, COR.jupiter[2]],
      [buraco.imune, CFG.NETUNO_IMUNE, COR.netuno[2], COR.netuno[0]],
      [buraco.enjoo, CFG.COMETA_ENJOO, COR.enjoo, COR.cometa[1]]
    ];
    for (const [v, tot, cor, claro] of fila) {
      if (v <= 0) continue;
      const cheio = Math.max(1, Math.round((l - 2) * v / tot));
      ctx.fillStyle = COR.borda;                       // trilho
      ctx.fillRect(x0, y0, l, 4);
      ctx.fillStyle = COR.vazio;                       // vão interno
      ctx.fillRect(x0 + 1, y0 + 1, l - 2, 2);
      ctx.fillStyle = cor;
      ctx.fillRect(x0 + 1, y0 + 1, cheio, 2);
      ctx.fillStyle = claro;                           // fio de luz em cima
      ctx.fillRect(x0 + 1, y0 + 1, cheio, 1);
      ctx.globalAlpha = 0.5;                           // pontinha acesa
      ctx.fillStyle = claro;
      ctx.fillRect(x0 + cheio, y0 + 1, 1, 2);
      ctx.globalAlpha = 1;
      y0 += 6;
    }
  }

}

function desenharCadente() {
  if (!cadente) return;
  // rastro dourado que vai apagando
  for (let i = cadente.rastro.length - 1; i >= 0; i--) {
    const r = cadente.rastro[i];
    const p = 1 - i / cadente.rastro.length;
    const cor = COR.cadente[p > 0.66 ? 1 : p > 0.33 ? 2 : 2];
    ctx.globalAlpha = 0.25 + p * 0.75;
    px(paraTelaX(r.x), paraTelaY(r.y), cor);
    if (p > 0.5) {
      px(paraTelaX(r.x) + 1, paraTelaY(r.y), cor);
      px(paraTelaX(r.x), paraTelaY(r.y) + 1, cor);
    }
    ctx.globalAlpha = 1;
  }
  const x = paraTelaX(cadente.x), y = paraTelaY(cadente.y);
  ctx.globalAlpha = 0.45;                       // brilho dourado em volta
  disco(x, y, CFG.CADENTE_RAIO + 2, COR.cadente[0]);
  ctx.globalAlpha = 1;
  carimbo(ESTRELAS_SPR[4], x, y, COR.cadente[2]);
  carimbo(ESTRELAS_SPR[2], x, y, COR.estrela);  // miolo preto, como as outras
}

/* O rabo é o que dá o aviso: longo, azul, e engrossando perto da cabeça. */
function desenharCometa() {
  if (!cometa) return;
  const R = CFG.COMETA_RAIO;
  const n = cometa.rastro.length;
  // o rabo engrossa perto da cabeça e afina até sumir, na medida do raio
  for (let i = n - 1; i >= 0; i--) {
    const r = cometa.rastro[i];
    const p = 1 - i / n;                        // 1 na cabeça, 0 na ponta do rabo
    const x = paraTelaX(r.x), y = paraTelaY(r.y);
    ctx.globalAlpha = 0.14 + p * 0.7;
    const cor = COR.cometa[p > 0.72 ? 1 : p > 0.4 ? 2 : 3];
    const w = R * 0.62 * Math.pow(p, 0.8);
    if (w < 0.8) px(x, y, cor);
    else disco(x, y, w, cor);
  }
  ctx.globalAlpha = 1;

  const x = paraTelaX(cometa.x), y = paraTelaY(cometa.y);
  // a coma pulsa: cresce e encolhe, e o brilho vai junto
  const pc = 0.5 + 0.5 * Math.sin(quadro * 0.19);
  brilho(x, y, R * 0.75, R * 0.75 + 9 + pc * 3, COR.cometa[3], 0.26 + pc * 0.16, 2);
  ctx.globalAlpha = 0.5 + pc * 0.2;
  disco(x, y, R * (0.92 + pc * 0.12), COR.cometa[1]);
  ctx.globalAlpha = 1;
  disco(x, y, R * (0.6 + pc * 0.06), COR.cometa[0]);
  disco(x, y, R * 0.4, COR.cometa[2]);
  // núcleo em cruz: um disco de raio 2 sai quadrado e estraga a cabeça
  px(x, y, COR.cometa[4]);
  px(x - 1, y, COR.cometa[4]); px(x + 1, y, COR.cometa[4]);
  px(x, y - 1, COR.cometa[4]); px(x, y + 1, COR.cometa[4]);
  // lascas orbitando o núcleo: dá a sensação de bola de gases, não de bolinha
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2 + quadro * 0.05;
    const rr = R * (0.72 + 0.16 * Math.sin(quadro * 0.13 + k));
    px(x + Math.cos(a) * rr, y + Math.sin(a) * rr, COR.cometa[k % 2 ? 0 : 3]);
  }
}

function desenharBuraco() {
  // os que estão atrás primeiro, para o mais próximo do jogador ficar por cima
  for (const r of rivais) {
    const pal = paletaDe(r);
    desenharPersonagem(r, raioMundoNivel(r.nivel) * zoom,
                       pal.disco, pal.halo, pal.contorno, pal.blush, false);
  }
  desenharPersonagem(buraco, raioTela,
                     COR.disco, COR.halo, COR.contorno, COR.blush, true);
}

/* A mesma coroa, miúda, para marcar a linha do primeiro no placar. Repetir
   o símbolo que já está na cabeça dele liga as duas leituras sem legenda. */
const COROA_HUD = ["#.#.#", "#####", ".###."];
function desenharCoroaHUD(x, y, cor) {
  // parada de propósito: quem flutua é a coroa do boneco em campo. No placar
  // ela é um rótulo, e rótulo que mexe compete com o jogo pela atenção
  carimbo(COROA_HUD, x + 2, y, COR.coroa[2]);
  carimbo(COROA_HUD, x + 2, y - 1, COR.coroa[1]);
}

/* A coroa do líder. Ela flutua (não encosta na cabeça), balança devagar e,
   quando troca de dono, CAI de cima com um repique — é o movimento que
   anuncia a virada, mais do que a coroa em si. */
function desenharCoroa(p, bx, by, r) {
  const t = COROAS[r < 14 ? 0 : r < 24 ? 1 : 2];
  // balanço mais largo e mais alto: ela precisa parecer solta no ar, não
  // apoiada na cabeça
  const bal = Math.sin(quadro * 0.062) * 2.2;
  const a = coroaAnim;
  const queda = a > 0 ? -Math.pow(a, 1.6) * (r + 30) + Math.sin(a * Math.PI) * 5 : 0;
  const cy = by - r - 10 - t.length + bal + queda;
  const giro = a > 0 ? Math.sin(a * Math.PI * 3) * 2 * a : 0;

  ctx.globalAlpha = 0.45;                         // brilhinho por baixo
  disco(bx + giro, cy + 1, t.length * 0.85, COR.coroa[0]);
  // um risco de sombra na cabeça, logo abaixo: é o que diz que ela flutua
  ctx.globalAlpha = 0.22 - Math.sin(quadro * 0.062) * 0.06;
  oval(bx, by - r + 1, t[0].length * 0.34, 1, COR.coroa[2]);
  ctx.globalAlpha = 1;
  carimbo(t, bx + giro, cy + 1, COR.coroa[2]);    // sombra, meio pixel abaixo
  carimbo(t, bx + giro, cy, COR.coroa[1]);

  // faíscas ocasionais em volta, para a coroa não ficar estática
  if (quadro % 9 === 0) {
    const ang = Math.random() * Math.PI * 2;
    const d = t[0].length * 0.6;
    px(bx + giro + Math.cos(ang) * d, cy + Math.sin(ang) * d * 0.7, COR.coroa[0]);
  }
}

/* A gota de suor do enjoo: escorre da têmpora, some e recomeça. É o sinal
   mais direto de "não estou bem" que cabe num rosto deste tamanho. */
function gotaDeSuor(bx, by, r, t) {
  const ciclo = (quadro % 96) / 96;
  if (ciclo > 0.62) return;                      // fica um tempo sem gota
  const q = ciclo / 0.62;
  const x = bx + r * 0.52;
  const y = by - r * 0.42 + q * r * 0.5;
  const c = COR.cometa[3];
  ctx.globalAlpha = q < 0.85 ? 1 : (1 - q) / 0.15;
  if (t >= 2) {                                  // gota maior nos bonecos grandes
    px(x, y - 1, c);
    px(x - 1, y, c); px(x, y, COR.cometa[1]); px(x + 1, y, c);
    px(x, y + 1, c);
  } else {
    px(x, y, c); px(x, y + 1, c);
  }
  ctx.globalAlpha = 1;
}

/* a carinha: olhos que espiam para onde ele está indo, bochechas e um sorriso */
function desenharRosto(p, bx, by, r, blush, ex, ey) {
  ex = ex || 1; ey = ey || 1;
  /* Os olhos ARRASTAM atrás da mudança de direção em vez de saltar junto.
     É "overlapping action": partes leves chegam depois do corpo, e são elas
     que dão vida — olho que gruda na direção nova no mesmo quadro parece
     desenho técnico. */
  const v = Math.hypot(p.vx, p.vy);
  const alvoX = v > 0.01 ? (p.vx / v) * r * 0.11 : 0;
  const alvoY = v > 0.01 ? (p.vy / v) * r * 0.11 : 0;
  p.olhoX = (p.olhoX || 0) + (alvoX - (p.olhoX || 0)) * 0.16;
  p.olhoY = (p.olhoY || 0) + (alvoY - (p.olhoY || 0)) * 0.16;
  const ox = p.olhoX, oy = p.olhoY;
  const t = r < 11 ? 0 : r < 15 ? 1 : r < 20 ? 2 : r < 25 ? 3 : 4;
  const sep = Math.max(3, r * 0.4);

  const doente = p.enjoo > 0;
  const pasmo = p.surpresa > 0;

  // a surpresa é curta e passa na frente do enjoo: quem acabou de levar uma
  // trombada arregala os olhos, e volta a passar mal logo em seguida
  let olho, boca;
  if (pasmo) {
    olho = OLHOS[Math.min(OLHOS.length - 1, t + 1)];   // olhos de um tamanho acima
    boca = BOCAS_O[t];
  } else if (doente) {
    olho = OLHOS[t];
    boca = BOCAS_TRISTE[t];
    gotaDeSuor(bx, by, r, t);
  } else {
    olho = OLHOS[t];
    boca = p.boca > 0 ? BOCAS_O[t] : BOCAS[t];
  }
  // enquanto passa mal a bochecha sai de cena: é o que faz o rostinho perder
  // o viço, mais do que a boca virada
  if (t >= 1 && !doente) {
    // sobre corpo preto a bochecha em 62% some; ela é o único rosado do rosto
    ctx.globalAlpha = CFG.FUNDO_PB ? 0.9 : 0.62;
    const dist = sep + olho[0].length / 2 + 1.5;
    carimbo(BOCHECHAS[t], bx - dist * ex + ox, by + r * 0.26 * ey + oy, blush);
    carimbo(BOCHECHAS[t], bx + dist * ex + ox, by + r * 0.26 * ey + oy, blush);
    ctx.globalAlpha = 1;
  }
  carimbo(olho, bx - sep * ex + ox, by - r * 0.13 * ey + oy, COR.rosto);
  carimbo(olho, bx + sep * ex + ox, by - r * 0.13 * ey + oy, COR.rosto);
  carimbo(boca, bx + ox, by + r * 0.34 * ey + oy, COR.rosto);
}

/* Estouro arco-íris: sete faixas concêntricas abrindo a partir do
   personagem. O "borrão" sai de desenhar cada faixa três vezes, grossa e
   apagada por baixo, fina e viva por cima — canvas com filtro de blur é
   caro no celular, e isso dá o mesmo brilho macio de graça. */
function desenharArcoIris() {
  if (arco <= 0) return;
  const p = arco / CFG.ARCO;                 // 1 -> 0
  const t = 1 - p;                           // 0 -> 1
  const bx = paraTelaX(buraco.x), by = paraTelaY(buraco.y);
  const raio = raioTela + Math.pow(t, 0.6) * VL * 0.62;
  const CORES = COR.arcoiris;
  const esp = Math.max(2, raio * 0.055);

  for (let i = 0; i < CORES.length; i++) {
    const rr = raio - i * esp;
    if (rr <= raioTela * 0.7) continue;
    const desbota = p * p * (1 - i / (CORES.length + 2));
    ctx.globalAlpha = desbota * 0.22;        // camada larga: o brilho
    anel(bx, by, rr + esp, esp * 3, CORES[i]);
    ctx.globalAlpha = desbota * 0.5;         // camada viva
    anel(bx, by, rr, esp, CORES[i]);
  }
  ctx.globalAlpha = 1;
}

function desenharClaraoTerra() {
  if (flashTerra <= 0) return;
  const p = flashTerra / CFG.TERRA_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.85 * forcaFlash();
  ctx.fillStyle = COR.turboClarao;
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}



function desenharClaraoIma() {
  if (flashIma <= 0) return;
  const p = flashIma / CFG.MARTE_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.7 * forcaFlash();
  ctx.fillStyle = COR.imaClarao;
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

/* Enquanto Júpiter dura: clarão roxo nas laterais (mais forte a cada estrela
   roubada) e um tremor de fundo baixinho, para a tela nunca ficar parada. */
/* Pisca vermelho na borda: você está perdendo estrela, seja lá de quem for.
   Fica DEPOIS dos outros brilhos na ordem de desenho, para não ser abafado
   pelo roxo ou pelo dourado de um poder que esteja rolando ao mesmo tempo. */
function desenharBrilhoDano() {
  if (flashDano <= 0) return;
  const p = flashDano / CFG.DANO_FLASH;
  const larg = Math.max(6, Math.round(VL * 0.24));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.6) * p * 0.95 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.dano;
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function desenharBrilhoRoxo() {
  // Só quando O JOGADOR está drenando. Antes acendia com o poder de qualquer
   // um, e a tela ficava roxa por causa de uma briga do outro lado do mapa —
   // parecia que o efeito era seu quando não era. Quem está APANHANDO tem o
   // aviso vermelho, que é a informação certa para ele.
  const ativo = buraco.dreno > 0;
  if (!ativo && flashRoxo <= 0) return;
  const base = ativo ? 0.26 + 0.1 * Math.sin(quadro * 0.12) : 0;
  const p = Math.max(base, flashRoxo > 0 ? flashRoxo / CFG.JUPITER_CLARAO : 0);
  const larg = Math.max(6, Math.round(VL * 0.2));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.8) * p * 0.85 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.jupiter[3];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

/* Golpe de Saturno: as laterais piscam alternando amarelo e azul. Duas cores
   trocando dão a sensação de impacto que uma cor só não dá — o olho lê a
   troca, não o brilho. */
function desenharClaraoAzul() {
  if (flashAzul <= 0) return;
  const p = flashAzul / CFG.NETUNO_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.55 * forcaFlash();
  ctx.fillStyle = COR.netuno[0];
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

function desenharBrilhoSaturno() {
  if (flashTiro <= 0) return;
  const p = flashTiro / CFG.SATURNO_CLARAO;
  const larg = Math.max(6, Math.round(VL * 0.22));
  const troca = quadro % 8 < 4;
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 1.7) * p * 0.9 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = troca ? COR.saturno[3] : COR.bloco[3];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillStyle = troca ? COR.bloco[3] : COR.saturno[3];
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function desenharClaraoTiro() {
  if (flashTiro <= 0) return;
  const p = flashTiro / CFG.SATURNO_CLARAO;
  ctx.globalAlpha = Math.pow(p, 1.4) * 0.7 * forcaFlash();
  ctx.fillStyle = COR.bloco[0];
  ctx.fillRect(0, 0, VL, VA);
  ctx.globalAlpha = 1;
}

function desenharClaraoEnjoo() {
  if (flashEnjoo > 0) {
    const p = flashEnjoo / 26;
    ctx.globalAlpha = Math.pow(p, 1.4) * 0.8 * forcaFlash();
    ctx.fillStyle = COR.enjooClarao;
    ctx.fillRect(0, 0, VL, VA);
    ctx.globalAlpha = 1;
  }
  if (buraco.enjoo <= 0) return;
  // friagem: uma moldura azul fina lembrando que o freio está ligado
  const q = Math.min(1, buraco.enjoo / 40);
  const larg = Math.max(4, Math.round(VL * 0.13));
  for (let i = 0; i < larg; i++) {
    const t = 1 - i / larg;
    const a = Math.pow(t, 2.2) * 0.5 * q * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.cometa[1];
    ctx.fillRect(i, 0, 1, VA); ctx.fillRect(VL - 1 - i, 0, 1, VA);
    ctx.fillRect(0, i, VL, 1); ctx.fillRect(0, VA - 1 - i, VL, 1);
  }
  ctx.globalAlpha = 1;
}

/* No fundo preto qualquer chapada clara na borda vira um estouro: o olho
   está adaptado ao escuro e o mesmo alfa que era um brilho no branco vira
   uma parede de luz. Todos os flashes de lateral passam por aqui. */
function forcaFlash() { return CFG.FUNDO_PB ? 0.42 : 1; }

function desenharBrilhoLateral() {
  if (flashLado <= 0) return;
  const p = flashLado / 34;
  const larg = Math.max(6, Math.round(VL * 0.19));
  for (let i = 0; i < larg; i++) {
    const q = 1 - i / larg;
    const a = Math.pow(q, 1.9) * p * 0.85 * forcaFlash();
    if (a <= 0.012) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = COR.coracao[1];
    ctx.fillRect(i, 0, 1, VA);
    ctx.fillRect(VL - 1 - i, 0, 1, VA);
  }
  ctx.globalAlpha = 1;
}

function barra(x, y, l, p, cor) {
  ctx.fillStyle = COR.borda; ctx.fillRect(x, y, l, 3);
  ctx.fillStyle = cor; ctx.fillRect(x, y, Math.round(limitar(p, 0, 1) * l), 3);
}

/* Triângulo cheio apontando para `ang`: começa em (x,y) e afina até a ponta.
   Rasterizado a mão porque em pixel art um path com antialias vira borrão. */
/* Triângulo cheio, rasterizado pela CAIXA: percorre o quadrado que envolve a
   seta e, para cada pixel, desgira e testa se cai dentro. A versão anterior
   andava 1 px por vez ao longo do eixo e pintava uma faixa perpendicular a
   cada passo — nos ângulos diagonais os passos não se encostavam e a seta
   saía esfarelada, um punhado de pontinhos soltos. Era isso que sujava a
   marca: no eixo ela era limpa, na diagonal virava chuvisco. */
function seta(x, y, ang, tam, larg, cor) {
  ctx.fillStyle = cor;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const r = Math.ceil(Math.max(tam, larg)) + 1;
  const x0 = Math.round(x), y0 = Math.round(y);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const u = dx * ca + dy * sa;                // ao longo da seta
      if (u < -0.5 || u > tam) continue;
      const v = dy * ca - dx * sa;                // perpendicular
      if (Math.abs(v) > larg * (1 - u / tam) + 0.5) continue;
      ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
    }
  }
}

/* Marca de borda: aponta para um jogador que está fora da tela. Ela respira
   na direção dele (avança e recua) e leva um halo, senão some no fundo claro.
   As silhuetas alternativas (seta dupla, miolo aceso) foram embora junto com
   as marcas de cometa e cadente — só jogador tem seta agora, e a cor de cada
   um já basta para saber quem é. */
function marcaNaBorda(mx0, my0, cores) {
  const cx = VL / 2, cy = VA / 2;
  const dx = mx0 - cx, dy = my0 - cy;
  const ang = Math.atan2(dy, dx);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const pulso = 0.5 + 0.5 * Math.sin(quadro * 0.11);

  // a margem encolhe com o pulso: é isso que faz a seta cutucar para fora
  const marg = 15 - pulso * 4;
  // o placar da direita cresce com o número de rivais; a seta desvia dele
