    if (!podeTocar("comer", 45)) return;
    const base = 620 + Math.min(1, altura || 0) * 520;
    tom(base, base * 1.5, 0.07, "square", 0.14);
  },
  nivel() {
    [0, 0.07, 0.14, 0.23].forEach((d, i) =>
      tom(440 * Math.pow(1.26, i), 440 * Math.pow(1.26, i + 1), 0.13, "triangle", 0.2, d));
  },
  planeta(f) {                           // um sino por planeta, cada um numa nota
    tom(f, f * 2, 0.16, "triangle", 0.22);
    tom(f * 2.01, f * 3, 0.2, "sine", 0.14, 0.04);
  },
  cadente() {
    [0, 0.05, 0.1].forEach((d, i) => tom(900 + i * 320, 1500 + i * 400, 0.1, "square", 0.16, d));
  },
  trombada() {
    chiado(0.3, 0.5, 900);
    tom(180, 60, 0.28, "sawtooth", 0.3);
  },
  gelo() {
    chiado(0.12, 0.34, 5200);
    tom(1500, 700, 0.09, "square", 0.12);
  },
  /* o brawl abrindo: uma escadinha inteira subindo, sete notas como as sete
     cores, e um chiado largo por baixo. É o som mais comprido do jogo de
     propósito — ele só toca uma vez por partida, e quando toca a regra do
     jogo mudou */
  brawl() {
    for (let i = 0; i < 7; i++)
      tom(392 * Math.pow(1.19, i), 392 * Math.pow(1.19, i + 1),
          0.16, "triangle", 0.2, i * 0.06);
    chiado(0.5, 0.28, 2600, 0.02);
    tom(160, 320, 0.6, "sawtooth", 0.16, 0.1);
  },
  cometa() {                             // queda longa: o "passar mal"
    tom(520, 120, 0.55, "sawtooth", 0.24);
    chiado(0.4, 0.22, 700, 0.05);
  },
  dreno() {
    if (!podeTocar("dreno", 90)) return;
    tom(300, 820, 0.14, "sine", 0.13);
  },
  /* bônus de combo: um arpejo curto que sobe mais quanto maior o combo */
  combo(n) {
    const b = 523 * Math.pow(1.06, Math.min(12, n / 5));
    [0, 0.05, 0.1].forEach((d, i) => tom(b * [1, 1.26, 1.5][i], b * [1.26, 1.5, 2][i], 0.08, "square", 0.14, d));
  },
  /* bateu num corpo grande demais: "boing" de borracha */
  boing() {
    tom(320, 520, 0.08, "square", 0.12);
    tom(520, 260, 0.14, "triangle", 0.14, 0.06);
  },
  /* mastigou um corpo: quanto maior o degrau, mais grave e mais comprido */
  crunch(k) {
    if (!podeTocar("crunch", 60)) return;
    chiado(0.06 + k * 0.05, 0.3 + k * 0.05, 2600 - k * 500);
    tom(260 - k * 45, 90 - k * 10, 0.1 + k * 0.06, "square", 0.18 + k * 0.03);
    if (k >= 2) tom(392, 784, 0.25, "triangle", 0.16, 0.12);
  },
  /* sendo puxado para dentro: um redemoinho grave descendo */
  sugar() {
    tom(600, 90, 0.45, "sine", 0.2);
    chiado(0.4, 0.14, 1200);
  },
  /* a mordida: um estalo seco e um "glup" subindo */
  nhac() {
    chiado(0.08, 0.4, 3000);
    tom(140, 70, 0.12, "square", 0.24);
    tom(220, 520, 0.16, "triangle", 0.2, 0.08);
  },
  /* encher de balão: um sopro grave subindo devagar, e no topo um "plim" */
  inchar() {
    tom(140, 420, 0.32, "triangle", 0.24, 0.1);
    tom(210, 640, 0.3, "sine", 0.14, 0.12);
    chiado(0.18, 0.12, 900, 0.1);
    tom(880, 1320, 0.12, "triangle", 0.16, 0.42);
  },
  /* murchar: o assobio do balão soltando o ar, descendo */
  murchar() {
    tom(760, 160, 0.42, "sawtooth", 0.08);
    chiado(0.38, 0.16, 2400);
  },
  escudo() {
    [0, 0.06, 0.12, 0.18, 0.24].forEach((d, i) =>
      tom(520 * Math.pow(1.2, i), 520 * Math.pow(1.2, i) * 1.6, 0.2, "sine", 0.16, d));
  },
  coroa() {
    [0, 0.08, 0.16].forEach((d, i) =>
      tom(660 * Math.pow(1.33, i), 660 * Math.pow(1.33, i), 0.16, "triangle", 0.2, d));
  },
  perda() {
    tom(420, 150, 0.26, "square", 0.2);
  },
  clique() { tom(720, 900, 0.05, "square", 0.16); },
  /* a reta final abrindo: um "vuuup" subindo e um sino duplo em cima */
  reta() {
    tom(220, 880, 0.3, "triangle", 0.2);
    chiado(0.28, 0.16, 3200);
    tom(1047, 1047, 0.18, "triangle", 0.18, 0.28);
    tom(1568, 1568, 0.3, "sine", 0.14, 0.34);
  },
  /* cada estrela a menos: um tique. Na tensão vira tic-tac, mais agudo
     quanto mais perto do zero */
  tique(n, tenso) {
    if (!podeTocar("tique", tenso ? 60 : 90)) return;
    if (!tenso) { tom(1300, 1450, 0.035, "square", 0.05); return; }
    const f = 660 * Math.pow(1.07, CFG.CONTA_TENSA - n);
    tom(n % 2 ? f : f * 0.75, (n % 2 ? f : f * 0.75) * 1.02, 0.09, "triangle", 0.2);
    if (n <= 3) tom(f * 2, f * 2, 0.12, "sine", 0.1, 0.02);
  },
  fim(ganhou) {
    const notas = ganhou ? [523, 659, 784, 1047] : [523, 466, 392, 311];
    notas.forEach((f, i) => tom(f, f, 0.22, "triangle", 0.22, i * 0.13));
  }
};

/* Vibração no celular: só onde há dedo (no computador não existe) e com
   trava, para engolir dez estrelas seguidas não virar um zumbido contínuo. */
let ultimaVibra = 0;
function vibrar(padrao) {
  if (PONTEIRO_FINO_CEDO || !navigator.vibrate) return;
  const agora = performance.now();
  if (agora - ultimaVibra < 70) return;
  ultimaVibra = agora;
  try { navigator.vibrate(padrao); } catch (e) {}
}
const PONTEIRO_FINO_CEDO = window.matchMedia && window.matchMedia("(pointer: fine)").matches;

/* ── squash & stretch ─────────────────────────────────────────
   Uma MOLA por personagem, não um decaimento. `elast` é o quanto ele está
   achatado (positivo = largo e baixo, negativo = alto e fino) e `elastV` a
   velocidade com que volta. Uma mola ultrapassa o repouso e volta pelo outro
   lado algumas vezes — é isso que dá o repique, e é a diferença entre um
   "inchou e murchou" e um corpo com massa.
   O volume fica quase constante: o que engorda na horizontal afina na
   vertical, senão o personagem parece só crescer. */
function molaElastica(p) {
  const k = CFG.ELAST_MOLA, d = CFG.ELAST_ATRITO;
  p.elastV = (p.elastV || 0) - (p.elast || 0) * k;
  p.elastV *= d;
  p.elast = limitar((p.elast || 0) + p.elastV, -0.42, 0.42);
  if (Math.abs(p.elast) < 0.002 && Math.abs(p.elastV) < 0.002) {
    p.elast = 0; p.elastV = 0;
  }
}

/* dá um tranco na mola: positivo achata, negativo estica para cima */
function bater(p, forca) {
  p.elastV = (p.elastV || 0) + forca;
}

/* ── controle ────────────────────────────────────────────────── */
const toque = { ativo: false, ax: 0, ay: 0, x: 0, y: 0, id: null,
                ang: null, volta: 0, sentido: 0, acum: 0, parado: 0, girando: false };
let espiral = 0;          // 0 a 1: o quanto o gesto de espiral está valendo
const teclas = Object.create(null);
/* mouse de verdade (não é dedo): é o sinal de que dá para mostrar as teclas */
const PONTEIRO_FINO = window.matchMedia &&
                      window.matchMedia("(pointer: fine)").matches;

function zerarGesto() {
  toque.ang = null; toque.acum = 0; toque.parado = 0;
  toque.volta = 0; toque.girando = false; espiral = 0;
}
/* o gesto é zerado aqui e não em reiniciar(): reiniciar roda na abertura,
   antes de `espiral` e `toque` existirem, e tocar neles ali dá erro */
/* No celular o JOGAR pede tela cheia: a barra do navegador come um pedaço
   da arena. Só no toque (no computador a pessoa escolheu a janela dela) e
   sem reclamar se o navegador recusar — o iPhone não tem essa API. */
function telaCheia() {
  if (PONTEIRO_FINO || document.fullscreenElement) return;
  const el = document.documentElement;
  try { const p = el.requestFullscreen && el.requestFullscreen({ navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function jogar() {
  telaCheia();
  novaPartida();
  slotsOffline(); sortearNomes(); reiniciar(); zerarGesto();
  dicaTeclado = PONTEIRO_FINO ? 420 : 0;      // 7 segundos, só no computador
  cena = "jogo";
}
/* de novo, na mesma sala: quem manda recomeçar é sempre o anfitrião, senão
   dois cliques ao mesmo tempo dariam duas partidas diferentes */
function rejogar() {
  if (!REDE.ativa) { jogar(); return; }
  if (REDE.anfitriao) mandar({ t: "ir" });
}
function sair()  { toque.ativo = false; toque.id = null;
                   if (REDE.ativa || REDE.codigo) largarSala();
                   cena = "menu"; reiniciar(); zerarGesto(); }

tela.addEventListener("pointerdown", e => {
  e.preventDefault();
  iniciarSom();                          // navegador só libera áudio com gesto
  const gx = e.clientX / escala, gy = e.clientY / escala;

  if (cena === "menu") {
    for (let i = 0; i < CFG.OPCOES_RIVAIS.length; i++)
      if (dentro(gx, gy, botaoOponente(i), 5)) {
        SFX.clique();
        apertar("op" + i, () => {
          CFG.RIVAIS = CFG.OPCOES_RIVAIS[i];
          gerarCamadas();              // entra a cor de nebulosa do novo jogador
          reiniciar();                 // e recoloca os bonecos já no menu
        });
        return;
      }
    if (dentro(gx, gy, botaoSom(), 5)) {
      SOM.ligado = !SOM.ligado;
      if (SOM.ligado) SFX.clique();
      apertar("som", null);
      return;
    }
    if (dentro(gx, gy, botaoVisual(), 5)) {
      SFX.clique();
      apertar("visual", () => { cena = "visual"; visualMsg = ""; salvo.liberadosVistos = quantosLiberados(); gravar(); });
      return;
    }
    if (dentro(gx, gy, botaoFundo(), 5)) {
      SFX.clique();
      apertar("fundo", () => aplicarFundo(!CFG.FUNDO_PB));
      return;
    }
    if (dentro(gx, gy, botaoOnline(), 6)) {
      SFX.clique();
      apertar("online", () => { REDE.erro = ""; cena = "online"; });
      return;
    }
    if (dentro(gx, gy, botaoJogar(), 6)) { SFX.clique(); apertar("jogar", jogar); }
    return;
  }
  if (cena === "online" || cena === "codigo" || cena === "sala") {
    toqueOnline(gx, gy);
    return;
  }
  if (cena === "visual") { toqueVisual(gx, gy); return; }
  if (cena === "fim") {
    if (dentro(gx, gy, botaoJogar(), 6)) { SFX.clique(); apertar("jogar", rejogar); }
    else if (dentro(gx, gy, botaoSair(), 8)) { SFX.clique(); apertar("sair", sair); }
    return;
  }
  if (dentro(gx, gy, botaoSair(), 8)) { SFX.clique(); apertar("sair", sair); return; }

  if (toque.id !== null) return;
  tela.setPointerCapture(e.pointerId);
  toque.ativo = true; toque.id = e.pointerId;
  toque.ax = e.clientX; toque.ay = e.clientY;
  toque.x = e.clientX;  toque.y = e.clientY;
  // dedo novo, gesto novo: sem isso um toque herda o semicírculo do anterior
  toque.ang = null; toque.acum = 0; toque.volta = 0;
  toque.parado = 0; toque.girando = false;
});
tela.addEventListener("pointermove", e => {
  if (!toque.ativo || e.pointerId !== toque.id) return;
  e.preventDefault();
  toque.x = e.clientX; toque.y = e.clientY;
  // o centro do analógico segue o dedo quando ele passa do alcance
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  const d = Math.hypot(dx, dy), lim = CFG.RAIO_ANALOG * escala;
  if (d > lim) {
    toque.ax = toque.x - (dx / d) * lim;
    toque.ay = toque.y - (dy / d) * lim;
  }
});
for (const ev of ["pointerup", "pointercancel"])
  tela.addEventListener(ev, e => {
    if (e.pointerId === toque.id) { toque.ativo = false; toque.id = null; }
  });

/* SEMPRE em minúscula para letra. Sem isso a tecla FICA PRESA nesta exata
   combinação, que é a mais usada do teclado: segurar `d` para andar, apertar
   shift para sugar e soltar o `d` — o navegador entrega o keyup como `D`, a
   entrada `d` nunca é apagada e o boneco sai andando para sempre. */
const nomeTecla = k => (k.length === 1 ? k.toLowerCase() : k);

window.addEventListener("keydown", e => {
  iniciarSom();
  teclas[nomeTecla(e.key)] = true;
  /* no teclado do computador o código se digita direto: obrigar a clicar
     letra por letra num teclado desenhado seria perder tempo à toa */
  if (cena === "codigo") {
    if (e.key === "Backspace") REDE.digitado = REDE.digitado.slice(0, -1);
    else if (e.key === "Escape") { REDE.erro = ""; cena = "online"; }
    else if (e.key.length === 1 && LETRAS_SALA.indexOf(e.key.toUpperCase()) >= 0)
      digitar(e.key.toUpperCase());
    return;
  }
  if (cena === "sala") {
    if (e.key === "Escape") sair();
    else if ((e.key === "Enter" || e.key === " ") && REDE.anfitriao) mandar({ t: "ir" });
    return;
  }
  if (cena === "online") {
    if (e.key === "Escape") sair();
    return;
  }
  if (cena === "visual") { if (e.key === "Escape") cena = "menu"; return; }
  if (cena === "menu" && (e.key === "Enter" || e.key === " ")) jogar();
  else if (cena === "fim" && (e.key === "Enter" || e.key === " ")) rejogar();
  else if (e.key === "Escape") sair();
});
window.addEventListener("keyup", e => { teclas[nomeTecla(e.key)] = false; });
/* Sair da janela solta tudo: alt-tab no meio de uma corrida não entrega
   keyup nenhum, e o boneco continuava acelerando sozinho na volta. */
window.addEventListener("blur", () => {
  for (const k in teclas) teclas[k] = false;
});

/* ── lógica ──────────────────────────────────────────────────── */
/* O modo sucção só liga depois de um SEMICÍRCULO completo no mesmo sentido.
   Antes bastava a velocidade de giro, e uma simples troca de direção — que é
   um arco curto — já acendia o modo: o boneco parava de acelerar bem na hora
   em que o jogador queria virar. Agora `acum` soma o ângulo com sinal e zera
   a cada inversão de sentido; só ao passar de meia volta o modo destrava.
   A partir daí a intensidade continua vindo da VELOCIDADE do giro. */
function lerEspiral() {
  if (!toque.ativo) {
    toque.ang = null; toque.volta = 0; toque.acum = 0;
    toque.parado = 0; toque.girando = false;
    espiral = 0;
    return;
  }
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  if (Math.hypot(dx, dy) < CFG.ZONA_MORTA * 2) {   // perto demais, o ângulo pula
    toque.ang = null; toque.volta *= 0.9; toque.acum *= 0.9;
  } else {
    const a = Math.atan2(dy, dx);
    if (toque.ang !== null) {
      let d = a - toque.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      // inverteu o sentido? o semicírculo recomeça do zero
      if (d * toque.acum < 0) toque.acum = 0;
      // O acumulado zera quando o dedo PARA de rodar, não por decaimento.
      // Com decaimento ele saturava em d/0.03 e só uma volta bem rápida
      // alcançava meia volta — giro moderado nunca ligava. Zerando na pausa,
      // "virar e segurar a direção" (que é o que atrapalhava a fluidez) some,
      // e qualquer giro contínuo, mesmo calmo, conta.
      if (Math.abs(d) < 0.015) {
        if (++toque.parado > 8) { toque.acum = 0; toque.parado = 0; }
      } else {
        toque.parado = 0;
        toque.acum += d;
      }
      toque.volta = toque.volta * 0.94 + Math.abs(d);
      // e só destrava se, no instante da meia volta, o dedo ainda estiver
      // rodando rápido: meia volta lenta é manobra, não espiral
      if (Math.abs(toque.acum) >= Math.PI && toque.volta >= CFG.ESPIRAL_MIN)
        toque.girando = true;
      toque.sentido = toque.sentido * 0.9 + Math.sign(d) * 0.1;
    }
    toque.ang = a;
  }
  // parou de rodar: destrava e o modo cai sozinho
  if (toque.girando && toque.volta < CFG.ESPIRAL_MIN * 0.55) toque.girando = false;
  const alvo = toque.girando
    ? limitar((toque.volta - CFG.ESPIRAL_MIN) /
              (CFG.ESPIRAL_MAX - CFG.ESPIRAL_MIN), 0, 1)
    : 0;
  espiral += (alvo - espiral) * 0.18;             // entra e sai macio
  if (espiral < 0.01) espiral = 0;
}

function velMaxTela() {
  const base = Math.max(0.9, CFG.VEL_MAX - buraco.nivel * CFG.VEL_PERDA);
  const gelado = buraco.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  return (turbo > 0 ? base * CFG.TERRA_FATOR : base) * gelado;
}

/* O rival: escolhe o alvo mais próximo de tempos em tempos e vai atrás.
   A mira tem erro de propósito — sem isso ele é perfeito e chato. */
function passoRival(rival, L) {
  if (rival.engolido > 0) return;
  const rm = raioDe(rival);
  const zr = zoomDoNivel(rival.nivel);

  // Com um poder de ataque na mão ele para de catar estrela e vai atrás de
  // alguém: o poder só rende com os dois na mesma tela. A presa é o líder que
  // não seja ele — atacar quem está na frente é o que mantém a corrida viva
  const caçando = rival.tiro > 0 || rival.dreno > 0;
  /* Com arma na mão a presa é o líder — mas só se der para alcançá-lo antes
     de o poder acabar. Atravessar a arena atrás do primeiro colocado com 8
     segundos de gelo no bolso terminava com o poder vencido no caminho e
     ninguém atingido; nesse caso vale mais gastar em quem estiver por perto. */
  let presa = null;
  if (caçando) {
    presa = lider(rival);
    if (presa && Math.hypot(presa.x - rival.x, presa.y - rival.y) >
                 visaoL() * CFG.RIVAL_ALCANCE_ARMA)
      presa = maisPerto(rival) || presa;
  }
  // Sem poder na mão, ainda há um motivo para procurar briga: na trombada
  // quem tem MENOS estrela é que paga. Se ele está por cima com folga, ir
  // para cima de alguém menor é lucro certo — e é o que faz a liderança
  // pesar em vez de só correr atrás de estrela
  // Sem teimosia ele reavalia a cada quadro e volta a catar estrela assim que
  // a vítima se afasta um pouco — a investida nunca se completa. Escolhida a
  // presa, ele insiste por um tempo
  if (rival.perseguindo > 0) rival.perseguindo--;
  let vitima = null;
  if (!caçando && esperaColisao <= 0 && rival.imune <= 0) {
    if (rival.perseguindo > 0 && rival.presa &&
        rival.comidas - rival.presa.comidas >= CFG.RIVAL_MARGEM &&
        rival.presa.imune <= 0) {
      vitima = rival.presa;
    } else {
      vitima = presaFraca(rival);
      if (vitima) { rival.presa = vitima; rival.perseguindo = CFG.RIVAL_TEIMOSIA; }
    }
  }
  const vivo = rival.alvo && (rival.alvo === terra || rival.alvo === marte ||
                              rival.alvo === saturno || rival.alvo === jupiter ||
                              rival.alvo === urano ||
                              rival.alvo === netuno || rival.alvo === buraco ||
                              rivais.indexOf(rival.alvo) >= 0 ||
                              (corpos.indexOf(rival.alvo) >= 0 && !rival.alvo.comedor) ||
                              estrelas.indexOf(rival.alvo) >= 0);
  // engolir alguém vale mais que qualquer estrela; fugir de quem engole vale
  // mais ainda — e as duas coisas passam na frente do resto
  const perigo = ameaca(rival);
  // a vontade de caçar é sorteada a cada "pensada", pelo apetite do bot
  if (--rival.fomeT <= 0 || rival.fomeT == null) {
    rival.fomeT = CFG.RIVAL_PENSAR * 2;
    rival.comFome = Math.random() < (rival.apetite || 0.5);
  }
  const janta = perigo || !rival.comFome ? null : refeicao(rival);
  if (perigo) {
    rival.alvo = null;
    rival.ang = Math.atan2(rival.y - perigo.y, rival.x - perigo.x) + (Math.random() - 0.5) * 0.5;
    rival.pensar = 8;
  } else if (janta) {
    rival.alvo = janta;
    rival.pensar = 1;
  } else if (caçando && presa) {
    rival.alvo = presa;
    rival.pensar = 1;
  } else if (vitima) {
    rival.alvo = vitima;
    rival.pensar = 1;
  } else if (brawl > 0) {
    /* No BRAWL a estrela do chão não vale nada, e catar planeta só vale se
       for para usar em alguém. Sem estrela para colher, a CPU larga a
       colheita e vai para cima de gente — do líder, se houver quem esteja
       na frente dela. Sem isso ela passava os quinze segundos rodando o
       campo atrás de estrelas suspensas, e o brawl virava um intervalo. */
    rival.alvo = lider(rival) || maisPerto(rival);
    rival.pensar = 1;
  } else if (--rival.pensar <= 0 || !vivo) {
    rival.pensar = CFG.RIVAL_PENSAR + Math.floor(Math.random() * CFG.RIVAL_PENSAR);
    /* Ficar COLADO no líder para disputar as mesmas estrelas foi tentado e
       medido como pior: perto do líder o rival trombava com ele, e na trombada
       quem tem menos estrela é quem paga. Sem arma na mão, chegar perto de
       quem está na frente é só entregar cinco estrelas. */
    let melhor = null, md = Infinity;
    for (const e of estrelas) {
      const d = Math.hypot(e.x - rival.x, e.y - rival.y);
      if (d < md) { md = d; melhor = e; }
    }
    /* Estando ATRÁS no placar, um planeta vale muito mais que uma estrela: é
       arma para cima de quem está na frente. Ele então aceita desviar bem mais
       da rota para pegar um. O laço também passou a escolher o planeta MAIS
       PERTO — antes ficava com o último da lista que coubesse no limite, que
       podia ser o mais distante dos cinco. */
    const chefe = lider(rival);
    const atras = chefe && chefe.comidas - rival.comidas >= CFG.RIVAL_MARGEM;
    const limite = md * (atras ? CFG.RIVAL_FOME_ARMA : 1.3);
    // um corpo que cabe vale por várias estrelas: a "distância" dele encolhe
    for (const c of corpos) {
      if (c.comedor || !cabe(rival, c)) continue;
      const d = Math.hypot(c.x - rival.x, c.y - rival.y) / (1 + CFG.CORPOS[c.k].valor * 0.3);
      if (d < md) { md = d; melhor = c; }
    }
    let mp = Infinity;
    for (const o of [terra, marte, saturno, jupiter, urano, netuno]) {
      if (!o) continue;
      const d = Math.hypot(o.x - rival.x, o.y - rival.y);
      if (d < limite && d < mp) { mp = d; melhor = o; }
    }
    rival.alvo = melhor;
  }
  if (rival.alvo && !perigo) {
    const dx = rival.alvo.x - rival.x, dy = rival.alvo.y - rival.y;
    rival.ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * CFG.RIVAL_MIRA;
    // com poder na mão ele mantém distância de tiro em vez de colar; indo
    // trombar, é o contrário — quer o encostão
    if (caçando && rival.alvo !== janta) {
      const d = Math.hypot(dx, dy);
      const outroR = raioDe(rival.alvo);
      if (d < (rm + outroR) * CFG.RIVAL_DISTANCIA) rival.ang += Math.PI;
    }
  }

  const zonzo = rival.atordoado > 0;
  if (zonzo) rival.atordoado--;
  const gelado = rival.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  const forca = rival.forca || CFG.RIVAL_FORCA;
  const acel = (zonzo ? 0 : CFG.ACEL * forca * gelado) / zr;
  const atrito = zonzo ? CFG.COLISAO_ARRASTO : CFG.ATRITO;
  rival.vx = (rival.vx + Math.cos(rival.ang) * acel) * atrito;
  rival.vy = (rival.vy + Math.sin(rival.ang) * acel) * atrito;
  const vm = Math.max(0.9, CFG.VEL_MAX - rival.nivel * CFG.VEL_PERDA) * forca * gelado / zr;
  const v = Math.hypot(rival.vx, rival.vy);
  if (!zonzo && v > vm) { rival.vx = rival.vx / v * vm; rival.vy = rival.vy / v * vm; }
  rival.x += rival.vx; rival.y += rival.vy;

  const m = rm + 1;
  if (rival.x < L.x0 + m) { rival.x = L.x0 + m; rival.vx = Math.abs(rival.vx); }
  if (rival.y < L.y0 + m) { rival.y = L.y0 + m; rival.vy = Math.abs(rival.vy); }
  if (rival.x > L.x1 - m) { rival.x = L.x1 - m; rival.vx = -Math.abs(rival.vx); }
  if (rival.y > L.y1 - m) { rival.y = L.y1 - m; rival.vy = -Math.abs(rival.vy); }
}

/* O alvo de uma trombada proposital: o mais próximo que tenha bem menos
   estrela, esteja perto e não esteja de escudo. Sem a margem, dois quase
   empatados ficariam se perseguindo e a trombada viraria loteria. */
/* A vítima é o MAIOR que ele ainda ganha, não o mais perto. Antes ele batia
   em quem estivesse à mão, e o resultado era a CPU passar a partida inteira
   moendo o lanterna enquanto o líder disparava sozinho. Como na trombada quem
   paga é quem tem MENOS estrela, ir para cima do primeiro colocado que ele
   ainda vence é ao mesmo tempo a jogada mais lucrativa e a que segura a
   corrida — e é por isso que ele anda bem mais longe atrás do líder. */
function presaFraca(quem) {
  const chefe = lider(quem);
  const base = visaoL() * CFG.RIVAL_CACADA;
  let melhor = null, mc = -1, md = Infinity;
  for (const p of todos()) {
    if (p === quem || p.imune > 0) continue;
    if (quem.comidas - p.comidas < CFG.RIVAL_MARGEM) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d > base * (p === chefe ? CFG.RIVAL_CACADA_LIDER : 1)) continue;
    // chave de teste: com ela desligada ele volta a bater no mais PERTO
    const peso = CFG.RIVAL_ALVO_MAIOR ? p.comidas : -d;
    if (peso > mc || (peso === mc && d < md)) { mc = peso; md = d; melhor = p; }
  }
  return melhor;
}

/* o adversário visível mais próximo — é em quem o jogador acerta sem escolher */
function maisPerto(quem) {
  let melhor = null, md = Infinity;
  for (const p of todos()) {
    if (p === quem) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d < md && naTela(p.x, p.y, 0)) { md = d; melhor = p; }
  }
  return melhor;
}

/* o mais perto que `quem` consegue engolir, se estiver a uma distância
   razoável — uma tela e pouco */
function refeicao(quem) {
  let melhor = null, md = visaoL() * CFG.RIVAL_JANTA_DIST;
  for (const p of todos()) {
    if (p === quem || !podeEngolir(quem, p)) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d < md) { md = d; melhor = p; }
  }
  return melhor;
}
/* alguém perto que engole `quem`? é dele que se foge */
function ameaca(quem) {
  if (quem.imune > 0 || quem.cuspido > 0) return null;
  let pior = null, md = visaoL() * CFG.RIVAL_FOGE;
  for (const p of todos()) {
    if (p === quem || !podeEngolir(p, quem)) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d < md) { md = d; pior = p; }
  }
  return pior;
}

/* quem está na frente, tirando quem perguntou */
function lider(quem) {
  let melhor = null;
  for (const p of todos()) {
    if (p === quem) continue;
    if (!melhor || p.comidas > melhor.comidas) melhor = p;
  }
  return melhor;
}

const raioDe = p => p === buraco ? raioMundo() : raioMundoNivel(p.nivel) * fatorIncha(p);

/* Todo mundo trombando com todo mundo, inclusive rival com rival: a partida
   com três vira uma disputa de verdade, não dois duelos separados. */
function passoTrombadas() {
  const lista = todos();
  for (let i = 0; i < lista.length; i++) {
    for (let j = i + 1; j < lista.length; j++) {
      const a = lista[i], b = lista[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const minimo = raioDe(a) + raioDe(b);
      if (d >= minimo) continue;
      if (a.engolido > 0 || b.engolido > 0) continue;
      // grande o bastante para engolir: não empurra — deixa entrar
      const g = podeEngolir(a, b) ? a : podeEngolir(b, a) ? b : null;
      if (g && cena === "jogo") {
        const v = g === a ? b : a;
        if (d < raioDe(g) * 0.92) engolirRival(g, v);
        continue;
      }
      const ux = dx / d, uy = dy / d;
      const folga = (minimo - d) / 2 + 1;
      b.x += ux * folga;  b.y += uy * folga;
      a.x -= ux * folga;  a.y -= uy * folga;
      if (cena === "jogo" && esperaColisao <= 0) trombada(a, b, ux, uy);
    }
  }
}

/* COMBO: cada mordida dentro da janela da anterior soma. É o que transforma
   "comer estrela" em ritmo — e a cada COMBO_BONUS vem um prêmio que cresce
   com a sequência: x10 dá +1, x20 dá +2, x30 dá +3, e assim por diante. */
function contarCombo(p) {
  p.combo = (p.comboT > 0 ? p.combo || 0 : 0) + 1;
  p.comboT = CFG.COMBO_JANELA;
  if (p === buraco) { comboPop = 1; partida.combo = Math.max(partida.combo, p.combo); }
  if (p.combo % CFG.COMBO_BONUS === 0 && cena === "jogo") {
    const premio = p.combo / CFG.COMBO_BONUS;
    ganharEstrelas(p, premio);
    if (p === buraco) {
      anunciar("COMBO x" + p.combo + "! +" + premio, COR.hud, true);
      SFX.combo(p.combo); vibrar(18);
    }
  }
}
let comboPop = 0;
/* o número do combo flutua sobre a cabeça e estufa a cada mordida: na cor do
   jogador até o primeiro bônus, arco-íris dali em diante; some quando a janela fecha */
function desenharCombo() {
  const p = buraco;
  if (!(p.combo >= 1) || !(p.comboT > 0) || cena !== "jogo") return;
  const txt = "x" + p.combo;
  const tam = comboPop > 0.5 || p.combo >= CFG.COMBO_BONUS ? 2 : 1;
  const x = Math.round(paraTelaX(p.x) - larguraTexto(txt, tam) / 2);
  const y = Math.round(paraTelaY(p.y) - raioTela - 16 - FONTE_H * (tam - 1) - comboPop * 4);
  const cor = p.combo >= CFG.COMBO_BONUS ? COR.arcoiris[Math.floor(quadro / 4) % COR.arcoiris.length]
            : corDe(p)[4];
  ctx.globalAlpha = Math.min(1, p.comboT / 14);
  texto(txt, x, y, cor, tam);
  ctx.globalAlpha = 1;
}

/* ── A RETA FINAL ─────────────────────────────────────────────────
   Quando falta CONTA_DE estrelas para o líder bater a META, um número grande
   na cor do jogador entra na tela e conta até zero. É o relógio que a música
   já tocava (o andamento sobe na reta final) e que ninguém via.
   Cada dígito é um bonequinho com física própria, como num placar de
   odômetro: o que mudou CAI da tela girando e o novo despenca de cima,
   achata ao bater no chão e volta (squash & stretch); o que não mudou dá um
   pulinho de simpatia. Subir (o líder perdeu estrelas) faz o contrário: o
   novo sobe de baixo e o velho voa para cima.
   Abaixo de CONTA_TENSA o número cresce, bate como um coração cada vez mais
   rápido e solta uma onda a cada estrela; nos três últimos, arco-íris.
   Desenhado por sprites de 1 px por ponto da fonte, ampliados sem
   suavização: o squash fica fracionário só enquanto mexe, e parado o
   número cai exato na grade do pixel art. */
const spritesConta = new Map();
function zerarContagem() {
  CONTA.fase = "fora";           // fora | chegada | doca | saindo
  CONTA.t = 0;
  CONTA.n = null;                // o número que está na tela
  CONTA.digs = [];               // da direita para a esquerda
  CONTA.cacos = []; CONTA.brilhos = []; CONTA.ondas = [];
  CONTA.esc = 3; CONTA.escV = 0; // pixels de tela por ponto da fonte
  CONTA.batida = 0; CONTA.fase2 = 0;
  CONTA.q = quadro;
  CONTA.jaVeio = false;
  CONTA.cx = VL / 2; CONTA.cy = 0; CONTA.S = 0;
}

/* cada dígito pintado uma vez por cor, 1 px por ponto da fonte */
function spriteConta(ch, cor) {
  const k = ch + cor;
  let c = spritesConta.get(k);
  if (c) return c;
  const g = glifo(ch);
  c = document.createElement("canvas");
  c.width = g.larg; c.height = FONTE_H - 1;
  const x = c.getContext("2d");
  x.fillStyle = cor;
  for (let ly = 0; ly < FONTE_H - 1; ly++)
    for (let lx = 0; lx < g.larg; lx++) {
      if (g.linhas[ly][g.c0 + lx] === "#") x.fillRect(lx, ly, 1, 1);
    }
  if (spritesConta.size > 400) spritesConta.clear();
  spritesConta.set(k, c);
  return c;
}
const largDigito = ch => glifo(ch).larg;

/* Um dígito com os pés em (cx, base): o squash cresce para os lados e
   encolhe para cima a partir do chão, como algo que pousou de verdade */
function carimboConta(ch, cx, base, S, e, rot, face, alfa) {
  const pal = corDe(buraco);
  const sx = S * (1 + e), sy = S * (1 - e);
  const w = largDigito(ch) * sx, h = (FONTE_H - 1) * sy;
  const sombra = Math.max(1, Math.round(S * 0.6));
  ctx.save();
  ctx.globalAlpha = alfa == null ? 1 : alfa;
  const exato = !rot && Math.abs(e) < 0.004;
  ctx.translate(exato ? Math.round(cx - w / 2) + w / 2 : cx, exato ? Math.round(base) : base);
  if (rot) ctx.rotate(rot);
  const x0 = -w / 2, y0 = -h;
  const borda = spriteConta(ch, COR.vazio);
  for (let dx = -1; dx <= 1; dx++)                // contorno de 1 px em volta
    for (let dy = -1; dy <= 1; dy++) {            // do número e da sombra
      ctx.drawImage(borda, x0 + dx, y0 + dy, w, h);
      ctx.drawImage(borda, x0 + dx, y0 + dy + sombra, w, h);
    }
  ctx.drawImage(spriteConta(ch, pal[7]), x0, y0 + sombra, w, h);
  // o friso claro: a mesma forma, clara, 1 px acima da face
  ctx.drawImage(spriteConta(ch, pal[2]), x0, y0, w, h);
  ctx.drawImage(spriteConta(ch, face), x0, y0 + 1, w, h);
  ctx.restore();
}

function novoDigito(ch, de) {
  // de: -1 despenca de cima, +1 sobe de baixo, 0 já nasce no lugar
  return { ch: ch, y: de * 11, vy: de < 0 ? 0.3 : de > 0 ? -0.6 : 0,
           e: 0, ev: 0, chao: de >= 0 };
}
function montarConta(n, de) {
  CONTA.n = n;
  CONTA.digs = ("" + n).split("").reverse().map(ch => novoDigito(ch, de));
}
function escalaConta(n) { return n <= 3 ? 5 : n <= 9 ? 4 : 3; }

/* x do centro de cada dígito (lista da direita para a esquerda) */
function posicoesConta(S, cx) {
  const ds = CONTA.digs;
  let total = 0;
  for (const d of ds) total += largDigito(d.ch) * S;
  total += (ds.length - 1) * S;
  let x = cx + total / 2;
  return ds.map(d => { const w = largDigito(d.ch) * S; x -= w; const c = x + w / 2; x -= S; return c; });
}

function soltarBrilhos(x, y, n, forca, cores) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.4) * forca;
    const vida = 18 + Math.floor(Math.random() * 16);
    CONTA.brilhos.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.4,
                         vida: vida, total: vida, cor: cores[k % cores.length] });
  }
}

function mudarConta(novo) {
  // a escala do quadro passado, com estufada e tudo: o caco sai de onde estava
  const velho = CONTA.n, S = CONTA.S || CONTA.esc;
  const desce = novo < velho, de = desce ? -1 : 1;
  const xs = posicoesConta(S, CONTA.cx);
  const a = ("" + velho).split("").reverse(), b = ("" + novo).split("").reverse();
  const mesmoTam = a.length === b.length;
  const digs = [];
  for (let i = 0; i < b.length; i++) {
    const antigo = CONTA.digs[i];
    if (mesmoTam && antigo && a[i] === b[i]) {
      antigo.vy = Math.min(antigo.vy, -1); antigo.chao = false;   // o pulinho
      digs.push(antigo);
    } else digs.push(novoDigito(b[i], de));
  }
  // o que saiu vira caco: cai girando (ou voa para cima, se o número subiu)
  CONTA.digs.forEach((d, i) => {
    if (digs.includes(d)) return;
    CONTA.cacos.push({ ch: d.ch, x: xs[i], y: CONTA.cy + d.y, S: S,
                       vx: (Math.random() - 0.5) * 1.3 + (i ? -0.25 : 0.25),
                       vy: desce ? -1.3 - Math.random() * 0.5 : -2, g: desce ? 0.2 : 0.08,
                       rot: 0, vr: (Math.random() < 0.5 ? -1 : 1) * (0.04 + Math.random() * 0.05),
                       vida: 30, total: 30 });
  });
  CONTA.digs = digs;
  CONTA.n = novo;

  const tenso = novo <= CFG.CONTA_TENSA;
  const pal = corDe(buraco);
  const meio = CONTA.cy - (FONTE_H - 1) * S / 2;
  soltarBrilhos(CONTA.cx, meio, tenso ? 10 : 5, tenso ? 1.6 : 1, [pal[4], pal[2], COR.hud]);
  if (tenso && desce) {
    CONTA.batida = 1;
    CONTA.ondas.push({ x: CONTA.cx, y: meio, r: 6, vida: 26, total: 26, cor: pal[4] });
    if (novo <= 3) { CONTA.ondas.push({ x: CONTA.cx, y: meio, r: 2, vida: 34, total: 34, cor: pal[2] }); vibrar(25); }
  }
  if (desce) SFX.tique(novo, tenso);
}

function passoContagem() {
  const C = CONTA;
  C.t++;
  // a escala vai para o alvo com mola: o número "estufa" ao entrar na tensão
  const alvo = C.n == null ? 3 : escalaConta(C.n);
  C.escV = (C.escV + (alvo - C.esc) * 0.16) * 0.7;
  C.esc += C.escV;
  if (Math.abs(alvo - C.esc) < 0.02 && Math.abs(C.escV) < 0.02) { C.esc = alvo; C.escV = 0; }
  C.batida *= 0.88;

  for (const d of C.digs) {
    if (d.y < 0 || !d.chao) {
      // no ar: cai com gravidade e estica na direção do movimento
      d.vy += 0.45; d.y += d.vy;
      d.e = -Math.min(0.18, Math.abs(d.vy) * 0.035);
      if (d.y >= 0 && d.vy > 0) {
        d.y = 0;
        // bate no chão: achata na proporção da velocidade e quica um pouco
        d.ev = 0; d.e = Math.min(0.24, d.vy * 0.045);
        if (d.vy > 3) { d.vy = -d.vy * 0.2; } else { d.vy = 0; d.chao = true; }
      }
    } else if (d.y > 0) {
      // subindo de baixo: mola que passa um pouco do lugar
      d.vy = (d.vy - d.y * 0.22) * 0.74; d.y += d.vy;
      d.e = -Math.min(0.15, Math.abs(d.vy) * 0.04);
      if (Math.abs(d.y) < 0.3 && Math.abs(d.vy) < 0.3) { d.y = 0; d.vy = 0; }
    } else {
      d.ev = (d.ev - d.e * 0.3) * 0.66; d.e += d.ev;   // o achatado volta
      if (Math.abs(d.e) < 0.004 && Math.abs(d.ev) < 0.004) d.e = d.ev = 0;
    }
  }
  for (let i = C.cacos.length - 1; i >= 0; i--) {
    const c = C.cacos[i];
    c.vy += c.g; c.x += c.vx; c.y += c.vy; c.rot += c.vr;
    if (--c.vida <= 0) C.cacos.splice(i, 1);
  }
  for (let i = C.brilhos.length - 1; i >= 0; i--) {
    const b = C.brilhos[i];
    b.x += b.vx; b.y += b.vy; b.vx *= 0.9; b.vy = b.vy * 0.9 + 0.03;
    if (--b.vida <= 0) C.brilhos.splice(i, 1);
  }
  for (let i = C.ondas.length - 1; i >= 0; i--) {
    const o = C.ondas[i];
    o.r += 1.6 * (o.vida / o.total) + 0.3;
    if (--o.vida <= 0) C.ondas.splice(i, 1);
  }
}

const sobeEDesce = t => t * t * (3 - 2 * t);
const voltaAlem = t => { const s = 2.2; t -= 1; return t * t * ((s + 1) * t + s) + 1; };

function desenharContagem(yDoca) {
  const C = CONTA;
  if (cena !== "jogo") return;
  let maior = 0;
  for (const p of todos()) maior = Math.max(maior, p.comidas);
  const resta = Math.max(0, CFG.META - maior);
  const dentro = resta <= CFG.CONTA_DE;

  // a primeira vez é um evento: o número estoura no meio da tela, fica um
  // instante e voa para o lugar dele. Se voltar depois, só pipoca no lugar
  if (dentro && (C.fase === "fora" || C.fase === "saindo")) {
    C.t = 0; C.cacos = [];
    C.esc = escalaConta(resta); C.escV = 0;
    montarConta(resta, C.jaVeio ? -1 : 0);
    if (!C.jaVeio) {
      C.fase = "chegada"; C.jaVeio = true;
      SFX.reta(); vibrar([20, 40, 30]);
      tremor = Math.max(tremor, 8);
    } else C.fase = "doca";
  } else if (!dentro && (C.fase === "doca" || C.fase === "chegada")) {
    C.fase = "saindo"; C.t = 0;
  } else if (dentro && resta !== C.n) mudarConta(resta);

  const passos = limitar(quadro - C.q, 0, 5);
  C.q = quadro;
  for (let k = 0; k < passos; k++) passoContagem();
  if (C.fase === "fora" && !C.cacos.length && !C.brilhos.length) return;

  const pal = corDe(buraco);
  const S0 = C.esc;
  const altDoca = (FONTE_H - 1) * escalaConta(C.n == null ? 50 : C.n);
  const dx = VL / 2, dy = yDoca + altDoca;          // pés do número na doca
  let cx = dx, cy = dy, mult = 1, alfa = 1, rotulo = 1;

  if (C.fase === "chegada") {
    const POP = 14, FICA = 46, VOO = 24;
    // no alto da tela: o meio é onde você está, e o número não pode tapar o boneco
    const mx = VL / 2, my = Math.round(VA * 0.24);
    if (C.t < POP) {
      mult = 2.4 * voltaAlem(C.t / POP);
      cx = mx; cy = my; rotulo = 0;
    } else if (C.t < POP + FICA) {
      // fica pulsando no centro, girando brilhos em volta
      const u = C.t - POP;
      mult = 2.4 * (1 + Math.sin(u * 0.35) * 0.05 * (1 - u / FICA));
      cx = mx; cy = my; rotulo = 0;
      if (u === 1) {
        const meio = my - (FONTE_H - 1) * S0 * mult / 2;
        soltarBrilhos(mx, meio, 22, 2.6, [pal[4], pal[2], pal[5], COR.hud]);
        C.ondas.push({ x: mx, y: meio, r: 10, vida: 30, total: 30, cor: pal[4] });
        C.ondas.push({ x: mx, y: meio, r: 4, vida: 38, total: 38, cor: pal[2] });
      }
      if (u % 3 === 0) {
        const a = u * 0.5, R = 34;
        const meio = my - (FONTE_H - 1) * S0 * mult / 2;
        soltarBrilhos(mx + Math.cos(a) * R, meio + Math.sin(a) * R * 0.6, 1, 0.3, [pal[2]]);
      }
      // a legenda do evento, letra a letra em arco-íris
      const leg = "reta final!";
      const ly = Math.round(my + 8 + Math.sin(u * 0.2) * 1.5);
      const lx = Math.round((VL - larguraTexto(leg, 2)) / 2);
      ctx.globalAlpha = Math.min(1, u / 5) * (u > FICA - 6 ? (FICA - u) / 6 : 1);
      for (let ox = -1; ox <= 1; ox++)
        for (let oy = -1; oy <= 1; oy++)
          if (ox || oy) desenhaGlifos(leg, lx + ox * 2, ly + oy * 2, COR.vazio, 2);
      glifosIris(leg, lx, ly, 2, Math.floor(quadro * 0.3));
      ctx.globalAlpha = 1;
    } else {
      // o voo: devagar, rápido, devagar, num arco para cima e encolhendo
      const t = Math.min(1, (C.t - POP - FICA) / VOO), e = sobeEDesce(t);
      cx = mx + (dx - mx) * e;
      cy = my + (dy - my) * e - Math.sin(t * Math.PI) * 16;
      mult = 2.4 + (1 - 2.4) * e;
      rotulo = e;
      if (C.t % 2 === 0)
        soltarBrilhos(cx, cy - (FONTE_H - 1) * S0 * mult / 2, 2, 0.5, [pal[4], pal[2]]);
      if (t >= 1) {
        C.fase = "doca"; C.t = 0;
        for (const d of C.digs) { d.chao = true; d.e = 0.22; d.ev = 0; }  // pousa
      }
    }
  } else if (C.fase === "saindo") {
    const t = Math.min(1, C.t / 18);
    mult = 1 + Math.sin(t * Math.PI) * 0.3 - t * t;
    alfa = 1 - t; rotulo = 1 - t;
    if (t >= 1) { C.fase = "fora"; C.n = null; C.digs = []; }
  }

  const tenso = C.n != null && C.n <= CFG.CONTA_TENSA;
  if (C.fase === "doca") {
    // flutua de leve; na tensão, bate como um coração cada vez mais rápido
    cy += Math.round(Math.sin(quadro * 0.07) * 1.2);
    if (tenso) {
      const periodo = 14 + C.n * 2.6;
      C.fase2 += 1 / periodo * passos;
      const f = C.fase2 % 1;
      const pulso = Math.exp(-f * 9) + 0.5 * Math.exp(-Math.max(0, f - 0.18) * 11) * (f > 0.18 ? 1 : 0);
      mult *= 1 + 0.07 * pulso + 0.14 * C.batida;
      if (C.n <= 3) { cx += Math.round((Math.random() - 0.5) * 2); cy += Math.round((Math.random() - 0.5) * 2); }
    }
  }
  const S = S0 * mult;
  C.cx = cx; C.cy = cy; C.S = S;

  // halo atrás, só na tensão
  if (tenso && C.digs.length && C.fase === "doca") {
    const meio = cy - (FONTE_H - 1) * S / 2;
    ctx.save();
    if (CFG.FUNDO_PB) ctx.globalCompositeOperation = "lighter";
    brilho(cx, meio, 4, 16 + S * 4 + C.batida * 10, pal[4], 0.22 + C.batida * 0.3, 1.6);
    ctx.restore();
  }

  for (const o of C.ondas) {
    ctx.globalAlpha = o.vida / o.total;
    ctx.fillStyle = o.cor;
    const passo = 1 / Math.max(4, o.r);
    for (let a = 0; a < Math.PI * 2; a += passo)
      ctx.fillRect(Math.round(o.x + Math.cos(a) * o.r), Math.round(o.y + Math.sin(a) * o.r * 0.8), 1, 1);
  }
  ctx.globalAlpha = 1;

  for (const c of C.cacos)
    carimboConta(c.ch, c.x, c.y, c.S, 0, c.rot, pal[4], Math.min(1, c.vida / 14));

  if (C.digs.length) {
    const xs = posicoesConta(S, cx);
    C.digs.forEach((d, i) => {
      // os três últimos em arco-íris, cada dígito numa cor correndo
      const face = C.n != null && C.n <= 3 ? corIris(0.25, i)
                 : tenso && C.batida > 0.55 ? pal[2] : pal[4];
      carimboConta(d.ch, xs[i], cy + d.y * mult, S, d.e, 0, face, alfa);
    });

    // a legenda embaixo: quem lidera muda a frase
    if (rotulo > 0.02) {
      const meu = primeiro === buraco;
      const leg = meu ? "pra voce vencer!" : "estrelas pro fim";
      const ly = Math.round(cy + Math.max(2, S * 0.6) + 4), lw = larguraTexto(leg, 1);
      // em tela estreita a legenda encostava no placar da direita: desvia
      let lx = Math.round(cx - lw / 2);
      const teto = VL - 4 - PLACAR_L - 6;
      if (dy + 16 < alturaPlacar() + 4 && lx + lw > teto) lx = teto - lw;
      ctx.globalAlpha = rotulo * alfa;
      texto(leg, lx, ly, meu ? pal[4] : COR.hudFraco, 1);
      ctx.globalAlpha = 1;
    }
  }

  for (const b of C.brilhos) {
    const v = b.vida / b.total, braco = v > 0.6 ? 2 : v > 0.25 ? 1 : 0;
    ctx.globalAlpha = Math.min(1, v * 1.6);
    ctx.fillStyle = b.cor;
    const x = Math.round(b.x), y = Math.round(b.y);
    ctx.fillRect(x, y, 1, 1);
    if (braco) {
      ctx.fillRect(x - braco, y, braco, 1); ctx.fillRect(x + 1, y, braco, 1);
      ctx.fillRect(x, y - braco, 1, braco); ctx.fillRect(x, y + 1, 1, braco);
    }
  }
  ctx.globalAlpha = 1;
}

/* ── a escada de tamanho: passo ───────────────────────────────── */
const raioCorpo = k => raioMundoNivel(CFG.CORPOS[k].nivel) / CFG.CORPO_RAZAO;
const cabe = (p, c) => raioDe(p) >= c.r * CFG.CORPO_RAZAO * 0.999;

function novoCorpo(k) {
  const L = limites(), r = raioCorpo(k);
  if (L.l < r * 4 || L.a < r * 4) return null;     // a arena ainda não comporta
  for (let tent = 0; tent < 30; tent++) {
    const x = L.x0 + r + Math.random() * (L.l - 2 * r);
    const y = L.y0 + r + Math.random() * (L.a - 2 * r);
    // nasce fora da sua vista e longe de todo mundo: não "brota" na cara
    if (naTela(x, y, r * zoom + 10)) continue;
    if (todos().some(p => Math.hypot(p.x - x, p.y - y) < raioDe(p) + r * 1.5)) continue;
    if (corpos.some(c => Math.hypot(c.x - x, c.y - y) < c.r + r)) continue;
    const a = Math.random() * Math.PI * 2, v = (0.05 + Math.random() * 0.08) / zoom;
    return { k: k, v: Math.floor(Math.random() * 3), x: x, y: y, r: r,
             vx: Math.cos(a) * v, vy: Math.sin(a) * v, quadro: Math.floor(Math.random() * 999),
             mola: 0, molaV: 0, aviso: 0, comedor: null, t: 0, nasce: 0 };
  }
  return null;
}

function passoCorpos(L) {
  // o degrau entra quando alguém já está chegando perto de poder comê-lo
  let maior = 0;
  for (const p of todos()) maior = Math.max(maior, p.nivel + (p.inchado > 0 ? CFG.JUPITER_NIVEIS : 0));
  CFG.CORPOS.forEach((def, k) => {
    if (maior < def.nivel - CFG.CORPO_ANTES) return;
    const alvo = def.quantos;
    let tem = 0;
    for (const c of corpos) if (c.k === k) tem++;
    if (tem < alvo && --esperaCorpo[k] <= 0) {
      const c = novoCorpo(k);
      if (c) corpos.push(c);
      // entre um e outro do mesmo degrau, uma pausa: não chegam em penca
      esperaCorpo[k] = c ? Math.round(def.renasce * 0.25) : 30;
    }
  });

  for (let i = corpos.length - 1; i >= 0; i--) {
    const c = corpos[i];
    c.quadro++;
    c.molaV = (c.molaV - c.mola * 0.18) * 0.86; c.mola += c.molaV;
    if (c.aviso > 0) c.aviso--;
    if (c.nasce < CFG.CORPO_NASCE) c.nasce++;
    c.r = raioCorpo(c.k);

    if (c.comedor) {
      // caindo para dentro: gira em volta do centro de quem comeu e encolhe
      const g = c.comedor;
      c.t++;
      if (c.k >= 1 && c.t % 5 === 1 && (g === buraco || naTela(c.x, c.y, 20)))
        soltarCoracoes(c.x, c.y, 1, 0.7, 0);
      const dx = c.x - g.x, dy = c.y - g.y, ang = 0.3 + c.t * 0.02;
      const co = Math.cos(ang), si = Math.sin(ang), enc = 0.84;
      c.x = g.x + (dx * co - dy * si) * enc;
      c.y = g.y + (dx * si + dy * co) * enc;
      if (c.t >= CFG.CORPO_ENGOLIR || g.engolido > 0) {
        if (!(g.engolido > 0)) premiarCorpo(c, g);
        corpos.splice(i, 1);
        esperaCorpo[c.k] = CFG.CORPOS[c.k].renasce;
      }
      continue;
    }

    c.x += c.vx; c.y += c.vy;
    if (c.x < L.x0 + c.r) { c.x = L.x0 + c.r; c.vx = Math.abs(c.vx); }
    if (c.x > L.x1 - c.r) { c.x = L.x1 - c.r; c.vx = -Math.abs(c.vx); }
    if (c.y < L.y0 + c.r) { c.y = L.y0 + c.r; c.vy = Math.abs(c.vy); }
    if (c.y > L.y1 - c.r) { c.y = L.y1 - c.r; c.vy = -Math.abs(c.vy); }

    for (const p of todos()) {
      if (p.engolido > 0) continue;
      const pr = raioDe(p);
      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
      if (cabe(p, c)) {
        if (d < pr - c.r * 0.35) {               // entrou: agora é dele
          c.comedor = p; c.t = 0; p.boca = Math.max(p.boca, 16);
          comecarCorpo(c, p);
          break;
        }
        // perto: puxado de leve, mais devagar que estrela — tem massa
        const alc = pr * CFG.ALCANCE_SUCCAO;
        if (d < alc) {
          const f = 0.03 * (1 - d / alc) * (1 + (p === buraco ? espiral : p.espiral || 0)) / zoom;
          c.vx -= dx / d * f; c.vy -= dy / d * f;
        }
      } else if (d < pr + c.r * 0.9) {
        // grande demais: ele quica no corpo, e o corpo balança
        const nx = dx / d, ny = dy / d, fura = pr + c.r * 0.9 - d;
        p.x -= nx * fura; p.y -= ny * fura;
        const vn = p.vx * nx + p.vy * ny;
        if (vn > 0) { p.vx -= 1.45 * vn * nx; p.vy -= 1.45 * vn * ny; }
        c.vx += nx * Math.max(0, vn) * 0.12; c.vy += ny * Math.max(0, vn) * 0.12;
        c.molaV += 0.18;
        if (p === buraco) {
          if (c.aviso < 30 && podeTocar("boing", 260)) { SFX.boing(); vibrar(12); bater(buraco, 0.14); }
          c.aviso = 70;
        }
      }
    }
    const v = Math.hypot(c.vx, c.vy), vm = 0.9 / zoom;
    if (v > vm) { c.vx = c.vx / v * vm; c.vy = c.vy / v * vm; }
    c.vx *= 0.993; c.vy *= 0.993;
    // nunca fica parado de vez: um corpo boiando é o que dá vida ao campo
    if (v < 0.03 / zoom) { const a = c.quadro * 0.01 + c.k; c.vx += Math.cos(a) * 0.002 / zoom; c.vy += Math.sin(a) * 0.002 / zoom; }
  }
}

/* engoliu um corpo: estrelas, combo, festa proporcional ao tamanho */
function premiarCorpo(c, g) {
  const def = CFG.CORPOS[c.k];
  if (g === buraco) partida.corpos[c.k]++;
  ganharEstrelas(g, def.valor);
  contarCombo(g);
  g.pulso = 1; g.fervor = 1; g.boca = 0;
  bater(g, 0.22 + c.k * 0.06);
  const perto = g === buraco || naTela(g.x, g.y, 30);
  if (perto) {
    const cores = c.k === 3 ? PAL_CORPO.sol : c.k === 0 ? PAL_CORPO.asteroide : (c.k === 1 ? PAL_CORPO.lua[0] : PAL_CORPO.planeta[c.v % 3][0]);
    for (let n = 0; n < 10 + c.k * 8; n++) {
      const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.2) / zoom;
      const vida = 14 + Math.floor(Math.random() * 16);
      faiscas.push({ curva: (Math.random() - 0.5) * 0.12, x: g.x, y: g.y,
                     vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: vida, total: vida,
                     arrasto: 0.93, tipo: "brilho", cor: cores[1 + Math.floor(Math.random() * 3)] });
    }
    aneis.push({ x: g.x, y: g.y, r: raioDe(g) * 0.7, vida: 18, total: 18,
                 rival: g !== buraco, pal: g !== buraco ? paletaDe(g).disco : null });
    festaCorpo(c, g);
  }
  if (g === buraco) {
    SFX.crunch(c.k);
    vibrar(12 + c.k * 14);
    tremor = Math.max(tremor, 3 + c.k * 5);
  } else if (perto) SFX.crunch(c.k);
}

/* `a` engole `b`? Precisa ser bem maior, e `b` não pode estar de escudo,
   recém-cuspido ou já sendo engolido por outro. */
/* SUPER SIZE vale para comer: Júpiter empresta só um nível (~15% de raio),
   menos que ENGOLIR_RAZAO, então pela conta do raio o inchado nunca comia
   quem tinha o mesmo tamanho dele — esbarrava, e ainda perdia a trombada
   se tivesse menos estrelas. Agora, inchado de verdade (depois da tomada de
   fôlego), ele come qualquer um do seu tamanho real ou menor, mesmo de
   barriga cheia: são 7 s para sair caçando. */
const superDe = p => p.inchado > 0 && !(p.inchaPrep > 0);
function podeEngolir(a, b) {
  if (b.imune > 0 || b.cuspido > 0 || b.engolido > 0 || a.engolido > 0) return false;
  if (superDe(a) && b.nivel <= a.nivel && !(superDe(b) && b.nivel >= a.nivel)) return true;
  return !(a.digerindo > 0) && raioDe(a) >= raioDe(b) * CFG.ENGOLIR_RAZAO;
}

function engolirRival(g, v) {
  const perda = Math.min(v.comidas, Math.max(CFG.ENGOLIR_MIN, Math.round(v.comidas * CFG.ENGOLIR_FRACAO)));
  perderEstrelas(v, perda, "engolido");
  const lider = todos().every(o => o === g || o.comidas <= g.comidas);
  v.premio = Math.round(perda * (lider ? CFG.ENGOLIR_LEVA_LIDER : CFG.ENGOLIR_LEVA));
  g.digerindo = CFG.DIGESTAO + CFG.ENGOLIR_ANIM;
  v.comedor = g;
  v.engolido = CFG.ENGOLIR_ANIM;
  v.surpresa = CFG.ENGOLIR_ANIM + 10;
  v.vx = v.vy = 0;
  v.atordoado = 0;
  g.boca = CFG.ENGOLIR_ANIM;                     // boca aberta enquanto puxa
  if (v === buraco) { tremor = Math.max(tremor, 14); flashDano = CFG.DANO_FLASH; vibrar([30, 40, 60]); }
  if (g === buraco) vibrar(25);
  if (g === buraco || v === buraco) { SFX.sugar(); comecarDrama(g, v); }
}

/* a vítima espirala para dentro de quem comeu enquanto encolhe; no fim o
   comedor fecha a boca ("nhac"), engorda, e a vítima é cuspida longe */
function passoEngolidos() {
  for (const p of todos()) {
    if (p.cuspido > 0) p.cuspido--;
    if (p.digerindo > 0) p.digerindo--;
    if (!(p.engolido > 0)) continue;
    const g = p.comedor;
    if (g) {
      const t = 1 - p.engolido / CFG.ENGOLIR_ANIM;
      const dx = p.x - g.x, dy = p.y - g.y;
      const ang = 0.35 + t * 0.25;                 // gira cada vez mais rápido
      const co = Math.cos(ang), si = Math.sin(ang);
      const enc = 0.86 - t * 0.2;                  // e cai para o centro
      p.x = g.x + (dx * co - dy * si) * enc;
      p.y = g.y + (dx * si + dy * co) * enc;
    }
    if (--p.engolido > 0) continue;
    if (g) {
      ganharEstrelas(g, p.premio || 0);
      if (g === buraco) partida.rivais++;
      contarCombo(g);
      g.pulso = 1; g.boca = 0; bater(g, 0.42);
      g.fervor = 1;
      const perto = g === buraco || p === buraco || naTela(g.x, g.y, 30);
      if (perto) {
        aneis.push({ x: g.x, y: g.y, r: raioDe(g), vida: 24, total: 24,
                     rival: g !== buraco, pal: g !== buraco ? paletaDe(g).disco : null });
        faiscar(g.x, g.y, 26, 2, 8);
      }
      if (g === buraco) {
        SFX.nhac(); tremor = Math.max(tremor, 18); aberr = Math.max(aberr, 14);
        soltarCoracoes(g.x, g.y, 14, 1.6, 1);
        vibrar([20, 30, 50]);
      } else if (perto) SFX.nhac();
      if (g === buraco || p === buraco) nhacDrama(g, p);
    }
    cuspir(p, g);
  }
}

/* cuspido: reaparece longe de quem comeu, parado, tonto e protegido */
function cuspir(p, g) {
  const L = limites();
  let melhor = null, md = -1;
  for (let k = 0; k < 14; k++) {
    const x = L.x0 + 30 + Math.random() * (L.l - 60), y = L.y0 + 30 + Math.random() * (L.a - 60);
    let d = g ? Math.hypot(x - g.x, y - g.y) : 1e9;
    for (const o of todos()) if (o !== p) d = Math.min(d, Math.hypot(x - o.x, y - o.y) * 1.6);
    if (d > md) { md = d; melhor = { x: x, y: y }; }
  }
  // sem candidato válido (engolida herdada da rede sem saber quem comeu, ou
  // arena ainda sem medida) ele reaparece onde está: melhor que quebrar
  if (melhor && isFinite(melhor.x) && isFinite(melhor.y)) { p.x = melhor.x; p.y = melhor.y; }
  p.vx = p.vy = 0;
  p.cuspido = CFG.CUSPIDO; p.comedor = null; p.premio = 0;
  p.surpresa = 0; p.tonto = CFG.ARFA * 3;
  p.pulso = 1; bater(p, -0.4);
  if (p !== buraco) { p.alvo = null; p.perseguindo = 0; }
  if (p === buraco) {
    // a câmera vai junto na hora: deslizar a arena inteira daria enjoo
    cam.x = buraco.x - visaoL() / 2; cam.y = buraco.y - visaoA() / 2;
  }
  if (p === buraco || naTela(p.x, p.y, 30)) {
    aneis.push({ x: p.x, y: p.y, r: 3, vida: 20, total: 20, rival: p !== buraco,
                 pal: p !== buraco ? paletaDe(p).disco : null });
    faiscar(p.x, p.y, 14, 2, 8);
  }
}

/* ── o drama da engolida ──────────────────────────────────────
   Uma engolida que envolve VOCÊ é o momento mais forte do jogo e tem que
   parecer: câmera lenta enquanto a vítima espirala, tarjas de cinema e
   linhas de mangá apontando para quem come, a câmera chegando perto aos
   poucos (antecipação) e, no "nhac", um congelamento curtinho seguido do
   estouro — tranco na câmera, clarão na cor de quem comeu, ondas e chuva de
   brilhos (exagero e ação secundária). */
const tempoDrama = () => !REDE.ativa && cena === "jogo";
const corDe = p => (p === buraco ? paletaSkin() : paletaDe(p)).disco;
function lento(ms, forca) {
  if (!tempoDrama()) return;
  const agora = performance.now();
  lentoForca = lentoAte > agora ? Math.min(lentoForca, forca) : forca;
  lentoAte = Math.max(lentoAte, agora + ms);
}
function congelar(ms) {
  if (tempoDrama()) pausaAte = Math.max(pausaAte, performance.now() + ms);
}
function clarear(cor, quadros) {
  flashCorCor = cor; flashCor = flashCorTotal = quadros;
}
/* g pode faltar (convidado sendo engolido: o retrato não diz por quem) */
function comecarDrama(g, v) {
  const alvo = g || v;
  // vítima miudinha: zoom e câmera lenta mínimos; do seu tamanho: máximos
  // (sem g — convidado do online — não dá para saber, vale o máximo)
  let peso = 1;
  if (g) {
    peso = (raioDe(v) / raioDe(g) - CFG.DRAMA_MIUDO) / (CFG.DRAMA_PARECIDO - CFG.DRAMA_MIUDO);
    peso = Math.max(0, Math.min(1, peso));
    peso = peso * peso * (3 - 2 * peso);
  }
  const forca = CFG.DRAMA_LENTO_MIUDO + (CFG.DRAMA_LENTO - CFG.DRAMA_LENTO_MIUDO) * peso;
  drama = { g: g, v: v, t: 0, soco: CFG.DRAMA_SOCO_MIUDO + (1 - CFG.DRAMA_SOCO_MIUDO) * peso };
  socoX = alvo.x; socoY = alvo.y;
  faixasAlvo = 1;
  foco = { x: alvo.x, y: alvo.y, vida: CFG.ENGOLIR_ANIM + 30, total: CFG.ENGOLIR_ANIM + 30,
           cor: corDe(alvo)[1], fixo: alvo };
  lento(CFG.ENGOLIR_ANIM * 1000 / 60 / forca, forca);
  // antecipação: a câmera recua um tiquinho antes de começar a chegar perto
  socoV -= 0.03;
}
function passoDrama() {
  socoV = (socoV + (socoAlvo - soco) * 0.14) * 0.8;
  soco += socoV;
  faixas += (faixasAlvo - faixas) * 0.16;
  if (flashCor > 0) flashCor--;
  if (foco) {
    if (foco.fixo) { foco.x = foco.fixo.x; foco.y = foco.fixo.y; }
    if (--foco.vida <= 0) foco = null;
  }
  for (let i = almas.length - 1; i >= 0; i--) {
    const a = almas[i];
    a.y -= a.sobe; a.sobe *= 0.992;
    a.x += Math.sin(a.fase + a.t * 0.08) * 0.25 / zoom;
    if (++a.t >= a.total) almas.splice(i, 1);
  }
  if (!drama) return;
  const d = drama, g = d.g, v = d.v;
  d.t++;
  if (!(v.engolido > 0) || d.t > CFG.ENGOLIR_ANIM + 6) {
    drama = null; faixasAlvo = 0; socoAlvo = 0;
    return;
  }
  const k = d.t / CFG.ENGOLIR_ANIM;
  const alvo = g || v;
  socoX = alvo.x; socoY = alvo.y;
  socoAlvo = CFG.DRAMA_SOCO * 0.7 * Math.min(1, k * 1.3) * d.soco;
  // a vítima vai se desfazendo num fio de brilhos que entra na boca
  if (g) {
    const cores = corDe(v);
    for (let n = 0; n < 2; n++) {
      const a = Math.random() * Math.PI * 2, rr = raioDe(v) * (0.6 + Math.random() * 0.6);
      const x = v.x + Math.cos(a) * rr, y = v.y + Math.sin(a) * rr;
      const dx = g.x - x, dy = g.y - y, dd = Math.hypot(dx, dy) || 1;
      const vel = Math.min(dd / 10, 2.4 / zoom);
      faiscas.push({ curva: 0.12, x: x, y: y, vx: dx / dd * vel, vy: dy / dd * vel,
                     vida: 10, total: 10, arrasto: 1, tipo: "brilho",
                     cor: cores[1 + Math.floor(Math.random() * 4)] });
    }
  }
}
/* o "nhac" de uma engolida de rival que envolve você */
function nhacDrama(g, v) {
  congelar(CFG.DRAMA_PAUSA);
  lentoAte = 0;
  socoX = g.x; socoY = g.y;
  socoV += 0.09; socoAlvo = 0;
  faixasAlvo = 0;
  tremor = Math.max(tremor, 26); aberr = Math.max(aberr, 18);
  clarear(corDe(g)[3], 16);
  const r = raioDe(g), pal = corDe(v);
  for (let k = 0; k < 3; k++)
    aneis.push({ x: g.x, y: g.y, r: r * (0.8 + k * 0.45), vida: 18 + k * 8, total: 18 + k * 8,
                 rival: true, pal: k === 1 ? corDe(g) : pal });
  for (let n = 0; n < 34; n++) {
    const a = Math.random() * Math.PI * 2, vel = (1.2 + Math.random() * 2.2) / zoom;
    const vida = 16 + Math.floor(Math.random() * 18);
    faiscas.push({ curva: (Math.random() - 0.5) * 0.16, x: g.x + Math.cos(a) * r, y: g.y + Math.sin(a) * r,
                   vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, vida: vida, total: vida,
                   arrasto: 0.9, tipo: Math.random() < 0.4 ? "raio" : "brilho",
                   cor: (Math.random() < 0.5 ? pal : corDe(g))[1 + Math.floor(Math.random() * 4)] });
  }
  foco = { x: g.x, y: g.y, vida: 26, total: 26, cor: corDe(g)[1], fixo: g };
}

/* Engolir lua, planeta ou sol: cada um com a sua festa, crescendo com o
   degrau. Eles vão felizes — em vez de grito, sobe uma alminha sorrindo. */
const COR_CORPO = k => k === 3 ? PAL_CORPO.sol : k === 0 ? PAL_CORPO.asteroide
  : k === 1 ? PAL_CORPO.lua[0] : null;
function coresDoCorpo(c) {
  return COR_CORPO(c.k) || PAL_CORPO.planeta[c.v % 3][0];
}
/* começou a cair para dentro de VOCÊ. Pedido do usuário: corpo celeste não
   ganha o drama de engolir rival (câmera lenta, tarjas, linhas, aproximação)
   — fica só a festa no fim */
function comecarCorpo(c, g) {}
function festaCorpo(c, g) {
  const cores = coresDoCorpo(c), r = raioDe(g), eu = g === buraco;
  // a alminha: o corpo, miudinho e sorrindo, sobe e vai embora em paz
  almas.push({ x: g.x, y: g.y - r * 0.4, sobe: (0.35 + c.k * 0.06) / zoom, t: 0,
               total: 80 + c.k * 10, fase: Math.random() * 6, k: c.k, cor: cores });
  soltarCoracoes(g.x, g.y, 4 + c.k * 4, 1.2 + c.k * 0.3, c.k >= 2 ? 1 : 0);
  for (let k = 0; k < c.k; k++)
    aneis.push({ x: g.x, y: g.y, r: r * (0.9 + k * 0.5), vida: 20 + k * 8, total: 20 + k * 8,
                 rival: true, pal: [cores[0], cores[0], cores[0], cores[3], cores[0], cores[2]] });
  if (c.k === 3) {
    // o sol: raios dourados em leque, de dentro para fora
    for (let n = 0; n < 40; n++) {
      const a = (n / 40) * Math.PI * 2, vel = (1.6 + Math.random() * 1.6) / zoom;
      faiscas.push({ curva: 0, x: g.x + Math.cos(a) * r * 0.6, y: g.y + Math.sin(a) * r * 0.6,
                     vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, vida: 22 + (n % 3) * 6,
                     arrasto: 0.94, tipo: "raio", cor: cores[1 + (n % 4)] });
    }
  }
  if (!eu || c.k < 1) return;
  clarear(cores[c.k === 3 ? 2 : 1], 6 + c.k * 3);
}

/* a aproximação da câmera: copia a tela e redesenha ampliada em volta de
   quem está no centro do drama. Só desenho — `zoom` não muda */
const bufSoco = document.createElement("canvas");
function aplicarSoco() {
  const s = Math.max(0, soco);
  if (s < 0.004) return;
  if (bufSoco.width !== VL || bufSoco.height !== VA) { bufSoco.width = VL; bufSoco.height = VA; }
  const g = bufSoco.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, VL, VA); g.drawImage(tela, 0, 0);
  const f = 1 + s;
  const ox = limitar(paraTelaX(socoX), 0, VL), oy = limitar(paraTelaY(socoY), 0, VA);
  ctx.drawImage(bufSoco, Math.round(ox - ox * f), Math.round(oy - oy * f),
                Math.round(VL * f), Math.round(VA * f));
}
/* tarjas, linhas de foco e clarão: por cima do mundo, por baixo do HUD */
function desenharDrama() {
  if (flashCor > 0) {
    const p = flashCor / flashCorTotal;
    ctx.globalAlpha = p * p * 0.55 * forcaFlash();
    ctx.fillStyle = flashCorCor; ctx.fillRect(0, 0, VL, VA);
    ctx.globalAlpha = 1;
  }
  if (foco) {
    const p = foco.vida / foco.total;
    // entra rápido e sai devagar
    const a = Math.min(1, (1 - p) * 6) * Math.min(1, p * 2.2);
    linhasDeFoco(paraTelaX(foco.x), paraTelaY(foco.y), a, foco.cor);
  }
  if (faixas > 0.01) {
    const h = Math.round(VA * CFG.DRAMA_FAIXA * faixas);
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, VL, h); ctx.fillRect(0, VA - h, VL, h);
    // no fundo preto a tarja some: o fio na beirada é o que a desenha
    ctx.globalAlpha = Math.min(1, faixas * 1.4) * 0.8;
    ctx.fillStyle = foco ? foco.cor : COR.hud;
    ctx.fillRect(0, h, VL, 1); ctx.fillRect(0, VA - h - 1, VL, 1);
    ctx.globalAlpha = 1;
  }
}
/* linhas de mangá: riscos que afinam na direção do centro, sorteados de
   novo a cada 3 quadros para a tela "vibrar" */
function linhasDeFoco(cx, cy, forca, cor) {
  if (forca <= 0.02) return;
  const R = Math.hypot(VL, VA) * 0.75, n = 30;
  const sem = Math.floor(quadro / 3);
  const h = i => { const v = Math.sin(i * 127.1 + sem * 311.7) * 43758.5453; return v - Math.floor(v); };
  ctx.fillStyle = cor;
  for (let i = 0; i < n; i++) {
    const ang = (i + h(i) * 0.8) / n * Math.PI * 2;
    const co = Math.cos(ang), si = Math.sin(ang);
    const ri = Math.min(VL, VA) * (0.3 + 0.22 * h(i + 50)) * (1.25 - forca * 0.25);
    ctx.globalAlpha = forca * (0.35 + 0.35 * h(i + 99));
    for (let d = ri; d < R; d += 1.5) {
      const w = 1 + Math.floor((d - ri) / (R - ri) * 3);
      ctx.fillRect(Math.round(cx + co * d), Math.round(cy + si * d), w, w);
    }
  }
  ctx.globalAlpha = 1;
}
/* a alminha do corpo engolido: bolinha na cor dele, olhos "^ ^", sorriso e
   uma aureolazinha — subindo bamboleando e se apagando */
function desenharAlmas() {
  for (const a of almas) {
    const t = a.t / a.total;
    const x = paraTelaX(a.x), y = paraTelaY(a.y);
    const r = 4 + a.k;
    const s = t < 0.15 ? t / 0.15 : 1;            // nasce crescendo
    ctx.globalAlpha = t < 0.6 ? 0.95 : 0.95 * (1 - t) / 0.4;
    oval(x, y, r * s, r * s * (1 + 0.06 * Math.sin(a.t * 0.2)), a.cor[1]);
    oval(x - r * 0.3, y - r * 0.35, r * 0.3 * s, r * 0.25 * s, a.cor[0]);
    if (s >= 1) {
      carimbo(OLHOS_GORDO[0], x - r * 0.42, y - 0.5, ROSTO_CORPO);
      carimbo(OLHOS_GORDO[0], x + r * 0.42, y - 0.5, ROSTO_CORPO);
      px(x - 1, y + r * 0.45, ROSTO_CORPO); px(x, y + r * 0.45 + 1, ROSTO_CORPO);
      px(x + 1, y + r * 0.45, ROSTO_CORPO);
      ctx.globalAlpha *= 0.6;
      px(x - r * 0.75, y + 1, BLUSH_CORPO); px(x + r * 0.75, y + 1, BLUSH_CORPO);
      ctx.globalAlpha = t < 0.6 ? 0.95 : 0.95 * (1 - t) / 0.4;
      // auréola: oval vazada acima da cabeça
      const ay = y - r - 3, ar = r * 0.8;
      for (let i = 0; i < 16; i++) {
        const an = i / 16 * Math.PI * 2;
        px(x + Math.cos(an) * ar, ay + Math.sin(an) * ar * 0.3, "#ffe98a");
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* Encostou: os dois voam para lados opostos, a tela sacode forte, as cores
   se separam, e quem tem menos estrelas larga um punhado delas no campo. */
function trombada(a, b, ux, uy) {
  esperaColisao = CFG.COLISAO_ESPERA;
  const emp = CFG.COLISAO_EMPURRAO / zoom;
  /* inchado contra quem não está: o grandão mal se mexe, não fica zonzo e
     ganha o encontrão — o outro voa mais longe */
  const sa = superDe(a), sb = superDe(b), umSuper = sa !== sb;
  const ea = umSuper ? (sa ? 0.35 : 1.5) : 1, eb = umSuper ? (sb ? 0.35 : 1.5) : 1;
  a.vx = -ux * emp * ea; a.vy = -uy * emp * ea;
  b.vx =  ux * emp * eb; b.vy =  uy * emp * eb;
  for (const p of [a, b]) {
    // quem está com escudo é empurrado, mas não fica zonzo nem perde estrela:
    // "invencível" tem que valer também para o avanço do outro
    p.atordoado = p.imune > 0 || (umSuper && superDe(p)) ? 0 : CFG.COLISAO_ATORDOA;
    if (p.imune > 0) escudou(p, p.x, p.y);
    p.pulso = 1;
    bater(p, 0.48);                       // pancada: achatada forte
    p.surpresa = CFG.COLISAO_SURPRESA;
    if (p !== buraco) { p.alvo = null; p.perseguindo = 0; }  // reavalia depois do tranco
  }

  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const meu = a === buraco || b === buraco;
  if (meu) SFX.trombada();
  // só sacode a tela na trombada que envolve você; entre rivais, um estalo
  if (meu) {
    tremor = CFG.COLISAO_TREMOR;
    aberr = CFG.COLISAO_ABERR;
    flashLado = 30;
  } else if (naTela(mx, my, 20)) {
    tremor = Math.max(tremor, 10);
  }
  faiscar(mx, my, meu ? 34 : 18, 2, 8);
  aneis.push({ x: mx, y: my, r: 4, vida: 22, total: 22, rival: !meu });

  const perdedor = umSuper ? (sa ? b : a) : a.comidas <= b.comidas ? a : b;
  if (perdedor.imune > 0) return;               // escudo segura a conta também
  const quantas = Math.min(CFG.COLISAO_ESTRELAS, perdedor.comidas);
  if (quantas <= 0) return;
  perderEstrelas(perdedor, quantas, "trombada");
  /* NO BRAWL A ESTRELA TROCA DE DONO. Fora dele a trombada joga as estrelas
     do perdedor no chão, e quem quiser que vá catar — parte da graça é a
     correria depois da pancada. No brawl o chão está congelado: cair ali
     seria sumir com elas, e a pancada não renderia nada a ninguém. Como o
     modo inteiro é "só se ganha tirando do outro", elas vão direto para quem
     ganhou o encontrão, pelo mesmo fio que o dreno de Júpiter usa. */
  if (brawl > 0) {
    // o ponto entra quando a estrela CHEGA, dentro de passoRoubadas: somar
    // aqui também contaria cada uma duas vezes
    const ganhador = perdedor === a ? b : a;
    for (let k = 0; k < quantas; k++) estrelaViajando(perdedor, ganhador);
  } else {
    for (let k = 0; k < quantas; k++) estrelas.push(estrelaSolta(perdedor, k, quantas));
  }
}

/* uma estrela saindo de um e indo para o outro pelo ar. É o mesmo bicho que
   o dreno de Júpiter cria; aqui ele nasce da trombada */
function estrelaViajando(de, para) {
  const rr = raioDe(de);
  const a = Math.random() * Math.PI * 2;
  roubadas.push({
    x0: de.x + Math.cos(a) * rr * 0.8, y0: de.y + Math.sin(a) * rr * 0.8,
    para: para, x: 0, y: 0, t: 0, giro: Math.random() * Math.PI, rastro: [],
    curva: (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.3),
    passo: 1 / (22 + Math.floor(Math.random() * 10))
  });
}

/* as estrelas perdidas voltam para o campo, espalhadas em volta do perdedor */
function estrelaSolta(de, k, total) {
  const L = limites();
  const e = novaEstrela(null);
  const a = (k / total) * Math.PI * 2 + Math.random() * 0.5;
  // caem além do alcance de sucção dele: senão o perdedor reabsorve na hora
  const raio = raioDe(de) * CFG.ALCANCE_SUCCAO * (1.1 + Math.random() * 0.55);
  e.x = limitar(de.x + Math.cos(a) * raio, L.x0 + 4, L.x1 - 4);
  e.y = limitar(de.y + Math.sin(a) * raio, L.y0 + 4, L.y1 - 4);
  const v = (0.5 + Math.random() * 1.1) / zoom;
  e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
  e.presa = false;
  return e;
}

/* Uma estrela cadente atravessa o mapa de tempos em tempos. Quem encostar
   nela leva um punhado de estrelas de uma vez. */
/* O sentido é sorteado, mas o caminho passa perto de quem está jogando:
   ela nasce numa ponta do mapa, cruza o cenário à vista e sai pela outra.
   Sorteando só um ponto de partida, ela costumava riscar um canto vazio. */
function novaCadente() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  // ponto de travessia: perto do jogador, com uma folga para não ser sempre igual
  const px0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.55, L.x0 + 6, L.x1 - 6);
  const py0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.55, L.y0 + 6, L.y1 - 6);
  // recua desse ponto, no sentido contrário, até encostar na borda do mapa
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (px0 - L.x0) / ca : (L.x1 - px0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (py0 - L.y0) / sa : (L.y1 - py0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.CADENTE_VEL / zoom;
  return { x: px0 - ca * t, y: py0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 1800, rastro: [] };
}

function passoCadente(L) {
  if (!cadente) {
    if (--esperaCadente <= 0) { cadente = novaCadente(); esperaCadente = CFG.CADENTE_INTERVALO; }
    return;
  }
  cadente.rastro.unshift({ x: cadente.x, y: cadente.y });
  if (cadente.rastro.length > 14) cadente.rastro.pop();
  cadente.x += cadente.vx; cadente.y += cadente.vy;
  cadente.vida--;

  const rc = CFG.CADENTE_RAIO / zoom;
  for (const p of todos()) {
    const rp = raioDe(p);
    if (Math.hypot(cadente.x - p.x, cadente.y - p.y) < rp + rc) {
      faiscar(cadente.x, cadente.y, 30, 3, 8);
      for (let k = 0; k < 26; k++) {
        const a = Math.random() * Math.PI * 2, v = (0.7 + Math.random()) / zoom;
        faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: cadente.x, y: cadente.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                       vida: 18 + Math.floor(Math.random() * 14), arrasto: 0.97, tipo: "raio",
                       cor: COR.cadente[Math.floor(Math.random() * COR.cadente.length)] });
      }
      p.pulso = 1; p.boca = 22;
      if (p === buraco) { tremor = 16; aberr = CFG.ABERRACAO; soltarCoracoes(p.x, p.y, 18, 1.8, 1); }
      if (p === buraco) { anunciar("+" + CFG.CADENTE_PREMIO + "!", COR.cadente[2]); SFX.cadente(); }
      ganharEstrelas(p, CFG.CADENTE_PREMIO);
      cadente = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cadente.vida <= 0 ||
      cadente.x < L.x0 - fora || cadente.x > L.x1 + fora ||
      cadente.y < L.y0 - fora || cadente.y > L.y1 + fora) cadente = null;
}

/* O cometa usa a mesma travessia da estrela cadente — nasce numa ponta do
   mapa e cruza o cenário à vista — mas ele é o perigo: quem encostar fica
   congelado e anda mais devagar por um tempo. Vem mais devagar de propósito,
   para dar tempo de ler a trajetória e desviar. */
function novaCometa() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  const cx0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.5, L.x0 + 6, L.x1 - 6);
  const cy0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.5, L.y0 + 6, L.y1 - 6);
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (cx0 - L.x0) / ca : (L.x1 - cx0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (cy0 - L.y0) / sa : (L.y1 - cy0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.COMETA_VEL / zoom;
  return { x: cx0 - ca * t, y: cy0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 2400, rastro: [] };
}

/* ── o cometa arco-íris ───────────────────────────────────────
   Mesma construção do cometa azul — nasce fora do mapa e atravessa —, com
   duas diferenças de propósito: ele espalha MUITO mais o ponto de travessia
   (o cometa azul mira quase em você; este passa por onde calhar) e é mais
   lento, para dar tempo de ir atrás quando aparece na tela. Um jogador que o
   vê pode correr para tocá-lo; quem não viu, não perde nada que fosse seu. */
function novoArcoIris() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  const esp = CFG.ARCOIRIS_ESPALHA;
  const x0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * esp, L.x0 + 8, L.x1 - 8);
  const y0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * esp, L.y0 + 8, L.y1 - 8);
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (x0 - L.x0) / ca : (L.x1 - x0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (y0 - L.y0) / sa : (L.y1 - y0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.ARCOIRIS_VEL / zoom;
  /* O caminho é um ARCO: a direção gira um pouquinho por quadro. Para ele
     ainda cruzar perto do ponto sorteado, sai torto pela metade do giro que
     vai fazer até lá — a corda do arco aponta para o alvo. */
  const curva = (Math.random() < 0.5 ? -1 : 1) * CFG.ARCOIRIS_CURVA;
  const ang = a - curva * (t / v) / 2;
  return { x: x0 - ca * t, y: y0 - sa * t, vx: Math.cos(ang) * v * 0.3, vy: Math.sin(ang) * v * 0.3,
           ang: ang, curva: curva, idade: 0, vida: 3600, rastro: [] };
}

function passoArcoIris(L) {
  if (!arcoiris) {
    // uma passagem por partida: depois que ele some, não volta
    if (arcoirisPassou || --esperaArcoIris > 0) return;
    arcoiris = novoArcoIris(); arcoirisPassou = true;
    return;
  }
  arcoiris.rastro.unshift({ x: arcoiris.x, y: arcoiris.y });
  if (arcoiris.rastro.length > CFG.ARCOIRIS_RABO) arcoiris.rastro.pop();
  // entra devagar e embala (slow in), e vai fazendo a curva
  const c = arcoiris;
  c.idade++; c.ang += c.curva;
  const e = 1 - Math.pow(1 - Math.min(1, c.idade / CFG.ARCOIRIS_ARRANQUE), 3);
  const v = CFG.ARCOIRIS_VEL / zoom * (0.3 + 0.7 * e);
  c.vx = Math.cos(c.ang) * v; c.vy = Math.sin(c.ang) * v;
  arcoiris.x += arcoiris.vx; arcoiris.y += arcoiris.vy;
  arcoiris.vida--;

  const rc = CFG.ARCOIRIS_RAIO / zoom;
  for (const p of todos()) {
    if (Math.hypot(arcoiris.x - p.x, arcoiris.y - p.y) < raioDe(p) + rc) {
      abrirBrawl(p);
      return;
    }
  }
  const fora = 60 / zoom;
  if (arcoiris.vida <= 0 ||
      arcoiris.x < L.x0 - fora || arcoiris.x > L.x1 + fora ||
      arcoiris.y < L.y0 - fora || arcoiris.y > L.y1 + fora) arcoiris = null;
}

/* Estourou o cometa: as estrelas do campo param onde estão e por 15 segundos
   a única moeda é o que se tira do outro. O escudo de Netuno NÃO defende
   disso — o brawl não é um golpe contra quem encostou, é uma regra nova para
   todo mundo ao mesmo tempo. */
function abrirBrawl(quem) {
  arcoiris = null;
  brawl = CFG.BRAWL; brawlDono = quem;
  anunciar("BRAWL!", COR.arcoiris[0], true);
  SFX.brawl();
  tremor = 20; flash = CFG.ARCO; aberr = CFG.ABERRACAO; arco = CFG.ARCO;
  // as estrelas soltam de quem as estava puxando e ficam boiando
  for (const e of estrelas) { e.presa = false; e.vx = 0; e.vy = 0; }
  soltarCoracoes(quem.x, quem.y, 26, 2.2, 1);
  quem.pulso = 1; quem.boca = 24;
  for (let k = 0; k < 46; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.8) / zoom;
    faiscas.push({ x: quem.x, y: quem.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 20 + Math.floor(Math.random() * 22), arrasto: 0.94,
                   curva: (Math.random() - 0.5) * 0.08, tipo: "raio",
                   cor: COR.arcoiris[Math.floor(Math.random() * COR.arcoiris.length)] });
  }
}

/* corações entrando pelas laterais da tela enquanto o brawl dura. Nascem
   FORA do quadro e sobem atravessando: é o exagero que diz "isto aqui não é
   a partida de sempre" sem tomar o meio da tela, que é onde se joga. */
function coracaoDaBorda() {
  for (let k = 0; k < CFG.BRAWL_CORACOES; k++) {
    const lado = Math.random() < 0.5 ? -1 : 1;
    const x = cam.x + (lado < 0 ? -4 : VL + 4) / zoom;
    const y = cam.y + (0.15 + Math.random() * 0.9) * VA / zoom;
    const vida = 70 + Math.floor(Math.random() * 50);
    coracoes.push({ x: x, y: y,
                    vx: -lado * (0.35 + Math.random() * 0.8) / zoom,
                    vy: -(0.25 + Math.random() * 0.6) / zoom,
                    vida: vida, total: vida,
                    tam: Math.floor(Math.random() * CORACOES.length),
                    fase: Math.random() * Math.PI * 2 });
  }
}

function passoCometa(L) {
  if (!cometa) {
    if (--esperaCometa <= 0) { cometa = novaCometa(); esperaCometa = CFG.COMETA_INTERVALO; }
    return;
  }
  cometa.rastro.unshift({ x: cometa.x, y: cometa.y });
  if (cometa.rastro.length > CFG.COMETA_RABO) cometa.rastro.pop();
  cometa.x += cometa.vx; cometa.y += cometa.vy;
  cometa.vida--;
  if (quadro % 3 === 0) bafo(cometa.x, cometa.y, 1, 0.5);   // poeira caindo do rabo

  const rc = CFG.COMETA_RAIO / zoom;
  for (const p of todos()) {
    const rp = raioDe(p);
    if (Math.hypot(cometa.x - p.x, cometa.y - p.y) < rp + rc) {
      // com escudo, o cometa se despedaça sem deixar enjoo
      if (!escudou(p, cometa.x, cometa.y)) adoecer(p);
      cometa = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cometa.vida <= 0 ||
      cometa.x < L.x0 - fora || cometa.x > L.x1 + fora ||
      cometa.y < L.y0 - fora || cometa.y > L.y1 + fora) cometa = null;
}

/* Escudo de Netuno batendo: estilhaça o que veio e não deixa passar nada.
   Devolve true quando defendeu, para quem chamou saber que não deve seguir. */
function escudou(p, x, y) {
  if (p.imune <= 0) return false;
  p.pulso = Math.max(p.pulso, 0.7);
  if (p === buraco) {
    flashAzul = Math.max(flashAzul, 16);
    tremor = Math.max(tremor, 6);
  }
  aneis.push({ x: x, y: y, r: 2, vida: 16, total: 16, rival: p !== buraco, pal: p !== buraco ? paletaDe(p).disco : null });
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.1) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 12 + Math.floor(Math.random() * 10), arrasto: 0.94, tipo: "raio",
                   cor: COR.arcoiris[Math.floor(Math.random() * COR.arcoiris.length)] });
  }
  return true;
}

function adoecer(p) {
  if (p === buraco) SFX.cometa();
  bater(p, 0.26);
  p.enjoo = CFG.COMETA_ENJOO;
  // o cometa não só atrasa: derruba estrelas na batida
  const cai = Math.min(CFG.COMETA_ESTRELAS, p.comidas);
  if (cai > 0) {
    perderEstrelas(p, cai);            // sem origem: o aviso sai junto do rótulo
    for (let k = 0; k < cai; k++) estrelas.push(estrelaSolta(p, k, cai));
  }
  p.perdeuNoCometa = cai;
  p.pulso = 1; p.boca = 24;
  bafo(p.x, p.y, 30, 1.6);
  aneis.push({ x: p.x, y: p.y, r: 3, vida: 20, total: 20, rival: p !== buraco,
               pal: p !== buraco ? paletaDe(p).disco : null });
  // a pancada também freia na hora: senão o congelamento demora a ser sentido
  p.vx *= 0.4; p.vy *= 0.4;
  if (p !== buraco) return;
  anunciar("SPEED DOWN", COR.enjoo);
  // o custo entra depois, com o mesmo desenho do "-X" do dreno
  if (p.perdeuNoCometa > 0)
    anunciarDepois("-" + p.perdeuNoCometa, COR.enjoo, CFG.ANUNCIO - 22);
  tremor = 30;                                  // batida: sacode mais
  aberr = CFG.ABERRACAO;
  flashEnjoo = 26;
}

/* bafo do cometa: lascas verdes, claras por fora e fortes no miolo */
function bafo(x, y, quantas, forca) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.3 + Math.random() * 1.2) * forca / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 20 + Math.floor(Math.random() * 20), arrasto: 0.95,
                   tipo: "enjoo", cor: COR.cometa[1 + Math.floor(Math.random() * 3)] });
  }
}

/* Uma amostra a cada meio segundo. Meio segundo é o suficiente para o
   traçado ficar liso na largura que ele tem na tela, e uma partida de três
   minutos guarda só 360 amostras. */
const PASSO_HISTORICO = 30;
/* A coroa muda de cabeça quando alguém passa o líder. Empate NÃO troca: no
   0 a 0 do começo, e a cada vez que dois se igualam, a coroa ficaria pulando
   de um para o outro sem ninguém ter feito nada. */
function verLideranca() {
  let melhor = null;
  for (const p of todos())
    if (p.comidas > 0 && (!melhor || p.comidas > melhor.comidas)) melhor = p;
  if (melhor === primeiro) return;
  if (primeiro && melhor && melhor.comidas === primeiro.comidas) return;
  primeiro = melhor;
