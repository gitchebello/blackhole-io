<title>blackhole.io</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#fdf7fa;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #tela { display:block; width:100vw; height:100vh;
          image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   blackhole.io — protótipo 03
   Nebulosa criadora de estrelas. Engula estrelas para crescer.
   O universo se expande junto com você: quanto maior o buraco,
   mais longe a câmera fica e mais mapa aparece.
   ══════════════════════════════════════════════════════════════ */

/* ── parâmetros (mexa aqui pra ajustar o jogo) ───────────────── */
const CFG = {
  /* estrelas */
  /* Caiu de 30 para 20. É o único parâmetro que alonga a partida de verdade:
     medido, mexer no raio inicial ou no alcance da sucção muda 3 a 6 s, e
     mexer na densidade muda 40 s (57 s → 100 s). Campo mais ralo obriga a
     caçar em vez de aspirar o que já está debaixo do nariz. */
  ESTRELAS: 20,          // estrelas no campo no nível 0 (cresce junto com o mundo)
  DENSIDADE_FIXA: true,  // acompanhar o tamanho do universo ao repor estrelas
  /* TETO do campo. A arena quintuplica de área ao longo da partida e o número
     de estrelas ia junto: por volta de 1min30 o campo tinha quase 100 estrelas
     soltas, bem na hora em que o buraco já está grande, rápido e com o maior
     alcance de sucção — e as últimas 50 estrelas saíam em 5 s, contra 21 s das
     primeiras 50. Com o teto o campo estabiliza em 45 e cada trecho de 50
     passa a custar de 15 a 23 s, do começo ao fim.
     Foi tentado no lugar disso um EXPOENTE na densidade (crescer devagar em
     vez de parar de crescer): achatava igual, mas encompridava também o
     começo da partida — as primeiras 50 iam de 21 s para 39 s. O teto deixa a
     abertura como estava e só corta o excesso do fim. */
  ESTRELAS_TETO: 45,     // teto de estrelas no campo, com um rival
  ESTRELAS_TETO_RIVAL: 8, // e o quanto ele sobe por oponente a mais: quatro
                          // bocas no mesmo campo esvaziavam a arena e a
                          // partida de 3 rivais ia a 127 s

  /* crescimento */
  CUSTO_BASE: 5,         // estrelas para sair do nível 0
  CUSTO_PASSO: 2,        // cada nível custa isso a mais que o anterior
  META: 300,             // quem chegar a 300 estrelas primeiro vence
  NIVEL_MAX: 16,         // teto de TAMANHO, não de vitória: sem isso ele
                         // engoliria a tela. 300 estrelas caem por volta do
                         // nível 15, então o teto quase nunca é encostado
  /* 15 é o MENOR raio que ainda cai no terceiro jogo de sprites de rosto (o
     corte no desenho do rosto é em r < 15). Abaixo disso o personagem perde
     bochecha e boca desenhadas com folga e fica tosco, que foi o problema do
     raio 12. O passo subiu junto para o tamanho final não encolher. */
  RAIO_BASE: 15,         // raio APARENTE (na tela) no nível 0
  RAIO_TELA_PASSO: 1.7,  // quanto o raio aparente cresce por nível

  /* universo em expansão */
  /* A câmera abre PROGRESSIVAMENTE: cada nível revela mais campo que o
     anterior. O zoom sai de 1/(1 + n*PASSO + n²*CURVA), então a LARGURA vista
     cresce como (1 + n*PASSO + n²*CURVA) — o termo quadrático é o que faz
     cada nível render mais que o de antes. Com a fórmula linear antiga, a
     abertura ia diminuindo em campo visto conforme o zoom caía. */
  ZOOM_PASSO: 0.032,     // abertura por nível
  ZOOM_CURVA: 0.006,     // e o quanto essa abertura acelera
  ZOOM_MIN: 0.33,        // afastamento máximo
  ZOOM_ESTOURO: 0.075,   // o quanto a câmera passa do ponto ao subir de nível
  ZOOM_FREIO: 0.9,       // com que rapidez esse estouro assenta
  MUNDO_MULT: 2,         // o mundo tem esta vez o tamanho do que a câmera vê.
                         // Desce sempre que o zoom abre mais: o mundo é gerado
                         // no tamanho TOTALMENTE expandido, então ZOOM_MIN e
                         // MUNDO_MULT multiplicam juntos a memória das nuvens

  /* movimento (em pixels de TELA por quadro: o mundo já compensa o zoom) */
  ACEL: 0.34,
  ATRITO: 0.93,
  VEL_MAX: 2.2,
  VEL_PERDA: 0.025,       // perda de velocidade aparente por nível

  /* sucção */
  /* O alcance é MÚLTIPLO do raio, então o personagem maior já multiplica a
     área de coleta sozinho. Foi de 3,6 para 2,2 no mesmo movimento em que ele
     cresceu — e a força do puxão desceu junto, senão o que entra no alcance
     ainda chega rápido demais. */
  ALCANCE_SUCCAO: 2.2,   // raio de atração, em múltiplos do raio do buraco
  FORCA_SUCCAO: 0.13,
  GIRO_SUCCAO: 1.2,      // quanto a estrela rodopia enquanto é sugada

  /* Terra */
  TERRA_RAIO: 8,         // raio aparente da Terra, na tela
  /* A Terra é a ÚNICA que continua em 10s. Os outros quatro subiram para
     25s: com os cinco em 10s havia sempre planeta em cena, e o que devia ser
     um achado virava paisagem. O turbo é o poder que só ajuda a andar, então
     é o que pode aparecer sempre sem virar bagunça. */
  TERRA_ESPERA: 600,     // quadros até uma nova Terra aparecer (600 = 10s)
  TERRA_TURBO: 600,      // duração do turbo (600 = 10s)
  TERRA_FATOR: 1.5,      // multiplicador de velocidade do turbo

  /* Marte — o planeta vermelho: vira ímã por um tempo */
  MARTE_RAIO: 8,         // do mesmo tamanho da Terra
  MARTE_ESPERA: 1500,    // 25s; só a Terra ficou em 10s (ver TERRA_ESPERA)
  MARTE_IMA: 300,        // duração do ímã (300 = 5s)
  MARTE_ALCANCE: 1.35,   // quanto o alcance de sucção estica no ímã
  MARTE_FORCA: 1,        // sem puxão extra: esticar o alcance já reforça o perto
  MARTE_CLARAO: 24,      // flash vermelho ao devorá-lo

  /* Saturno — o dos anéis: vira uma torre de gelo por um tempo */
  SATURNO_RAIO: 8,
  SATURNO_ESPERA: 1500,  // 25s
  SATURNO_TIRO: 480,     // duração do poder (480 = 8s)
  SATURNO_CADENCIA: 40,  // quadros entre um bloco e o outro
  SATURNO_DANO: 2,       // estrelas que o oponente perde por bloco
  SATURNO_VEL: 2.8,      // velocidade do bloco, em pixels de tela
  SATURNO_MIRA: 0.022,   // correção de rumo por quadro: persegue de leve.
                         // Em 0,055 o bloco virava teleguiado e acertava 90%
  SATURNO_FOLGA: 6,      // margem, em pixels de tela, para o rival contar
                         // como "na tela" na hora de atirar
  SATURNO_RAIO_BLOCO: 3,
  SATURNO_CLARAO: 24,

  /* Júpiter — o gigante roxo: rouba estrelas de perto */
  JUPITER_RAIO: 8,
  JUPITER_ESPERA: 1500,  // 25s
  JUPITER_DRENO: 600,    // duração do poder (600 = 10s)
  JUPITER_RITMO: 20,     // 3 estrelas por segundo
  JUPITER_FOLGA: 6,      // basta o rival estar na tela; a folga é a margem
  JUPITER_CLARAO: 26,

  /* Netuno — o azul profundo: escudo total por um tempo */
  NETUNO_RAIO: 8,
  NETUNO_ESPERA: 1500,   // 25s
  NETUNO_IMUNE: 600,     // 10s sem levar golpe nenhum
  NETUNO_CLARAO: 26,

  NEBULOSAS: 10,          // nuvens de gás espalhadas pelo mapa; o resto é vácuo

  ROSTO: true,           // o buraco negro tem carinha

  /* rival */
  RIVAL_FORCA: 0.76,     // o quanto o rival acelera comparado a você
  RIVAL_MIRA: 0.4,       // erro de mira dele, em radianos
  RIVAL_PENSAR: 24,      // quadros entre uma decisão e outra
  RIVAIS: 1,             // quantos oponentes entram em campo (1 a 3)
  RIVAIS_MAX: 3,
  RIVAL_DISTANCIA: 2.4,  // quão perto ele chega ao caçar, em encostões
  RIVAL_MARGEM: 8,       // quantas estrelas a mais ele precisa ter para
                         // achar que vale a pena ir para cima de alguém
  RIVAL_CACADA: 0.8,     // e a que distância procura vítima, em telas
  RIVAL_ALCANCE_ARMA: 1.6, // até que distância vale ir de arma na mão atrás
                           // do líder, em telas; mais longe que isso o poder
                           // acaba na viagem e ele mira em quem estiver perto
  RIVAL_ALVO_MAIOR: true,  // a vítima é o MAIOR que ele ainda ganha, não o
                           // mais perto (com false, comportamento antigo)
  /* 1,4 e não 2,2: esticar demais a caçada faz o rival atravessar meia arena
     sem colher nada, e o que ele tira na trombada (5) não paga a viagem. */
  RIVAL_CACADA_LIDER: 1.4, // atrás do líder ele vai mais longe
  /* DESVIAR de quem tem mais estrela foi tentado e MEDIDO como pior, nas duas
     versões: meia-volta e contorno de 90 graus. Trombar com quem está na
     frente custa cinco estrelas, mas passar a partida escapando custa mais —
     cada desvio é tempo sem colher, e o líder está sempre por perto porque os
     dois disputam as mesmas estrelas. Em 90 s de partida a vantagem do
     jogador ia de +68 (sem desvio) para +225 (com desvio) no duelo. */
  RIVAL_FOME_ARMA: 2,      // o quanto ele desvia da rota por um planeta
                           // quando está atrás no placar (1.3 = normal)
  RIVAL_TEIMOSIA: 100,   // quadros que ele insiste na vítima escolhida

  /* efeito da Terra */
  TERRA_CLARAO: 30,      // duração do flash azul ao devorá-la

  ABERRACAO: 26,         // quadros de aberração cromática ao crescer
  ARCO: 34,              // quadros do estouro arco-íris ao crescer

  /* vinheta desfocada */
  VINHETA: true,
  VINHETA_CURVA: 1.6,    // quanto o desfoque demora a aparecer saindo do centro
  VINHETA_FIM: 0.96,     // onde ele chega ao máximo (1 = borda da tela)
  VINHETA_FORCA: 0.72,   // teto do desfoque na borda: 1 troca o pixel todo

  /* trombada entre os dois */
  COLISAO_ESTRELAS: 5,   // quantas estrelas o menor perde na trombada
  COLISAO_EMPURRAO: 9,   // com que força os dois são arremessados
  COLISAO_ATORDOA: 30,   // quadros sem conseguir acelerar depois da pancada
  COLISAO_ARRASTO: 0.977,// atrito enquanto voam: menor que o normal, vão longe
  COLISAO_ESPERA: 50,    // quadros de carência para não trombar em sequência
  COLISAO_SURPRESA: 50,  // quadros de cara de espanto depois da pancada
  ANUNCIO: 80,           // quadros que o aviso do efeito fica na tela
  DANO_FLASH: 22,        // quadros do pisca vermelho ao perder estrela
  COLISAO_TREMOR: 52,
  COLISAO_ABERR: 44,
  COLISAO_CUSTA_NIVEL: true,   // a perda também tira progresso, não só o contador

  /* estrela cadente */
  CADENTE_INTERVALO: 480,      // 480 quadros = 8 segundos
  CADENTE_PREMIO: 10,          // estrelas ganhas ao pegá-la
  CADENTE_VEL: 3.4,
  CADENTE_RAIO: 7,

  /* cometa: o de rabo verde, que deixa enjoado quem encostar */
  COMETA_INTERVALO: 660,   // 660 quadros = 11 segundos
  COMETA_VEL: 2.5,         // mais devagar que a cadente: dá para desviar
  COMETA_RAIO: 14,        // bem maior que a cadente: é obstáculo, não prêmio
  COMETA_ENJOO: 300,        // duração do enjoo (300 = 5s)
  COMETA_FREIO: 0.75,      // fica com 75% da velocidade enquanto durar
  COMETA_ESTRELAS: 5,      // e ainda derruba este tanto de estrelas
  COMETA_RABO: 34,         // comprimento do rastro azul
  ABERRACAO_MAX: 2,      // deslocamento máximo dos canais, em pixels

  /* controle */
  ZONA_MORTA: 4,
  BOTAO_AFUNDA: 7,       // quadros que o botão afunda antes de valer
  /* squash & stretch */
  ELAST_MOLA: 0.16,      // rigidez: quanto maior, mais rápido o repique
  ELAST_ATRITO: 0.885,    // quanto a mola perde por quadro; perto de 1 balança mais
  /* modo sucção: rodar o dedo em círculo acelera a rotação do buraco */
  ESPIRAL_MIN: 0.7,      // giro acumulado onde o modo começa a valer
  ESPIRAL_MAX: 2,        // e onde chega no máximo (~1,3 volta por segundo)
  // ~70% mais fraco que a primeira versão: com o buraco grande, o alcance já
  // é enorme, e um multiplicador alto por cima varria a tela de estrelas
  /* o freio e o limiar de "parado" do modo sucção. Em 0,72 ele para em cerca
     de 6 quadros vindo da velocidade máxima — rápido o bastante para o freio
     parecer resposta ao comando, e não um deslize longo */
  SUCCAO_FREIO: 0.72,     // atrito por quadro enquanto o modo está acionado
  SUCCAO_PARADO: 0.35,    // velocidade de tela abaixo da qual ele conta parado
  ESPIRAL_ALCANCE: 0.33,  // quanto o alcance de sucção estica no máximo
  ESPIRAL_FORCA: 0.48,    // e quanto o puxão fica mais firme
  ESPIRAL_PLANETA: 0.15,  // com que força os planetas vêm junto
  ESPIRAL_GIRO: 0.15,     // torção da imagem no redemoinho, em radianos
  ESPIRAL_PUXA: 0.055,    // e o quanto ela é sugada para o centro
  RAIO_ANALOG: 22,
  ESCURO: false,          // paleta escura inteira (dormente)
  /* O escuro é o modo PADRÃO. O jogo é sobre um buraco negro no espaço: o
     céu claro sempre foi a exceção simpática, não o ponto de partida. Quem
     preferir o claro troca no botão de sol do menu. */
  FUNDO_PB: true,         // só o cenário em preto e branco; o resto mantém a cor
  SEMENTE: 20260823
};

   execução — se voltar a ter, é preciso reatribuir COR e regerar as camadas de

const COR = CFG.ESCURO ? PALETAS.escuro : PALETAS.claro;

/* ── fundo escuro ─────────────────────────────────────────────
   Não é a paleta escura inteira: aqui só o CENÁRIO vira preto e branco — céu,
   nebulosas, poeira e estrelas — e todo o resto do jogo mantém a cor. É outra
   ideia da versão escura anterior: em vez de reinventar o jogo em néon, o
   campo vira um fundo neutro e as cores passam a viver só nos personagens e
   nos efeitos, que é onde a informação está.

   Os painéis e as bordas de barra vão junto porque são chapadas claras: sobre
   preto elas viravam manchas brancas maiores que qualquer personagem. */
/* Preto e branco de verdade, sem tingir. A tentativa anterior levava um
   violeta "para dar vida" e o resultado foi o oposto: a nuvem virou uma mancha
   colorida disputando com os personagens, que é justamente o que este modo
   existe para evitar.

   O que faz a nuvem ficar limpa não é o matiz, é ONDE a escada acende. Os
   quatro primeiros degraus ficam praticamente no preto — a franja pontilhada
   desaparece no vazio em vez de virar chuvisco cinza — e só os dois últimos
   sobem, direto para o branco. O resultado é um miolo aceso com queda curta,
   que é como nebulosa se parece de longe. */

   a camada de nebulosa continua sendo gerada mas sai lisa — um fundo chapado.

/* ── utilidades ──────────────────────────────────────────────── */
function semente(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const suave = t => t * t * (3 - 2 * t);
const misturar = (a, b, t) => a + (b - a) * t;
const limitar = (v, a, b) => (v < a ? a : v > b ? b : v);

function embaralha(x, y, s) {
  let h = x * 374761393 + y * 668265263 + s * 1274126177;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function ruido(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const tx = suave(x - xi), ty = suave(y - yi);
  const a = embaralha(xi, yi, s),     b = embaralha(xi + 1, yi, s);
  const c = embaralha(xi, yi + 1, s), d = embaralha(xi + 1, yi + 1, s);
  return misturar(misturar(a, b, tx), misturar(c, d, tx), ty);
}
function fractal(x, y, s, oitavas) {
  let soma = 0, amp = 1, freq = 1, norma = 0;
  for (let i = 0; i < oitavas; i++) {
    soma += ruido(x * freq, y * freq, s + i * 101) * amp;
    norma += amp; amp *= 0.5; freq *= 2;
  }
  return soma / norma;
}

/* ── canvas e escala ─────────────────────────────────────────── */
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d", { alpha: false });

let VL = 240, VA = 400, escala = 2;

/* Tela de referência do projeto: o celular em pé. É a medida com que tudo foi
   desenhado e balanceado, e é dela que sai o tamanho do mundo. */
const REF_L = 195, REF_A = 390;
const AREA_ALVO = REF_L * REF_A * 1.05;   // quanto de campo cabe na tela
/* Altura de canvas que o menu precisa para caber: título, JOGAR, oponentes e
   os dois botões de ícone. Em 250 o celular DEITADO caía para escala 1 — cada
   pixel do jogo virava um pixel da tela e a arte pixelada sumia. */
const VA_MINIMO = 170;

/* A escala saía de `largura / 200`, que só faz sentido em tela EM PÉ. Num
   monitor deitado de 1920 isso dava escala 10 e um canvas de 192x108: o
   personagem enchia a tela e não sobrava campo nenhum para ver. Agora a
   escala sai da ÁREA da janela, então o jogador vê mais ou menos a mesma
   quantidade de jogo em qualquer formato de tela — só que distribuída no
   formato dele. O piso de altura é para a UI (menu e placar final) não
   estourar em monitor muito largo e baixo. */
function redimensionar() {
  const sl = Math.max(1, window.innerWidth);
  const sa = Math.max(1, window.innerHeight);
  const porArea = Math.max(1, Math.round(Math.sqrt(sl * sa / AREA_ALVO)));
  const porAltura = Math.max(1, Math.floor(sa / VA_MINIMO));
  escala = Math.max(1, Math.min(porArea, porAltura));
  VL = Math.ceil(sl / escala);
  VA = Math.ceil(sa / escala);
  tela.width = VL; tela.height = VA;
  tela.style.width = sl + "px";
  tela.style.height = sa + "px";
  ctx.imageSmoothingEnabled = false;
}
redimensionar();
window.addEventListener("resize", () => { redimensionar(); });

/* ── o mundo é do tamanho do universo TOTALMENTE expandido; a área
      jogável começa pequena no meio e vai abrindo conforme o nível ── */
/* O mundo tem tamanho FIXO, tirado da tela de referência e não da janela de
   quem está jogando. É o que faz a partida ser a mesma no celular e no
   monitor — e, de quebra, é o que permite redimensionar a janela sem ter de
   recozinhar as nebulosas, que são pintadas no tamanho do mundo. */
const MUNDO = {
  L: Math.ceil(REF_L / CFG.ZOOM_MIN * CFG.MUNDO_MULT),
  A: Math.ceil(REF_A / CFG.ZOOM_MIN * CFG.MUNDO_MULT)
};

// matriz de Bayer: mistura duas cores vizinhas com pontilhado,
// que é como a pixel art faz degradê sem inventar cor nova
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

/* Quantas cores de nebulosa entram: uma por jogador em campo. Com você e um
   rival são duas; o terceiro jogador traz o verde e o quarto traz o amarelo. */
function coresNebulosa() {
  return Math.min(COR.nebs.length, 1 + limitar(CFG.RIVAIS, 1, CFG.RIVAIS_MAX));
}

/* Sorteia algumas nuvens espalhadas, de cores alternadas. Cada nuvem é
   um punhado de bolhas redondas que se fundem — fica fofa e simples de ler,
   em vez de fibrosa. Fora delas o espaço é preto de verdade. */
function sortearNebulosas() {
  const r = semente(CFG.SEMENTE + 17);
  const lista = [];
  const raioBase = Math.min(MUNDO.L, MUNDO.A) * 0.15;
  for (let tent = 0; tent < 1200 && lista.length < CFG.NEBULOSAS; tent++) {
    const rx = raioBase * (0.7 + r() * 0.7);
    const ry = rx * (0.75 + r() * 0.5);
    const n = { x: MUNDO.L * (0.12 + r() * 0.76),
                y: MUNDO.A * (0.10 + r() * 0.80),
                rx: rx, ry: ry, esc: 1 / (30 + r() * 20),
                s: Math.floor(r() * 90000), pal: 0, bolhas: [], R: 0 };

    // as bolhas: uma grande no meio e outras menores em volta
    const quantas = 6 + Math.floor(r() * 4);
    for (let k = 0; k < quantas; k++) {
      const a = r() * Math.PI * 2, dist = k === 0 ? 0 : 0.12 + r() * 0.5;
      const b = { dx: Math.cos(a) * dist * n.rx,
                  dy: Math.sin(a) * dist * n.ry,
                  r: (k === 0 ? 0.55 : 0.32 + r() * 0.22) * n.rx };
      n.bolhas.push(b);
      n.R = Math.max(n.R, Math.hypot(b.dx, b.dy) + b.r);
    }

    let cabe = true;
    for (const o of lista)
      if (Math.hypot(o.x - n.x, o.y - n.y) < (o.R + n.R) * 0.72) cabe = false;
    if (cabe) lista.push(n);
  }
  // cores: uma parte para cada, embaralhadas, e sem duas vizinhas iguais
  distribuirCores(lista, r);
  return lista;
}
/* Reparte as cores entre as nuvens sem deixar duas vizinhas iguais. Ficou
   separada de sortearNebulosas porque precisa rodar de novo quando o número
   de jogadores muda, sem re-sortear posição e formato das nuvens. */
function distribuirCores(lista, r) {
  const cores = coresNebulosa();
  const vizinho = i => {
    let melhor = -1, dm = Infinity;
    for (let j = 0; j < lista.length; j++) {
      if (j === i) continue;
      const d = Math.hypot(lista[j].x - lista[i].x, lista[j].y - lista[i].y);
      if (d < dm) { dm = d; melhor = j; }
    }
    return melhor;
  };
  for (let i = 0; i < lista.length; i++) lista[i].pal = i % cores;
  for (let i = lista.length - 1; i > 0; i--) {          // embaralha as cores
    const j = Math.floor(r() * (i + 1));
    const t = lista[i].pal; lista[i].pal = lista[j].pal; lista[j].pal = t;
  }
  for (let passe = 0; passe < 8; passe++) {
    let tudoCerto = true;
    for (let i = 0; i < lista.length; i++) {
      const v = vizinho(i);
      if (v < 0 || lista[v].pal !== lista[i].pal) continue;
      tudoCerto = false;
      for (let j = 0; j < lista.length; j++)
        if (j !== i && j !== v && lista[j].pal !== lista[i].pal) {
          const t = lista[i].pal; lista[i].pal = lista[j].pal; lista[j].pal = t;
          break;
        }
    }
    if (tudoCerto) break;
  }
}

const NEBULOSAS = sortearNebulosas();

/* A nebulosa é pintada uma vez POR CAMADA DE ZOOM. Antes existia um único
   canvas no tamanho do universo inteiro, que era encolhido na hora de
   desenhar — e encolher pixel art come pixels: o pontilhado virava moiré e
   ainda custava caro, porque a cada quadro o navegador reamostrava uma área
   enorme. Agora cada camada já nasce na resolução em que vai aparecer, então
   o desenho sai 1:1, sem serrilhado e sem reamostragem. */
function pintarNebulosa(escala) {
  const L = Math.max(1, Math.round(MUNDO.L * escala));
  const A = Math.max(1, Math.round(MUNDO.A * escala));
  const cv = document.createElement("canvas");
  cv.width = L; cv.height = A;
  const fx = cv.getContext("2d");
  const img = fx.createImageData(L, A);
  const d = img.data;
  const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const paletas = COR.nebs.map(p => p.map(rgb));
  const vazio = rgb(COR.vazio);
  for (let i = 0; i < d.length; i += 4) {
    d[i] = vazio[0]; d[i+1] = vazio[1]; d[i+2] = vazio[2]; d[i+3] = 255;
  }

  /* densidade em blocos de 2x2 PIXELS DE TELA (assim o grão da nuvem tem
     o mesmo tamanho aparente em todas as camadas) */
  const BL = Math.ceil(L / 2), BA = Math.ceil(A / 2);
  const forca = new Float32Array(BL * BA);
  const dono  = new Uint8Array(BL * BA);

  for (const n of NEBULOSAS) {
    const bx0 = Math.max(0, Math.floor((n.x - n.R) * escala / 2));
    const bx1 = Math.min(BL - 1, Math.ceil((n.x + n.R) * escala / 2));
    const by0 = Math.max(0, Math.floor((n.y - n.R) * escala / 2));
    const by1 = Math.min(BA - 1, Math.ceil((n.y + n.R) * escala / 2));
    for (let by = by0; by <= by1; by++) {
      for (let bx = bx0; bx <= bx1; bx++) {
        const x = bx * 2 / escala, y = by * 2 / escala;   // volta pro mundo
        let v = 0;
        for (const b of n.bolhas) {          // bolhas que se fundem
          const dx = x - n.x - b.dx, dy = y - n.y - b.dy;
          const t = 1 - (dx * dx + dy * dy) / (b.r * b.r);
          if (t > 0) v += t * t;
        }
        if (v <= 0) continue;
        // um tempero de ruído só para a borda não ficar de compasso
        v *= 0.82 + 0.3 * fractal(x * n.esc, y * n.esc, n.s, 3);
        v = Math.min(1, v * 0.42);   // sobe o miolo até os tons fortes; a franja segue rala
        if (v <= 0.02) continue;
        const i = by * BL + bx;
        if (v > forca[i]) { forca[i] = v; dono[i] = n.pal; }
      }
    }
  }

  const DEGRAUS = 6;
  for (let by = 0; by < BA; by++) {
    for (let bx = 0; bx < BL; bx++) {
      const i = by * BL + bx;
      const v = forca[i];
      if (v <= 0) continue;
      const paleta = paletas[dono[i]];
      const tom = Math.min(1, v) * DEGRAUS;
      const base = Math.floor(tom), frac = tom - base;
      for (let oy = 0; oy < 2; oy++) {
        const y = by * 2 + oy; if (y >= A) break;
        for (let ox = 0; ox < 2; ox++) {
          const x = bx * 2 + ox; if (x >= L) break;
          const lim = (BAYER[(x & 3) + (y & 3) * 4] + embaralha(x, y, 31) * 5 - 2.5) / 16;
          const passo = base + (frac > lim ? 1 : 0);
          if (passo <= 0) continue;                    // franja pontilhada: vira vácuo
          const cor = paleta[Math.min(paleta.length - 1, passo - 1)];
          const j = (y * L + x) * 4;
          d[j] = cor[0]; d[j+1] = cor[1]; d[j+2] = cor[2];
        }
      }
    }
  }
  fx.putImageData(img, 0, 0);

  // poeira estelar: pontinhos fixos que dão profundidade (não são comestíveis)
  const r = semente(CFG.SEMENTE + 99);
  const pontos = Math.round(MUNDO.L * MUNDO.A / 1100);
  for (let i = 0; i < pontos; i++) {
    fx.fillStyle = COR.poeira[Math.floor(r() * COR.poeira.length)];
    fx.fillRect(Math.round(r() * MUNDO.L * escala), Math.round(r() * MUNDO.A * escala), 1, 1);
  }
  for (let i = 0; i < pontos / 9; i++) {
    fx.fillStyle = COR.poeira[2];
    fx.fillRect(Math.round(r() * MUNDO.L * escala), Math.round(r() * MUNDO.A * escala), 1, 1);
  }
  return { escala: escala, canvas: cv };
}

/* uma camada por degrau de zoom, da mais próxima à mais afastada */
const CAMADAS = [];
const N_CAMADAS = 4;
let coresPintadas = -1;      // com quantas cores as camadas atuais foram feitas

/* As camadas são caras de gerar, então só voltam ao forno quando o número de
   cores muda de verdade — e não a cada clique no seletor de oponentes. */
function gerarCamadas() {
  const cores = coresNebulosa();
  if (cores === coresPintadas) return;
  coresPintadas = cores;
  distribuirCores(NEBULOSAS, semente(CFG.SEMENTE + 17));
  CAMADAS.length = 0;
  for (let i = 0; i < N_CAMADAS; i++)
    CAMADAS.push(pintarNebulosa(1 - (1 - CFG.ZOOM_MIN) * i / (N_CAMADAS - 1)));
}
gerarCamadas();

/* a menor camada que ainda não precisa ser ampliada */
function camadaAtual() {
  let melhor = CAMADAS[CAMADAS.length - 1];
  for (const c of CAMADAS) if (c.escala >= zoom - 0.001) melhor = c;
  return melhor;
}

/* Largura da linha dy de um círculo de raio R, para os planetas.
   Mede com R + 0,5 — o raio até a BORDA de fora do último pixel, não até o
   centro dele. Com R cravado, a linha do polo saía com 1 px sozinho embaixo
   de uma de 9, e o que se via era uma bola cortada reta em cima e embaixo.
   Com meio pixel a mais, o polo fecha com 5 px e a bola arredonda. */
function meiaLinha(R, dy) {
  const f = (R + 0.5) * (R + 0.5) - dy * dy;
  return f <= 0 ? -1 : Math.floor(Math.sqrt(f));
}

/* ── planetas ────────────────────────────────────────────────
   Um gerador só para os cinco, e UM QUADRO cada: eles não giram mais. A
   rotação em torno do próprio eixo era animação por animação — num sprite de
   19 px ela não conta história nenhuma e ainda embaralhava a leitura da
   superfície a cada sete quadros. Parados, dá para desenhar de verdade.

   A esfera é iluminada de verdade:
   · DIFUSA por normal de esfera (N·L), e não por um gradiente em dx+dy;
   · ESPECULAR, o ponto claro do lado da luz, que é o que dá o "brilho de
     bola" — sem ele nenhuma esfera pequena convence;
   · LUZ DE BORDA no limbo escuro, um fio mais claro do lado oposto à luz,
     que é o jeito mais barato de descolar o planeta do fundo.

   Cada planeta entrega só quais materiais existem e uma função que diz qual
   deles está em cada ponto, em coordenadas de -1 a 1. Sem giro, as manchas
   são POSICIONADAS À MÃO, o que dá muito mais controle que ruído procedural
   nesse tamanho. */
const LUZ = (() => { const l = [-0.55, -0.6, 0.58];
  const m = Math.hypot(l[0], l[1], l[2]);
  return [l[0]/m, l[1]/m, l[2]/m]; })();

function fazerPlaneta(R, materiais, superficie) {
  const D = R * 2 + 1;
  const cv = document.createElement("canvas");
  cv.width = D; cv.height = D;
  const fx = cv.getContext("2d");
  const c = R;

  for (let y = 0; y < D; y++) {
    const dy = y - c;
    const w = meiaLinha(R, dy);
    if (w < 0) continue;
    for (let x = c - w; x <= c + w; x++) {
      const dx = x - c;
      const nx = dx / (R + 0.5), ny = dy / (R + 0.5);
      const nz = Math.sqrt(Math.max(0.001, 1 - nx * nx - ny * ny));

      const dif = Math.max(0, nx * LUZ[0] + ny * LUZ[1] + nz * LUZ[2]);
      const esp = Math.pow(dif, 20);
      const borda = Math.pow(1 - nz, 3.2) * (1 - dif) * 0.9;
      const luz = dif * 0.8 + 0.16 + borda;

      /* A superfície pode devolver um índice de material ou o par
         [material, degrau]. O degrau escurece um pouco sem trocar de cor, e é
         assim que as FAIXAS são feitas agora: trocando de paleta, a borda da
         faixa virava uma linha reta atravessando a bola e o planeta parecia
         achatado. Como degrau, a faixa acompanha o sombreamento da esfera. */
      const r = superficie(nx, ny, nz);
      const mat = materiais[Array.isArray(r) ? r[0] : r];
      const passo = Array.isArray(r) ? r[1] : 0;
      const n = mat.length;
      let i = Math.round((1 - limitar(luz, 0, 1)) * (n - 1)) + passo;
      if (esp > 0.3) i = 0;                      // o brilho estoura para o topo
      fx.fillStyle = mat[limitar(i, 0, n - 1)];
      fx.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* mancha oval posicionada à mão, em coordenadas de -1 a 1 */
const mancha = (nx, ny, cx, cy, rx, ry) => {
  const a = (nx - cx) / rx, b = (ny - cy) / ry;
  return a * a + b * b < 1;
};

/* Escadas de CINCO tons: num disco de 17 px, sete degraus caem no mesmo
   pixel e o planeta fica sujo em vez de sombreado.
   As FAIXAS são degraus da mesma cor, não paletas diferentes — trocar de cor
   deixava uma linha reta cortando a bola e achatava o desenho. Só as manchas
   têm paleta própria, e cada planeta tem no máximo duas. */

/* Terra: oceano e dois continentes */
const TERRA_D = CFG.TERRA_RAIO * 2 + 1;
const terraSprite = fazerPlaneta(CFG.TERRA_RAIO, [
  ["#d8f0ff","#8ec8ee","#4a90c8","#28588c","#123354"],   // oceano
  ["#dcf8dc","#8fd9a4","#46a86a","#256b42","#144026"]    // terra
], (nx, ny) => {
  if (mancha(nx, ny, -0.28, -0.14, 0.46, 0.44)) return 1;
  if (mancha(nx, ny, 0.32, 0.34, 0.42, 0.42)) return 1;
  return 0;
});

/* Marte: poeira e um mar escuro */
const MARTE_D = CFG.MARTE_RAIO * 2 + 1;
const marteSprite = fazerPlaneta(CFG.MARTE_RAIO, [
  ["#ffd0ac","#ff9264","#e2512f","#a82c19","#5c150c"],   // poeira
  ["#dfa080","#b25c40","#833021","#5a1d12","#310c06"]    // mar
], (nx, ny) => mancha(nx, ny, 0.16, 0.26, 0.52, 0.36) ? 1 : 0);

/* Júpiter: faixas em degrau e a mancha */
const JUP_D = CFG.JUPITER_RAIO * 2 + 1;
const jupiterSprite = fazerPlaneta(CFG.JUPITER_RAIO, [
  ["#f7eeff","#dcc4f6","#b492e2","#7d5cae","#4b356b"],
  ["#ffd8e6","#f0a0b8","#c96e8a","#96455c","#5a2434"]    // mancha
], (nx, ny) => {
  if (mancha(nx, ny, 0.22, 0.24, 0.32, 0.22)) return 1;
  const f = Math.abs(ny + 0.06 * Math.sin(nx * 2.6));
  return [0, (f > 0.3 && f < 0.62) ? 1 : 0];
});

/* Saturno: antes era UMA faixa e o anel fazia todo o trabalho — o corpo saía
   liso feito bola de bilhar. Agora são quatro faixas em degrau, espelhadas no
   equador e ficando mais escuras na direção dos polos, que é como o gigante
   gasoso realmente se lê: listras paralelas, não manchas. Como são degraus da
   MESMA rampa (e não paletas diferentes), elas acompanham o sombreamento da
   esfera em vez de cortar a bola com linhas retas. */
const SAT_D = CFG.SATURNO_RAIO * 2 + 1;
/* A rampa desceu bastante: o creme quase branco do meio deixava a bola sem
   sombra nenhuma, e ao lado da Terra e de Marte — que têm azul e vermelho
   cheios — o Saturno sumia. Agora o alto é dourado e o pé é marrom fechado,
   que é o contraste que faz a esfera parecer redonda. */
const saturnoSprite = fazerPlaneta(CFG.SATURNO_RAIO, [
  ["#fff3cc","#ffd77e","#dda546","#94631f","#4a2c0d"]
], (nx, ny) => {
  const f = Math.abs(ny + 0.055 * Math.sin(nx * 2.2));
  /* Nenhuma faixa desce dois degraus: com a calota escura demais o polo
     afundava no céu preto e a bola parecia CORTADA em cima — o mesmo achatado
     que já tinha sido reclamado antes. As listras alternam um degrau só, e
     quem fecha a silhueta é o contorno desenhado por fora. */
  if (f > 0.62) return [0, 1];
  if (f > 0.42) return [0, 0];          // faixa clara larga
  if (f > 0.24) return [0, 1];
  return [0, 0];                        // banda equatorial, a mais clara
});

/* Netuno: faixa em degrau e uma mancha escura */
const NET_D = CFG.NETUNO_RAIO * 2 + 1;
const netunoSprite = fazerPlaneta(CFG.NETUNO_RAIO, [
  ["#dcefff","#9cc8f4","#5389cf","#2a5088","#132b52"],
  ["#5c7ba0","#3a5680","#22406a","#142a48","#060d18"]    // mancha
], (nx, ny) => {
  if (mancha(nx, ny, -0.22, -0.1, 0.32, 0.24)) return 1;
  const f = Math.abs(ny + 0.05 * Math.sin(nx * 2.4));
  return [0, (f > 0.32 && f < 0.64) ? 1 : 0];
});

/* Losango cheio girando: percorre a caixa do desenho e desgira cada pixel
   para saber se ele cai dentro do quadrado inclinado. É barato porque a caixa
   tem 9 px de lado, e só há um punhado de blocos em cena. */
function cristal(cx, cy, r, giro) {
  const co = Math.cos(-giro), si = Math.sin(-giro);
  const x0 = Math.round(cx), y0 = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const u = dx * co - dy * si, v = dx * si + dy * co;
      const d = Math.max(Math.abs(u), Math.abs(v));
      if (d > r) continue;
      // aresta escura por fora, corpo claro dentro, lasco branco no canto alto
      const cor = d > r - 1 ? COR.bloco[3]
                : (u + v < -r * 0.55 ? COR.bloco[0] : COR.bloco[1]);
      px(x0 + dx, y0 + dy, cor);
    }
  }
}

/* ── desenho em pixel cheio (sem antialias) ──────────────────── */
function disco(cx, cy, raio, cor) {
  ctx.fillStyle = cor;
  const r = Math.round(raio), x0 = Math.round(cx), y0 = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) {
    const larg = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) + 0.5);
    if (larg <= 0) continue;
    ctx.fillRect(x0 - larg, y0 + dy, larg * 2 + 1, 1);
  }
}
function oval(cx, cy, rx, ry, cor) {
  ctx.fillStyle = cor;
  const x0 = Math.round(cx), y0 = Math.round(cy);
  const ay = Math.round(ry);
  for (let dy = -ay; dy <= ay; dy++) {
    const t = ry > 0 ? 1 - (dy * dy) / (ry * ry) : 1;
    if (t < 0) continue;
    const w = Math.round(rx * Math.sqrt(t));
    ctx.fillRect(x0 - w, y0 + dy, w * 2 + 1, 1);
  }
}
function carimbo(mapa, cx, cy, cor) {          // estampa um desenhinho centrado
  ctx.fillStyle = cor;
  const l = mapa[0].length, a = mapa.length;
  const x0 = Math.round(cx - l / 2), y0 = Math.round(cy - a / 2);
  for (let y = 0; y < a; y++) {
    const linha = mapa[y];
    for (let x = 0; x < l; x++) if (linha[x] === "#") ctx.fillRect(x0 + x, y0 + y, 1, 1);
  }
}

/* Brilho radial: discos concêntricos do maior para o menor, todos com a
   MESMA opacidade baixa. O que empilha é a quantidade — perto do planeta
   passam todos os discos, na ponta passa um só —, e é isso que dá a queda
   suave até zerar.
   Feito com anéis de 1 px, a luz saía com um cruzeiro de raios: anel fino
   cobre número diferente de pixels no topo e na lateral, e a sobra desenha
   eixos. Disco cheio é o mesmo rasterizador do resto do jogo e não tem essa
   costura.
   `curva` alta aperta a luz contra o planeta; 1 dá rampa reta. */
function brilho(cx, cy, r0, r1, cor, forca, curva) {
  const n = Math.max(2, Math.round((r1 - r0) * 1.6));
  const a = forca / n;
  const k = curva || 2;
  ctx.globalAlpha = a;
  for (let i = n; i >= 1; i--) {
    const t = i / n;
    disco(cx, cy, r0 + (r1 - r0) * Math.pow(t, k), cor);
  }
  ctx.globalAlpha = 1;
}

/* Reta em pixel cheio (Bresenham). O gráfico do fim é a única coisa do jogo
   que precisa ligar dois pontos quaisquer. */
function linha(x0, y0, x1, y1, cor) {
  ctx.fillStyle = cor;
  let x = Math.round(x0), y = Math.round(y0);
  const xf = Math.round(x1), yf = Math.round(y1);
  const dx = Math.abs(xf - x), dy = -Math.abs(yf - y);
  const sx = x < xf ? 1 : -1, sy = y < yf ? 1 : -1;
  let erro = dx + dy;
  for (let guarda = 0; guarda < 4096; guarda++) {
    ctx.fillRect(x, y, 1, 1);
    if (x === xf && y === yf) break;
    const e2 = 2 * erro;
    if (e2 >= dy) { erro += dy; x += sx; }
    if (e2 <= dx) { erro += dx; y += sy; }
  }
}

function anel(cx, cy, raio, esp, cor) {        // rosca preenchida, sem antialias
  ctx.fillStyle = cor;
  const x0 = Math.round(cx), y0 = Math.round(cy);
  const re = raio, ri = Math.max(0, raio - esp);
  const R = Math.ceil(re);
  for (let dy = -R; dy <= R; dy++) {
    const fe = re * re - dy * dy;
    if (fe <= 0) continue;
    const we = Math.floor(Math.sqrt(fe) + 0.5);
    const fi = ri * ri - dy * dy;
    const wi = fi > 0 ? Math.floor(Math.sqrt(fi) + 0.5) : -1;
    if (wi < 0) ctx.fillRect(x0 - we, y0 + dy, we * 2 + 1, 1);
    else {
      ctx.fillRect(x0 - we, y0 + dy, we - wi, 1);
      ctx.fillRect(x0 + wi + 1, y0 + dy, we - wi, 1);
    }
  }
}

function px(x, y, cor) {
  ctx.fillStyle = cor;
  ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
}
function desenhaGlifos(str, x, y, cor, tam) {
  ctx.fillStyle = cor;
  let cx = Math.round(x), cy = Math.round(y);
  for (const ch of str) {
    const g = glifo(ch);
    for (let ly = 0; ly < FONTE_H; ly++) {
      const linha = g.linhas[ly];
      for (let lx = 0; lx < g.larg; lx++)
        if (linha[g.c0 + lx] === "#")
          ctx.fillRect(cx + lx * tam, cy + ly * tam, tam, tam);
    }
    cx += (g.larg + VAO) * tam;
  }
}
function texto(str, x, y, cor, tam) {
  // contorno branco em volta: no céu claro, com estrela preta passando atrás,
  // uma sombra só de um lado não segura a leitura
  tam = tam || 1;
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      if (dx || dy) desenhaGlifos(str, x + dx * tam, y + dy * tam, COR.vazio, tam);
  desenhaGlifos(str, x, y, cor, tam);
}
function larguraTexto(str, tam) {
  tam = tam || 1;
  let l = 0;
  for (const ch of str) l += (glifo(ch).larg + VAO) * tam;
  return Math.max(0, l - VAO * tam);
}
function textoCentro(str, y, cor, tam) {
  texto(str, Math.round((VL - larguraTexto(str, tam || 1)) / 2), y, cor, tam);
}
/* ANTECIPAÇÃO no botão: ao tocar, ele AFUNDA por uns quadros e só então a
   ação acontece. O peso do movimento vem do recuo antes do avanço; botão que
   dispara no mesmo quadro do toque não tem peso nenhum, só resposta.
   `acao` é guardada e chamada quando o afundar termina. */
let botaoAfundando = null;
function apertar(nome, acao) {
  botaoAfundando = { nome: nome, t: CFG.BOTAO_AFUNDA, total: CFG.BOTAO_AFUNDA, acao: acao };
}
function passoBotao() {
  if (!botaoAfundando) return;
  if (--botaoAfundando.t > 0) return;
  const acao = botaoAfundando.acao;
  botaoAfundando = null;
  if (acao) acao();
}
/* o quanto encolher agora, para quem está desenhando o botão */
function encolhimento(nome) {
  if (!botaoAfundando || botaoAfundando.nome !== nome) return 0;
  const p = botaoAfundando.t / botaoAfundando.total;
  return Math.sin(p * Math.PI) * 0.14 + (1 - p) * 0.02;
}
/* devolve o retângulo já encolhido, mantendo o centro */
function comprimir(r, nome) {
  const e = encolhimento(nome);
  if (e <= 0) return r;
  const dl = Math.round(r.l * e), da = Math.round(r.a * e);
  return { x: r.x + Math.round(dl / 2), y: r.y + Math.round(da / 2),
           l: r.l - dl, a: r.a - da };
}

/* Caixa de botão: quinas cortadas e contorno de espessura livre. O traço de
   1 px sumia contra o céu cheio de estrela — a 2 px o botão vira um objeto
   sólido, com dentro e fora, em vez de um retângulo desenhado por cima. */
function caixa(r, corFundo, corBorda, grossura) {
  const g = grossura || 1;
  ctx.fillStyle = corFundo;
  ctx.fillRect(r.x + 1, r.y, r.l - 2, r.a);      // as duas faixas cruzadas
  ctx.fillRect(r.x, r.y + 1, r.l, r.a - 2);      // deixam as 4 quinas de fora
  ctx.fillStyle = corBorda;
  ctx.fillRect(r.x + 1, r.y, r.l - 2, g);
  ctx.fillRect(r.x + 1, r.y + r.a - g, r.l - 2, g);
  ctx.fillRect(r.x, r.y + 1, g, r.a - 2);
  ctx.fillRect(r.x + r.l - g, r.y + 1, g, r.a - 2);
}

/* ── botões (retângulos em pixels do jogo; o toque tem folga extra) ── */
/* Abaixo do JOGAR ainda vêm os oponentes e os dois botões de ícone: 104 px
   de pilha. Em tela baixa (monitor largo) 60% da altura jogava tudo isso para
   fora, então o bloco sobe o quanto for preciso para caber. */
const PILHA_MENU = 104;
/* Largura máxima do miolo de texto. Sem ela, no monitor de 1920 o placar
   final ficava esparramado de beira a beira. */
const COLUNA = 240;
function botaoJogar() {
  const l = 90, a = 22;
  const y = Math.min(Math.round(VA * 0.60), VA - PILHA_MENU);
  return { x: Math.round((VL - l) / 2), y: Math.max(Math.round(VA * 0.3), y), l: l, a: a };
}
// meio do topo: os contadores ficam nos dois cantos e o X não briga com
// nenhum deles
/* O X centrado nos DOIS eixos. Antes o vertical era um "+3" chutado e a
   letra ficava alta dentro da caixinha; agora sai da altura real da fonte.
   A caixa também tem lado ímpar, para o centro dela cair em cima de um pixel
   e não entre dois. */
function desenharBotaoSair() {
  const b = comprimir(botaoSair(), "sair");
  caixa(b, COR.painel, COR.hudFraco);
  const l = larguraTexto("X", 1);
  texto("X", b.x + Math.round((b.l - l) / 2),
        b.y + Math.round((b.a - FONTE_H) / 2), COR.hud, 1);
}

// centrado pela LARGURA da caixa, não por VL/2 menos metade chutada:
// com tela de largura ímpar a diferença é de 1 px, e ela se vê
const SAIR_L = 13;
function botaoSair() { return { x: Math.round((VL - SAIR_L) / 2), y: 3,
                                l: SAIR_L, a: 13 }; }
function dentro(gx, gy, r, folga) {
  folga = folga || 0;
  return gx >= r.x - folga && gx <= r.x + r.l + folga &&
         gy >= r.y - folga && gy <= r.y + r.a + folga;
}

/* ── estado ──────────────────────────────────────────────────── */
const rnd = semente(CFG.SEMENTE + 4242);

let cena = "menu";                 // "menu" | "jogo"
const buraco = { x: 0, y: 0, vx: 0, vy: 0, ang: -Math.PI / 2,
                 nivel: 0, progresso: 0, comidas: 0, pulso: 0, boca: 0, atordoado: 0 };

/* Os rivais: mesmo bicho, cérebro simples, uma cor cada. São criados uma vez
   só, no máximo possível, e `rivais` aponta para os que estão em campo — assim
   nenhuma referência guardada por aí (alvo de um bloco, destino de uma estrela
   roubada) aponta para um objeto que deixou de existir. */
const TODOS_RIVAIS = [];
for (let i = 0; i < CFG.RIVAIS_MAX; i++)
  TODOS_RIVAIS.push({ x: 0, y: 0, vx: 0, vy: 0, ang: 0, indice: i,
                      nivel: 0, progresso: 0, comidas: 0, pulso: 0, boca: 0,
                      atordoado: 0, alvo: null, pensar: 0 });
let rivais = [TODOS_RIVAIS[0]];
const rival = TODOS_RIVAIS[0];      // atalho para o primeiro, que sempre existe
/* todo mundo em campo, para os laços que valem para os dois lados */
const todos = () => [buraco].concat(rivais);
const paletaDe = r => COR.rivais[r.indice % COR.rivais.length];
let vencedor = null;
let estrelas = [], faiscas = [], coracoes = [], aneis = [], terra = null, esperaTerra = 0, turbo = 0;
let marte = null, esperaMarte = 0, ima = 0, flashIma = 0;
let saturno = null, esperaSaturno = 0, flashTiro = 0, blocos = [];
/* tiro/recargaTiro e dreno/ritmoDreno moram em buraco e rival: os dois usam
   os mesmos poderes, cada um contra o outro */
let jupiter = null, esperaJupiter = 0, flashRoxo = 0, drenando = false;
let roubadas = [];        // estrelas viajando de um jogador para o outro
let netuno = null, esperaNetuno = 0, flashAzul = 0;
/* imune vive no personagem: os dois podem ficar invencíveis */
let anuncio = null;
/* declarado aqui e não junto de anunciarDepois: reiniciar() roda na
   abertura e mexe nele, antes de o resto do arquivo existir */
let anuncioAdiado = null;
let flashDano = 0;      // pisca vermelho nas laterais quando VOCÊ perde estrela
let tremor = 0, flash = 0, flashLado = 0, flashTerra = 0, aberr = 0, arco = 0, quadro = 0;
let esperaColisao = 0, cadente = null, esperaCadente = 0;
let cometa = null, esperaCometa = 0, flashEnjoo = 0;
let zoom = 1, zoomAlvo = 1, raioTela = CFG.RAIO_BASE;
let expansao = 0;       // 1 no instante do nível novo, decai até 0
let historico = [];     // { t: segundos, v: [estrelas de cada um] }
let quadroInicio = 0;   // `quadro` nunca zera; o tempo da partida sai da diferença
let primeiro = null;    // quem está com mais estrelas; ganha a coroa
/* Quanto o inimigo já tirou de você, por origem. O dreno e o gelo tiram de
   pouco em pouco — anunciar cada estrela viraria um piscar sem sentido —,
   então acumulam e o total sai quando a agressão para. */
let perdaAcum = { dreno: 0, gelo: 0 };
let perdaParada = { dreno: 0, gelo: 0 };   // quadros desde o último golpe
let ganhoParado = 0;
let ganhoDreno = 0;     // o que VOCÊ tirou dos outros no dreno
let coroaAnim = 0;      // 1 no instante em que a coroa troca de cabeça
const cam = { x: 0, y: 0 };

/* quanto custa sair do nível n: cada nível pede mais que o anterior */
const custoDoNivel = n => CFG.CUSTO_BASE + n * CFG.CUSTO_PASSO;
const noMaximo = () => buraco.nivel >= CFG.NIVEL_MAX;

/* o raio do buraco em unidades de MUNDO: cresce mais rápido que o
   aparente, porque a câmera se afasta na mesma medida */
const zoomDoNivel = n => Math.max(CFG.ZOOM_MIN,
  1 / (1 + n * CFG.ZOOM_PASSO + n * n * CFG.ZOOM_CURVA));
const raioTelaNivel = n => CFG.RAIO_BASE + n * CFG.RAIO_TELA_PASSO;
const raioMundoNivel = n => raioTelaNivel(n) / zoomDoNivel(n);
const raioMundo = () => raioTela / zoom;
const visaoL = () => VL / zoom;
const visaoA = () => VA / zoom;

/* a área jogável é um retângulo centrado que abre conforme o zoom sai */
function limites() {
  const l = Math.min(MUNDO.L, visaoL() * CFG.MUNDO_MULT);
  const a = Math.min(MUNDO.A, visaoA() * CFG.MUNDO_MULT);
  return { x0: (MUNDO.L - l) / 2, y0: (MUNDO.A - a) / 2,
           x1: (MUNDO.L + l) / 2, y1: (MUNDO.A + a) / 2, l: l, a: a };
}

/* quantas estrelas o campo deve ter para a densidade não mudar */
function alvoEstrelas() {
  if (!CFG.DENSIDADE_FIXA) return CFG.ESTRELAS;
  // pela tela de referência: assim a DENSIDADE é a mesma em toda plataforma,
  // e quem tem tela maior vê mais estrelas porque enxerga mais campo
  const base = (REF_L * CFG.MUNDO_MULT) * (REF_A * CFG.MUNDO_MULT);
  const agora = limites().l * limites().a;
  // pelo CFG e não por `rivais.length`: reiniciar() semeia o campo antes de
  // montar a lista de rivais, e ali ela ainda é a da partida anterior
  const quantos = limitar(CFG.RIVAIS, 1, CFG.RIVAIS_MAX);
  const teto = CFG.ESTRELAS_TETO + (quantos - 1) * CFG.ESTRELAS_TETO_RIVAL;
  return Math.min(teto, Math.round(CFG.ESTRELAS * agora / base));
}

function novaEstrela(longeDe) {
  const L = limites();
  for (let tent = 0; tent < 40; tent++) {
    const e = {
      x: L.x0 + 6 + rnd() * (L.l - 12),
      y: L.y0 + 6 + rnd() * (L.a - 12),
      fase: rnd() * Math.PI * 2,
      ritmo: 0.05 + rnd() * 0.07,
      giro: rnd() < 0.5 ? -1 : 1,
      sx: 0, sy: 0, salc: 1,
      vx: 0, vy: 0, presa: false
    };
    if (!longeDe) return e;
    if (Math.hypot(e.x - longeDe.x, e.y - longeDe.y) > visaoL() * 0.45) return e;
  }
  return { x: L.x0 + L.l * rnd(), y: L.y0 + L.a * rnd(), fase: 0,
           ritmo: 0.06, giro: rnd() < 0.5 ? -1 : 1, vx: 0, vy: 0, presa: false };
}

function novaTerra() {
  const L = limites();
  for (let tent = 0; tent < 40; tent++) {
    const t = {
      x: L.x0 + 20 + rnd() * (L.l - 40),
      y: L.y0 + 20 + rnd() * (L.a - 40),
      vx: (rnd() - 0.5) * 0.12, vy: (rnd() - 0.5) * 0.12,
      quadro: 0
    };
    if (Math.hypot(t.x - buraco.x, t.y - buraco.y) > visaoL() * 0.35) return t;
  }
  return null;
}


function novoMarte() {

    };

}

function novoSaturno() {

    };

function novoJupiter() {

  for (let tent = 0; tent < 40; tent++) {

    };

}

function novoNetuno() {

  for (let tent = 0; tent < 40; tent++) {
    const t = {

      quadro: 0
    };
    if (Math.hypot(t.x - buraco.x, t.y - buraco.y) > visaoL() * 0.35) return t;
  }

function reiniciar() {
  buraco.nivel = 0; buraco.comidas = 0; buraco.progresso = 0;
  raioTela = CFG.RAIO_BASE; zoom = zoomAlvo = 1;
  buraco.x = MUNDO.L / 2; buraco.y = MUNDO.A / 2;
  buraco.vx = buraco.vy = 0; buraco.ang = -Math.PI / 2;
  buraco.pulso = 0; buraco.boca = 0; buraco.atordoado = 0; aneis = [];
  faiscas = []; coracoes = []; tremor = 0; flash = 0; flashLado = 0; aberr = 0;
  arco = 0; turbo = 0; esperaColisao = 0; expansao = 0;
  historico = []; quadroInicio = quadro;
  primeiro = null; coroaAnim = 0;
  perdaAcum = { dreno: 0, gelo: 0 };
  perdaParada = { dreno: 0, gelo: 0 }; ganhoParado = 0;
  ganhoDreno = 0;
  cadente = null; esperaCadente = CFG.CADENTE_INTERVALO;
  cometa = null; esperaCometa = CFG.COMETA_INTERVALO; flashEnjoo = 0;
  buraco.enjoo = 0; buraco.surpresa = 0; buraco.fervor = 0;
  buraco.elast = 0; buraco.elastV = 0;
  estrelas = [];
  for (let i = 0; i < alvoEstrelas(); i++) estrelas.push(novaEstrela(buraco));
  rivais = TODOS_RIVAIS.slice(0, limitar(CFG.RIVAIS, 1, CFG.RIVAIS_MAX));
  const L0 = limites();
  for (let i = 0; i < rivais.length; i++) {
    const r = rivais[i];
    r.nivel = 0; r.comidas = 0; r.progresso = 0;
    r.vx = r.vy = 0; r.pulso = 0; r.boca = 0; r.atordoado = 0;
    r.alvo = null; r.pensar = 0; r.enjoo = 0; r.surpresa = 0; r.fervor = 0;
    r.presa = null; r.perseguindo = 0; r.elast = 0; r.elastV = 0;
    r.tiro = 0; r.recargaTiro = 0; r.dreno = 0; r.ritmoDreno = 0; r.imune = 0;
    // espalhados em leque à mesma distância: ninguém começa com vantagem
    const a = -Math.PI / 2 + (i + 1) / (rivais.length + 1) * Math.PI * 2;
    r.ang = a + Math.PI;
    r.x = limitar(buraco.x + Math.cos(a) * visaoL() * 0.44, L0.x0 + 20, L0.x1 - 20);
    r.y = limitar(buraco.y + Math.sin(a) * visaoA() * 0.30, L0.y0 + 20, L0.y1 - 20);
  }
  vencedor = null; flashTerra = 0;

  terra = novaTerra(); esperaTerra = 0;
  marte = null; esperaMarte = CFG.MARTE_ESPERA; ima = 0; flashIma = 0;
  saturno = null; esperaSaturno = CFG.SATURNO_ESPERA; flashTiro = 0; blocos = [];
  buraco.tiro = 0; buraco.recargaTiro = 0;
  jupiter = null; esperaJupiter = CFG.JUPITER_ESPERA;
  flashRoxo = 0; drenando = false; roubadas = [];
  buraco.dreno = 0; buraco.ritmoDreno = 0;
  netuno = null; esperaNetuno = CFG.NETUNO_ESPERA; flashAzul = 0;
  buraco.imune = 0;
  anuncio = null; anuncioAdiado = null; flashDano = 0;
  cam.x = buraco.x - visaoL() / 2;
  cam.y = buraco.y - visaoA() / 2;
}
reiniciar();

/* ── som ─────────────────────────────────────────────────────
   Tudo sintetizado na hora com Web Audio: o jogo é um arquivo só e continua
   sendo, sem nenhum .wav pendurado. São dois tijolos — um oscilador com
   envelope e um chiado filtrado — e todos os efeitos saem da combinação
   dos dois.

   O contexto só nasce no primeiro toque: navegador de celular recusa áudio
   iniciado sem gesto do usuário, e criar antes deixaria um contexto suspenso
   para sempre. */
const SOM = { ctx: null, mestre: null, ligado: true, ultimo: {} };

function iniciarSom() {
  if (SOM.ctx) { if (SOM.ctx.state === "suspended") SOM.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  SOM.ctx = new AC();
  SOM.mestre = SOM.ctx.createGain();
  SOM.mestre.gain.value = 0.34;          // o jogo é para ouvir baixo
  SOM.mestre.connect(SOM.ctx.destination);
}

/* Trava por efeito: engolir dez estrelas no mesmo quadro tocaria dez vezes o
   mesmo blip e viraria estalo. `espera` é em milissegundos. */
function podeTocar(nome, espera) {
  const t = SOM.ctx ? SOM.ctx.currentTime * 1000 : 0;
  if (SOM.ultimo[nome] && t - SOM.ultimo[nome] < espera) return false;
  SOM.ultimo[nome] = t;
  return true;
}

/* Um oscilador com envelope. `f2` faz a nota escorregar até outra frequência,
   que é o que dá o "pew" de subida e o "wah" de queda. */
function tom(f1, f2, dur, tipo, vol, atraso) {
  if (!SOM.ctx || !SOM.ligado) return;
  const t = SOM.ctx.currentTime + (atraso || 0);
  const o = SOM.ctx.createOscillator();
  const g = SOM.ctx.createGain();
  o.type = tipo || "square";
  o.frequency.setValueAtTime(f1, t);
  if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.012, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(SOM.mestre);
  o.start(t); o.stop(t + dur + 0.02);
}

/* Chiado filtrado: a base de tudo que é batida, estalo ou explosão. */
function chiado(dur, vol, corte, atraso) {
  if (!SOM.ctx || !SOM.ligado) return;
  const t = SOM.ctx.currentTime + (atraso || 0);
  const n = Math.max(1, Math.floor(SOM.ctx.sampleRate * dur));
  const buf = SOM.ctx.createBuffer(1, n, SOM.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = SOM.ctx.createBufferSource();
  src.buffer = buf;
  const f = SOM.ctx.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = corte || 1800;
  const g = SOM.ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(SOM.mestre);
  src.start(t); src.stop(t + dur + 0.02);
}

/* O repertório. Cada efeito é uma frase curta: o jogo é rápido e som
   comprido atropela o próximo. */
const SFX = {
  comer(altura) {                        // sobe de tom conforme a sequência
    if (!podeTocar("comer", 45)) return;
    const base = 620 + Math.min(1, altura || 0) * 520;
    tom(base, base * 1.5, 0.07, "square", 0.14);
  },
  nivel() {
    [0, 0.07, 0.14, 0.23].forEach((d, i) =>
      tom(440 * Math.pow(1.26, i), 440 * Math.pow(1.26, i + 1), 0.13, "triangle", 0.2, d));
  },
  planeta(f) {                           // um sino por planeta, cada um numa nota
    tom(f, f * 2, 0.16, "triangle", 0.22);
    tom(f * 2.01, f * 3, 0.2, "sine", 0.14, 0.04);
  },
  cadente() {
    [0, 0.05, 0.1].forEach((d, i) => tom(900 + i * 320, 1500 + i * 400, 0.1, "square", 0.16, d));
  },
  trombada() {
    chiado(0.3, 0.5, 900);
    tom(180, 60, 0.28, "sawtooth", 0.3);
  },
  gelo() {
    chiado(0.12, 0.34, 5200);
    tom(1500, 700, 0.09, "square", 0.12);
  },
  cometa() {                             // queda longa: o "passar mal"
    tom(520, 120, 0.55, "sawtooth", 0.24);
    chiado(0.4, 0.22, 700, 0.05);
  },
  dreno() {
    if (!podeTocar("dreno", 90)) return;
    tom(300, 820, 0.14, "sine", 0.13);
  },
  escudo() {
    [0, 0.06, 0.12, 0.18, 0.24].forEach((d, i) =>
      tom(520 * Math.pow(1.2, i), 520 * Math.pow(1.2, i) * 1.6, 0.2, "sine", 0.16, d));
  },
  coroa() {
    [0, 0.08, 0.16].forEach((d, i) =>
      tom(660 * Math.pow(1.33, i), 660 * Math.pow(1.33, i), 0.16, "triangle", 0.2, d));
  },
  perda() {
    tom(420, 150, 0.26, "square", 0.2);
  },
  clique() { tom(720, 900, 0.05, "square", 0.16); },
  fim(ganhou) {
    const notas = ganhou ? [523, 659, 784, 1047] : [523, 466, 392, 311];
    notas.forEach((f, i) => tom(f, f, 0.22, "triangle", 0.22, i * 0.13));
  }
};

/* ── squash & stretch ─────────────────────────────────────────
   Uma MOLA por personagem, não um decaimento. `elast` é o quanto ele está
   achatado (positivo = largo e baixo, negativo = alto e fino) e `elastV` a
   velocidade com que volta. Uma mola ultrapassa o repouso e volta pelo outro
   lado algumas vezes — é isso que dá o repique, e é a diferença entre um
   "inchou e murchou" e um corpo com massa.
   O volume fica quase constante: o que engorda na horizontal afina na
   vertical, senão o personagem parece só crescer. */
function molaElastica(p) {
  const k = CFG.ELAST_MOLA, d = CFG.ELAST_ATRITO;
  p.elastV = (p.elastV || 0) - (p.elast || 0) * k;
  p.elastV *= d;
  p.elast = limitar((p.elast || 0) + p.elastV, -0.42, 0.42);
  if (Math.abs(p.elast) < 0.002 && Math.abs(p.elastV) < 0.002) {
    p.elast = 0; p.elastV = 0;
  }
}

/* dá um tranco na mola: positivo achata, negativo estica para cima */
function bater(p, forca) {
  p.elastV = (p.elastV || 0) + forca;
}

/* ── controle ────────────────────────────────────────────────── */
const toque = { ativo: false, ax: 0, ay: 0, x: 0, y: 0, id: null,
                ang: null, volta: 0, sentido: 0, acum: 0, parado: 0, girando: false };
let espiral = 0;          // 0 a 1: o quanto o gesto de espiral está valendo
const teclas = Object.create(null);
/* mouse de verdade (não é dedo): é o sinal de que dá para mostrar as teclas */
const PONTEIRO_FINO = window.matchMedia &&
                      window.matchMedia("(pointer: fine)").matches;

function zerarGesto() {
  toque.ang = null; toque.acum = 0; toque.parado = 0;
  toque.volta = 0; toque.girando = false; espiral = 0;
}
/* o gesto é zerado aqui e não em reiniciar(): reiniciar roda na abertura,
   antes de `espiral` e `toque` existirem, e tocar neles ali dá erro */
function jogar() { reiniciar(); zerarGesto(); cena = "jogo"; }
function sair()  { toque.ativo = false; toque.id = null;
                   cena = "menu"; reiniciar(); zerarGesto(); }

tela.addEventListener("pointerdown", e => {
  e.preventDefault();
  iniciarSom();                          // navegador só libera áudio com gesto
  const gx = e.clientX / escala, gy = e.clientY / escala;

  if (cena === "menu") {
    for (let i = 0; i < CFG.RIVAIS_MAX; i++)
      if (dentro(gx, gy, botaoOponente(i), 5)) {
        SFX.clique();
        apertar("op" + i, () => {
          CFG.RIVAIS = i + 1;
          gerarCamadas();              // entra a cor de nebulosa do novo jogador
          reiniciar();                 // e recoloca os bonecos já no menu
        });
        return;
      }
    if (dentro(gx, gy, botaoSom(), 5)) {
      SOM.ligado = !SOM.ligado;
      if (SOM.ligado) SFX.clique();
      apertar("som", null);
      return;
    }
    if (dentro(gx, gy, botaoFundo(), 5)) {
      SFX.clique();
      apertar("fundo", () => aplicarFundo(!CFG.FUNDO_PB));
      return;
    }
    if (dentro(gx, gy, botaoJogar(), 6)) { SFX.clique(); apertar("jogar", jogar); }
    return;
  }
  if (cena === "fim") {
    if (dentro(gx, gy, botaoJogar(), 6)) { SFX.clique(); apertar("jogar", jogar); }
    else if (dentro(gx, gy, botaoSair(), 8)) { SFX.clique(); apertar("sair", sair); }
    return;
  }
  if (dentro(gx, gy, botaoSair(), 8)) { SFX.clique(); apertar("sair", sair); return; }

  if (toque.id !== null) return;
  tela.setPointerCapture(e.pointerId);
  toque.ativo = true; toque.id = e.pointerId;
  toque.ax = e.clientX; toque.ay = e.clientY;
  toque.x = e.clientX;  toque.y = e.clientY;
  // dedo novo, gesto novo: sem isso um toque herda o semicírculo do anterior
  toque.ang = null; toque.acum = 0; toque.volta = 0;
  toque.parado = 0; toque.girando = false;
});
tela.addEventListener("pointermove", e => {
  if (!toque.ativo || e.pointerId !== toque.id) return;
  e.preventDefault();
  toque.x = e.clientX; toque.y = e.clientY;
  // o centro do analógico segue o dedo quando ele passa do alcance
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  const d = Math.hypot(dx, dy), lim = CFG.RAIO_ANALOG * escala;
  if (d > lim) {
    toque.ax = toque.x - (dx / d) * lim;
    toque.ay = toque.y - (dy / d) * lim;
  }
});
for (const ev of ["pointerup", "pointercancel"])
  tela.addEventListener(ev, e => {
    if (e.pointerId === toque.id) { toque.ativo = false; toque.id = null; }
  });

window.addEventListener("keydown", e => {
  iniciarSom();
  teclas[e.key] = true;
  if ((cena === "menu" || cena === "fim") && (e.key === "Enter" || e.key === " ")) jogar();
  else if (e.key === "Escape") sair();
});
window.addEventListener("keyup", e => { teclas[e.key] = false; });

/* ── lógica ──────────────────────────────────────────────────── */
/* O modo sucção só liga depois de um SEMICÍRCULO completo no mesmo sentido.
   Antes bastava a velocidade de giro, e uma simples troca de direção — que é
   um arco curto — já acendia o modo: o boneco parava de acelerar bem na hora
   em que o jogador queria virar. Agora `acum` soma o ângulo com sinal e zera
   a cada inversão de sentido; só ao passar de meia volta o modo destrava.
   A partir daí a intensidade continua vindo da VELOCIDADE do giro. */
function lerEspiral() {
  if (!toque.ativo) {
    toque.ang = null; toque.volta = 0; toque.acum = 0;
    toque.parado = 0; toque.girando = false;
    espiral = 0;
    return;
  }
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  if (Math.hypot(dx, dy) < CFG.ZONA_MORTA * 2) {   // perto demais, o ângulo pula
    toque.ang = null; toque.volta *= 0.9; toque.acum *= 0.9;
  } else {
    const a = Math.atan2(dy, dx);
    if (toque.ang !== null) {
      let d = a - toque.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      // inverteu o sentido? o semicírculo recomeça do zero
      if (d * toque.acum < 0) toque.acum = 0;
      // O acumulado zera quando o dedo PARA de rodar, não por decaimento.
      // Com decaimento ele saturava em d/0.03 e só uma volta bem rápida
      // alcançava meia volta — giro moderado nunca ligava. Zerando na pausa,
      // "virar e segurar a direção" (que é o que atrapalhava a fluidez) some,
      // e qualquer giro contínuo, mesmo calmo, conta.
      if (Math.abs(d) < 0.015) {
        if (++toque.parado > 8) { toque.acum = 0; toque.parado = 0; }
      } else {
        toque.parado = 0;
        toque.acum += d;
      }
      toque.volta = toque.volta * 0.94 + Math.abs(d);
      // e só destrava se, no instante da meia volta, o dedo ainda estiver
      // rodando rápido: meia volta lenta é manobra, não espiral
      if (Math.abs(toque.acum) >= Math.PI && toque.volta >= CFG.ESPIRAL_MIN)
        toque.girando = true;
      toque.sentido = toque.sentido * 0.9 + Math.sign(d) * 0.1;
    }
    toque.ang = a;
  }
  // parou de rodar: destrava e o modo cai sozinho
  if (toque.girando && toque.volta < CFG.ESPIRAL_MIN * 0.55) toque.girando = false;
  const alvo = toque.girando
    ? limitar((toque.volta - CFG.ESPIRAL_MIN) /
              (CFG.ESPIRAL_MAX - CFG.ESPIRAL_MIN), 0, 1)
    : 0;
  espiral += (alvo - espiral) * 0.18;             // entra e sai macio
  if (espiral < 0.01) espiral = 0;
}

function velMaxTela() {
  const base = Math.max(0.9, CFG.VEL_MAX - buraco.nivel * CFG.VEL_PERDA);
  const gelado = buraco.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  return (turbo > 0 ? base * CFG.TERRA_FATOR : base) * gelado;
}

/* O rival: escolhe o alvo mais próximo de tempos em tempos e vai atrás.
   A mira tem erro de propósito — sem isso ele é perfeito e chato. */
function passoRival(rival, L) {
  const rm = raioMundoNivel(rival.nivel);
  const zr = zoomDoNivel(rival.nivel);

  // Com um poder de ataque na mão ele para de catar estrela e vai atrás de
  // alguém: o poder só rende com os dois na mesma tela. A presa é o líder que
  // não seja ele — atacar quem está na frente é o que mantém a corrida viva
  const caçando = rival.tiro > 0 || rival.dreno > 0;
  /* Com arma na mão a presa é o líder — mas só se der para alcançá-lo antes
     de o poder acabar. Atravessar a arena atrás do primeiro colocado com 8
     segundos de gelo no bolso terminava com o poder vencido no caminho e
     ninguém atingido; nesse caso vale mais gastar em quem estiver por perto. */
  let presa = null;
  if (caçando) {
    presa = lider(rival);
    if (presa && Math.hypot(presa.x - rival.x, presa.y - rival.y) >
                 visaoL() * CFG.RIVAL_ALCANCE_ARMA)
      presa = maisPerto(rival) || presa;
  }
  // Sem poder na mão, ainda há um motivo para procurar briga: na trombada
  // quem tem MENOS estrela é que paga. Se ele está por cima com folga, ir
  // para cima de alguém menor é lucro certo — e é o que faz a liderança
  // pesar em vez de só correr atrás de estrela
  // Sem teimosia ele reavalia a cada quadro e volta a catar estrela assim que
  // a vítima se afasta um pouco — a investida nunca se completa. Escolhida a
  // presa, ele insiste por um tempo
  if (rival.perseguindo > 0) rival.perseguindo--;
  let vitima = null;
  if (!caçando && esperaColisao <= 0 && rival.imune <= 0) {
    if (rival.perseguindo > 0 && rival.presa &&
        rival.comidas - rival.presa.comidas >= CFG.RIVAL_MARGEM &&
        rival.presa.imune <= 0) {
      vitima = rival.presa;
    } else {
      vitima = presaFraca(rival);
      if (vitima) { rival.presa = vitima; rival.perseguindo = CFG.RIVAL_TEIMOSIA; }
    }
  }
  const vivo = rival.alvo && (rival.alvo === terra || rival.alvo === marte ||
                              rival.alvo === saturno || rival.alvo === jupiter ||
                              rival.alvo === netuno || rival.alvo === buraco ||
                              rivais.indexOf(rival.alvo) >= 0 ||
                              estrelas.indexOf(rival.alvo) >= 0);
  if (caçando && presa) {
    rival.alvo = presa;
    rival.pensar = 1;
  } else if (vitima) {
    rival.alvo = vitima;
    rival.pensar = 1;
  } else if (--rival.pensar <= 0 || !vivo) {
    rival.pensar = CFG.RIVAL_PENSAR + Math.floor(Math.random() * CFG.RIVAL_PENSAR);
    /* Ficar COLADO no líder para disputar as mesmas estrelas foi tentado e
       medido como pior: perto do líder o rival trombava com ele, e na trombada
       quem tem menos estrela é quem paga. Sem arma na mão, chegar perto de
       quem está na frente é só entregar cinco estrelas. */
    let melhor = null, md = Infinity;
    for (const e of estrelas) {
      const d = Math.hypot(e.x - rival.x, e.y - rival.y);
      if (d < md) { md = d; melhor = e; }
    }
    /* Estando ATRÁS no placar, um planeta vale muito mais que uma estrela: é
       arma para cima de quem está na frente. Ele então aceita desviar bem mais
       da rota para pegar um. O laço também passou a escolher o planeta MAIS
       PERTO — antes ficava com o último da lista que coubesse no limite, que
       podia ser o mais distante dos cinco. */
    const chefe = lider(rival);
    const atras = chefe && chefe.comidas - rival.comidas >= CFG.RIVAL_MARGEM;
    const limite = md * (atras ? CFG.RIVAL_FOME_ARMA : 1.3);
    let mp = Infinity;
    for (const o of [terra, marte, saturno, jupiter, netuno]) {
      if (!o) continue;
      const d = Math.hypot(o.x - rival.x, o.y - rival.y);
      if (d < limite && d < mp) { mp = d; melhor = o; }
    }
    rival.alvo = melhor;
  }
  if (rival.alvo) {
    const dx = rival.alvo.x - rival.x, dy = rival.alvo.y - rival.y;
    rival.ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * CFG.RIVAL_MIRA;
    // com poder na mão ele mantém distância de tiro em vez de colar; indo
    // trombar, é o contrário — quer o encostão
    if (caçando) {
      const d = Math.hypot(dx, dy);
      const outroR = rival.alvo === buraco ? raioMundo() : raioMundoNivel(rival.alvo.nivel);
      if (d < (rm + outroR) * CFG.RIVAL_DISTANCIA) rival.ang += Math.PI;
    }
  }

  const zonzo = rival.atordoado > 0;
  if (zonzo) rival.atordoado--;
  const gelado = rival.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  const acel = (zonzo ? 0 : CFG.ACEL * CFG.RIVAL_FORCA * gelado) / zr;
  const atrito = zonzo ? CFG.COLISAO_ARRASTO : CFG.ATRITO;
  rival.vx = (rival.vx + Math.cos(rival.ang) * acel) * atrito;
  rival.vy = (rival.vy + Math.sin(rival.ang) * acel) * atrito;
  const vm = Math.max(0.9, CFG.VEL_MAX - rival.nivel * CFG.VEL_PERDA) * CFG.RIVAL_FORCA * gelado / zr;
  const v = Math.hypot(rival.vx, rival.vy);
  if (!zonzo && v > vm) { rival.vx = rival.vx / v * vm; rival.vy = rival.vy / v * vm; }
  rival.x += rival.vx; rival.y += rival.vy;

  const m = rm + 1;
  if (rival.x < L.x0 + m) { rival.x = L.x0 + m; rival.vx = Math.abs(rival.vx); }
  if (rival.y < L.y0 + m) { rival.y = L.y0 + m; rival.vy = Math.abs(rival.vy); }
  if (rival.x > L.x1 - m) { rival.x = L.x1 - m; rival.vx = -Math.abs(rival.vx); }
  if (rival.y > L.y1 - m) { rival.y = L.y1 - m; rival.vy = -Math.abs(rival.vy); }
}

/* O alvo de uma trombada proposital: o mais próximo que tenha bem menos
   estrela, esteja perto e não esteja de escudo. Sem a margem, dois quase
   empatados ficariam se perseguindo e a trombada viraria loteria. */
/* A vítima é o MAIOR que ele ainda ganha, não o mais perto. Antes ele batia
   em quem estivesse à mão, e o resultado era a CPU passar a partida inteira
   moendo o lanterna enquanto o líder disparava sozinho. Como na trombada quem
   paga é quem tem MENOS estrela, ir para cima do primeiro colocado que ele
   ainda vence é ao mesmo tempo a jogada mais lucrativa e a que segura a
   corrida — e é por isso que ele anda bem mais longe atrás do líder. */
function presaFraca(quem) {
  const chefe = lider(quem);
  const base = visaoL() * CFG.RIVAL_CACADA;
  let melhor = null, mc = -1, md = Infinity;
  for (const p of todos()) {
    if (p === quem || p.imune > 0) continue;
    if (quem.comidas - p.comidas < CFG.RIVAL_MARGEM) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d > base * (p === chefe ? CFG.RIVAL_CACADA_LIDER : 1)) continue;
    // chave de teste: com ela desligada ele volta a bater no mais PERTO
    const peso = CFG.RIVAL_ALVO_MAIOR ? p.comidas : -d;
    if (peso > mc || (peso === mc && d < md)) { mc = peso; md = d; melhor = p; }
  }
  return melhor;
}

/* o adversário visível mais próximo — é em quem o jogador acerta sem escolher */
function maisPerto(quem) {
  let melhor = null, md = Infinity;
  for (const p of todos()) {
    if (p === quem) continue;
    const d = Math.hypot(p.x - quem.x, p.y - quem.y);
    if (d < md && naTela(p.x, p.y, 0)) { md = d; melhor = p; }
  }
  return melhor;
}

/* quem está na frente, tirando quem perguntou */
function lider(quem) {
  let melhor = null;
  for (const p of todos()) {
    if (p === quem) continue;
    if (!melhor || p.comidas > melhor.comidas) melhor = p;
  }
  return melhor;
}

const raioDe = p => p === buraco ? raioMundo() : raioMundoNivel(p.nivel);

/* Todo mundo trombando com todo mundo, inclusive rival com rival: a partida
   com três vira uma disputa de verdade, não dois duelos separados. */
function passoTrombadas() {
  const lista = todos();
  for (let i = 0; i < lista.length; i++) {
    for (let j = i + 1; j < lista.length; j++) {
      const a = lista[i], b = lista[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const minimo = raioDe(a) + raioDe(b);
      if (d >= minimo) continue;
      const ux = dx / d, uy = dy / d;
      const folga = (minimo - d) / 2 + 1;
      b.x += ux * folga;  b.y += uy * folga;
      a.x -= ux * folga;  a.y -= uy * folga;
      if (cena === "jogo" && esperaColisao <= 0) trombada(a, b, ux, uy);
    }
  }
}

/* Encostou: os dois voam para lados opostos, a tela sacode forte, as cores
   se separam, e quem tem menos estrelas larga um punhado delas no campo. */
function trombada(a, b, ux, uy) {
  esperaColisao = CFG.COLISAO_ESPERA;
  const emp = CFG.COLISAO_EMPURRAO / zoom;
  a.vx = -ux * emp; a.vy = -uy * emp;
  b.vx =  ux * emp; b.vy =  uy * emp;
  for (const p of [a, b]) {
    // quem está com escudo é empurrado, mas não fica zonzo nem perde estrela:
    // "invencível" tem que valer também para o avanço do outro
    p.atordoado = p.imune > 0 ? 0 : CFG.COLISAO_ATORDOA;
    if (p.imune > 0) escudou(p, p.x, p.y);
    p.pulso = 1;
    bater(p, 0.48);                       // pancada: achatada forte
    p.surpresa = CFG.COLISAO_SURPRESA;
    if (p !== buraco) { p.alvo = null; p.perseguindo = 0; }  // reavalia depois do tranco
  }

  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const meu = a === buraco || b === buraco;
  if (meu) SFX.trombada();
  // só sacode a tela na trombada que envolve você; entre rivais, um estalo
  if (meu) {
    tremor = CFG.COLISAO_TREMOR;
    aberr = CFG.COLISAO_ABERR;
    flashLado = 30;
  } else if (naTela(mx, my, 20)) {
    tremor = Math.max(tremor, 10);
  }
  faiscar(mx, my, meu ? 34 : 18, 2, 8);
  aneis.push({ x: mx, y: my, r: 4, vida: 22, total: 22, rival: !meu });

  const perdedor = a.comidas <= b.comidas ? a : b;
  if (perdedor.imune > 0) return;               // escudo segura a conta também
  const quantas = Math.min(CFG.COLISAO_ESTRELAS, perdedor.comidas);
  if (quantas <= 0) return;
  perderEstrelas(perdedor, quantas, "trombada");
  for (let k = 0; k < quantas; k++) estrelas.push(estrelaSolta(perdedor, k, quantas));
}

/* as estrelas perdidas voltam para o campo, espalhadas em volta do perdedor */
function estrelaSolta(de, k, total) {
  const L = limites();
  const e = novaEstrela(null);
  const a = (k / total) * Math.PI * 2 + Math.random() * 0.5;
  // caem além do alcance de sucção dele: senão o perdedor reabsorve na hora
  const raio = raioMundoNivel(de.nivel) * CFG.ALCANCE_SUCCAO * (1.1 + Math.random() * 0.55);
  e.x = limitar(de.x + Math.cos(a) * raio, L.x0 + 4, L.x1 - 4);
  e.y = limitar(de.y + Math.sin(a) * raio, L.y0 + 4, L.y1 - 4);
  const v = (0.5 + Math.random() * 1.1) / zoom;
  e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
  e.presa = false;
  return e;
}

/* Uma estrela cadente atravessa o mapa de tempos em tempos. Quem encostar
   nela leva um punhado de estrelas de uma vez. */
/* O sentido é sorteado, mas o caminho passa perto de quem está jogando:
   ela nasce numa ponta do mapa, cruza o cenário à vista e sai pela outra.
   Sorteando só um ponto de partida, ela costumava riscar um canto vazio. */
function novaCadente() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  // ponto de travessia: perto do jogador, com uma folga para não ser sempre igual
  const px0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.55, L.x0 + 6, L.x1 - 6);
  const py0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.55, L.y0 + 6, L.y1 - 6);
  // recua desse ponto, no sentido contrário, até encostar na borda do mapa
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (px0 - L.x0) / ca : (L.x1 - px0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (py0 - L.y0) / sa : (L.y1 - py0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.CADENTE_VEL / zoom;
  return { x: px0 - ca * t, y: py0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 1800, rastro: [] };
}

function passoCadente(L) {
  if (!cadente) {
    if (--esperaCadente <= 0) { cadente = novaCadente(); esperaCadente = CFG.CADENTE_INTERVALO; }
    return;
  }
  cadente.rastro.unshift({ x: cadente.x, y: cadente.y });
  if (cadente.rastro.length > 14) cadente.rastro.pop();
  cadente.x += cadente.vx; cadente.y += cadente.vy;
  cadente.vida--;

  const rc = CFG.CADENTE_RAIO / zoom;
  for (const p of todos()) {
    const rp = raioDe(p);
    if (Math.hypot(cadente.x - p.x, cadente.y - p.y) < rp + rc) {
      faiscar(cadente.x, cadente.y, 30, 3, 8);
      for (let k = 0; k < 26; k++) {
        const a = Math.random() * Math.PI * 2, v = (0.7 + Math.random()) / zoom;
        faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: cadente.x, y: cadente.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                       vida: 18 + Math.floor(Math.random() * 14), arrasto: 0.97, tipo: "raio",
                       cor: COR.cadente[Math.floor(Math.random() * COR.cadente.length)] });
      }
      p.pulso = 1; p.boca = 22;
      if (p === buraco) { tremor = 16; aberr = CFG.ABERRACAO; soltarCoracoes(p.x, p.y, 18, 1.8, 1); }
      if (p === buraco) { anunciar("+" + CFG.CADENTE_PREMIO + "!", COR.cadente[2]); SFX.cadente(); }
      ganharEstrelas(p, CFG.CADENTE_PREMIO);
      cadente = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cadente.vida <= 0 ||
      cadente.x < L.x0 - fora || cadente.x > L.x1 + fora ||
      cadente.y < L.y0 - fora || cadente.y > L.y1 + fora) cadente = null;
}

/* O cometa usa a mesma travessia da estrela cadente — nasce numa ponta do
   mapa e cruza o cenário à vista — mas ele é o perigo: quem encostar fica
   congelado e anda mais devagar por um tempo. Vem mais devagar de propósito,
   para dar tempo de ler a trajetória e desviar. */
function novaCometa() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  const cx0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.5, L.x0 + 6, L.x1 - 6);
  const cy0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.5, L.y0 + 6, L.y1 - 6);
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (cx0 - L.x0) / ca : (L.x1 - cx0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (cy0 - L.y0) / sa : (L.y1 - cy0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.COMETA_VEL / zoom;
  return { x: cx0 - ca * t, y: cy0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 2400, rastro: [] };
}

function passoCometa(L) {
  if (!cometa) {
    if (--esperaCometa <= 0) { cometa = novaCometa(); esperaCometa = CFG.COMETA_INTERVALO; }
    return;
  }
  cometa.rastro.unshift({ x: cometa.x, y: cometa.y });
  if (cometa.rastro.length > CFG.COMETA_RABO) cometa.rastro.pop();
  cometa.x += cometa.vx; cometa.y += cometa.vy;
  cometa.vida--;
  if (quadro % 3 === 0) bafo(cometa.x, cometa.y, 1, 0.5);   // poeira caindo do rabo

  const rc = CFG.COMETA_RAIO / zoom;
  for (const p of todos()) {
    const rp = raioDe(p);
    if (Math.hypot(cometa.x - p.x, cometa.y - p.y) < rp + rc) {
      // com escudo, o cometa se despedaça sem deixar enjoo
      if (!escudou(p, cometa.x, cometa.y)) adoecer(p);
      cometa = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cometa.vida <= 0 ||
      cometa.x < L.x0 - fora || cometa.x > L.x1 + fora ||
      cometa.y < L.y0 - fora || cometa.y > L.y1 + fora) cometa = null;
}

/* Escudo de Netuno batendo: estilhaça o que veio e não deixa passar nada.
   Devolve true quando defendeu, para quem chamou saber que não deve seguir. */
function escudou(p, x, y) {
  if (p.imune <= 0) return false;
  p.pulso = Math.max(p.pulso, 0.7);
  if (p === buraco) {
    flashAzul = Math.max(flashAzul, 16);
    tremor = Math.max(tremor, 6);
  }
  aneis.push({ x: x, y: y, r: 2, vida: 16, total: 16, rival: p !== buraco, pal: p !== buraco ? paletaDe(p).disco : null });
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.1) / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 12 + Math.floor(Math.random() * 10), arrasto: 0.94, tipo: "raio",
                   cor: COR.arcoiris[Math.floor(Math.random() * COR.arcoiris.length)] });
  }
  return true;
}

function adoecer(p) {
  if (p === buraco) SFX.cometa();
  bater(p, 0.26);
  p.enjoo = CFG.COMETA_ENJOO;
  // o cometa não só atrasa: derruba estrelas na batida
  const cai = Math.min(CFG.COMETA_ESTRELAS, p.comidas);
  if (cai > 0) {
    perderEstrelas(p, cai);            // sem origem: o aviso sai junto do rótulo
    for (let k = 0; k < cai; k++) estrelas.push(estrelaSolta(p, k, cai));
  }
  p.perdeuNoCometa = cai;
  p.pulso = 1; p.boca = 24;
  bafo(p.x, p.y, 30, 1.6);
  aneis.push({ x: p.x, y: p.y, r: 3, vida: 20, total: 20, rival: p !== buraco,
               pal: p !== buraco ? paletaDe(p).disco : null });
  // a pancada também freia na hora: senão o congelamento demora a ser sentido
  p.vx *= 0.4; p.vy *= 0.4;
  if (p !== buraco) return;
  anunciar("SPEED DOWN", COR.enjoo);
  // o custo entra depois, com o mesmo desenho do "-X" do dreno
  if (p.perdeuNoCometa > 0)
    anunciarDepois("-" + p.perdeuNoCometa, COR.enjoo, CFG.ANUNCIO - 22);
  tremor = 30;                                  // batida: sacode mais
  aberr = CFG.ABERRACAO;
  flashEnjoo = 26;
}

/* bafo do cometa: lascas verdes, claras por fora e fortes no miolo */
function bafo(x, y, quantas, forca) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.3 + Math.random() * 1.2) * forca / zoom;
    faiscas.push({ curva: (Math.random() - 0.5) * 0.09, x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 20 + Math.floor(Math.random() * 20), arrasto: 0.95,
