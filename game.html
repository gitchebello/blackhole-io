<title>blackhole.io</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#fdf7fa;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #tela { display:block; width:100vw; height:100vh;
          image-rendering: pixelated; image-rendering: crisp-edges; }
</style>

"use strict";

/* ══════════════════════════════════════════════════════════════
   blackhole.io — protótipo 03
   Nebulosa criadora de estrelas. Engula estrelas para crescer.
   O universo se expande junto com você: quanto maior o buraco,
   mais longe a câmera fica e mais mapa aparece.
   ══════════════════════════════════════════════════════════════ */

/* ── parâmetros (mexa aqui pra ajustar o jogo) ───────────────── */
const CFG = {
  /* estrelas */
  ESTRELAS: 30,          // estrelas no campo no nível 0 (cresce junto com o mundo)
  DENSIDADE_FIXA: true,  // manter a mesma densidade quando o universo se expande

  /* crescimento */
  CUSTO_BASE: 5,         // estrelas para sair do nível 0
  CUSTO_PASSO: 2,        // cada nível custa isso a mais que o anterior
  META: 300,             // quem chegar a 300 estrelas primeiro vence
  NIVEL_MAX: 16,         // teto de TAMANHO, não de vitória: sem isso ele
                         // engoliria a tela. 300 estrelas caem por volta do
                         // nível 15, então o teto quase nunca é encostado
  RAIO_BASE: 12,         // raio APARENTE (na tela) no nível 0 — tem que caber a carinha
  RAIO_TELA_PASSO: 1.4,  // quanto o raio aparente cresce por nível

  /* universo em expansão */
  /* A câmera abre PROGRESSIVAMENTE: cada nível revela mais campo que o
     anterior. O zoom sai de 1/(1 + n*PASSO + n²*CURVA), então a LARGURA vista
     cresce como (1 + n*PASSO + n²*CURVA) — o termo quadrático é o que faz
     cada nível render mais que o de antes. Com a fórmula linear antiga, a
     abertura ia diminuindo em campo visto conforme o zoom caía. */
  ZOOM_PASSO: 0.022,     // abertura por nível
  ZOOM_CURVA: 0.0016,    // e o quanto essa abertura acelera
  ZOOM_MIN: 0.55,        // afastamento máximo
  MUNDO_MULT: 2.4,       // o mundo tem esta vez o tamanho do que a câmera vê

  /* movimento (em pixels de TELA por quadro: o mundo já compensa o zoom) */
  ACEL: 0.34,
  ATRITO: 0.93,
  VEL_MAX: 2.2,
  VEL_PERDA: 0.025,       // perda de velocidade aparente por nível

  /* sucção */
  ALCANCE_SUCCAO: 3.6,   // raio de atração, em múltiplos do raio do buraco
  FORCA_SUCCAO: 0.17,
  GIRO_SUCCAO: 1.2,      // quanto a estrela rodopia enquanto é sugada

  /* Terra */
  TERRA_RAIO: 7,         // raio aparente da Terra, na tela
  TERRA_ESPERA: 600,     // quadros até uma nova Terra aparecer (600 = 10s)
  TERRA_TURBO: 600,      // duração do turbo (600 = 10s)
  TERRA_FATOR: 1.5,      // multiplicador de velocidade do turbo

  /* Marte — o planeta vermelho: vira ímã por um tempo */

  MARTE_ESPERA: 600,     // mesma frequência da Terra (600 = 10s)
  MARTE_IMA: 300,        // duração do ímã (300 = 5s)
  MARTE_ALCANCE: 1.35,   // quanto o alcance de sucção estica no ímã
  MARTE_FORCA: 1,        // sem puxão extra: esticar o alcance já reforça o perto
  MARTE_CLARAO: 24,      // flash vermelho ao devorá-lo

  /* Saturno — o dos anéis: vira uma torre de gelo por um tempo */
  SATURNO_RAIO: 7,

  ABERRACAO: 26,         // quadros de aberração cromática ao crescer
  ARCO: 34,              // quadros do estouro arco-íris ao crescer

  VINHETA_FIM: 0.96,     // onde ele chega ao máximo (1 = borda da tela)

  COLISAO_EMPURRAO: 9,   // com que força os dois são arremessados

  COLISAO_SURPRESA: 50,  // quadros de cara de espanto depois da pancada

  COMETA_VEL: 2.5,         // mais devagar que a cadente: dá para desviar
  COMETA_RAIO: 14,        // bem maior que a cadente: é obstáculo, não prêmio
  COMETA_ENJOO: 300,        // duração do enjoo (300 = 5s)
  COMETA_FREIO: 0.75,      // fica com 75% da velocidade enquanto durar
  COMETA_RABO: 34,         // comprimento do rastro azul
  ABERRACAO_MAX: 2,      // deslocamento máximo dos canais, em pixels

  ZONA_MORTA: 4,
  /* modo sucção: rodar o dedo em círculo acelera a rotação do buraco */

  // é enorme, e um multiplicador alto por cima varria a tela de estrelas

  ESPIRAL_FORCA: 0.48,    // e quanto o puxão fica mais firme

  SEMENTE: 20260823

"/":["....#","....#","...#.","..#..",".#...","#....","#....","....."],
"-":[".....",".....",".....",".###.",".....",".....",".....","....."],
"+":[".....","..#..","..#..","#####","..#..","..#..",".....","....."],
"!":["..#..","..#..","..#..","..#..","..#..",".....","..#..","....."],
"?":[".###.","#...#","....#","..##.","..#..",".....","..#..","....."],
" ":[".....",".....",".....",".....",".....",".....",".....","....."]
};

/* cada glifo guarda onde começa e quanto ocupa: o texto sai proporcional,
   e não com o espaçamento de máquina de escrever */
const GLIFOS = {};
for (const ch in FONTE) {
  const linhas = FONTE[ch];
  let c0 = 99, c1 = -1;
  for (let y = 0; y < FONTE_H; y++)
    for (let x = 0; x < 5; x++)
      if (linhas[y][x] === "#") { if (x < c0) c0 = x; if (x > c1) c1 = x; }
  if (c1 < 0) { c0 = 0; c1 = 1; }                 // o espaço tem 2 de largura
  GLIFOS[ch] = { linhas: linhas, c0: c0, larg: c1 - c0 + 1 };
}
const VAO = 1;                                     // vão entre letras
const glifo = ch => GLIFOS[ch] || GLIFOS[ch.toUpperCase()] || GLIFOS[" "];

/* ── utilidades ──────────────────────────────────────────────── */
function semente(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const suave = t => t * t * (3 - 2 * t);
const misturar = (a, b, t) => a + (b - a) * t;
const limitar = (v, a, b) => (v < a ? a : v > b ? b : v);

function embaralha(x, y, s) {
  let h = x * 374761393 + y * 668265263 + s * 1274126177;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function ruido(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const tx = suave(x - xi), ty = suave(y - yi);
  const a = embaralha(xi, yi, s),     b = embaralha(xi + 1, yi, s);
  const c = embaralha(xi, yi + 1, s), d = embaralha(xi + 1, yi + 1, s);
  return misturar(misturar(a, b, tx), misturar(c, d, tx), ty);
}
function fractal(x, y, s, oitavas) {
  let soma = 0, amp = 1, freq = 1, norma = 0;
  for (let i = 0; i < oitavas; i++) {
    soma += ruido(x * freq, y * freq, s + i * 101) * amp;
    norma += amp; amp *= 0.5; freq *= 2;
  }
  return soma / norma;
}

/* ── canvas e escala ─────────────────────────────────────────── */
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d", { alpha: false });

let VL = 240, VA = 400, escala = 2;

function redimensionar() {
  const sl = Math.max(1, window.innerWidth);
  const sa = Math.max(1, window.innerHeight);
  escala = Math.max(1, Math.round(sl / 200));
  VL = Math.ceil(sl / escala);
  VA = Math.ceil(sa / escala);
  tela.width = VL; tela.height = VA;
  tela.style.width = sl + "px";
  tela.style.height = sa + "px";
  ctx.imageSmoothingEnabled = false;
}
redimensionar();
window.addEventListener("resize", () => { redimensionar(); });

/* ── o mundo é do tamanho do universo TOTALMENTE expandido; a área
      jogável começa pequena no meio e vai abrindo conforme o nível ── */
const MUNDO = {
  L: Math.ceil(VL / CFG.ZOOM_MIN * CFG.MUNDO_MULT),
  A: Math.ceil(VA / CFG.ZOOM_MIN * CFG.MUNDO_MULT)
};

// matriz de Bayer: mistura duas cores vizinhas com pontilhado,
// que é como a pixel art faz degradê sem inventar cor nova
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

/* Sorteia algumas nuvens espalhadas, de cores alternadas. Cada nuvem é
   um punhado de bolhas redondas que se fundem — fica fofa e simples de ler,
   em vez de fibrosa. Fora delas o espaço é preto de verdade. */
function sortearNebulosas() {
  const r = semente(CFG.SEMENTE + 17);
  const lista = [];
  const raioBase = Math.min(MUNDO.L, MUNDO.A) * 0.15;
  for (let tent = 0; tent < 1200 && lista.length < CFG.NEBULOSAS; tent++) {
    const rx = raioBase * (0.7 + r() * 0.7);
    const ry = rx * (0.75 + r() * 0.5);
    const n = { x: MUNDO.L * (0.12 + r() * 0.76),
                y: MUNDO.A * (0.10 + r() * 0.80),
                rx: rx, ry: ry, esc: 1 / (30 + r() * 20),
                s: Math.floor(r() * 90000), pal: 0, bolhas: [], R: 0 };

    // as bolhas: uma grande no meio e outras menores em volta
    const quantas = 6 + Math.floor(r() * 4);
    for (let k = 0; k < quantas; k++) {
      const a = r() * Math.PI * 2, dist = k === 0 ? 0 : 0.12 + r() * 0.5;
      const b = { dx: Math.cos(a) * dist * n.rx,
                  dy: Math.sin(a) * dist * n.ry,
                  r: (k === 0 ? 0.55 : 0.32 + r() * 0.22) * n.rx };
      n.bolhas.push(b);
      n.R = Math.max(n.R, Math.hypot(b.dx, b.dy) + b.r);
    }

    let cabe = true;
    for (const o of lista)
      if (Math.hypot(o.x - n.x, o.y - n.y) < (o.R + n.R) * 0.72) cabe = false;
    if (cabe) lista.push(n);
  }
  // cores: uma parte para cada, embaralhadas, e sem duas vizinhas iguais
  const vizinho = i => {
    let melhor = -1, dm = Infinity;
    for (let j = 0; j < lista.length; j++) {
      if (j === i) continue;
      const d = Math.hypot(lista[j].x - lista[i].x, lista[j].y - lista[i].y);
      if (d < dm) { dm = d; melhor = j; }
    }
    return melhor;
  };
  for (let i = 0; i < lista.length; i++) lista[i].pal = i % COR.nebs.length;
  for (let i = lista.length - 1; i > 0; i--) {          // embaralha as cores
    const j = Math.floor(r() * (i + 1));
    const t = lista[i].pal; lista[i].pal = lista[j].pal; lista[j].pal = t;
  }
  for (let passe = 0; passe < 8; passe++) {
    let tudoCerto = true;
    for (let i = 0; i < lista.length; i++) {
      const v = vizinho(i);
      if (v < 0 || lista[v].pal !== lista[i].pal) continue;
      tudoCerto = false;
      for (let j = 0; j < lista.length; j++)
        if (j !== i && j !== v && lista[j].pal !== lista[i].pal) {
          const t = lista[i].pal; lista[i].pal = lista[j].pal; lista[j].pal = t;
          break;
        }
    }
    if (tudoCerto) break;
  }
  return lista;
}
const NEBULOSAS = sortearNebulosas();

/* A nebulosa é pintada uma vez POR CAMADA DE ZOOM. Antes existia um único
   canvas no tamanho do universo inteiro, que era encolhido na hora de
   desenhar — e encolher pixel art come pixels: o pontilhado virava moiré e
   ainda custava caro, porque a cada quadro o navegador reamostrava uma área
   enorme. Agora cada camada já nasce na resolução em que vai aparecer, então
   o desenho sai 1:1, sem serrilhado e sem reamostragem. */
function pintarNebulosa(escala) {
  const L = Math.max(1, Math.round(MUNDO.L * escala));
  const A = Math.max(1, Math.round(MUNDO.A * escala));
  const cv = document.createElement("canvas");
  cv.width = L; cv.height = A;
  const fx = cv.getContext("2d");
  const img = fx.createImageData(L, A);
  const d = img.data;
  const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const paletas = COR.nebs.map(p => p.map(rgb));
  const vazio = rgb(COR.vazio);
  for (let i = 0; i < d.length; i += 4) {
    d[i] = vazio[0]; d[i+1] = vazio[1]; d[i+2] = vazio[2]; d[i+3] = 255;
  }

  /* densidade em blocos de 2x2 PIXELS DE TELA (assim o grão da nuvem tem
     o mesmo tamanho aparente em todas as camadas) */
  const BL = Math.ceil(L / 2), BA = Math.ceil(A / 2);
  const forca = new Float32Array(BL * BA);
  const dono  = new Uint8Array(BL * BA);

  for (const n of NEBULOSAS) {
    const bx0 = Math.max(0, Math.floor((n.x - n.R) * escala / 2));
    const bx1 = Math.min(BL - 1, Math.ceil((n.x + n.R) * escala / 2));
    const by0 = Math.max(0, Math.floor((n.y - n.R) * escala / 2));
    const by1 = Math.min(BA - 1, Math.ceil((n.y + n.R) * escala / 2));
    for (let by = by0; by <= by1; by++) {
      for (let bx = bx0; bx <= bx1; bx++) {
        const x = bx * 2 / escala, y = by * 2 / escala;   // volta pro mundo
        let v = 0;
        for (const b of n.bolhas) {          // bolhas que se fundem
          const dx = x - n.x - b.dx, dy = y - n.y - b.dy;
          const t = 1 - (dx * dx + dy * dy) / (b.r * b.r);
          if (t > 0) v += t * t;
        }
        if (v <= 0) continue;
        // um tempero de ruído só para a borda não ficar de compasso
        v *= 0.82 + 0.3 * fractal(x * n.esc, y * n.esc, n.s, 3);
        v = Math.min(1, v * 0.42);   // sobe o miolo até os tons fortes; a franja segue rala
        if (v <= 0.02) continue;
        const i = by * BL + bx;
        if (v > forca[i]) { forca[i] = v; dono[i] = n.pal; }
      }
    }
  }

  const DEGRAUS = 6;
  for (let by = 0; by < BA; by++) {
    for (let bx = 0; bx < BL; bx++) {
      const i = by * BL + bx;
      const v = forca[i];
      if (v <= 0) continue;
      const paleta = paletas[dono[i]];
      const tom = Math.min(1, v) * DEGRAUS;
      const base = Math.floor(tom), frac = tom - base;
      for (let oy = 0; oy < 2; oy++) {
        const y = by * 2 + oy; if (y >= A) break;
        for (let ox = 0; ox < 2; ox++) {
          const x = bx * 2 + ox; if (x >= L) break;
          const lim = (BAYER[(x & 3) + (y & 3) * 4] + embaralha(x, y, 31) * 5 - 2.5) / 16;
          const passo = base + (frac > lim ? 1 : 0);
          if (passo <= 0) continue;                    // franja pontilhada: vira vácuo
          const cor = paleta[Math.min(paleta.length - 1, passo - 1)];
          const j = (y * L + x) * 4;
          d[j] = cor[0]; d[j+1] = cor[1]; d[j+2] = cor[2];
        }
      }
    }
  }
  fx.putImageData(img, 0, 0);

  // poeira estelar: pontinhos fixos que dão profundidade (não são comestíveis)
  const r = semente(CFG.SEMENTE + 99);
  const pontos = Math.round(MUNDO.L * MUNDO.A / 1100);
  for (let i = 0; i < pontos; i++) {
    fx.fillStyle = COR.poeira[Math.floor(r() * COR.poeira.length)];
    fx.fillRect(Math.round(r() * MUNDO.L * escala), Math.round(r() * MUNDO.A * escala), 1, 1);
  }
  for (let i = 0; i < pontos / 9; i++) {
    fx.fillStyle = COR.poeira[2];
    fx.fillRect(Math.round(r() * MUNDO.L * escala), Math.round(r() * MUNDO.A * escala), 1, 1);
  }
  return { escala: escala, canvas: cv };
}

/* uma camada por degrau de zoom, da mais próxima à mais afastada */
const CAMADAS = [];
const N_CAMADAS = 4;
for (let i = 0; i < N_CAMADAS; i++)
  CAMADAS.push(pintarNebulosa(1 - (1 - CFG.ZOOM_MIN) * i / (N_CAMADAS - 1)));

/* a menor camada que ainda não precisa ser ampliada */
function camadaAtual() {
  let melhor = CAMADAS[CAMADAS.length - 1];
  for (const c of CAMADAS) if (c.escala >= zoom - 0.001) melhor = c;
  return melhor;
}

/* ── sprite da Terra: 8 quadros de rotação, desenhados pixel a pixel ──
   A silhueta é montada linha a linha com a MESMA regra do disco() do jogo
   (largura = round(sqrt(R²-dy²))). Desenhar por distância euclidiana dava um
   contorno diferente do resto e a bolinha parecia recortada em quadrado. */
const TERRA_D = CFG.TERRA_RAIO * 2 + 1;
const TERRA_QUADROS = 8;
const terraSprite = document.createElement("canvas");
terraSprite.width = TERRA_D * TERRA_QUADROS; terraSprite.height = TERRA_D;

/* largura da linha dy de um círculo de raio R, do jeito do disco() */
function meiaLinha(R, dy) {
  const f = R * R - dy * dy;
  return f <= 0 ? -1 : Math.floor(Math.sqrt(f) + 0.5);
}

function desenharSpriteTerra() {
  const fx = terraSprite.getContext("2d");
  const R = CFG.TERRA_RAIO, c = R;
  const oceano = ["#4f93c9","#74b4e2","#9dd0f2"];
  const terra  = ["#3f9e74","#5cbf92","#82d9b0"];
  const gelo   = ["#d2ecf8","#e8f6ff","#ffffff"];
  const limbo  = "#3a76a6";

  for (let q = 0; q < TERRA_QUADROS; q++) {
    const giro = q * (12 / TERRA_QUADROS);
    for (let y = 0; y < TERRA_D; y++) {
      const dy = y - c;
      const w = meiaLinha(R, dy);
      if (w < 0) continue;
      for (let x = c - w; x <= c + w; x++) {
        const dx = x - c;
        const luz = limitar((-dx - dy) / (R * 1.9) + 0.5, 0, 1);
        const tom = luz > 0.68 ? 2 : luz > 0.36 ? 1 : 0;
        let cor;
        // o fio de contorno acompanha a linha, não o raio: fica de 1 px
        // uniforme em toda a volta em vez de engrossar em cima e embaixo
        // só a ponta de cada linha: o fio grosso em cima e embaixo é o que
        // fazia o degrau da esfera saltar aos olhos
        const naBorda = (x === c - w || x === c + w);
        if (naBorda) {
          cor = limbo;
        } else if (Math.abs(dy) > R * 0.62 && Math.abs(dx) < w * 0.5) {
          // calota medida pela LARGURA da linha, não pelo raio: assim ela
          // afina junto com o polo em vez de virar uma tampa branca
          cor = gelo[tom];
        } else {
          const lon = Math.asin(limitar(dx / Math.sqrt(Math.max(0.01, R * R - dy * dy)), -1, 1));
          const n = fractal(lon * 3.4 + giro, y * 0.34, CFG.SEMENTE + 5150, 2);
          cor = n > 0.53 ? terra[tom] : oceano[tom];
        }
        fx.fillStyle = cor;
        fx.fillRect(q * TERRA_D + x, y, 1, 1);
      }
    }
    fx.fillStyle = "#ffffff";                   // brilho especular
    fx.fillRect(q * TERRA_D + c - Math.round(R * 0.45), c - Math.round(R * 0.45), 1, 1);
  }
}
desenharSpriteTerra();

/* ── sprite de Marte: vermelho de verdade ────────────────────
   Nada de ruído fino: Io era manchado de pontinhos e os dois ficavam
   parecidos. Aqui as regiões escuras são FAIXAS largas de latitude, que é
   como Marte se lê de longe — um vermelho forte cortado por mares escuros,
   com a calota branca só no norte. */
const MARTE_D = CFG.MARTE_RAIO * 2 + 1;
const MARTE_QUADROS = 8;
const marteSprite = document.createElement("canvas");
marteSprite.width = MARTE_D * MARTE_QUADROS; marteSprite.height = MARTE_D;

function desenharSpriteMarte() {
  const fx = marteSprite.getContext("2d");
  const R = CFG.MARTE_RAIO, c = R;
  const vermelho = ["#c2231c","#e33a2b","#f4614a"];   // o corpo, saturado
  const mar      = ["#a1201a","#bd2f25","#d44a3a"];   // regiões escuras, mas perto
                                                     // do corpo: com contraste alto
                                                     // a mancha vira vinco na esfera
  const gelo     = ["#f0e4e0","#faf2ef","#ffffff"];
  const limbo    = "#7a0f10";

  for (let q = 0; q < MARTE_QUADROS; q++) {
    const giro = q * (Math.PI * 2 / MARTE_QUADROS);
    for (let y = 0; y < MARTE_D; y++) {
      const dy = y - c;
      const w = meiaLinha(R, dy);
      if (w < 0) continue;
      for (let x = c - w; x <= c + w; x++) {
        const dx = x - c;
        const luz = limitar((-dx - dy) / (R * 1.9) + 0.5, 0, 1);
        const tom = luz > 0.68 ? 2 : luz > 0.36 ? 1 : 0;
        let cor;
        // só a ponta de cada linha: o fio grosso em cima e embaixo é o que
        // fazia o degrau da esfera saltar aos olhos
        const naBorda = (x === c - w || x === c + w);
        if (naBorda) {
          cor = limbo;
        } else if (dy < -R * 0.66 && Math.abs(dx) < w * 0.45) {
          cor = gelo[tom];                      // calota norte, só uma
        } else {
          const lon = Math.asin(limitar(dx / Math.sqrt(Math.max(0.01, R * R - dy * dy)), -1, 1));
          // faixas largas: duas senoides de latitude moduladas pela longitude
          // frequência alta o bastante para caber 2 ou 3 faixas num raio de 7:
          // com faixa larga demais sobra uma mancha só, e ela lê como sujeira
          const faixa = Math.sin(dy * 1.15 + Math.sin(lon + giro) * 1.1) +
                        0.55 * Math.sin(dy * 0.5 - lon * 1.7 + giro);
          cor = faixa > 0.35 ? mar[tom] : vermelho[tom];
        }
        fx.fillStyle = cor;
        fx.fillRect(q * MARTE_D + x, y, 1, 1);
      }
    }
    fx.fillStyle = "#ff9d86";                   // brilho quente no alto-esquerda
    fx.fillRect(q * MARTE_D + c - Math.round(R * 0.45), c - Math.round(R * 0.45), 1, 1);
  }
}
desenharSpriteMarte();

/* ── sprite de Saturno: só o corpo, em amarelo pastel ────────
   O anel não cabe aqui: ele passa por trás e por diante do planeta, então
   é desenhado na hora, em duas metades, com o corpo no meio. */
const SAT_D = CFG.SATURNO_RAIO * 2 + 1;
const SAT_QUADROS = 8;
const saturnoSprite = document.createElement("canvas");
saturnoSprite.width = SAT_D * SAT_QUADROS; saturnoSprite.height = SAT_D;

function desenharSpriteSaturno() {
  const fx = saturnoSprite.getContext("2d");
  const R = CFG.SATURNO_RAIO, c = R;
  const S = COR.saturno;
  const limbo = S[5];

  for (let q = 0; q < SAT_QUADROS; q++) {
    const giro = q * (Math.PI * 2 / SAT_QUADROS);
    for (let y = 0; y < SAT_D; y++) {
      const dy = y - c;
      const w = meiaLinha(R, dy);
      if (w < 0) continue;
      for (let x = c - w; x <= c + w; x++) {
        const dx = x - c;
        const luz = limitar((-dx - dy) / (R * 1.9) + 0.5, 0, 1);
        let cor;
        if (x === c - w || x === c + w) {
          cor = limbo;
        } else {
          // faixas horizontais suaves, que é o que Saturno tem de marcante
          const banda = Math.sin(dy * 1.5 + Math.sin(giro) * 0.5) * 0.5 + 0.5;
          // faixa mais larga de tons: o corpo estava pálido demais e sumia
          const t = limitar(luz * 0.62 + banda * 0.38, 0, 0.999);
          cor = S[Math.min(4, Math.floor((1 - t) * 5.6))];
        }
        fx.fillStyle = cor;
        fx.fillRect(q * SAT_D + x, y, 1, 1);
      }
    }
  }
}
desenharSpriteSaturno();

/* ── sprite de Júpiter: faixas roxas e a mancha ──────────────
   O que identifica Júpiter de longe são as listras horizontais e a mancha
   oval. As listras aqui são função só de dy, então ficam retas e paralelas;
   é o que separa a leitura dele da de Marte, cujas faixas ondulam. */
const JUP_D = CFG.JUPITER_RAIO * 2 + 1;
const JUP_QUADROS = 8;
const jupiterSprite = document.createElement("canvas");
jupiterSprite.width = JUP_D * JUP_QUADROS; jupiterSprite.height = JUP_D;

function desenharSpriteJupiter() {
  const fx = jupiterSprite.getContext("2d");
  const R = CFG.JUPITER_RAIO, c = R;
  const J = COR.jupiter;

  for (let q = 0; q < JUP_QUADROS; q++) {
    const giro = q * (Math.PI * 2 / JUP_QUADROS);
    for (let y = 0; y < JUP_D; y++) {
      const dy = y - c;
      const w = meiaLinha(R, dy);
      if (w < 0) continue;
      for (let x = c - w; x <= c + w; x++) {
        const dx = x - c;
        const luz = limitar((-dx - dy) / (R * 1.9) + 0.5, 0, 1);
        let cor;
        if (x === c - w || x === c + w) {
          cor = J[5];
        } else {
          const lon = Math.asin(limitar(dx / Math.sqrt(Math.max(0.01, R * R - dy * dy)), -1, 1));
          const listra = Math.sin(dy * 1.9) * 0.5 + 0.5;
          const t = limitar(luz * 0.55 + listra * 0.45, 0, 0.999);
          cor = J[Math.min(4, Math.floor((1 - t) * 5.2))];
          // a mancha: uma oval que dá a volta com o planeta
          const ml = lon + giro;
          const dml = Math.atan2(Math.sin(ml - 1.1), Math.cos(ml - 1.1));
          if (Math.abs(dml) < 0.55 && Math.abs(dy - R * 0.22) < R * 0.28)
            cor = luz > 0.5 ? J[1] : J[2];
        }
        fx.fillStyle = cor;
        fx.fillRect(q * JUP_D + x, y, 1, 1);
      }
    }
  }
}
desenharSpriteJupiter();

/* ── sprite de Netuno: azul profundo e saturado ──────────────
   Faixas suaves e uma mancha escura. Bem mais escuro que a Terra, senão os
   dois azuis se confundem no campo. */
const NET_D = CFG.NETUNO_RAIO * 2 + 1;
const NET_QUADROS = 8;
const netunoSprite = document.createElement("canvas");
netunoSprite.width = NET_D * NET_QUADROS; netunoSprite.height = NET_D;

function desenharSpriteNetuno() {
  const fx = netunoSprite.getContext("2d");
  const R = CFG.NETUNO_RAIO, c = R;
  const N = COR.netuno;

  for (let q = 0; q < NET_QUADROS; q++) {
    const giro = q * (Math.PI * 2 / NET_QUADROS);
    for (let y = 0; y < NET_D; y++) {
      const dy = y - c;
      const w = meiaLinha(R, dy);
      if (w < 0) continue;
      for (let x = c - w; x <= c + w; x++) {
        const dx = x - c;
        const luz = limitar((-dx - dy) / (R * 1.9) + 0.5, 0, 1);
        let cor;
        if (x === c - w || x === c + w) {
          cor = N[4];
        } else {
          const lon = Math.asin(limitar(dx / Math.sqrt(Math.max(0.01, R * R - dy * dy)), -1, 1));
          const listra = Math.sin(dy * 1.6 + Math.sin(lon + giro) * 0.4) * 0.5 + 0.5;
          const t = limitar(luz * 0.6 + listra * 0.4, 0, 0.999);
          cor = N[Math.min(4, Math.floor((1 - t) * 4.4))];
          const ml = Math.atan2(Math.sin(lon + giro - 0.8), Math.cos(lon + giro - 0.8));
          if (Math.abs(ml) < 0.5 && Math.abs(dy + R * 0.15) < R * 0.26) cor = N[4];
        }
        fx.fillStyle = cor;
        fx.fillRect(q * NET_D + x, y, 1, 1);
      }
    }
  }
}
desenharSpriteNetuno();

/* ── desenho em pixel cheio (sem antialias) ──────────────────── */
function disco(cx, cy, raio, cor) {
  ctx.fillStyle = cor;
  const r = Math.round(raio), x0 = Math.round(cx), y0 = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) {
    const larg = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) + 0.5);
    if (larg <= 0) continue;
    ctx.fillRect(x0 - larg, y0 + dy, larg * 2 + 1, 1);
  }
}
function oval(cx, cy, rx, ry, cor) {
  ctx.fillStyle = cor;
  const x0 = Math.round(cx), y0 = Math.round(cy);
  const ay = Math.round(ry);
  for (let dy = -ay; dy <= ay; dy++) {
    const t = ry > 0 ? 1 - (dy * dy) / (ry * ry) : 1;
    if (t < 0) continue;
    const w = Math.round(rx * Math.sqrt(t));
    ctx.fillRect(x0 - w, y0 + dy, w * 2 + 1, 1);
  }
}
function carimbo(mapa, cx, cy, cor) {          // estampa um desenhinho centrado
  ctx.fillStyle = cor;
  const l = mapa[0].length, a = mapa.length;
  const x0 = Math.round(cx - l / 2), y0 = Math.round(cy - a / 2);
  for (let y = 0; y < a; y++) {
    const linha = mapa[y];
    for (let x = 0; x < l; x++) if (linha[x] === "#") ctx.fillRect(x0 + x, y0 + y, 1, 1);
  }
}

function anel(cx, cy, raio, esp, cor) {        // rosca preenchida, sem antialias
  ctx.fillStyle = cor;
  const x0 = Math.round(cx), y0 = Math.round(cy);
  const re = raio, ri = Math.max(0, raio - esp);
  const R = Math.ceil(re);
  for (let dy = -R; dy <= R; dy++) {
    const fe = re * re - dy * dy;
    if (fe <= 0) continue;
    const we = Math.floor(Math.sqrt(fe) + 0.5);
    const fi = ri * ri - dy * dy;
    const wi = fi > 0 ? Math.floor(Math.sqrt(fi) + 0.5) : -1;
    if (wi < 0) ctx.fillRect(x0 - we, y0 + dy, we * 2 + 1, 1);
    else {
      ctx.fillRect(x0 - we, y0 + dy, we - wi, 1);
      ctx.fillRect(x0 + wi + 1, y0 + dy, we - wi, 1);
    }
  }
}

function px(x, y, cor) {
  ctx.fillStyle = cor;
  ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
}
function desenhaGlifos(str, x, y, cor, tam) {
  ctx.fillStyle = cor;
  let cx = Math.round(x), cy = Math.round(y);
  for (const ch of str) {
    const g = glifo(ch);
    for (let ly = 0; ly < FONTE_H; ly++) {
      const linha = g.linhas[ly];
      for (let lx = 0; lx < g.larg; lx++)
        if (linha[g.c0 + lx] === "#")
          ctx.fillRect(cx + lx * tam, cy + ly * tam, tam, tam);
    }
    cx += (g.larg + VAO) * tam;
  }
}
function texto(str, x, y, cor, tam) {
  // contorno branco em volta: no céu claro, com estrela preta passando atrás,
  // uma sombra só de um lado não segura a leitura
  tam = tam || 1;
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      if (dx || dy) desenhaGlifos(str, x + dx * tam, y + dy * tam, COR.vazio, tam);
  desenhaGlifos(str, x, y, cor, tam);
}
function larguraTexto(str, tam) {
  tam = tam || 1;
  let l = 0;
  for (const ch of str) l += (glifo(ch).larg + VAO) * tam;
  return Math.max(0, l - VAO * tam);
}
function textoCentro(str, y, cor, tam) {
  texto(str, Math.round((VL - larguraTexto(str, tam || 1)) / 2), y, cor, tam);
}
function caixa(r, corFundo, corBorda) {
  ctx.fillStyle = corFundo;
  ctx.fillRect(r.x, r.y, r.l, r.a);
  ctx.fillStyle = corBorda;
  ctx.fillRect(r.x, r.y, r.l, 1); ctx.fillRect(r.x, r.y + r.a - 1, r.l, 1);
  ctx.fillRect(r.x, r.y, 1, r.a); ctx.fillRect(r.x + r.l - 1, r.y, 1, r.a);
}

function dentro(gx, gy, r, folga) {
  folga = folga || 0;
  return gx >= r.x - folga && gx <= r.x + r.l + folga &&
         gy >= r.y - folga && gy <= r.y + r.a + folga;
}

  return { x0: (MUNDO.L - l) / 2, y0: (MUNDO.A - a) / 2,
           x1: (MUNDO.L + l) / 2, y1: (MUNDO.A + a) / 2, l: l, a: a };
}

  if (!CFG.DENSIDADE_FIXA) return CFG.ESTRELAS;
  const base = (VL * CFG.MUNDO_MULT) * (VA * CFG.MUNDO_MULT);
  const agora = limites().l * limites().a;
  return Math.round(CFG.ESTRELAS * agora / base);
}

function novaEstrela(longeDe) {

      y: L.y0 + 6 + rnd() * (L.a - 12),
      fase: rnd() * Math.PI * 2,
      ritmo: 0.05 + rnd() * 0.07,
      giro: rnd() < 0.5 ? -1 : 1,
      sx: 0, sy: 0, salc: 1,
      vx: 0, vy: 0, presa: false

    if (!longeDe) return e;
    if (Math.hypot(e.x - longeDe.x, e.y - longeDe.y) > visaoL() * 0.45) return e;
  }
  return { x: L.x0 + L.l * rnd(), y: L.y0 + L.a * rnd(), fase: 0,
           ritmo: 0.06, giro: rnd() < 0.5 ? -1 : 1, vx: 0, vy: 0, presa: false };

const toque = { ativo: false, ax: 0, ay: 0, x: 0, y: 0, id: null,
                ang: null, volta: 0, sentido: 0 };
let espiral = 0;          // 0 a 1: o quanto o gesto de espiral está valendo
const teclas = Object.create(null);

function jogar() { reiniciar(); cena = "jogo"; }
function sair()  { toque.ativo = false; toque.id = null; toque.ang = null;
                   toque.volta = 0; espiral = 0; cena = "menu"; reiniciar(); }

tela.addEventListener("pointerdown", e => {
  e.preventDefault();
  const gx = e.clientX / escala, gy = e.clientY / escala;

  if (cena === "menu") {
    if (dentro(gx, gy, botaoJogar(), 6)) jogar();
    return;
  }
  if (cena === "fim") {
    if (dentro(gx, gy, botaoJogar(), 6)) jogar();
    else if (dentro(gx, gy, botaoSair(), 8)) sair();
    return;
  }
  if (dentro(gx, gy, botaoSair(), 8)) { sair(); return; }

  if (toque.id !== null) return;
  tela.setPointerCapture(e.pointerId);
  toque.ativo = true; toque.id = e.pointerId;
  toque.ax = e.clientX; toque.ay = e.clientY;
  toque.x = e.clientX;  toque.y = e.clientY;
});
tela.addEventListener("pointermove", e => {
  if (!toque.ativo || e.pointerId !== toque.id) return;
  e.preventDefault();
  toque.x = e.clientX; toque.y = e.clientY;
  // o centro do analógico segue o dedo quando ele passa do alcance
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  const d = Math.hypot(dx, dy), lim = CFG.RAIO_ANALOG * escala;
  if (d > lim) {
    toque.ax = toque.x - (dx / d) * lim;
    toque.ay = toque.y - (dy / d) * lim;
  }
});
for (const ev of ["pointerup", "pointercancel"])
  tela.addEventListener(ev, e => {
    if (e.pointerId === toque.id) { toque.ativo = false; toque.id = null; }
  });

window.addEventListener("keydown", e => {
  teclas[e.key] = true;
  if ((cena === "menu" || cena === "fim") && (e.key === "Enter" || e.key === " ")) jogar();
  else if (e.key === "Escape") sair();
});
window.addEventListener("keyup", e => { teclas[e.key] = false; });

/* ── lógica ──────────────────────────────────────────────────── */
/* Mede o quanto o dedo está girando em torno do ponto onde encostou.
   Acumula o |dθ| com decaimento: o valor de regime é proporcional à
   VELOCIDADE do giro, não ao total girado — assim parar de rodar desliga o
   modo em meio segundo, em vez de deixar um saldo pendurado. */
function lerEspiral() {
  if (!toque.ativo) { toque.ang = null; toque.volta = 0; espiral = 0; return; }
  const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
  if (Math.hypot(dx, dy) < CFG.ZONA_MORTA * 2) {   // perto demais, o ângulo pula
    toque.ang = null; toque.volta *= 0.9;
  } else {
    const a = Math.atan2(dy, dx);
    if (toque.ang !== null) {
      let d = a - toque.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      toque.volta = toque.volta * 0.94 + Math.abs(d);
      toque.sentido = toque.sentido * 0.9 + Math.sign(d) * 0.1;
    }
    toque.ang = a;
  }
  espiral = limitar((toque.volta - CFG.ESPIRAL_MIN) /
                    (CFG.ESPIRAL_MAX - CFG.ESPIRAL_MIN), 0, 1);
}

function velMaxTela() {
  const base = Math.max(0.9, CFG.VEL_MAX - buraco.nivel * CFG.VEL_PERDA);
  const gelado = buraco.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  return (turbo > 0 ? base * CFG.TERRA_FATOR : base) * gelado;
}

/* O rival: escolhe o alvo mais próximo de tempos em tempos e vai atrás.
   A mira tem erro de propósito — sem isso ele é perfeito e chato. */
function passoRival(L) {
  const rm = raioMundoNivel(rival.nivel);
  const zr = zoomDoNivel(rival.nivel);

  // Com um poder de ataque na mão, ele para de catar estrela e vem atrás de
  // você: o poder só rende se os dois estiverem na mesma tela, então caçar é
  // literalmente o uso certo dele
  const caçando = rival.tiro > 0 || rival.dreno > 0;
  const vivo = rival.alvo && (rival.alvo === terra || rival.alvo === marte ||
                              rival.alvo === saturno || rival.alvo === jupiter ||
                              rival.alvo === buraco || rival.alvo === netuno ||
                              estrelas.indexOf(rival.alvo) >= 0);
  if (caçando) {
    rival.alvo = buraco;
    rival.pensar = 1;
  } else if (--rival.pensar <= 0 || !vivo) {
    rival.pensar = CFG.RIVAL_PENSAR + Math.floor(Math.random() * CFG.RIVAL_PENSAR);
    let melhor = null, md = Infinity;
    for (const e of estrelas) {
      const d = Math.hypot(e.x - rival.x, e.y - rival.y);
      if (d < md) { md = d; melhor = e; }
    }
    if (terra && Math.hypot(terra.x - rival.x, terra.y - rival.y) < md * 1.3) melhor = terra;
    if (marte && Math.hypot(marte.x - rival.x, marte.y - rival.y) < md * 1.3) melhor = marte;
    if (saturno && Math.hypot(saturno.x - rival.x, saturno.y - rival.y) < md * 1.3) melhor = saturno;
    if (jupiter && Math.hypot(jupiter.x - rival.x, jupiter.y - rival.y) < md * 1.3) melhor = jupiter;
    if (netuno && Math.hypot(netuno.x - rival.x, netuno.y - rival.y) < md * 1.3) melhor = netuno;
    rival.alvo = melhor;
  }
  if (rival.alvo) {
    const dx = rival.alvo.x - rival.x, dy = rival.alvo.y - rival.y;
    rival.ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * CFG.RIVAL_MIRA;
    // caçando, ele mantém distância de tiro em vez de colar: encostar dispara
    // a trombada, e na trombada quem tem menos estrela é que paga
    if (caçando) {
      const d = Math.hypot(dx, dy);
      const perto = (rm + raioMundo()) * CFG.RIVAL_DISTANCIA;
      if (d < perto) rival.ang += Math.PI;      // recua sem parar de mirar
    }
  }

  const zonzo = rival.atordoado > 0;
  if (zonzo) rival.atordoado--;
  const gelado = rival.enjoo > 0 ? CFG.COMETA_FREIO : 1;
  const acel = (zonzo ? 0 : CFG.ACEL * CFG.RIVAL_FORCA * gelado) / zr;
  const atrito = zonzo ? CFG.COLISAO_ARRASTO : CFG.ATRITO;
  rival.vx = (rival.vx + Math.cos(rival.ang) * acel) * atrito;
  rival.vy = (rival.vy + Math.sin(rival.ang) * acel) * atrito;
  const vm = Math.max(0.9, CFG.VEL_MAX - rival.nivel * CFG.VEL_PERDA) * CFG.RIVAL_FORCA * gelado / zr;
  const v = Math.hypot(rival.vx, rival.vy);
  if (!zonzo && v > vm) { rival.vx = rival.vx / v * vm; rival.vy = rival.vy / v * vm; }
  rival.x += rival.vx; rival.y += rival.vy;

  const m = rm + 1;
  if (rival.x < L.x0 + m) { rival.x = L.x0 + m; rival.vx = Math.abs(rival.vx); }
  if (rival.y < L.y0 + m) { rival.y = L.y0 + m; rival.vy = Math.abs(rival.vy); }
  if (rival.x > L.x1 - m) { rival.x = L.x1 - m; rival.vx = -Math.abs(rival.vx); }
  if (rival.y > L.y1 - m) { rival.y = L.y1 - m; rival.vy = -Math.abs(rival.vy); }

  // trombada: os dois se arremessam, e o menor perde massa
  const dx = rival.x - buraco.x, dy = rival.y - buraco.y;
  const d = Math.hypot(dx, dy) || 0.001;
  const minimo = rm + raioMundo();
  if (d < minimo) {
    const ux = dx / d, uy = dy / d;
    const folga = (minimo - d) / 2 + 1;
    rival.x += ux * folga;  rival.y += uy * folga;
    buraco.x -= ux * folga; buraco.y -= uy * folga;
    if (cena === "jogo" && esperaColisao <= 0) trombada(ux, uy);
  }
}

/* Encostou: os dois voam para lados opostos, a tela sacode forte, as cores
   se separam, e quem tem menos estrelas larga um punhado delas no campo. */
function trombada(ux, uy) {
  esperaColisao = CFG.COLISAO_ESPERA;
  const emp = CFG.COLISAO_EMPURRAO / zoom;
  buraco.vx = -ux * emp; buraco.vy = -uy * emp;
  rival.vx  =  ux * emp; rival.vy  =  uy * emp;
  buraco.atordoado = rival.atordoado = CFG.COLISAO_ATORDOA;
  buraco.pulso = 1; rival.pulso = 1;
  buraco.surpresa = rival.surpresa = CFG.COLISAO_SURPRESA;
  rival.alvo = null;                     // ele reavalia depois de levar o tranco

  tremor = CFG.COLISAO_TREMOR;
  aberr = CFG.COLISAO_ABERR;
  flashLado = 30;

  const mx = (buraco.x + rival.x) / 2, my = (buraco.y + rival.y) / 2;
  faiscar(mx, my, 34, 2, 8);
  aneis.push({ x: mx, y: my, r: 4, vida: 22, total: 22, rival: false });

  const perdedor = buraco.comidas <= rival.comidas ? buraco : rival;
  const quantas = Math.min(CFG.COLISAO_ESTRELAS, perdedor.comidas);
  if (quantas <= 0) return;
  perderEstrelas(perdedor, quantas);
  for (let k = 0; k < quantas; k++) estrelas.push(estrelaSolta(perdedor, k, quantas));
}

/* as estrelas perdidas voltam para o campo, espalhadas em volta do perdedor */
function estrelaSolta(de, k, total) {
  const L = limites();
  const e = novaEstrela(null);
  const a = (k / total) * Math.PI * 2 + Math.random() * 0.5;
  // caem além do alcance de sucção dele: senão o perdedor reabsorve na hora
  const raio = raioMundoNivel(de.nivel) * CFG.ALCANCE_SUCCAO * (1.1 + Math.random() * 0.55);
  e.x = limitar(de.x + Math.cos(a) * raio, L.x0 + 4, L.x1 - 4);
  e.y = limitar(de.y + Math.sin(a) * raio, L.y0 + 4, L.y1 - 4);
  const v = (0.5 + Math.random() * 1.1) / zoom;
  e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
  e.presa = false;
  return e;
}

/* Uma estrela cadente atravessa o mapa de tempos em tempos. Quem encostar
   nela leva um punhado de estrelas de uma vez. */
/* O sentido é sorteado, mas o caminho passa perto de quem está jogando:
   ela nasce numa ponta do mapa, cruza o cenário à vista e sai pela outra.
   Sorteando só um ponto de partida, ela costumava riscar um canto vazio. */
function novaCadente() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  // ponto de travessia: perto do jogador, com uma folga para não ser sempre igual
  const px0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.55, L.x0 + 6, L.x1 - 6);
  const py0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.55, L.y0 + 6, L.y1 - 6);
  // recua desse ponto, no sentido contrário, até encostar na borda do mapa
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (px0 - L.x0) / ca : (L.x1 - px0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (py0 - L.y0) / sa : (L.y1 - py0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.CADENTE_VEL / zoom;
  return { x: px0 - ca * t, y: py0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 1800, rastro: [] };
}

function passoCadente(L) {
  if (!cadente) {
    if (--esperaCadente <= 0) { cadente = novaCadente(); esperaCadente = CFG.CADENTE_INTERVALO; }
    return;
  }
  cadente.rastro.unshift({ x: cadente.x, y: cadente.y });
  if (cadente.rastro.length > 14) cadente.rastro.pop();
  cadente.x += cadente.vx; cadente.y += cadente.vy;
  cadente.vida--;

  const rc = CFG.CADENTE_RAIO / zoom;
  for (const p of [buraco, rival]) {
    const rp = p === buraco ? raioMundo() : raioMundoNivel(p.nivel);
    if (Math.hypot(cadente.x - p.x, cadente.y - p.y) < rp + rc) {
      faiscar(cadente.x, cadente.y, 30, 3, 8);
      for (let k = 0; k < 26; k++) {
        const a = Math.random() * Math.PI * 2, v = (0.7 + Math.random()) / zoom;
        faiscas.push({ x: cadente.x, y: cadente.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                       vida: 18 + Math.floor(Math.random() * 14), arrasto: 0.97, tipo: "raio",
                       cor: COR.cadente[Math.floor(Math.random() * COR.cadente.length)] });
      }
      p.pulso = 1; p.boca = 22;
      if (p === buraco) { tremor = 16; aberr = CFG.ABERRACAO; soltarCoracoes(p.x, p.y, 18, 1.8, 1); }
      ganharEstrelas(p, CFG.CADENTE_PREMIO);
      cadente = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cadente.vida <= 0 ||
      cadente.x < L.x0 - fora || cadente.x > L.x1 + fora ||
      cadente.y < L.y0 - fora || cadente.y > L.y1 + fora) cadente = null;
}

/* O cometa usa a mesma travessia da estrela cadente — nasce numa ponta do
   mapa e cruza o cenário à vista — mas ele é o perigo: quem encostar fica
   congelado e anda mais devagar por um tempo. Vem mais devagar de propósito,
   para dar tempo de ler a trajetória e desviar. */
function novaCometa() {
  const L = limites();
  const a = Math.random() * Math.PI * 2;
  const ca = Math.cos(a), sa = Math.sin(a);
  const cx0 = limitar(buraco.x + (Math.random() - 0.5) * visaoL() * 0.5, L.x0 + 6, L.x1 - 6);
  const cy0 = limitar(buraco.y + (Math.random() - 0.5) * visaoA() * 0.5, L.y0 + 6, L.y1 - 6);
  let t = Infinity;
  if (Math.abs(ca) > 1e-4) t = Math.min(t, ca > 0 ? (cx0 - L.x0) / ca : (L.x1 - cx0) / -ca);
  if (Math.abs(sa) > 1e-4) t = Math.min(t, sa > 0 ? (cy0 - L.y0) / sa : (L.y1 - cy0) / -sa);
  t = Math.max(0, t - 4);
  const v = CFG.COMETA_VEL / zoom;
  return { x: cx0 - ca * t, y: cy0 - sa * t,
           vx: ca * v, vy: sa * v,
           vida: 2400, rastro: [] };
}

function passoCometa(L) {
  if (!cometa) {
    if (--esperaCometa <= 0) { cometa = novaCometa(); esperaCometa = CFG.COMETA_INTERVALO; }
    return;
  }
  cometa.rastro.unshift({ x: cometa.x, y: cometa.y });
  if (cometa.rastro.length > CFG.COMETA_RABO) cometa.rastro.pop();
  cometa.x += cometa.vx; cometa.y += cometa.vy;
  cometa.vida--;
  if (quadro % 3 === 0) bafo(cometa.x, cometa.y, 1, 0.5);   // poeira caindo do rabo

  const rc = CFG.COMETA_RAIO / zoom;
  for (const p of [buraco, rival]) {
    const rp = p === buraco ? raioMundo() : raioMundoNivel(p.nivel);
    if (Math.hypot(cometa.x - p.x, cometa.y - p.y) < rp + rc) {
      adoecer(p);
      cometa = null;
      return;
    }
  }

  const fora = 60 / zoom;
  if (cometa.vida <= 0 ||
      cometa.x < L.x0 - fora || cometa.x > L.x1 + fora ||
      cometa.y < L.y0 - fora || cometa.y > L.y1 + fora) cometa = null;
}

function adoecer(p) {
  p.enjoo = CFG.COMETA_ENJOO;
  p.pulso = 1; p.boca = 24;
  bafo(p.x, p.y, 30, 1.6);
  aneis.push({ x: p.x, y: p.y, r: 3, vida: 20, total: 20, rival: p === rival });
  // a pancada também freia na hora: senão o congelamento demora a ser sentido
  p.vx *= 0.4; p.vy *= 0.4;
  if (p !== buraco) return;
  anunciar("SPEED DOWN", COR.enjoo);
  tremor = 30;                                  // batida: sacode mais
  aberr = CFG.ABERRACAO;
  flashEnjoo = 26;
}

/* bafo do cometa: lascas verdes, claras por fora e fortes no miolo */
function bafo(x, y, quantas, forca) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.3 + Math.random() * 1.2) * forca / zoom;
    faiscas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 20 + Math.floor(Math.random() * 20), arrasto: 0.95,
                   tipo: "enjoo", cor: COR.cometa[1 + Math.floor(Math.random() * 3)] });
  }
}

function terminar(quem) {
  vencedor = quem;
  cena = "fim";
  tremor = 14;
  soltarCoracoes(buraco.x, buraco.y, 40, 2.4, 1);
}

function passo() {
  quadro++;
  if (cena === "fim") {           // congela a partida, deixa a festa correr
    passoParticulas();
    return;
  }

  /* — direção — */
  let acelerando = false;
  if (cena === "menu") {
    // no menu ele fica parado, esperando: só o disco de acreção gira
    buraco.vx = buraco.vy = 0;
  } else {
    if (toque.ativo) {
      const dx = toque.x - toque.ax, dy = toque.y - toque.ay;
      if (Math.hypot(dx, dy) > CFG.ZONA_MORTA) buraco.ang = Math.atan2(dy, dx);
      acelerando = true;
    }
    lerEspiral();
    // rodando o dedo, ele não sai andando: o gesto vira rotação, não empurrão.
    // Sem isso o buraco descreveria círculos junto com o dedo e o modo sucção
    // ficaria impossível de usar parado, que é o ponto dele
    if (espiral > 0.15) acelerando = false;
    let tx = 0, ty = 0;
    if (teclas.ArrowLeft  || teclas.a || teclas.A) tx -= 1;
    if (teclas.ArrowRight || teclas.d || teclas.D) tx += 1;
    if (teclas.ArrowUp    || teclas.w || teclas.W) ty -= 1;
    if (teclas.ArrowDown  || teclas.s || teclas.S) ty += 1;
    if (tx || ty) { buraco.ang = Math.atan2(ty, tx); acelerando = true; }
  }

  /* — movimento: tudo é pensado em pixels de tela e convertido pelo zoom,
       para a sensação de velocidade não mudar quando a câmera se afasta — */
  // depois da pancada ele fica um tempo sem comando e sem teto de velocidade:
  // é o que faz os dois realmente se afastarem, em vez de grudarem de novo
  const zonzo = buraco.atordoado > 0;
  if (zonzo) { buraco.atordoado--; acelerando = false; }
  const fator = (turbo > 0 ? CFG.TERRA_FATOR : 1) *
                (buraco.enjoo > 0 ? CFG.COMETA_FREIO : 1);
  const acel = (acelerando ? CFG.ACEL * fator : 0) / zoom;
  const atrito = zonzo ? CFG.COLISAO_ARRASTO : CFG.ATRITO;
  buraco.vx = (buraco.vx + Math.cos(buraco.ang) * acel) * atrito;
  buraco.vy = (buraco.vy + Math.sin(buraco.ang) * acel) * atrito;
  const v = Math.hypot(buraco.vx, buraco.vy), vm = velMaxTela() / zoom;
  if (!zonzo && v > vm) { buraco.vx = buraco.vx / v * vm; buraco.vy = buraco.vy / v * vm; }
  buraco.x += buraco.vx; buraco.y += buraco.vy;
  if (turbo > 0) turbo--;

  /* — beirada do universo — */
  const L = limites(), m = raioMundo() + 1;
  if (buraco.x < L.x0 + m) { buraco.x = L.x0 + m; buraco.vx *= -0.35; }
  if (buraco.y < L.y0 + m) { buraco.y = L.y0 + m; buraco.vy *= -0.35; }
  if (buraco.x > L.x1 - m) { buraco.x = L.x1 - m; buraco.vx *= -0.35; }
  if (buraco.y > L.y1 - m) { buraco.y = L.y1 - m; buraco.vy *= -0.35; }

  passoRival(L);
  passoCadente(L);
  passoCometa(L);

  /* — crescimento suave do raio e do afastamento da câmera — */
  const raioAlvo = CFG.RAIO_BASE + buraco.nivel * CFG.RAIO_TELA_PASSO;
  zoomAlvo = zoomDoNivel(buraco.nivel);
  raioTela += (raioAlvo - raioTela) * 0.08;
  zoom += (zoomAlvo - zoom) * 0.05;

  /* — o campo repõe estrelas conforme o universo abre — */
  const alvo = alvoEstrelas();
  if (estrelas.length < alvo) estrelas.push(novaEstrela(buraco));

  /* — estrelas: os dois disputam; ganha quem estiver proporcionalmente
       mais perto, medindo pelo próprio alcance de cada um — */
  const sugadores = [
    { quem: buraco, x: buraco.x, y: buraco.y, rm: raioMundo() },
    { quem: rival,  x: rival.x,  y: rival.y,  rm: raioMundoNivel(rival.nivel) }
  ];
  // o ímã de Marte estica só o alcance do jogador, e por pouco tempo:
  // esticar demais faria as estrelas virem sozinhas e tirava a graça de mirar.
  // O gesto de espiral soma por cima, enquanto o dedo estiver rodando
  sugadores[0].alc = sugadores[0].rm * CFG.ALCANCE_SUCCAO *
                     (ima > 0 ? CFG.MARTE_ALCANCE : 1) *
                     (1 + espiral * CFG.ESPIRAL_ALCANCE);
  sugadores[1].alc = sugadores[1].rm * CFG.ALCANCE_SUCCAO;

  for (let i = estrelas.length - 1; i >= 0; i--) {
    const e = estrelas[i];
    e.fase += e.ritmo;

    let dono = null, melhor = Infinity, dDono = 0;
    for (const g of sugadores) {
      const d = Math.hypot(g.x - e.x, g.y - e.y) || 0.001;
      const rel = d / g.alc;
      if (rel < melhor) { melhor = rel; dono = g; dDono = d; }
    }

    if (melhor < 1) {
      e.presa = true;
      e.sx = dono.x; e.sy = dono.y; e.salc = dono.alc;
      const dx = dono.x - e.x, dy = dono.y - e.y, d = dDono;
      let puxao = dono.quem === buraco && ima > 0 ? CFG.MARTE_FORCA : 1;
      if (dono.quem === buraco) puxao *= 1 + espiral * CFG.ESPIRAL_FORCA;
      const forca = (CFG.FORCA_SUCCAO * puxao * (1 - melhor) + 0.02) / zoom;
      e.vx += (dx / d) * forca; e.vy += (dy / d) * forca;
      // gira a estrela em torno do sugador: o mergulho vira espiral.
      // É um giro do POSICIONAMENTO, não uma força lateral — força lateral
      // alimenta a órbita e a estrela nunca cai (foi o que aconteceu antes).
      const ang = 0.055 * CFG.GIRO_SUCCAO * (1 - melhor) * e.giro;
      const co = Math.cos(ang), si = Math.sin(ang);
      const rx = e.x - dono.x, ry = e.y - dono.y;
      e.x = dono.x + rx * co - ry * si;
      e.y = dono.y + rx * si + ry * co;
      const wx = e.vx, wy = e.vy;
      e.vx = wx * co - wy * si; e.vy = wx * si + wy * co;
    } else if (e.presa) { e.presa = false; e.vx *= 0.9; e.vy *= 0.9; }

    e.x += e.vx; e.y += e.vy; e.vx *= 0.985; e.vy *= 0.985;
    if (e.x < L.x0 + 2 || e.x > L.x1 - 2) { e.vx *= -0.6; e.x = limitar(e.x, L.x0 + 2, L.x1 - 2); }
    if (e.y < L.y0 + 2 || e.y > L.y1 - 2) { e.vy *= -0.6; e.y = limitar(e.y, L.y0 + 2, L.y1 - 2); }
    if (dono && dDono < dono.rm * 0.85) engolirEstrela(i, dono.quem);
  }

  /* — a Terra — */
  if (terra) {
    terra.quadro++;
    terra.x += terra.vx / zoom; terra.y += terra.vy / zoom;
    const rt = CFG.TERRA_RAIO / zoom;
    if (terra.x < L.x0 + rt || terra.x > L.x1 - rt) terra.vx *= -1;
    if (terra.y < L.y0 + rt || terra.y > L.y1 - rt) terra.vy *= -1;
    terra.x = limitar(terra.x, L.x0 + rt, L.x1 - rt);
    terra.y = limitar(terra.y, L.y0 + rt, L.y1 - rt);
    if (Math.hypot(terra.x - buraco.x, terra.y - buraco.y) < raioMundo() + rt * 0.4)
      engolirTerra(buraco);
    else if (Math.hypot(terra.x - rival.x, terra.y - rival.y) < raioMundoNivel(rival.nivel) + rt * 0.4)
      engolirTerra(rival);
  } else if (--esperaTerra <= 0) {
    terra = novaTerra();
  }

  /* — Marte — */
  if (marte) {
    marte.quadro++;
    marte.x += marte.vx / zoom; marte.y += marte.vy / zoom;
    const rm2 = CFG.MARTE_RAIO / zoom;
    if (marte.x < L.x0 + rm2 || marte.x > L.x1 - rm2) marte.vx *= -1;
    if (marte.y < L.y0 + rm2 || marte.y > L.y1 - rm2) marte.vy *= -1;
    marte.x = limitar(marte.x, L.x0 + rm2, L.x1 - rm2);
    marte.y = limitar(marte.y, L.y0 + rm2, L.y1 - rm2);
    if (Math.hypot(marte.x - buraco.x, marte.y - buraco.y) < raioMundo() + rm2 * 0.4)
      engolirMarte(buraco);
    else if (Math.hypot(marte.x - rival.x, marte.y - rival.y) < raioMundoNivel(rival.nivel) + rm2 * 0.4)
      engolirMarte(rival);
  } else if (--esperaMarte <= 0) {
    marte = novoMarte();
  }

  /* — Saturno — */
  if (saturno) {
    saturno.quadro++;
    saturno.x += saturno.vx / zoom; saturno.y += saturno.vy / zoom;
    const rs = CFG.SATURNO_RAIO / zoom;
    if (saturno.x < L.x0 + rs || saturno.x > L.x1 - rs) saturno.vx *= -1;
    if (saturno.y < L.y0 + rs || saturno.y > L.y1 - rs) saturno.vy *= -1;
    saturno.x = limitar(saturno.x, L.x0 + rs, L.x1 - rs);
    saturno.y = limitar(saturno.y, L.y0 + rs, L.y1 - rs);
    if (Math.hypot(saturno.x - buraco.x, saturno.y - buraco.y) < raioMundo() + rs * 0.4)
      engolirSaturno(buraco);
    else if (Math.hypot(saturno.x - rival.x, saturno.y - rival.y) < raioMundoNivel(rival.nivel) + rs * 0.4)
      engolirSaturno(rival);
  } else if (--esperaSaturno <= 0) {
    saturno = novoSaturno();
  }

  /* — Júpiter — */
  if (jupiter) {
    jupiter.quadro++;
    jupiter.x += jupiter.vx / zoom; jupiter.y += jupiter.vy / zoom;
    const rj = CFG.JUPITER_RAIO / zoom;
    if (jupiter.x < L.x0 + rj || jupiter.x > L.x1 - rj) jupiter.vx *= -1;
    if (jupiter.y < L.y0 + rj || jupiter.y > L.y1 - rj) jupiter.vy *= -1;
    jupiter.x = limitar(jupiter.x, L.x0 + rj, L.x1 - rj);
    jupiter.y = limitar(jupiter.y, L.y0 + rj, L.y1 - rj);
    if (Math.hypot(jupiter.x - buraco.x, jupiter.y - buraco.y) < raioMundo() + rj * 0.4)
      engolirJupiter(buraco);
    else if (Math.hypot(jupiter.x - rival.x, jupiter.y - rival.y) < raioMundoNivel(rival.nivel) + rj * 0.4)
      engolirJupiter(rival);
  } else if (--esperaJupiter <= 0) {
    jupiter = novoJupiter();
  }

  /* — Netuno — */
  if (netuno) {
    netuno.quadro++;
    netuno.x += netuno.vx / zoom; netuno.y += netuno.vy / zoom;
    const rn = CFG.NETUNO_RAIO / zoom;
    if (netuno.x < L.x0 + rn || netuno.x > L.x1 - rn) netuno.vx *= -1;
    if (netuno.y < L.y0 + rn || netuno.y > L.y1 - rn) netuno.vy *= -1;
    netuno.x = limitar(netuno.x, L.x0 + rn, L.x1 - rn);
    netuno.y = limitar(netuno.y, L.y0 + rn, L.y1 - rn);
    if (Math.hypot(netuno.x - buraco.x, netuno.y - buraco.y) < raioMundo() + rn * 0.4)
      engolirNetuno(buraco);
    else if (Math.hypot(netuno.x - rival.x, netuno.y - rival.y) < raioMundoNivel(rival.nivel) + rn * 0.4)
      engolirNetuno(rival);
  } else if (--esperaNetuno <= 0) {
    netuno = novoNetuno();
  }

  /* — o roubo de estrelas, enquanto o poder dura, dos dois lados — */
  drenando = false;
  for (const p of [buraco, rival]) {
    if (p.dreno <= 0) continue;
    p.dreno--;
    const outro = p === buraco ? rival : buraco;
    // basta estar na mesma tela: com raio fixo, no zoom afastado o alvo
    // aparecia na tela e mesmo assim ficava fora do alcance, o que confunde
    if (naTela(p.x, p.y, -CFG.JUPITER_FOLGA) &&
        naTela(outro.x, outro.y, -CFG.JUPITER_FOLGA)) {
      drenando = true;
      if (--p.ritmoDreno <= 0) {
        p.ritmoDreno = CFG.JUPITER_RITMO;
        if (outro.comidas > 0 && outro.imune <= 0) arrancarEstrela(p, outro);
      }
      if (quadro % 3 === 0) fioRoxo(p, outro);
    } else {
      p.ritmoDreno = Math.min(p.ritmoDreno, 20);   // saiu de vista, quase reinicia
    }
  }

  /* — a torre de gelo atira enquanto o poder dura, dos dois lados — */
  for (const p of [buraco, rival]) {
    if (p.tiro <= 0) continue;
    p.tiro--;
    if (p.recargaTiro > 0) p.recargaTiro--;
    // Só atira quem está visível, e só em quem está visível: a câmera segue o
    // jogador, então isso vale para os dois — ninguém leva tiro de fora da tela
    const outro = p === buraco ? rival : buraco;
    if (p.recargaTiro <= 0 &&
        naTela(p.x, p.y, -CFG.SATURNO_FOLGA) &&
        naTela(outro.x, outro.y, -CFG.SATURNO_FOLGA)) atirarBloco(p, outro);
  }
  passoBlocos(L);

  passoRoubadas();
  if (espiral > 0.02) puxarPlanetas();
  passoParticulas();

  /* — câmera — */
  const alvoX = limitar(buraco.x - visaoL() / 2, L.x0, L.x1 - visaoL());
  const alvoY = limitar(buraco.y - visaoA() / 2, L.y0, L.y1 - visaoA());
  cam.x += (alvoX - cam.x) * 0.12;
  cam.y += (alvoY - cam.y) * 0.12;
  cam.x = limitar(cam.x, 0, MUNDO.L - visaoL());
  cam.y = limitar(cam.y, 0, MUNDO.A - visaoA());
}

function passoParticulas() {
  for (let i = faiscas.length - 1; i >= 0; i--) {
    const f = faiscas[i];
    const ar = f.arrasto || 0.9;
    f.x += f.vx; f.y += f.vy; f.vx *= ar; f.vy *= ar; f.vida--;
    if (f.vida <= 0) faiscas.splice(i, 1);
  }

  for (let i = coracoes.length - 1; i >= 0; i--) {
    const c = coracoes[i];
    c.x += c.vx + Math.sin(c.fase + quadro * 0.09) * 0.14 / zoom;   // bambeia
    c.y += c.vy;
    c.vy -= 0.005 / zoom;                                           // sobem
    c.vx *= 0.985;
    if (--c.vida <= 0) coracoes.splice(i, 1);
  }

  for (let i = aneis.length - 1; i >= 0; i--) {
    const a = aneis[i];
    a.r += 1.1 / zoom;
    if (--a.vida <= 0) aneis.splice(i, 1);
  }
  buraco.pulso *= 0.85; rival.pulso *= 0.85;
  if (buraco.boca > 0) buraco.boca--;
  if (rival.boca > 0) rival.boca--;
  if (flashTerra > 0) flashTerra--;
  if (flashIma > 0) flashIma--;
  if (flashTiro > 0) flashTiro--;
  if (flashRoxo > 0) flashRoxo--;
  if (flashAzul > 0) flashAzul--;
  if (buraco.imune > 0) buraco.imune--;
  if (rival.imune > 0) rival.imune--;
  // a tela nunca fica parada durante o efeito: um tremor de fundo baixinho
  if (buraco.dreno > 0 || rival.dreno > 0) tremor = Math.max(tremor, drenando ? 3.5 : 2);
  if (ima > 0) { ima--; faiscarIma(); if (quadro % 2 === 0) faiscarIma(); }
  if (flashEnjoo > 0) flashEnjoo--;
  if (buraco.surpresa > 0) buraco.surpresa--;
  if (rival.surpresa > 0) rival.surpresa--;
  if (buraco.enjoo > 0) {
    buraco.enjoo--;
    if (quadro % 4 === 0) bafo(buraco.x, buraco.y, 1, 0.5);   // lascas caindo
  }
  if (rival.enjoo > 0) {
    rival.enjoo--;
    if (quadro % 6 === 0) bafo(rival.x, rival.y, 1, 0.5);
  }
  if (turbo > 0) { raiarTurbo(); if (quadro % 2 === 0) raiarTurbo(); }

  if (tremor > 0) tremor *= 0.9;
  if (flash > 0) flash--;
  if (flashLado > 0) flashLado--;
  if (aberr > 0) aberr--;
  if (arco > 0) arco--;
  if (esperaColisao > 0) esperaColisao--;
}



/* raios azuis e dourados saindo de dentro do personagem enquanto o turbo dura */
function raiarTurbo() {
  const a = Math.random() * Math.PI * 2;
  const v = (0.8 + Math.random() * 1.1) / zoom;
  faiscas.push({ x: buraco.x, y: buraco.y,
                 vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                 vida: 16 + Math.floor(Math.random() * 14), arrasto: 0.975, tipo: "raio",
                 cor: COR.turboPart[Math.floor(Math.random() * COR.turboPart.length)] });
}

function faiscar(x, y, quantas, dei, dfi) {
  for (let k = 0; k < quantas; k++) {
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 1.1) / zoom;
    faiscas.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                   vida: 10 + Math.floor(Math.random() * 12),
                   cor: COR.disco[dei + Math.floor(Math.random() * (dfi - dei))] });
  }
}

function soltarCoracoes(x, y, quantos, forca, tamMin) {
  for (let k = 0; k < quantos; k++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.7;
    const vel = (0.35 + Math.random() * 0.85) * (forca || 1) / zoom;
    const vida = 42 + Math.floor(Math.random() * 34);
    coracoes.push({ x: x, y: y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel,
                    vida: vida, total: vida,
                    tam: Math.min(CORACOES.length - 1,
                                  (tamMin || 0) + (Math.random() < 0.55 ? 0 : 1)),
                    fase: Math.random() * Math.PI * 2 });
  }
}

/* Um caminho só para ganhar estrelas: a estrela engolida, o prêmio da
   cadente. Sobe quantos níveis for preciso. */
function ganharEstrelas(dono, n) {
  dono.comidas += n;
  // o nível só governa o tamanho; quem termina a partida é o contador
  if (dono.nivel < CFG.NIVEL_MAX) {
    dono.progresso += n;
    while (dono.nivel < CFG.NIVEL_MAX && dono.progresso >= custoDoNivel(dono.nivel)) {
      dono.progresso -= custoDoNivel(dono.nivel);
      dono.nivel++;
      subiuDeNivel(dono);
    }
    if (dono.nivel >= CFG.NIVEL_MAX) dono.progresso = 0;
  }
  if (dono.comidas >= CFG.META && cena === "jogo") terminar(dono);
}

function subiuDeNivel(dono) {
  if (dono === buraco) {
    tremor = 22; flash = CFG.ARCO; flashLado = 36;
    aberr = CFG.ABERRACAO; arco = CFG.ARCO;
    soltarCoracoes(buraco.x, buraco.y, 34, 2.1, 1);   // chuva de corações
  } else {
    soltarCoracoes(rival.x, rival.y, 8, 1.2, 0);
  }
}

/* Perder massa: sai do contador e volta do progresso, devolvendo nível se
   preciso — senão a trombada seria só um número piscando. */
function perderEstrelas(dono, n) {
  // O escudo de Netuno é o único ponto que precisa saber de imunidade: tudo
  // que tira estrela passa por aqui — bloco de gelo, dreno e trombada
  if (dono.imune > 0) {
    dono.pulso = Math.max(dono.pulso, 0.6);
    if (dono === buraco) flashAzul = Math.max(flashAzul, 12);
    return;
  }
  dono.comidas = Math.max(0, dono.comidas - n);
  if (!CFG.COLISAO_CUSTA_NIVEL) return;
  let resta = n;
  while (resta > 0) {
    if (dono.progresso > 0) {
      const tira = Math.min(dono.progresso, resta);
      dono.progresso -= tira; resta -= tira;
    } else if (dono.nivel > 0) {
      dono.nivel--;
      dono.progresso = custoDoNivel(dono.nivel);
    } else break;
  }
}

function engolirEstrela(indice, dono) {
  const e = estrelas[indice];
  faiscar(e.x, e.y, 11, 3, 8);
  estrelas.splice(indice, 1);
  if (cena !== "jogo") return;          // no menu ele come só de enfeite
  dono.pulso = 1; dono.boca = 18;
  aneis.push({ x: e.x, y: e.y, r: 2, vida: 15, total: 15, rival: dono === rival });
  if (dono === buraco && Math.random() < 0.28) soltarCoracoes(e.x, e.y, 1, 0.7, 0);
  ganharEstrelas(dono, 1);
}

function engolirTerra(dono) {
  faiscar(terra.x, terra.y, 18, 2, 8);
  terra = null;
  esperaTerra = CFG.TERRA_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  if (dono !== buraco) return;                  // o rival só engole, não turbina
  turbo = CFG.TERRA_TURBO;
  anunciar("SPEED UP", COR.turbo);
  tremor = 10;
  flashTerra = CFG.TERRA_CLARAO;
  for (let k = 0; k < 30; k++) raiarTurbo();
  soltarCoracoes(buraco.x, buraco.y, 8, 1.1, 0);
}



function engolirMarte(dono) {
  faiscar(marte.x, marte.y, 18, 2, 8);
  marte = null;
  esperaMarte = CFG.MARTE_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  if (dono !== buraco) return;                  // o rival só engole, como na Terra
  ima = CFG.MARTE_IMA;
  anunciar("MAGNETIC!", COR.ima);
  tremor = 10;
  flashIma = CFG.MARTE_CLARAO;
  aneis.push({ x: buraco.x, y: buraco.y, r: 3, vida: 24, total: 24, rival: false });
  for (let k = 0; k < 24; k++) faiscarIma();
}

function engolirSaturno(dono) {
  faiscar(saturno.x, saturno.y, 18, 2, 8);
  saturno = null;
  esperaSaturno = CFG.SATURNO_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  dono.tiro = CFG.SATURNO_TIRO;
  dono.recargaTiro = 0;
  if (dono !== buraco) { tremor = 6; return; }  // no rival, sem aviso nem clarão
  // dourado, e não o azul do gelo: o azul brigaria com o "SPEED UP" da Terra,
  // e dourado liga o aviso a Saturno na hora
  anunciar("ICE SHOT!", COR.saturno[4]);
  tremor = 10;
  flashTiro = CFG.SATURNO_CLARAO;
  for (let k = 0; k < 20; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "enjoo",
                   cor: COR.bloco[Math.floor(Math.random() * COR.bloco.length)] });
  }
}

/* Um bloco sai da borda do buraco na direção do rival. Ele corrige o rumo de
   leve a cada quadro: sem correção nenhuma erra quase sempre, e com correção
   forte vira teleguiado e não dá para o rival escapar. */
function atirarBloco(de, alvo) {
  de.recargaTiro = CFG.SATURNO_CADENCIA;
  const a = Math.atan2(alvo.y - de.y, alvo.x - de.x) +
            (Math.random() - 0.5) * 0.3;
  const v = CFG.SATURNO_VEL / zoom;
  const r = de === buraco ? raioMundo() : raioMundoNivel(de.nivel);
  blocos.push({ x: de.x + Math.cos(a) * r, y: de.y + Math.sin(a) * r,
                vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                giro: Math.random() * Math.PI, vida: 200, alvo: alvo });
  de.pulso = Math.max(de.pulso, 0.5);
}

function passoBlocos(L) {
  const rr = CFG.SATURNO_RAIO_BLOCO / zoom;
  for (let i = blocos.length - 1; i >= 0; i--) {
    const g = blocos[i];
    const vitima = g.alvo;
    // persegue de leve: gira o vetor na direção do alvo
    const alvo = Math.atan2(vitima.y - g.y, vitima.x - g.x);
    const atual = Math.atan2(g.vy, g.vx);
    let dif = alvo - atual;
    while (dif > Math.PI) dif -= Math.PI * 2;
    while (dif < -Math.PI) dif += Math.PI * 2;
    const ang = atual + limitar(dif, -CFG.SATURNO_MIRA, CFG.SATURNO_MIRA);
    const v = Math.hypot(g.vx, g.vy);
    g.vx = Math.cos(ang) * v; g.vy = Math.sin(ang) * v;
    g.x += g.vx; g.y += g.vy;
    g.giro += 0.14;
    g.vida--;

    const rv = vitima === buraco ? raioMundo() : raioMundoNivel(vitima.nivel);
    if (Math.hypot(g.x - vitima.x, g.y - vitima.y) < rv + rr) {
      const quantas = Math.min(CFG.SATURNO_DANO, vitima.comidas);
      if (quantas > 0) perderEstrelas(vitima, quantas);
      vitima.pulso = 1; vitima.boca = 14;
      vitima.surpresa = Math.max(vitima.surpresa, 18);
      // levar tiro sacode mais do que acertar: o baque é de quem apanha
      tremor = Math.max(tremor, vitima === buraco ? 14 : 6);
      if (vitima === buraco) aberr = Math.max(aberr, Math.round(CFG.ABERRACAO * 0.5));
      faiscar(g.x, g.y, 10, 2, 6);
      for (let k = 0; k < 10; k++) {
        const a = Math.random() * Math.PI * 2, s2 = (0.5 + Math.random()) / zoom;
        faiscas.push({ x: g.x, y: g.y, vx: Math.cos(a) * s2, vy: Math.sin(a) * s2,
                       vida: 12 + Math.floor(Math.random() * 10), arrasto: 0.94,
                       tipo: "enjoo", cor: COR.bloco[Math.floor(Math.random() * 3)] });
      }
      aneis.push({ x: g.x, y: g.y, r: 2, vida: 14, total: 14, rival: vitima === rival });
      blocos.splice(i, 1);
      continue;
    }
    // e some ao sair de vista: bloco perseguindo fora da tela é dano invisível
    if (g.vida <= 0 || !naTela(g.x, g.y, 10)) blocos.splice(i, 1);
  }
}

/* No modo sucção os planetas também são puxados — devagar, porque eles têm
   massa. É o que faz o gesto valer a pena quando não há estrela por perto. */
function puxarPlanetas() {
  const alc = raioMundo() * CFG.ALCANCE_SUCCAO * (1 + espiral * CFG.ESPIRAL_ALCANCE) * 1.4;
  for (const o of [terra, marte, saturno, jupiter]) {
    if (!o) continue;
    const dx = buraco.x - o.x, dy = buraco.y - o.y;
    const d = Math.hypot(dx, dy) || 0.001;
    if (d > alc) continue;
    const f = CFG.ESPIRAL_PLANETA * espiral * (1 - d / alc) * 0.06;
    o.vx += (dx / d) * f * zoom;                 // vx dos planetas é em tela
    o.vy += (dy / d) * f * zoom;
    o.vx *= 0.99; o.vy *= 0.99;
  }
}

/* A estrela sai do rival NA HORA (o contador dele cai no mesmo quadro, para
   ele ver que está perdendo) e viaja até o jogador, que só marca o ponto
   quando ela chega. É o trajeto que conta a história. */
function arrancarEstrela(de, vitima) {
  perderEstrelas(vitima, 1);
  vitima.pulso = 1;
  vitima.boca = 14;
  vitima.surpresa = Math.max(vitima.surpresa, 20);
  tremor = Math.max(tremor, vitima === buraco ? 8 : 5);
  flashRoxo = Math.max(flashRoxo, 14);
  aneis.push({ x: vitima.x, y: vitima.y, r: 2, vida: 14, total: 14, rival: vitima === rival });
  const rr = vitima === buraco ? raioMundo() : raioMundoNivel(vitima.nivel);
  const a = Math.random() * Math.PI * 2;
  roubadas.push({
    x0: vitima.x + Math.cos(a) * rr * 0.8, y0: vitima.y + Math.sin(a) * rr * 0.8,
    para: de,
    x: 0, y: 0, t: 0, giro: Math.random() * Math.PI,
    // a curva sai por um lado: em linha reta as três por segundo viram um fio só
    curva: (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.3),
    passo: 1 / (22 + Math.floor(Math.random() * 10))
  });
  for (let k = 0; k < 8; k++) {
    const b = Math.random() * Math.PI * 2, v = (0.5 + Math.random()) / zoom;
    faiscas.push({ x: vitima.x, y: vitima.y, vx: Math.cos(b) * v, vy: Math.sin(b) * v,
                   vida: 12 + Math.floor(Math.random() * 8), arrasto: 0.95, tipo: "raio",
                   cor: COR.jupiter[2 + Math.floor(Math.random() * 3)] });
  }
}

function passoRoubadas() {
  for (let i = roubadas.length - 1; i >= 0; i--) {
    const e = roubadas[i];
    e.t += e.passo;
    e.giro += 0.2;
    const p = e.para;
    if (e.t >= 1) {
      // chegou: agora sim o ponto entra, com o mesmo estalo de engolir estrela
      ganharEstrelas(p, 1);
      p.pulso = 1; p.boca = 16;
      aneis.push({ x: p.x, y: p.y, r: 2, vida: 14, total: 14, rival: p === rival });
      faiscar(p.x, p.y, 8, 3, 8);
      roubadas.splice(i, 1);
      continue;
    }
    // sempre mira onde o ladrão está AGORA: se ele foge, a estrela persegue
    const t = e.t;
    const mx = e.x0 + (p.x - e.x0) * t;
    const my = e.y0 + (p.y - e.y0) * t;
    const dx = p.x - e.x0, dy = p.y - e.y0;
    const arco = Math.sin(t * Math.PI) * e.curva;
    e.x = mx - dy * arco;
    e.y = my + dx * arco;
  }
}

function engolirNetuno(dono) {
  faiscar(netuno.x, netuno.y, 18, 2, 8);
  netuno = null;
  esperaNetuno = CFG.NETUNO_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  dono.imune = CFG.NETUNO_IMUNE;
  if (dono !== buraco) { tremor = 6; return; }
  anunciar("INVINCIBLE!", COR.netunoTexto);
  tremor = 12;
  flashAzul = CFG.NETUNO_CLARAO;
  arco = Math.max(arco, 30);
  for (let k = 0; k < 26; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "raio",
                   cor: COR.arcoiris[Math.floor(Math.random() * COR.arcoiris.length)] });
  }
}

function engolirJupiter(dono) {
  faiscar(jupiter.x, jupiter.y, 18, 2, 8);
  jupiter = null;
  esperaJupiter = CFG.JUPITER_ESPERA;
  if (cena !== "jogo") return;
  dono.pulso = 1; dono.boca = 20;
  dono.dreno = CFG.JUPITER_DRENO;
  dono.ritmoDreno = CFG.JUPITER_RITMO;
  if (dono !== buraco) { tremor = 6; return; }  // no rival, sem aviso nem clarão
  anunciar("STAR DRAIN!", COR.roxo);
  tremor = 12;
  flashRoxo = CFG.JUPITER_CLARAO;
  for (let k = 0; k < 26; k++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) / zoom;
    faiscas.push({ x: buraco.x, y: buraco.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 16 + Math.floor(Math.random() * 12), arrasto: 0.96, tipo: "raio",
                   cor: COR.jupiter[2 + Math.floor(Math.random() * 3)] });
  }
}

/* fio de partículas correndo do rival para o buraco: é o que mostra de onde
   a estrela está saindo, sem precisar de texto */
function fioRoxo(de, vitima) {
  const t = Math.random();
  const x = vitima.x + (de.x - vitima.x) * t;
  const y = vitima.y + (de.y - vitima.y) * t;
  const dx = de.x - vitima.x, dy = de.y - vitima.y;
  const m = Math.hypot(dx, dy) || 1;
  const v = (1.2 + Math.random()) / zoom;
  faiscas.push({ x: x + (Math.random() - 0.5) * 6 / zoom,
                 y: y + (Math.random() - 0.5) * 6 / zoom,
                 vx: dx / m * v, vy: dy / m * v,
                 vida: 10 + Math.floor(Math.random() * 8), arrasto: 0.98, tipo: "raio",
                 cor: COR.jupiter[2 + Math.floor(Math.random() * 3)] });
}

/* poeira vermelha correndo PARA DENTRO do buraco: o ímã puxa, então as
   partículas dele vêm de fora para o centro, ao contrário das do turbo */
function faiscarIma() {
  const alc = raioMundo() * CFG.ALCANCE_SUCCAO * CFG.MARTE_ALCANCE;
  const a = Math.random() * Math.PI * 2;
  const d = raioMundo() + Math.random() * (alc - raioMundo());
  const v = (0.5 + Math.random() * 0.9) / zoom;
  faiscas.push({ x: buraco.x + Math.cos(a) * d, y: buraco.y + Math.sin(a) * d,
                 vx: -Math.cos(a) * v, vy: -Math.sin(a) * v,
                 vida: 14 + Math.floor(Math.random() * 10), arrasto: 0.99, tipo: "raio",
                 cor: COR.imaPart[Math.floor(Math.random() * COR.imaPart.length)] });
}

/* O anel de Saturno, em duas metades: a de trás sai antes do corpo, a da
   frente depois. Sem isso o anel some atrás do planeta ou passa por cima dele
   inteiro, e nos dois casos a leitura de "planeta com anel" se perde.

   Ele é desenhado por LINHA, como o resto do jogo, e a inclinação é um
   cisalhamento (cada linha desliza um tanto para o lado) em vez de uma
   rotação. Rotacionar quebraria as linhas horizontais e o anel voltaria a
   sair pontilhado; cisalhando, cada linha continua um traço cheio.
   Duas faixas com um vão entre elas — a divisão é o que faz parecer anel de
   Saturno, e não um aro. */
function anelSaturno(cx, cy, R, frente) {
  // ry precisa render umas 9 linhas: com 7 as duas faixas e o vão entre elas
  // não cabem e o anel vira um borrão colado no corpo
  const rx = R * 2, ry = R * 0.62;
  const incl = 0.95;                             // cisalhamento por linha
  const faixas = [[1, 0.82, COR.saturno[4]],     // externa, mais escura
                  [0.7, 0.46, COR.saturno[2]]];  // interna, clara
  const topo = Math.ceil(ry);
  for (let dy = -topo; dy <= topo; dy++) {
    if ((dy >= 0) !== frente) continue;
    const desliza = dy * incl;
    for (const [ko, ki, cor] of faixas) {
      const fo = 1 - (dy / (ry * ko)) * (dy / (ry * ko));
      if (fo <= 0) continue;
      const xo = rx * ko * Math.sqrt(fo);
      const fi = 1 - (dy / (ry * ki)) * (dy / (ry * ki));
      const xi = fi > 0 ? rx * ki * Math.sqrt(fi) : 0;
      ctx.fillStyle = cor;
      const y = Math.round(cy + dy);
      const e0 = Math.round(cx + desliza - xo), e1 = Math.round(cx + desliza - xi);
      const d0 = Math.round(cx + desliza + xi), d1 = Math.round(cx + desliza + xo);
      if (e1 > e0) ctx.fillRect(e0, y, e1 - e0, 1);
      if (d1 > d0) ctx.fillRect(d0, y, d1 - d0, 1);
    }
  }
}

/* ── desenho ─────────────────────────────────────────────────── */
const paraTelaX = wx => (wx - cam.x) * zoom;
const paraTelaY = wy => (wy - cam.y) * zoom;
/* está dentro do que a câmera mostra? folga negativa exige folga sobrando */
function naTela(x, y, folga) {
  const sx = paraTelaX(x), sy = paraTelaY(y);
  return sx > -folga && sx < VL + folga && sy > -folga && sy < VA + folga;
}

function desenharMundo() {
  const sx0 = tremor > 0.3 ? (Math.random() - 0.5) * tremor / zoom : 0;
  const sy0 = tremor > 0.3 ? (Math.random() - 0.5) * tremor / zoom : 0;
  const cx = limitar(cam.x + sx0, 0, MUNDO.L - visaoL());
  const cy = limitar(cam.y + sy0, 0, MUNDO.A - visaoA());

  ctx.fillStyle = COR.vazio;
  ctx.fillRect(0, 0, VL, VA);
  const cam0 = camadaAtual();
  const e = cam0.escala;
  const sx = cx * e, sy = cy * e;
  const sl = Math.min(cam0.canvas.width - sx, visaoL() * e);
  const sa = Math.min(cam0.canvas.height - sy, visaoA() * e);
  ctx.drawImage(cam0.canvas, sx, sy, sl, sa, 0, 0, VL, VA);

  const guardaX = cam.x, guardaY = cam.y;
  cam.x = cx; cam.y = cy;

  /* beirada da área jogável: a fronteira do universo conhecido */
  const L = limites();
  ctx.fillStyle = COR.borda;
  const bx0 = paraTelaX(L.x0), bx1 = paraTelaX(L.x1);
  const by0 = paraTelaY(L.y0), by1 = paraTelaY(L.y1);
  for (let y = 0; y < VA; y += 3) {
    if (bx0 > -1 && bx0 < VL) ctx.fillRect(Math.round(bx0), y, 1, 2);
    if (bx1 > -1 && bx1 < VL) ctx.fillRect(Math.round(bx1), y, 1, 2);
  }
  for (let x = 0; x < VL; x += 3) {
    if (by0 > -1 && by0 < VA) ctx.fillRect(x, Math.round(by0), 2, 1);
    if (by1 > -1 && by1 < VA) ctx.fillRect(x, Math.round(by1), 2, 1);
  }

  /* estrelas */
  for (const e of estrelas) {
    const x = paraTelaX(e.x), y = paraTelaY(e.y);
    if (x < -8 || y < -8 || x > VL + 8 || y > VA + 8) continue;
    const osc = (Math.sin(e.fase) + 1) / 2;
    let spr;
    if (e.presa) {
      // sendo engolida: encolhe conforme chega perto, como se fosse espremida
      const d = Math.hypot(buraco.x - e.x, buraco.y - e.y);
      const perto = limitar(d / (raioMundo() * CFG.ALCANCE_SUCCAO), 0, 1);
      spr = ESTRELAS_SPR[perto > 0.62 ? 2 : perto > 0.3 ? 1 : 0];
    } else {
      spr = ESTRELAS_SPR[osc > 0.72 ? 3 : osc > 0.3 ? 2 : 1];
    }
    carimbo(spr, x, y, COR.estrela);
    if (e.presa) {                               // rastrinho atrás da estrela
      const dx = buraco.x - e.x, dy = buraco.y - e.y;
      const d2 = Math.hypot(dx, dy) || 1;
      px(x - dx / d2 * 4, y - dy / d2 * 4, COR.estrelaSuave);
      px(x - dx / d2 * 6, y - dy / d2 * 6, COR.poeira[2]);
    }
  }

  /* a Terra */
  if (terra) {
    const x = Math.round(paraTelaX(terra.x)) - CFG.TERRA_RAIO;
    const y = Math.round(paraTelaY(terra.y)) - CFG.TERRA_RAIO;
    if (x > -TERRA_D && y > -TERRA_D && x < VL && y < VA) {
      // glow azul em camadas, respirando devagar
      const cxT2 = x + CFG.TERRA_RAIO, cyT2 = y + CFG.TERRA_RAIO;
      const pT = 0.5 + 0.5 * Math.sin(quadro * 0.055);
      for (let k = 4; k >= 1; k--) {
        ctx.globalAlpha = (0.065 + pT * 0.04) * k / 4;
        disco(cxT2, cyT2, CFG.TERRA_RAIO + k * 2.1 + pT * 1.6, COR.glowTerra);
      }
      ctx.globalAlpha = 1;
      const q = Math.floor(terra.quadro / 7) % TERRA_QUADROS;
      ctx.drawImage(terraSprite, q * TERRA_D, 0, TERRA_D, TERRA_D, x, y, TERRA_D, TERRA_D);
    }
  }

  /* Marte */
  if (marte) {
    const x = Math.round(paraTelaX(marte.x)) - CFG.MARTE_RAIO;
    const y = Math.round(paraTelaY(marte.y)) - CFG.MARTE_RAIO;
    if (x > -MARTE_D && y > -MARTE_D && x < VL && y < VA) {
      // glow vermelho, mais forte que o da Terra: Marte é o planeta quente
      const cxM2 = x + CFG.MARTE_RAIO, cyM2 = y + CFG.MARTE_RAIO;
      const pM = 0.5 + 0.5 * Math.sin(quadro * 0.075 + 1.3);
      for (let k = 5; k >= 1; k--) {
        ctx.globalAlpha = (0.085 + pM * 0.055) * k / 5;
        disco(cxM2, cyM2, CFG.MARTE_RAIO + k * 2.2 + pM * 2, COR.glowMarte);
      }
      ctx.globalAlpha = 1;
      const q = Math.floor(marte.quadro / 7) % MARTE_QUADROS;
      ctx.drawImage(marteSprite, q * MARTE_D, 0, MARTE_D, MARTE_D, x, y, MARTE_D, MARTE_D);
    }
  }

  /* Saturno */
  if (saturno) {
    const cxS = Math.round(paraTelaX(saturno.x));
    const cyS = Math.round(paraTelaY(saturno.y));
    const R = CFG.SATURNO_RAIO;
    if (cxS > -R * 3 && cyS > -R * 3 && cxS < VL + R * 3 && cyS < VA + R * 3) {
      const pS = 0.5 + 0.5 * Math.sin(quadro * 0.062 + 2.4);
      for (let k = 4; k >= 1; k--) {            // glow dourado
        ctx.globalAlpha = (0.07 + pS * 0.045) * k / 4;
        disco(cxS, cyS, R + k * 2.2 + pS * 1.7, COR.glowSaturno);
      }
      ctx.globalAlpha = 1;
      anelSaturno(cxS, cyS, R, false);          // metade de trás
      const q = Math.floor(saturno.quadro / 7) % SAT_QUADROS;
      ctx.drawImage(saturnoSprite, q * SAT_D, 0, SAT_D, SAT_D, cxS - R, cyS - R, SAT_D, SAT_D);
      anelSaturno(cxS, cyS, R, true);           // metade da frente
    }
  }

  /* Júpiter */
  if (jupiter) {
    const cxJ = Math.round(paraTelaX(jupiter.x));
    const cyJ = Math.round(paraTelaY(jupiter.y));
    const R = CFG.JUPITER_RAIO;
    if (cxJ > -R * 4 && cyJ > -R * 4 && cxJ < VL + R * 4 && cyJ < VA + R * 4) {
      // nuvem de fumaça: bolhas roxo-claro girando devagar em volta, mais
      // largas que o glow e irregulares — é o que dá o ar de gigante gasoso
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + jupiter.quadro * 0.006;
        const rr = R * (1.5 + 0.5 * Math.sin(jupiter.quadro * 0.02 + i * 1.7));
        ctx.globalAlpha = 0.1 + 0.05 * Math.sin(jupiter.quadro * 0.03 + i);
        disco(cxJ + Math.cos(a) * rr * 0.7, cyJ + Math.sin(a) * rr * 0.45,
              R * (0.7 + 0.25 * Math.sin(i * 2.3)), COR.fumaca);
      }
      const pJ = 0.5 + 0.5 * Math.sin(quadro * 0.058 + 3.7);
      for (let k = 3; k >= 1; k--) {
        ctx.globalAlpha = (0.055 + pJ * 0.032) * k / 3;
        disco(cxJ, cyJ, R + k * 2 + pJ * 1.4, COR.glowJupiter);
      }
      ctx.globalAlpha = 1;
      const q = Math.floor(jupiter.quadro / 7) % JUP_QUADROS;
      ctx.drawImage(jupiterSprite, q * JUP_D, 0, JUP_D, JUP_D, cxJ - R, cyJ - R, JUP_D, JUP_D);
    }
  }

  /* Netuno */
  if (netuno) {
    const cxN = Math.round(paraTelaX(netuno.x));
    const cyN = Math.round(paraTelaY(netuno.y));
    const R = CFG.NETUNO_RAIO;
    if (cxN > -R * 4 && cyN > -R * 4 && cxN < VL + R * 4 && cyN < VA + R * 4) {
      const pN = 0.5 + 0.5 * Math.sin(quadro * 0.05 + 1.9);
      for (let k = 4; k >= 1; k--) {
        ctx.globalAlpha = (0.075 + pN * 0.05) * k / 4;
        disco(cxN, cyN, R + k * 2.1 + pN * 1.5, COR.glowNetuno);
      }
      ctx.globalAlpha = 1;
      const q = Math.floor(netuno.quadro / 7) % NET_QUADROS;
      ctx.drawImage(netunoSprite, q * NET_D, 0, NET_D, NET_D, cxN - R, cyN - R, NET_D, NET_D);
    }
  }

  /* o alcance no modo sucção: riscos girando em volta do corpo. O anel no raio real de
     sucção chega a passar da largura da tela e não se vê — o que lê como
     "está girando" são traços perto do personagem, rápidos */
  if (espiral > 0.05) {
    const bx0 = paraTelaX(buraco.x), by0 = paraTelaY(buraco.y);
    const r0 = raioTela;
    const sent = toque.sentido >= 0 ? 1 : -1;
    for (let k = 0; k < 3; k++) {
      const rr = r0 * (1.5 + k * 0.55);
      const base = quadro * (0.05 + espiral * 0.11) * sent + k * 2.1;
